.option{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;gap:10px;width:100%;padding:12px;border:1px solid #b8c3ce;border-radius:6px;background:#fff;color:var(--ink);text-align:left}
.option:hover{border-color:var(--blue);background:#f3fafc}
.option .letter{width:30px;height:30px;display:grid;place-items:center;border:1px solid #8393a2;border-radius:50%;font-weight:800}

}

<script>
const QUESTIONS=[{"number": 1, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Monarch butterflies travel up to 4,800 kilometers each autumn to reach their wintering grounds in central Mexico. For decades, researchers assumed the insects relied mainly on the sun to find their way. The sun is an unreliable guide on cloudy ______ monarchs still manage to stay on course when skies are overcast. Later studies found that the butterflies can also sense Earth's magnetic field. This backup system may explain how the migration survives unpredictable autumn weather.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "days; however,", "B": "days, however,", "C": "days however,", "D": "days; however"}, "answer": "A", "explanation": "Two independent clauses joined by \"however\" need a semicolon (or period) BEFORE it and a comma AFTER it. A comma alone = comma splice; no comma after \"however\" is also wrong."}, {"number": 2, "rule": "however", "skill": "“, however;” — however ends clause 1 ｜ however 置於第一句句尾", "passage": "Community gardens have spread rapidly through American cities over the past two decades. Supporters often describe them as a simple way to increase access to fresh produce. The gardens' nutritional impact is difficult to ______ their social effects are easier to document. Surveys show that gardeners report knowing more of their neighbors after a single growing season. For many city planners, that finding alone justifies the modest public investment the gardens require.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "measure, however,", "B": "measure; however", "C": "measure however;", "D": "measure, however;"}, "answer": "D", "explanation": "Here \"however\" ends the first clause (contrasting it with the previous sentence), so it takes \", however;\" and the semicolon separates the two independent clauses. \", however,\" creates a comma splice."}, {"number": 3, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Johann Sebastian Bach was admired in his lifetime mainly as an organist rather than as a composer. After his death in 1750, much of his music was rarely performed. The young composer ______ helped change that in 1829 when he conducted a revival of the St. Matthew Passion in Berlin. The performance drew large crowds and sparked new interest in Bach's work across Europe. Today, Bach is regarded as one of the greatest composers in Western history.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Felix Mendelssohn; however,", "B": "Felix Mendelssohn, however", "C": "Felix Mendelssohn however,", "D": "Felix Mendelssohn, however,"}, "answer": "D", "explanation": "\"However\" interrupts a single clause (subject … verb), so it needs a PAIR of commas. A semicolon would cut the subject off from its verb."}, {"number": 4, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Octopuses are famous for solving puzzles in laboratory tanks, and some can even unscrew jar lids to reach food. In several ways, their intelligence resembles that of mammals such as dogs. The organization of that intelligence is very ______ about two-thirds of an octopus's neurons are located in its arms rather than in its brain. Each arm can taste, touch, and react to its surroundings with surprising independence. Researchers are still investigating how the brain and the arms coordinate their activity.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "different; though", "B": "different though,", "C": "different, though,", "D": "different, though;"}, "answer": "D", "explanation": "\"Though\" here is an adverb meaning \"however\" that ends the first clause, so it works like \", however;\". \"; though + clause\" makes \"though\" a conjunction and leaves a fragment after the semicolon."}, {"number": 5, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Emily Dickinson wrote nearly 1,800 poems during her lifetime. Fewer than a dozen of them were published while she was alive, and most of those appeared without her name. Though she rarely left her family's home in Amherst, ______ she exchanged letters with dozens of friends, editors, and relatives. These letters reveal a sharp, witty writer deeply engaged with the ideas of her time. After her death in 1886, her sister Lavinia discovered the hidden poems and worked to have them published.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Massachusetts:", "B": "Massachusetts,", "C": "Massachusetts;", "D": "Massachusetts."}, "answer": "B", "explanation": "\"Though\" is a subordinating conjunction here (= although). Dependent clause + COMMA + independent clause. A semicolon, period, or colon would leave the \"Though\" clause as a fragment."}, {"number": 6, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Bees are often credited with pollinating most of the world's crops. Flies, beetles, and moths also play important ______ some plants depend on them almost entirely. The cacao tree, the source of chocolate, is pollinated mainly by tiny midges. Without these insects, cacao farms would produce very little fruit. Protecting the damp, shady habitats that midges need is therefore a priority for many growers.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "roles,", "B": "roles, and", "C": "roles and", "D": "roles and,"}, "answer": "B", "explanation": "Two independent clauses joined by a FANBOYS conjunction need a comma BEFORE the conjunction. A comma alone = comma splice; no comma = run-on."}, {"number": 7, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Sea otters spend nearly their entire lives in cold Pacific waters. Unlike whales and seals, they have no thick layer of blubber to keep them warm. Instead, they rely on extremely dense fur, which traps a layer of air against their skin. They must also eat about a quarter of their body weight in food each ______ their high metabolism burns energy quickly to generate heat. By keeping sea urchin populations in check, otters help kelp forests thrive.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "day. Because", "B": "day, because,", "C": "day; because", "D": "day because"}, "answer": "D", "explanation": "A \"because\" clause that follows the main clause needs no punctuation. A period or semicolon leaves \"Because…\" as a fragment; a comma AFTER \"because\" is never correct."}, {"number": 8, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "For centuries, sailors could measure latitude by observing the height of the sun or the North Star. Longitude was a much harder problem. The difficulty was fundamentally about ______ calculate longitude, a navigator needed to know the exact time at a home port while at sea. Pendulum clocks, however, lost accuracy on rolling ships. In the 1760s, the English clockmaker John Harrison finally built a marine timekeeper reliable enough for the task.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "time; and to", "B": "time, to", "C": "time: to", "D": "time to"}, "answer": "C", "explanation": "A colon after a complete independent clause introduces the explanation of \"the difficulty.\" A comma creates a comma splice; no punctuation creates a run-on; \"; and\" is not a standard way to join clauses."}, {"number": 9, "rule": "Colons", "skill": "Colon introducing a list / item ｜ 冒號引出列舉", "passage": "The James Webb Space Telescope observes the universe primarily in infrared light. This choice allows it to study objects that visible-light telescopes struggle to ______ newly forming stars hidden inside dust clouds, the atmospheres of distant planets, and the faint light of the earliest galaxies. To detect such weak signals, the telescope's instruments must be kept extremely cold. A tennis-court-sized sunshield blocks heat from the sun, Earth, and Moon. Behind it, some instruments operate at temperatures below –260°C.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "see, such as:", "B": "see;", "C": "see, including:", "D": "see:"}, "answer": "D", "explanation": "A colon after a complete clause introduces a list. Never put a colon after \"such as\" or \"including\"; a semicolon cannot introduce a list."}, {"number": 10, "rule": "Colons", "skill": "Colon traps (after verb / such as / including) ｜ 冒號陷阱", "passage": "Mangrove forests grow along tropical coastlines where land meets the sea. Their tangled roots slow incoming waves and trap sediment. As a result, mangroves protect nearby communities ______ storm surges, erosion, and flooding. They also store large amounts of carbon in their waterlogged soils. Despite these benefits, many mangrove forests have been cleared for shrimp farms and coastal development.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "from", "B": "from:", "C": "from;", "D": "from—"}, "answer": "A", "explanation": "No punctuation between a preposition (\"from\") and its object. A colon can only follow a complete independent clause."}, {"number": 11, "rule": "Commas & dashes (essential / nonessential)", "skill": "Nonessential element: paired commas ｜ 非必要成分：成對逗號", "passage": "Honeybee colonies make collective decisions in a surprisingly democratic way. When a colony needs a new home, a few hundred scout bees fly out to inspect possible sites. Each scout that finds a promising cavity returns and performs a waggle ______ which tells other bees the site's direction and distance. Over several days, more and more scouts join the dances for the best site. Once enough scouts gather at one location, the whole swarm takes off for its new home.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "dance,", "B": "dance:", "C": "dance.", "D": "dance;"}, "answer": "A", "explanation": "A nonessential \"which\" clause is set off with a comma. A semicolon or period would leave \"which tells…\" as a fragment; a colon cannot introduce a \"which\" clause."}, {"number": 12, "rule": "Commas & dashes (essential / nonessential)", "skill": "Paired dashes ｜ 成對破折號", "passage": "In 1903, Wilbur and Orville Wright made the first controlled, powered airplane flight near Kitty Hawk, North Carolina. That first flight lasted only 12 seconds and covered about 120 feet. The brothers' success depended less on engine power than on control. Their system of wing warping—twisting the wingtips to roll the aircraft into a ______ allowed the pilot to keep the plane balanced. Later aircraft replaced wing warping with hinged panels called ailerons, but the principle remained the same.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "turn", "B": "turn,", "C": "turn;", "D": "turn—"}, "answer": "D", "explanation": "The interruption opens with a dash, so it must close with a dash. Mixing a dash with a comma (or using nothing) breaks the pair."}, {"number": 13, "rule": "Commas & dashes (essential / nonessential)", "skill": "Single dash ｜ 單一破折號", "passage": "Ancient Roman concrete has survived for two thousand years in harbors and monuments. Modern concrete, by contrast, can crack within decades. Scientists studying Roman structures have identified one likely reason for the ______ lumps of lime that can react with water to seal cracks as they form. This self-healing ability may help explain why Roman harbor walls are still standing. Engineers are now testing whether similar ingredients could make modern concrete more durable.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "difference small", "B": "difference. Small", "C": "difference; small", "D": "difference—small"}, "answer": "D", "explanation": "A single dash after a complete clause can introduce an explanation (like a colon). A semicolon or period would leave \"small lumps…\" as a fragment (no verb)."}, {"number": 14, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Many deserts receive less than 25 centimeters of rain a year. Plants in these environments must store water whenever it becomes available. The saguaro cactus has pleated stems that can expand like an accordion after a ______ a single large saguaro can absorb hundreds of liters of water in a day. This stored water allows the cactus to survive months of drought. Its waxy skin and spines further reduce water loss.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "storm; in fact,", "B": "storm; in fact", "C": "storm, in fact,", "D": "storm in fact,"}, "answer": "A", "explanation": "\"In fact\" is a transition that begins the second independent clause: semicolon before, comma after. A comma before it creates a comma splice."}, {"number": 15, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "The Maya city of Tikal once supported tens of thousands of residents. Its stone temples rise more than 60 meters above the surrounding rainforest. The city's population declined sharply in the ninth ______ archaeologists are still debating the causes. Some point to prolonged droughts, while others emphasize warfare and political instability. Most researchers now believe that several factors worked together.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "century though;", "B": "century; though", "C": "century, though;", "D": "century, though,"}, "answer": "C", "explanation": "\"Though\" = however, ending the first clause: \", though;\". \"; though + clause\" turns \"though\" into a conjunction and leaves a fragment; \", though,\" is a comma splice."}, {"number": 16, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Venus is nearly the same size as Earth and is sometimes called Earth's twin. The two planets share a similar size and rocky ______ conditions on their surfaces could hardly be more different. Venus's thick carbon dioxide atmosphere traps so much heat that surface temperatures reach about 465°C. Its air pressure is roughly 90 times that of Earth at sea level. Soviet landers that reached the surface in the 1970s and 1980s survived for about two hours at most.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "composition,", "B": "composition, however,", "C": "composition, but", "D": "composition but,"}, "answer": "C", "explanation": "\", but\" correctly joins two independent clauses. \", however,\" between two clauses is a comma splice—\"however\" is an adverb, not a conjunction."}, {"number": 17, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "For much of the twentieth century, scientists believed that adult human brains could not grow new neurons. Brain cells, they thought, were formed only before birth and in early childhood. The idea seemed to match what doctors observed in patients with brain ______ studies in the 1990s found evidence that new neurons can form in the adult hippocampus, a region linked to memory. The extent of this process in humans is still debated. Even so, the discovery transformed how scientists think about learning and recovery.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "injuries. However,", "B": "injuries however", "C": "injuries, however,", "D": "injuries. However"}, "answer": "A", "explanation": "A period before \"However\" and a comma after it correctly separates the two sentences. \", however,\" between two clauses is a comma splice."}, {"number": 18, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "In 2004, NASA's Spirit and Opportunity rovers landed on opposite sides of Mars. Each was designed to operate for about 90 Martian days. Engineers expected dust to gradually cover the rovers' solar panels and cut off their power. ______ continued exploring for nearly fifteen years. Wind gusts periodically cleaned its panels, allowing it to keep running until a planet-wide dust storm in 2018.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Opportunity however,", "B": "Opportunity, however", "C": "Opportunity; however,", "D": "Opportunity, however,"}, "answer": "D", "explanation": "\"However\" sits between the subject (Opportunity) and the verb, so it needs commas on both sides. A semicolon would separate the subject from its verb."}, {"number": 19, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "The Leaning Tower of Pisa began tilting during its construction in the twelfth century. Builders had placed it on soft, unstable soil. Over the centuries, the lean grew so severe that engineers closed the tower to visitors in 1990. A decade of careful work removed soil from beneath the higher ______ though the tower still leans about four degrees today. Engineers estimate that it will remain stable for at least two hundred years.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "side,", "B": "side;", "C": "side:", "D": "side."}, "answer": "A", "explanation": "\"Though\" here is a conjunction (= although) introducing a dependent clause after the main clause; a comma is correct. A semicolon, period, or colon leaves \"though the tower…\" as a fragment."}, {"number": 20, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "The platypus, which lives in the rivers of eastern Australia, has puzzled scientists since the 1790s. When the first preserved specimen reached Britain, some researchers suspected it was a hoax. The animal has a duck-like bill, a beaver-like tail, and webbed feet, and it lays eggs. Although the platypus is a ______ it has no nipples. Females instead release milk through patches of skin on their bellies, and the young lap it up.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "mammal;", "B": "mammal.", "C": "mammal", "D": "mammal,"}, "answer": "D", "explanation": "An introductory \"Although\" clause is followed by a comma before the main clause. A semicolon or period would create a fragment."}, {"number": 21, "rule": "Sentence boundaries (period / semicolon)", "skill": "Semicolon between independent clauses ｜ 分號連接兩獨立子句", "passage": "Coral reefs cover less than one percent of the ocean floor. They support roughly a quarter of all known marine ______ many of these species are found nowhere else. Reefs also protect coastlines and support fishing and tourism industries. Rising ocean temperatures, however, threaten their survival. When water becomes too warm, corals expel the algae that live in their tissues and turn white.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "species which", "B": "species", "C": "species;", "D": "species,"}, "answer": "C", "explanation": "Two independent clauses with no conjunction need a semicolon (or period). A comma = comma splice; nothing = run-on; \"which\" makes the sentence ungrammatical."}, {"number": 22, "rule": "Commas & dashes (essential / nonessential)", "skill": "Nonessential element: paired commas ｜ 非必要成分：成對逗號", "passage": "Many people believe that reading on screens harms comprehension. A recent study of college students tested this belief directly. The ______ found that students who read printed texts remembered key details better than those who read the same texts on tablets. The difference was largest for long, complex passages. The researchers suggest that scrolling may make it harder for readers to build a mental map of a text.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "study; though small,", "B": "study, though small,", "C": "study, though small", "D": "study though small,"}, "answer": "B", "explanation": "\"Though small\" is a nonessential interrupter between subject and verb, so it needs a pair of commas. A semicolon would cut the subject off from its verb."}, {"number": 23, "rule": "Commas & dashes (essential / nonessential)", "skill": "No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置", "passage": "Tomatoes originated in western South America and were brought to Europe in the 1500s. Italians and Spaniards soon began cooking with them. In parts of northern Europe, however, the plant was grown mainly as a decoration. The belief that tomatoes might be ______ was common there for many years, partly because the plant belongs to the same family as deadly nightshade. By the 1800s, tomatoes had become a popular ingredient across the continent.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "poisonous—", "B": "poisonous", "C": "poisonous,", "D": "poisonous;"}, "answer": "B", "explanation": "The whole phrase \"The belief that tomatoes might be poisonous\" is the subject; no punctuation can separate a subject from its verb (\"was\")."}, {"number": 24, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Penguins cannot fly, but they are superb swimmers. Their wings have evolved into stiff flippers that propel them through the water. Their bones are also denser than those of flying ______ the birds can dive deep without struggling against buoyancy. Emperor penguins have been recorded diving more than 500 meters below the surface. Some of their dives last over twenty minutes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "birds, therefore,", "B": "birds; therefore,", "C": "birds; therefore", "D": "birds therefore"}, "answer": "B", "explanation": "\"Therefore\" begins a new independent clause: semicolon before, comma after. \", therefore,\" between clauses is a comma splice."}, {"number": 25, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Alligators and crocodiles are often confused with each other. Both are large reptiles with powerful jaws and armored skin. An alligator has a broad, U-shaped ______ a crocodile has a narrower, V-shaped one. When a crocodile closes its mouth, its large fourth lower tooth remains visible. Alligators, by contrast, tend to hide their lower teeth when their jaws are shut.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "snout. Whereas", "B": "snout; whereas", "C": "snout whereas,", "D": "snout, whereas"}, "answer": "D", "explanation": "\"Whereas\" is a subordinating conjunction; \", whereas\" attaches its clause to the main clause. A period or semicolon before it leaves a fragment; a comma after it is wrong."}, {"number": 26, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "The Silk Road was not a single road but a network of trade routes linking China with the Mediterranean world. Silk was among the most famous goods carried along these routes. Merchants also traded spices, glass, horses, and ______ ideas and technologies may have been the network's most lasting cargo. Buddhism, for example, spread from India into China along these routes. Papermaking techniques later traveled west, reaching the Islamic world by the eighth century.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "paper, however,", "B": "paper however,", "C": "paper; however,", "D": "paper; however"}, "answer": "C", "explanation": "Between two independent clauses, \"however\" needs a semicolon before and a comma after. A comma before it = comma splice."}, {"number": 27, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Most people picture the Sahara as an endless sea of sand dunes. Dunes cover only about a quarter of the ______ of the rest consists of rocky plateaus, gravel plains, and mountains. The desert's highest peak, Emi Koussi in Chad, rises more than 3,400 meters. Thousands of years ago, the Sahara was much greener than it is today. Rock paintings show giraffes, cattle, and even swimmers in places that are now completely dry.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "desert, though. Much", "B": "desert; though much", "C": "desert though. Much", "D": "desert, though, much"}, "answer": "A", "explanation": "\"Though\" (= however) can end a sentence after a comma: \", though.\" Then a new sentence begins. \", though, much\" is a comma splice; \"; though much…\" leaves a fragment."}, {"number": 28, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Yellowstone National Park sits on top of one of the largest volcanic systems on Earth. The supervolcano has erupted massively three times over the past 2.1 million years. Scientists monitor the area constantly for signs of change; a major ______ is considered extremely unlikely in the near future. Most of the region's volcanic activity appears as geysers, hot springs, and mud pots. Old Faithful, the park's most famous geyser, erupts roughly every 60 to 110 minutes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "eruption, however,", "B": "eruption however,", "C": "eruption, however", "D": "eruption; however,"}, "answer": "A", "explanation": "The semicolon already separates the clauses; inside the second clause, \"however\" interrupts subject and verb, so it needs a pair of commas."}, {"number": 29, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "The Great Barrier Reef is the largest structure built by living things on Earth, stretching more than 2,000 kilometers along Australia's coast. It is made up of nearly 3,000 individual reefs and hundreds of islands. Remarkably, the reef is large enough to be seen from ______ it was built by coral polyps, tiny animals that are often only a few millimeters across. Over thousands of years, the polyps' limestone skeletons accumulated into massive structures. Today, the reef is home to about 1,500 species of fish.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "space, even though", "B": "space. Even though", "C": "space, however,", "D": "space; even though"}, "answer": "A", "explanation": "\"Even though\" introduces a dependent clause that can follow the main clause after a comma. \", however,\" is a comma splice; a semicolon or period before \"Even though\" leaves a fragment."}, {"number": 30, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Lightning heats the air around it to about 30,000°C in a fraction of a second. That is roughly five times hotter than the surface of the sun. The heated air expands ______ it produces a powerful shock wave that we hear as thunder. Because light travels much faster than sound, we see a flash before we hear the thunder. Counting the seconds between the two can help estimate how far away a storm is.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "explosively so,", "B": "explosively, so", "C": "explosively,", "D": "explosively; so,"}, "answer": "B", "explanation": "\", so\" correctly joins two independent clauses. A comma alone = comma splice; never put a comma after \"so\" here."}, {"number": 31, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "Many early photographs show people with stiff, serious expressions. This was not necessarily because people in the 1800s were unhappy. One reason was ______ early cameras required subjects to hold still for long periods, and a smile is hard to keep steady. Another reason was cultural, since formal portraits were expected to look dignified. By the early twentieth century, faster cameras and changing fashions made smiling portraits common.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "practical early", "B": "practical, because, early", "C": "practical, early", "D": "practical: early"}, "answer": "D", "explanation": "The colon follows a complete clause and introduces the explanation of what the \"practical\" reason was. A comma = comma splice; nothing = run-on."}, {"number": 32, "rule": "Colons", "skill": "Colon introducing a list / item ｜ 冒號引出列舉", "passage": "Marie Curie remains the only person to have won Nobel Prizes in two different sciences. Her research focused on radioactivity, a term she helped popularize. Together with her husband, Pierre, she discovered two new ______ polonium and radium. Polonium was named after Poland, Marie's homeland. Curie's notebooks are still so radioactive that they are stored in lead-lined boxes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "elements;", "B": "elements, such as:", "C": "elements:", "D": "elements, including:"}, "answer": "C", "explanation": "A colon after a complete clause introduces the two specific elements. No colon after \"including\" or \"such as\"; a semicolon cannot introduce a list."}, {"number": 33, "rule": "Commas & dashes (essential / nonessential)", "skill": "Paired dashes ｜ 成對破折號", "passage": "In 2019, astronomers released the first image of a black hole. The picture shows a glowing ring of hot gas surrounding a dark center. Producing it was an enormous technical challenge. The project linked eight radio observatories—located on four different ______ that together functioned as a single telescope the size of Earth. The black hole, which sits at the center of the galaxy M87, is about 55 million light-years away.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "continents;", "B": "continents", "C": "continents,", "D": "continents—"}, "answer": "D", "explanation": "The interrupting phrase opened with a dash, so it must close with a dash."}, {"number": 34, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "The Amazon River flows about 6,400 kilometers across South America before reaching the Atlantic Ocean. It discharges more water than any other river on Earth. Even though it is one of the world's most important ______ no bridge crosses the Amazon anywhere along its main channel. Much of the river runs through sparsely populated rainforest, where roads are few. In addition, its banks are soft and shift frequently during the rainy season.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "rivers;", "B": "rivers.", "C": "rivers,", "D": "rivers:"}, "answer": "C", "explanation": "An introductory \"Even though\" clause ends with a comma before the main clause. Any stronger mark leaves the dependent clause as a fragment."}, {"number": 35, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Glass appears to be a solid, and in everyday life it behaves like one. A popular myth claims that glass is actually a slow-moving liquid. As evidence, people point to old church windows that are thicker at the bottom than at the ______ the uneven thickness was caused by the way old glass was made, not by centuries of slow flow. Glassmakers often installed the panes with the thicker edge at the bottom for stability. Calculations show that glass at room temperature would take far longer than the age of the universe to flow noticeably.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "top. However", "B": "top. However,", "C": "top, however,", "D": "top however,"}, "answer": "B", "explanation": "Period before \"However,\" comma after it. \", however,\" between two independent clauses = comma splice."}, {"number": 36, "rule": "Sentence boundaries (period / semicolon)", "skill": "Semicolon between independent clauses ｜ 分號連接兩獨立子句", "passage": "Rubber trees are native to the Amazon rainforest. In the nineteenth century, demand for rubber soared as factories began producing tires, hoses, and waterproof clothing. In 1876, the British explorer Henry Wickham shipped about 70,000 rubber tree seeds from Brazil to ______ seedlings grown from them were later sent to British colonies in Asia. Within a few decades, plantations in Southeast Asia dominated the world's rubber supply. Brazil's rubber boom, meanwhile, collapsed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "London, which", "B": "London", "C": "London,", "D": "London;"}, "answer": "D", "explanation": "Two independent clauses with no conjunction need a semicolon. Comma = comma splice; nothing = run-on."}, {"number": 37, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Many animals use tools, a behavior once thought to be uniquely human. Chimpanzees strip leaves from twigs and use them to fish termites from their mounds. Birds can be skilled tool users as ______ New Caledonian crows shape twigs into hooked tools to pull insects out of tree bark. Some sea otters use rocks to crack open shellfish while floating on their backs. These examples suggest that tool use has evolved independently many times.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "well; for example,", "B": "well; for example", "C": "well for example,", "D": "well, for example,"}, "answer": "A", "explanation": "\"For example\" introduces a new independent clause: semicolon before, comma after."}, {"number": 38, "rule": "however", "skill": "“, however;” — however ends clause 1 ｜ however 置於第一句句尾", "passage": "Smartphones contain small amounts of gold, silver, and copper. Recovering these metals from discarded phones could reduce the need for new mining. Recycling rates for electronics remain ______ most old phones end up forgotten in drawers or thrown away with regular trash. Some companies now offer cash or store credit for used devices. Experts say that convenient drop-off programs are the most effective way to increase recycling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "low, however,", "B": "low; however", "C": "low however;", "D": "low, however;"}, "answer": "D", "explanation": "\"However\" ends the first clause (contrasting with the previous sentence) → \", however;\". The semicolon separates the two clauses."}, {"number": 39, "rule": "Commas & dashes (essential / nonessential)", "skill": "Essential element: no commas ｜ 必要成分：不加逗號", "passage": "The discovery of DNA's double-helix structure in 1953 is usually credited to James Watson and Francis Crick. Their work, however, relied heavily on data gathered by other scientists. In 1952, British chemist ______ produced an X-ray image of DNA known as Photo 51. Watson saw the image without her knowledge, and it helped him confirm the molecule's helical shape. Franklin died in 1958, four years before Watson, Crick, and Maurice Wilkins received the Nobel Prize.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": ", Rosalind Franklin", "B": ", Rosalind Franklin,", "C": "Rosalind Franklin", "D": "Rosalind Franklin,"}, "answer": "C", "explanation": "Title + name (\"British chemist Rosalind Franklin\") with no \"the\" is essential, so no commas. A comma before the verb \"produced\" separates subject and verb."}, {"number": 40, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Electric cars produce no tailpipe emissions while they are being driven. Building their large ______ requires mining lithium, cobalt, and nickel, which can damage local environments. Researchers are developing batteries that use more common materials, such as sodium. Recycling old batteries could also reduce the need for new mining. Over its full lifetime, a typical electric car still produces fewer emissions than a comparable gasoline car.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "batteries, though", "B": "batteries, though,", "C": "batteries though,", "D": "batteries; though,"}, "answer": "B", "explanation": "\"Though\" (= however) interrupts the subject and verb of one clause, so it needs a pair of commas."}, {"number": 41, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "Arctic ground squirrels hibernate for up to eight months each year. During hibernation, their body temperature can drop below the freezing point of water. When a squirrel wakes briefly every few ______ its body temperature rapidly climbs back to about 36°C. Scientists are not sure why the animals undergo these costly warm-ups. One hypothesis is that the periods of warmth allow the brain to repair itself.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "weeks,", "B": "weeks;", "C": "weeks.", "D": "weeks:"}, "answer": "A", "explanation": "An introductory \"When\" clause is followed by a comma before the main clause."}, {"number": 42, "rule": "Colons", "skill": "Colon introducing a list / item ｜ 冒號引出列舉", "passage": "Some of the most valuable spices in history came from tropical islands. In the 1600s, Dutch and English merchants fought bitterly over a small group of Indonesian islands known as the Banda Islands. These islands were then the world's only source of two prized ______ nutmeg and mace. Both spices come from the same tree, Myristica fragrans. In 1667, the Dutch gave up their claim to Manhattan partly in exchange for Run, one of the Banda Islands.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "spices, such as:", "B": "spices:", "C": "spices;", "D": "spices, including:"}, "answer": "B", "explanation": "A colon after the complete clause introduces the two spices. No colon after \"such as\" or \"including\"; a semicolon cannot introduce a list."}, {"number": 43, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Many hospitals now use ultraviolet robots to disinfect rooms. The devices emit UV-C light, which damages the genetic material of bacteria and viruses. The light works only on surfaces that it can reach directly. Shadowed areas remain ______ the robot is moved to a new position. Hospital staff therefore still clean rooms by hand before using the robots.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "contaminated; unless", "B": "contaminated. Unless", "C": "contaminated unless", "D": "contaminated, unless,"}, "answer": "C", "explanation": "An \"unless\" clause following the main clause needs no punctuation. A period or semicolon creates a fragment; never place a comma after \"unless.\""}, {"number": 44, "rule": "Commas & dashes (essential / nonessential)", "skill": "Nonessential element: paired commas ｜ 非必要成分：成對逗號", "passage": "In the 1830s, the English mathematician Charles Babbage designed a machine called the Analytical Engine. The machine was never completed, but its design contained many features of modern computers. Ada Lovelace, the daughter of the poet Lord ______ wrote detailed notes explaining how the engine could work. Her notes included a step-by-step method for calculating a series of numbers called Bernoulli numbers. For this reason, she is often described as the first computer programmer.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Byron—", "B": "Byron;", "C": "Byron", "D": "Byron,"}, "answer": "D", "explanation": "The appositive \"the daughter of the poet Lord Byron\" opened with a comma, so it must close with a comma."}, {"number": 45, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Hummingbirds have the highest metabolism of any warm-blooded animal. Their hearts can beat more than 1,200 times per minute during flight. Ruby-throated hummingbirds weigh only about three ______ many of them fly nonstop across the Gulf of Mexico, a journey of about 800 kilometers. To prepare, the birds nearly double their body weight by storing fat. Researchers are still studying how such tiny animals navigate so accurately.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "grams, yet", "B": "grams, yet,", "C": "grams; yet,", "D": "grams yet,"}, "answer": "A", "explanation": "\", yet\" (FANBOYS) joins two independent clauses with contrast. No comma after \"yet.\""}, {"number": 46, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Venice, Italy, is built on more than 100 small islands in a shallow lagoon. Its buildings rest on millions of wooden piles driven into the mud centuries ago. The wood has survived because the oxygen-poor mud prevents decay. Over the centuries, though, the city has slowly sunk while sea levels have risen. In 2020, Venice began operating movable barriers to block high tides from the ______ the barriers are costly to raise, and critics worry that frequent closures could harm the lagoon's ecosystem.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Adriatic, however,", "B": "Adriatic; however", "C": "Adriatic. Though,", "D": "Adriatic. However,"}, "answer": "D", "explanation": "Period + \"However,\" starts a new sentence correctly. \"Though,\" cannot start a sentence as an adverb; \", however,\" = comma splice; \"; however\" lacks the comma."}, {"number": 47, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "Frogs live on every continent except Antarctica. Their life cycle usually begins with a cluster of jelly-coated eggs. While most frogs lay their eggs in ______ some species have developed very different strategies. The male Darwin's frog, for example, carries tadpoles in his vocal sac until they become tiny froglets. Such adaptations protect the young from predators and from ponds that may dry up.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "water.", "B": "water;", "C": "water—", "D": "water,"}, "answer": "D", "explanation": "An introductory \"While\" clause is followed by a comma. Other marks leave the dependent clause as a fragment."}, {"number": 48, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "The violin was developed in northern Italy in the early 1500s. Instruments made by Antonio Stradivari around 1700 are among the most valuable in the world. Many musicians claim that a Stradivarius has an unmatched sound. Listeners in blind tests have struggled to tell the ______ in several studies, professional violinists actually preferred new instruments. Some researchers argue that a famous instrument's reputation shapes how listeners hear it.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "difference though", "B": "difference, though,", "C": "difference; though,", "D": "difference, though;"}, "answer": "D", "explanation": "\"Though\" = however, ending the first clause → \", though;\". \", though,\" is a comma splice; no punctuation is a run-on."}, {"number": 49, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Paper money first appeared in China during the Tang dynasty and became widespread under the Song dynasty. Merchants found heavy strings of copper coins inconvenient for large ______ they began depositing coins with trusted shops in exchange for paper receipts. Over time, the government took control of issuing these notes. When Marco Polo visited China in the late 1200s, he was amazed that paper could be used as money. Europe would not widely adopt paper currency for several more centuries.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "transactions, so", "B": "transactions,", "C": "transactions so,", "D": "transactions; so,"}, "answer": "A", "explanation": "\", so\" joins two independent clauses. A comma alone = comma splice."}, {"number": 50, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "The kakapo is a large, flightless parrot found only in New Zealand. Introduced predators such as cats and stoats nearly drove it to extinction. By 1995, only about 50 birds remained. The kakapo breeds slowly, and many of its eggs are ______ conservationists have steadily increased its population by moving the birds to predator-free islands. Today, more than 200 kakapo are alive.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "infertile; nevertheless,", "B": "infertile, nevertheless,", "C": "infertile nevertheless", "D": "infertile; nevertheless"}, "answer": "A", "explanation": "\"Nevertheless\" (like \"however\") begins a new independent clause: semicolon before, comma after."}, {"number": 51, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "The Great Pyramid of Giza was the tallest human-made structure in the world for nearly 4,000 years. It was long assumed that the pyramid was built by enslaved ______ archaeological evidence now suggests that it was built largely by paid laborers. Excavations near the site have uncovered workers' villages, bakeries, and cemeteries. Some workers were buried with bread and beer for the afterlife, an honor unlikely to be given to slaves. The workforce may have included farmers who served during the months when the Nile flooded their fields.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "people; however,", "B": "people however,", "C": "people, however,", "D": "people; however"}, "answer": "A", "explanation": "\"However\" begins the second independent clause: semicolon before, comma after."}, {"number": 52, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Sharks have existed for more than 400 million years, longer than trees have. They have survived several mass extinctions. Their ______ is far from certain. Each year, tens of millions of sharks are caught, many for their fins. Because most shark species grow slowly and produce few young, their populations recover very slowly from overfishing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "future though,", "B": "future, though,", "C": "future; though,", "D": "future, though"}, "answer": "B", "explanation": "\"Though\" (= however) interrupts the subject \"future\" and the verb \"is,\" so it needs commas on both sides."}, {"number": 53, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "The Dead Sea lies on the border between Jordan and the West Bank, more than 400 meters below sea level. Its shoreline is the lowest point of dry land on Earth. Because the lake is nearly ten times saltier than the ______ swimmers float on its surface with almost no effort. The high salt content also means that fish and plants cannot survive in its waters. Over the past several decades, the Dead Sea's surface has dropped by about one meter per year.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "ocean—", "B": "ocean,", "C": "ocean.", "D": "ocean;"}, "answer": "B", "explanation": "An introductory \"Because\" clause is followed by a comma before the main clause."}, {"number": 54, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "The ancient Olympic Games were held in Olympia, Greece, for more than a thousand years. In the 1890s, the French educator Pierre de Coubertin proposed reviving the tradition. The first modern Games took place in Athens in 1896. About 240 athletes from 14 nations ______ none of them were women. Women first competed four years later, at the 1900 Games in Paris.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "competed; but,", "B": "competed, but", "C": "competed, however", "D": "competed but,"}, "answer": "B", "explanation": "\", but\" joins two independent clauses. \", however\" between clauses is a comma splice."}, {"number": 55, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "Honey can last for thousands of years without spoiling. Archaeologists have found pots of honey in ancient Egyptian tombs that were still edible. The reason is ______ honey contains very little water and is highly acidic, conditions in which most bacteria cannot survive. Bees also add an enzyme that produces small amounts of hydrogen peroxide, which further protects the honey. As long as it is sealed to keep out moisture, honey can be stored almost indefinitely.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "chemical, because, honey", "B": "chemical: honey", "C": "chemical honey", "D": "chemical, honey"}, "answer": "B", "explanation": "Colon after a complete clause introduces the explanation. Comma = comma splice; nothing = run-on."}, {"number": 56, "rule": "Colons", "skill": "Colon introducing a list / item ｜ 冒號引出列舉", "passage": "The ancient Romans built a road network that stretched for tens of thousands of kilometers. The most important roads were paved with stone and carefully engineered to last. A typical Roman road was built in several ______ a foundation of large stones, a middle layer of gravel or crushed rock, and a smooth surface of fitted paving stones. The roads were slightly curved so that rainwater would drain to the sides. Some of them, such as the Appian Way, are still in use today.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "layers, including:", "B": "layers, such as:", "C": "layers:", "D": "layers;"}, "answer": "C", "explanation": "A colon after a complete clause introduces the list of layers."}, {"number": 57, "rule": "Commas & dashes (essential / nonessential)", "skill": "Paired dashes ｜ 成對破折號", "passage": "Mount Everest grows a little taller each year. The Indian tectonic plate continues to push northward into the Eurasian plate, lifting the Himalayas upward. The rate of growth—about four millimeters per ______ is tiny compared with the mountain's total height. Everest's official height of 8,849 meters was announced jointly by China and Nepal in 2020. Earthquakes and erosion can also slightly change the mountain's height over time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "year", "B": "year;", "C": "year,", "D": "year—"}, "answer": "D", "explanation": "Opening dash → closing dash."}, {"number": 58, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Most volcanoes form along the boundaries between tectonic plates. The Hawaiian ______ formed far from any plate boundary. Scientists believe they were created by a hot spot, a plume of hot material rising from deep within the mantle. As the Pacific plate slowly moves over the hot spot, new volcanoes form while older ones drift away and become inactive. This process explains why the islands get older as one moves northwest along the chain.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Islands, however", "B": "Islands, however,", "C": "Islands however,", "D": "Islands; however,"}, "answer": "B", "explanation": "\"However\" interrupts subject (\"The Hawaiian Islands\") and verb (\"formed\"): pair of commas."}, {"number": 59, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "Before the 1450s, most books in Europe were copied by hand, often by monks. A single Bible could take a scribe more than a year to complete. Johannes Gutenberg's printing press, which used movable metal type, changed this dramatically. Since the invention of the printing ______ books have been produced in ever-increasing numbers. By 1500, presses across Europe had printed millions of copies of thousands of different titles.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "press:", "B": "press,", "C": "press.", "D": "press;"}, "answer": "B", "explanation": "A comma follows the long introductory phrase \"Since the invention of the printing press.\""}, {"number": 60, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Vampire bats are the only mammals that feed entirely on blood. They live in Central and South America and usually feed on cattle, horses, and birds. Despite their reputation, vampire bats do not suck ______ they make a small cut with their sharp teeth and lap up the blood with their tongues. Their saliva contains a substance that keeps blood from clotting. Scientists have studied this substance, called draculin, as a possible medicine for stroke patients.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "blood; instead,", "B": "blood instead,", "C": "blood; instead", "D": "blood, instead,"}, "answer": "A", "explanation": "\"Instead\" begins a new independent clause: semicolon before, comma after."}, {"number": 61, "rule": "however", "skill": "“, however;” — however ends clause 1 ｜ however 置於第一句句尾", "passage": "Cats were first domesticated in the Near East roughly 10,000 years ago. Ancient Egyptians famously honored cats, and some were even mummified. Domestication probably did not begin with people choosing to keep cats as ______ cats likely moved into early farming villages on their own to hunt the mice that fed on stored grain. Farmers would have welcomed these skilled hunters. Over time, the cats that tolerated humans best thrived near settlements.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "pets; however", "B": "pets, however,", "C": "pets however;", "D": "pets, however;"}, "answer": "D", "explanation": "\"However\" closes the first clause → \", however;\". \", however,\" = comma splice."}, {"number": 62, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Visitors to Iceland can explore glaciers, volcanoes, and black-sand beaches. Many travelers come in winter hoping to see the northern ______ they visit in summer to experience the midnight sun. In June, the sun barely sets in the northern part of the country. In December, by contrast, daylight in Reykjavík lasts only about four hours. Each season offers a very different experience of the island.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "lights or,", "B": "lights, or,", "C": "lights, or", "D": "lights; or"}, "answer": "C", "explanation": "\", or\" joins two independent clauses. No comma after the conjunction; a semicolon before \"or\" is not standard."}, {"number": 63, "rule": "Commas & dashes (essential / nonessential)", "skill": "No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置", "passage": "Learning to play a musical instrument requires coordinating the eyes, ears, and hands. Researchers have found ______ children who take music lessons often show improvements in memory and attention. It is not yet clear whether music itself causes these benefits. Children who take lessons may differ in other ways, such as family income or parental involvement. Long-term studies that randomly assign children to music lessons may help answer the question.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": ", that", "B": "that", "C": "that,", "D": ": that"}, "answer": "B", "explanation": "No punctuation between a verb (\"found\") and its object clause (\"that…\")."}, {"number": 64, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "In 1900, about a third of the cars in the United States were electric. Electric cars were quiet, clean, and easy to ______ gasoline cars soon came to dominate the market. Henry Ford's mass-produced Model T, introduced in 1908, was far cheaper than electric models. The electric starter, introduced in 1912, also eliminated the need to crank gasoline engines by hand. By the 1930s, electric cars had nearly disappeared from American roads.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "start, however,", "B": "start, though,", "C": "start; however", "D": "start. However,"}, "answer": "D", "explanation": "Period + \"However,\" correctly starts a new sentence. \", however,\" and \", though,\" between clauses are comma splices."}, {"number": 65, "rule": "Colons", "skill": "Colon traps (after verb / such as / including) ｜ 冒號陷阱", "passage": "A healthy honeybee hive contains three types of bees. The colony ______ a single queen, thousands of female worker bees, and a few hundred male drones. The queen lays up to 2,000 eggs a day during the summer. Workers gather food, build the comb, and defend the hive. Drones exist mainly to mate with queens from other colonies.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "includes;", "B": "includes:", "C": "includes", "D": "includes—"}, "answer": "C", "explanation": "No colon (or any mark) between a verb and its object. A colon must follow a complete clause."}, {"number": 66, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Goldfish are often said to have memories lasting only three seconds. The claim is repeated in jokes, cartoons, and even advertisements. It has no scientific ______ laboratory experiments, goldfish have learned to push levers for food and remembered the task for months. Some fish have even learned to respond to particular sounds at feeding time. Scientists now consider goldfish surprisingly capable learners.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "basis, though, in", "B": "basis; though in", "C": "basis, though. In", "D": "basis though, in"}, "answer": "C", "explanation": "\"Though\" (= however) ends the sentence: \", though.\" A new sentence begins with \"In.\" \", though, in…\" is a comma splice."}, {"number": 67, "rule": "Commas & dashes (essential / nonessential)", "skill": "Nonessential element: paired commas ｜ 非必要成分：成對逗號", "passage": "For centuries, no one could read Egyptian hieroglyphs. The Rosetta Stone, a stone slab inscribed with the same decree in three ______ was discovered by French soldiers in Egypt in 1799. Two of the scripts were Egyptian, and the third was ancient Greek, which scholars could already read. By comparing the texts, the French scholar Jean-François Champollion deciphered the hieroglyphs in 1822. The stone is now displayed in the British Museum in London.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "scripts,", "B": "scripts—", "C": "scripts", "D": "scripts;"}, "answer": "A", "explanation": "The appositive opened with a comma, so it must close with a comma before the verb \"was discovered.\""}, {"number": 68, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Washington, D.C., is famous for its cherry blossoms. The city's first cherry trees were planted in ______ the mayor of Tokyo sent more than 3,000 of them as a gift of friendship. An earlier shipment in 1910 had to be destroyed because the trees were infested with insects. Today, the blossoms attract more than a million visitors each spring. The peak bloom usually occurs in late March or early April.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "1912. After", "B": "1912; after", "C": "1912, after,", "D": "1912, after"}, "answer": "D", "explanation": "\"After\" introduces a dependent clause attached to the main clause. A period or semicolon creates a fragment; no comma after \"after.\""}, {"number": 69, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Vaccines train the immune system to recognize a specific virus or bacterium. In theory, a vaccine could protect everyone who receives it. In ______ no vaccine is perfectly effective, and some people cannot be vaccinated because of medical conditions. When most of a community is vaccinated, the spread of disease slows dramatically. This effect, known as herd immunity, helps protect even those who are not immune.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "practice; however,", "B": "practice however,", "C": "practice, however,", "D": "practice, however"}, "answer": "C", "explanation": "\"However\" interrupts after the introductory phrase \"In practice,\" so it needs commas on both sides. A semicolon would leave \"In practice\" as a fragment."}, {"number": 70, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "The Great Fire of London began in a bakery on Pudding Lane in September 1666. Over four days, it destroyed more than 13,000 houses and nearly 90 churches. The fire spread ______ most buildings were made of timber and packed tightly together. Afterward, the city was rebuilt with wider streets and buildings of brick and stone. The architect Christopher Wren designed a new St. Paul's Cathedral, which was completed in 1711.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "quickly. Because", "B": "quickly, because,", "C": "quickly because", "D": "quickly; because"}, "answer": "C", "explanation": "A \"because\" clause after the main clause needs no punctuation. A period/semicolon creates a fragment."}, {"number": 71, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "Elephants that raid farms can destroy a season's crops in a single night. Traditional fences are expensive and often fail to stop them. Farmers in Kenya have found a creative ______ hang beehives on wires strung between fence posts. When an elephant bumps the wire, the hives swing and the bees swarm out. Elephants avoid bees, which can sting the sensitive skin around their eyes and trunks.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "alternative: and they", "B": "alternative, they", "C": "alternative: they", "D": "alternative they"}, "answer": "C", "explanation": "Colon after a complete clause introduces what the alternative is. Comma = comma splice; nothing = run-on."}, {"number": 72, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "The ostrich is the largest living bird, standing up to 2.7 meters tall. Its wings are far too small to lift its heavy body off the ground. The bird has long, powerful ______ it can outrun most of its predators, reaching speeds of about 70 kilometers per hour. Each foot has only two toes, an adaptation that helps with speed. When cornered, an ostrich can deliver a kick strong enough to injure a lion.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "legs, therefore", "B": "legs, so", "C": "legs so,", "D": "legs; so,"}, "answer": "B", "explanation": "\", so\" joins two clauses. \"Therefore\" is an adverb, so \", therefore\" between clauses is a comma splice."}, {"number": 73, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Leonardo da Vinci filled thousands of notebook pages with drawings of machines. His sketches include designs for a flying machine, a diving suit, and an armored ______ very few of these inventions were ever built during his lifetime. Many of the designs would not have worked with the materials and engines available at the time. Still, his notebooks show a mind that observed nature with remarkable care. His studies of birds' wings, for example, informed his ideas about flight.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "vehicle; however,", "B": "vehicle; however", "C": "vehicle however", "D": "vehicle, however,"}, "answer": "A", "explanation": "Semicolon before \"however,\" comma after it."}, {"number": 74, "rule": "Commas & dashes (essential / nonessential)", "skill": "Essential element: no commas ｜ 必要成分：不加逗號", "passage": "Rachel Carson is best known for Silent Spring, her 1962 book about the dangers of pesticides. That book helped launch the modern environmental movement. However, the ______ made Carson famous was an earlier work about the ocean. The Sea Around Us, published in 1951, spent more than 80 weeks on the New York Times bestseller list. Its success allowed Carson to leave her government job and write full-time.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "book that first", "B": "book, that first", "C": "book that first,", "D": "book, that first,"}, "answer": "A", "explanation": "A \"that\" clause is essential and never takes commas. A comma before the verb \"made\" would also separate subject and verb."}, {"number": 75, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Antarctica is the coldest, windiest, and highest continent on average. Its ice sheet averages nearly two kilometers thick. Surprisingly, Antarctica is also the largest desert on ______ though it holds about 70 percent of the planet's fresh water. Most of the interior receives less than 50 millimeters of precipitation a year. The continent is classified as a desert because so little new snow falls there.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Earth:", "B": "Earth,", "C": "Earth.", "D": "Earth;"}, "answer": "B", "explanation": "\"Though\" here is a conjunction (= although) introducing a dependent clause; join it with a comma. A period, semicolon, or colon creates a fragment."}, {"number": 76, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Penicillin was discovered by accident in 1928. Alexander Fleming noticed that mold growing in one of his dishes had killed the surrounding bacteria. Fleming published his findings in ______ few scientists paid attention at first. In 1940, Howard Florey, Ernst Chain, and their team at Oxford showed that penicillin could cure infections in mice. By the end of World War II, mass-produced penicillin had saved thousands of soldiers' lives.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "1929, however,", "B": "1929. However", "C": "1929. However,", "D": "1929 however,"}, "answer": "C", "explanation": "Period + \"However,\" + new sentence. \", however,\" = comma splice."}, {"number": 77, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Some scientists think that the first Americans walked across a land bridge from Siberia about 13,000 years ago. ______ argue that early migrants traveled by boat along the Pacific coast. Footprints found in New Mexico suggest that humans were present in North America more than 21,000 years ago. If those dates are correct, people arrived long before an inland route through the ice sheets opened. The debate over how and when the Americas were first settled remains lively.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Others, however,", "B": "Others however,", "C": "Others; however,", "D": "Others, however"}, "answer": "A", "explanation": "\"However\" interrupts subject (\"Others\") and verb (\"argue\"): pair of commas."}, {"number": 78, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Desalination plants turn seawater into drinking water. The technology is especially important in dry countries such as Saudi Arabia and Israel. The process requires a great deal of energy; its leftover ______ may be the bigger environmental concern. Brine is about twice as salty as seawater and can form oxygen-poor layers on the sea floor. Engineers are testing ways to dilute the brine or extract useful minerals from it.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "brine though,", "B": "brine, though,", "C": "brine, though", "D": "brine; though,"}, "answer": "B", "explanation": "The semicolon separates the clauses; inside the second clause, \"though\" (= however) interrupts subject and verb, so it needs a pair of commas."}, {"number": 79, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Earth's North and South Poles are both cold, but they differ in important ways. The North Pole sits on floating sea ice in the middle of the Arctic ______ the South Pole lies on a thick ice sheet covering solid land. Because of its higher elevation, the South Pole is much colder. Its average annual temperature is about –49°C, compared with about –18°C at the North Pole. Polar bears live only in the Arctic, and penguins live mainly in the Southern Hemisphere.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Ocean. While", "B": "Ocean while,", "C": "Ocean; while", "D": "Ocean, while"}, "answer": "D", "explanation": "\", while\" (contrast) attaches a dependent clause to the main clause. A semicolon or period before \"while\" creates a fragment."}, {"number": 80, "rule": "Colons", "skill": "Colon introducing a list / item ｜ 冒號引出列舉", "passage": "Hearing begins when sound waves enter the ear canal and strike the eardrum. The human ear has three main ______ the outer ear, the middle ear, and the inner ear. The middle ear contains the three smallest bones in the body. The smallest of these, the stapes, is about the size of a grain of rice. In the inner ear, tiny hair cells convert vibrations into electrical signals that travel to the brain.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "parts;", "B": "parts, such as:", "C": "parts:", "D": "parts, including:"}, "answer": "C", "explanation": "A colon after a complete clause introduces the list of three parts."}, {"number": 81, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Pompeii was a busy Roman city near the Bay of Naples. In 79 CE, nearby Mount Vesuvius ______ ash and pumice buried the city within hours. The ash preserved buildings, paintings, and even loaves of bread. Archaeologists later poured plaster into hollow spaces left by victims' bodies, creating detailed casts. Today, Pompeii is one of the most visited archaeological sites in the world.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "erupted,", "B": "erupted; and,", "C": "erupted and,", "D": "erupted, and"}, "answer": "D", "explanation": "\", and\" joins two independent clauses. A comma alone = comma splice."}, {"number": 82, "rule": "however", "skill": "“, however;” — however ends clause 1 ｜ however 置於第一句句尾", "passage": "Wind turbines generate electricity without burning fuel. They are not entirely free of environmental ______ their spinning blades kill hundreds of thousands of birds in the United States each year. That number is far smaller than the hundreds of millions killed by collisions with buildings. Careful placement of turbines away from migration routes can reduce bird deaths further. Some wind farms also pause their turbines when large flocks are detected nearby.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "costs, however,", "B": "costs however;", "C": "costs; however", "D": "costs, however;"}, "answer": "D", "explanation": "\"However\" ends the first clause → \", however;\". \", however,\" = comma splice."}, {"number": 83, "rule": "Commas & dashes (essential / nonessential)", "skill": "Paired dashes ｜ 成對破折號", "passage": "A total solar eclipse occurs when the moon passes directly between Earth and the sun. For a few minutes, the sky darkens and the sun's glowing outer atmosphere, the corona, becomes visible. Total solar eclipses—though visible somewhere on Earth about every 18 ______ occur at any single location only about once every 375 years on average. As a result, many people travel great distances to see one. In April 2024, millions of people gathered along a narrow path from Mexico to Canada to watch the event.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "months;", "B": "months—", "C": "months", "D": "months,"}, "answer": "B", "explanation": "Opening dash → closing dash. (Note \"though visible…\" inside is a reduced conjunction clause.)"}, {"number": 84, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "Today, the Eiffel Tower is the most recognizable symbol of Paris. When it was completed in 1889, however, many Parisians considered it ugly. A group of artists and writers even signed a public letter protesting its construction. Built as a temporary entrance arch for a world's ______ the tower was supposed to be taken down after 20 years. It was saved partly because it proved useful as a radio transmission tower.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options":
