{"A": "fair;", "B": "fair.", "C": "fair:", "D": "fair,"}, "answer": "D", "explanation": "An introductory participial phrase (\"Built as…\") is followed by a comma before the subject."}, {"number": 85, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Sloths are famous for moving slowly, and their low metabolism lets them survive on a diet of leaves. Although these animals spend most of their lives hanging in ______ they climb down to the ground about once a week to relieve themselves. The trip is dangerous because sloths are slow and vulnerable on the ground. Scientists are still debating why sloths take this risk. One hypothesis suggests that the behavior helps support moths and algae that live in sloth fur.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "trees,", "B": "trees, however,", "C": "trees. However,", "D": "trees; however,"}, "answer": "A", "explanation": "\"Although\" already shows contrast; it needs only a comma before the main clause. Adding \"however\" is redundant and creates a fragment or comma splice."}, {"number": 86, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Coffee plants grow best in a narrow range of temperatures. Rising global temperatures are making some traditional growing regions too ______ farmers in some countries are moving their coffee fields to higher, cooler elevations. Arabica coffee, which accounts for most of the world's production, is especially sensitive to heat. Researchers are also studying wild coffee species that may tolerate warmer conditions. One such species, Coffea stenophylla, was rediscovered in the wild in Sierra Leone in 2018.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "hot consequently,", "B": "hot, consequently,", "C": "hot; consequently,", "D": "hot; consequently"}, "answer": "C", "explanation": "\"Consequently\" begins a new independent clause: semicolon before, comma after."}, {"number": 87, "rule": "Sentence boundaries (period / semicolon)", "skill": "Semicolon between independent clauses ｜ 分號連接兩獨立子句", "passage": "The violin family includes four main instruments: the violin, the viola, the cello, and the double bass. The cello is played sitting down, with the instrument resting between the player's knees. The double bass is even ______ is often taller than the musician playing it. Its deep notes provide the foundation of an orchestra's sound. Jazz musicians frequently pluck the bass instead of using a bow.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "larger, it", "B": "larger, and, it", "C": "larger; it", "D": "larger it"}, "answer": "C", "explanation": "Two independent clauses, no conjunction → semicolon. Comma = comma splice."}, {"number": 88, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "The Galápagos Islands lie about 1,000 kilometers off the coast of Ecuador. Charles Darwin visited them in 1835 and collected many specimens of small birds. At first, Darwin did not realize that the birds were closely ______ an ornithologist in London later identified them as a group of distinct but related species. This insight helped Darwin develop his ideas about how species adapt to different environments. Today, the birds are known as Darwin's finches.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "related, however,", "B": "related; however", "C": "related; however,", "D": "related however"}, "answer": "C", "explanation": "Semicolon before \"however,\" comma after it."}, {"number": 89, "rule": "Colons", "skill": "Colon traps (after verb / such as / including) ｜ 冒號陷阱", "passage": "Before 1492, Europe, Asia, and Africa had no contact with the plants grown in the Americas. The exchange that followed Columbus's voyages transformed diets around the world. Many foods now considered staples elsewhere originated in the Americas, ______ potatoes, tomatoes, corn, and cacao. Italian cooking had no tomato sauce before the sixteenth century. Similarly, chili peppers did not reach India and Thailand until traders brought them from the Americas.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "including—", "B": ": including", "C": "including", "D": "including:"}, "answer": "C", "explanation": "Never place a colon (or dash) right after \"including.\" The list simply follows it."}, {"number": 90, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "The Dutch tulip craze of the 1630s is often described as the first financial bubble. According to popular accounts, people sold houses to buy single tulip bulbs. Prices for rare bulbs did rise ______ historians have found little evidence that the crash ruined many people. Most buyers were wealthy merchants who could absorb their losses. Some historians argue that the story was exaggerated by moralists who disapproved of speculation.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "dramatically, though,", "B": "dramatically; though", "C": "dramatically though", "D": "dramatically, though;"}, "answer": "D", "explanation": "\"Though\" (= however) ends the first clause → \", though;\". \"; though + clause\" leaves a fragment; \", though,\" = comma splice."}, {"number": 91, "rule": "Commas & dashes (essential / nonessential)", "skill": "Nonessential element: paired commas ｜ 非必要成分：成對逗號", "passage": "Diamonds are made of carbon atoms arranged in a rigid crystal structure. Pure diamonds are colorless, but small amounts of other elements can tint them. The Hope Diamond, whose deep blue color comes from traces of the element ______ is one of the most famous gems in the world. It weighs about 45 carats. Since 1958, it has been displayed at the Smithsonian's National Museum of Natural History in Washington, D.C.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "boron,", "B": "boron;", "C": "boron:", "D": "boron"}, "answer": "A", "explanation": "The nonessential \"whose\" clause opened with a comma, so it must close with a comma before the verb \"is.\""}, {"number": 92, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "The Vikings are often remembered as fierce raiders who attacked monasteries and coastal towns. Most Vikings spent their lives as farmers, craftspeople, and ______ trade routes stretched from Greenland in the west to Baghdad in the east. Arab silver coins have been found in large numbers in Scandinavian graves and hoards. Around the year 1000, Viking explorers also reached North America, establishing a short-lived settlement in Newfoundland.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "traders, however. Their", "B": "traders however. Their", "C": "traders, however, their", "D": "traders; however their"}, "answer": "A", "explanation": "\"However\" can end a sentence after a comma: \", however.\" The next independent clause starts a new sentence. \", however, their…\" is a comma splice."}, {"number": 93, "rule": "Commas & dashes (essential / nonessential)", "skill": "Single dash ｜ 單一破折號", "passage": "The axolotl is a salamander native to the lakes around Mexico City. Unlike most salamanders, it keeps its feathery gills and lives in water its entire life. The axolotl also has an extraordinary ______ can regrow lost limbs, parts of its heart, and even portions of its brain. Scientists study the animal in hopes of learning how to improve healing in humans. In the wild, however, axolotls are critically endangered because of pollution and urban growth.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "ability, it", "B": "ability it", "C": "ability that it", "D": "ability—it"}, "answer": "D", "explanation": "A single dash after a complete clause can introduce an explanation. A comma = comma splice; nothing = run-on."}, {"number": 94, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Hardness measures how well a material resists scratching. On the Mohs scale, diamonds rank 10, the highest possible score. Diamonds are the hardest natural ______ they can shatter if struck sharply at the right angle. This is because hardness and toughness are different properties. Jade, for example, is much softer than diamond but far more resistant to breaking.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "material, yet", "B": "material; yet,", "C": "material, though,", "D": "material yet,"}, "answer": "A", "explanation": "\", yet\" joins two independent clauses. \", though,\" (adverb) between two clauses is a comma splice."}, {"number": 95, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Living in space changes the human body in many ways. Without gravity pulling on them, muscles and bones no longer work to support the body's weight. Astronauts on the International Space Station exercise about two hours every ______ their muscles and bones do not weaken too much. Even so, some astronauts lose bone density during long missions. After returning to Earth, they may need weeks or months of rehabilitation to walk normally again.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "day so that", "B": "day; so that", "C": "day, so that,", "D": "day. So that"}, "answer": "A", "explanation": "\"So that\" (purpose) introduces a dependent clause; no comma is needed. A period or semicolon creates a fragment; never a comma after \"that.\""}, {"number": 96, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "Most people throw away a cup or bowl once it breaks. The Japanese art of kintsugi treats broken pottery in an unusual ______ of hiding the cracks, artisans fill them with lacquer mixed with powdered gold. The repaired object often looks more striking than the original. The practice reflects the idea that damage and repair are part of an object's history. Kintsugi has inspired artists and designers around the world.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "way: and instead", "B": "way: instead", "C": "way instead", "D": "way, instead"}, "answer": "B", "explanation": "Colon after a complete clause introduces the explanation of the \"unusual way.\""}, {"number": 97, "rule": "Colons", "skill": "Colon traps (after verb / such as / including) ｜ 冒號陷阱", "passage": "The International Space Station orbits Earth about 16 times a day. The station has been continuously occupied since November 2000. Its crew members, who come from many countries, conduct experiments in ______ biology, physics, and medicine. Many experiments study how plants, animals, and people respond to long periods of weightlessness. The station is roughly the size of a football field, including its solar panels.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "fields such as:", "B": "fields, such as:", "C": "fields such as", "D": "fields; such as"}, "answer": "C", "explanation": "No colon after \"such as\"; a semicolon cannot introduce examples."}, {"number": 98, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Neanderthals lived in Europe and western Asia until about 40,000 years ago. For a long time, they were portrayed as brutish and ______ recent discoveries have challenged that image. Neanderthals made jewelry from eagle talons, used pigments, and buried their dead. Genetic studies have shown that many people living today carry a small amount of Neanderthal DNA. Some scientists now argue that Neanderthals were far more similar to modern humans than once believed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "unintelligent, however,", "B": "unintelligent; however,", "C": "unintelligent however,", "D": "unintelligent; though,"}, "answer": "B", "explanation": "\"; however,\" correctly starts the second clause. \"Though\" cannot open a clause after a semicolon the way \"however\" can."}, {"number": 99, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Planting trees is often promoted as a simple way to fight climate change. Trees absorb carbon dioxide as they grow and store carbon in their wood. Planting the wrong trees in the wrong ______ can do more harm than good. In grasslands, for example, dense tree plantations can use up scarce water and crowd out native species. Many scientists argue that protecting existing forests is more effective than planting new ones.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "places, though", "B": "places, though,", "C": "places though,", "D": "places; though,"}, "answer": "B", "explanation": "\"Though\" interrupts the subject (\"Planting…places\") and verb (\"can do\"): pair of commas."}, {"number": 100, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "About 20,000 years ago, vast ice sheets covered much of North America and northern Europe. So much water was locked in ice that sea levels were far lower than they are today. A land bridge called Beringia connected Siberia and Alaska. As the climate warmed at the end of the last Ice ______ melting glaciers raised sea levels by more than 100 meters. Beringia disappeared beneath the waves, separating Asia from North America.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Age.", "B": "Age;", "C": "Age—", "D": "Age,"}, "answer": "D", "explanation": "An introductory \"As\" clause is followed by a comma."}, {"number": 101, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Before 1911, the Mona Lisa was admired by art experts but was not especially famous with the general public. In August of that year, the painting was stolen from the Louvre in Paris. Police questioned many suspects, including the artist Pablo ______ the real thief was Vincenzo Peruggia, an Italian handyman who had worked at the museum. The painting was recovered in Italy in 1913. The publicity surrounding the theft helped make the Mona Lisa the most famous painting in the world.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Picasso; however,", "B": "Picasso however,", "C": "Picasso; however", "D": "Picasso, however,"}, "answer": "A", "explanation": "Semicolon before \"however,\" comma after it."}, {"number": 102, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Bananas contain potassium, a mineral the body needs. A tiny fraction of natural potassium is radioactive. As a result, bananas are very slightly radioactive. There is no need to give up ______ person would have to eat millions of bananas at once to receive a dangerous dose. The body also regulates its potassium levels, so eating more bananas does not cause radiation to build up.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "bananas, though. A", "B": "bananas, though, a", "C": "bananas; though a", "D": "bananas though, a"}, "answer": "A", "explanation": "\", though.\" ends the sentence (though = however). \", though, a…\" is a comma splice; \"; though a…\" leaves a fragment."}, {"number": 103, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "The Netherlands is one of the flattest countries in the world. About a quarter of its land lies below sea ______ the Dutch have built an extensive system of dikes, dams, and storm barriers to keep the water out. Windmills were once used to pump water from low-lying fields. Today, electric pumps do most of this work. The country's expertise in water management is now sought by cities around the world.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "level, so", "B": "level, thus", "C": "level; so,", "D": "level so,"}, "answer": "A", "explanation": "\", so\" joins two clauses. \"Thus\" is an adverb, so \", thus\" between clauses is a comma splice."}, {"number": 104, "rule": "Commas & dashes (essential / nonessential)", "skill": "No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置", "passage": "Sunlight contains all the colors of the rainbow. As it passes through the atmosphere, it collides with gas molecules. The reason the sky looks blue is ______ these molecules scatter short blue wavelengths of light much more than longer red ones. At sunrise and sunset, sunlight travels through more of the atmosphere before reaching our eyes. By then, much of the blue light has been scattered away, leaving the sky orange and red.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": ": that", "B": "that", "C": "that,", "D": "that:"}, "answer": "B", "explanation": "No punctuation between \"is\" and its complement clause \"that…\". A colon needs a complete clause before it."}, {"number": 105, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "By the 1920s, gray wolves had been hunted out of Yellowstone National Park. Without wolves, the park's elk population grew, and the elk overgrazed young trees along rivers. In ______ wolves were reintroduced to the park. Since then, elk have changed their grazing habits, and some streamside trees have recovered. Scientists still debate how much of this recovery is due to the wolves alone.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "1995 however,", "B": "1995; however,", "C": "1995, however,", "D": "1995, however"}, "answer": "C", "explanation": "\"However\" follows the introductory phrase \"In 1995\" inside one clause: commas on both sides. A semicolon would leave \"In 1995\" as a fragment."}, {"number": 106, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Pluto was discovered in 1930 by Clyde Tombaugh, a young astronomer working in Arizona. For decades, it was taught as the ninth planet in our solar system. The International Astronomical Union reclassified Pluto as a dwarf planet in ______ even though many people objected to the change. The decision followed the discovery of other icy objects of similar size beyond Neptune. To be considered a planet, an object must clear other material from its orbit, which Pluto has not done.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "2006,", "B": "2006:", "C": "2006;", "D": "2006."}, "answer": "A", "explanation": "\"Even though\" introduces a dependent clause after the main clause; a comma is fine, but a semicolon, period, or colon leaves a fragment."}, {"number": 107, "rule": "however", "skill": "“, however;” — however ends clause 1 ｜ however 置於第一句句尾", "passage": "In 1997, IBM's computer Deep Blue defeated world chess champion Garry Kasparov in a six-game match. Many people saw the event as a sign that machines would soon outthink humans. Deep Blue was not intelligent in a general ______ it relied on enormous speed to evaluate about 200 million positions per second. It could not hold a conversation, recognize a face, or play any other game. Modern AI systems, by contrast, learn from data rather than relying only on brute-force search.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "sense, however,", "B": "sense however;", "C": "sense, however;", "D": "sense; however"}, "answer": "C", "explanation": "\"However\" closes the first clause → \", however;\". \", however,\" = comma splice."}, {"number": 108, "rule": "Commas & dashes (essential / nonessential)", "skill": "Nonessential element: paired commas ｜ 非必要成分：成對逗號", "passage": "Earth has just one natural satellite, the Moon. Several planets in our solar ______ including Jupiter and Saturn, have dozens of moons. Saturn has the most known moons of any planet. Many of these moons are only a few kilometers across. Mercury and Venus, by contrast, have no moons at all.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "system", "B": "system;", "C": "system:", "D": "system,"}, "answer": "D", "explanation": "The nonessential phrase \"including Jupiter and Saturn\" closes with a comma, so it must open with a comma too."}, {"number": 109, "rule": "Commas & dashes (essential / nonessential)", "skill": "Paired dashes ｜ 成對破折號", "passage": "The bristlecone pines of California's White Mountains are among the oldest living things on Earth. One tree—nicknamed Methuselah by the researchers who studied ______ is estimated to be more than 4,800 years old. The trees grow extremely slowly in the cold, dry mountain air. Their dense wood resists insects, fungi, and decay. To protect Methuselah from vandals, the Forest Service keeps its exact location secret.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "it,", "B": "it—", "C": "it", "D": "it;"}, "answer": "B", "explanation": "Opening dash → closing dash."}, {"number": 110, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "For astronomers, Earth's atmosphere is a nuisance because it blurs and distorts starlight. Placing a telescope in orbit avoids this problem. The Hubble Space Telescope was launched in ______ its first images were disappointingly blurry because its main mirror had been ground to the wrong shape. In 1993, astronauts installed corrective optics during a spacewalk mission. Since then, Hubble has produced some of the most famous images in the history of astronomy.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "1990; but,", "B": "1990 but,", "C": "1990, however", "D": "1990, but"}, "answer": "D", "explanation": "\", but\" joins two clauses. \", however\" between clauses is a comma splice."}, {"number": 111, "rule": "Colons", "skill": "Colon introducing a list / item ｜ 冒號引出列舉", "passage": "Qin Shi Huang became the first emperor of a unified China in 221 BCE. He standardized weights, measures, coins, and writing across his empire. He also ordered the construction of two enormous ______ an early version of the Great Wall and a vast tomb guarded by thousands of life-size clay soldiers. Farmers digging a well discovered the clay army in 1974. Archaeologists have uncovered only a small part of the tomb complex so far.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "projects, including:", "B": "projects;", "C": "projects, such as:", "D": "projects:"}, "answer": "D", "explanation": "Colon after a complete clause introduces the two projects."}, {"number": 112, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Walking is one of the simplest forms of exercise. It requires no special equipment, and most people can do it almost ______ studies link regular walking to lower rates of heart disease, diabetes, and depression. Even short walks after meals can help control blood sugar. Some researchers recommend aiming for about 7,000 to 10,000 steps a day. Walking with friends can add social benefits as well.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "anywhere; moreover,", "B": "anywhere, moreover,", "C": "anywhere; moreover", "D": "anywhere moreover,"}, "answer": "A", "explanation": "\"Moreover\" starts a new independent clause: semicolon before, comma after."}, {"number": 113, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "A cheetah can accelerate from 0 to about 95 kilometers per hour in roughly three seconds. Its flexible spine and long legs allow it to cover up to seven meters in a single stride. Though the cheetah is the fastest land ______ it can maintain its top speed for only about 20 to 30 seconds. After a chase, it must rest before eating, and larger predators sometimes steal its meal. For this reason, cheetahs often hunt during the day, when lions and hyenas are less active.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "animal;", "B": "animal,", "C": "animal; however,", "D": "animal."}, "answer": "B", "explanation": "\"Though\" (conjunction) + dependent clause + COMMA + main clause. Adding \"however\" is redundant and creates an error."}, {"number": 114, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Lie detectors, or polygraphs, measure heart rate, breathing, and sweating while a person answers questions. Supporters claim that lying causes stress, which shows up in these ______ anxiety can produce the same physical reactions in people who are telling the truth. Some people can also learn techniques to stay calm while lying. For these reasons, polygraph results are generally not admissible in American courts. Many scientists consider the tests unreliable.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "measurements, however,", "B": "measurements however,", "C": "measurements. However", "D": "measurements. However,"}, "answer": "D", "explanation": "Period + \"However,\" starts a new sentence. \", however,\" = comma splice."}, {"number": 115, "rule": "Sentence boundaries (period / semicolon)", "skill": "Semicolon between independent clauses ｜ 分號連接兩獨立子句", "passage": "The Titanic was the largest ship afloat when it set out on its first voyage in April 1912. Four days into the trip, it struck an iceberg in the North Atlantic. The ship carried lifeboats for only about half of the people on ______ more than 1,500 people died when it sank. The disaster led to new international rules requiring enough lifeboat space for everyone on board. It also led to the creation of an ice patrol to track icebergs in shipping lanes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "board,", "B": "board", "C": "board;", "D": "board, and,"}, "answer": "C", "explanation": "Two independent clauses, no conjunction → semicolon."}, {"number": 116, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "Flamingos are wading birds found in parts of Africa, Asia, Europe, and the Americas. Young flamingos are covered in gray or white feathers. The adults' famous pink color is not ______ comes from pigments in the algae and tiny shrimp they eat. Flamingos in zoos may fade if their diet lacks these pigments. For this reason, zookeepers often add special supplements to the birds' food.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "inherited it", "B": "inherited: because it", "C": "inherited: it", "D": "inherited, it"}, "answer": "C", "explanation": "Colon after a complete clause introduces the explanation. Comma = comma splice; \"because\" after a colon makes a fragment."}, {"number": 117, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Most spiders have poor eyesight and rely on vibrations to sense their surroundings. Many of them spin webs and wait for insects to become trapped. The jumping ______ hunts by stalking its prey and leaping onto it, sometimes from many times its own body length. Its large front eyes give it some of the sharpest vision of any invertebrate. Some species can even see colors, including ultraviolet light.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "spider however,", "B": "spider; however,", "C": "spider, however,", "D": "spider, however"}, "answer": "C", "explanation": "\"However\" interrupts subject (\"The jumping spider\") and verb (\"hunts\"): pair of commas."}, {"number": 118, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Titan is the largest of Saturn's many moons. It is even bigger than the planet Mercury. Though smaller than ______ Titan has an atmosphere that is denser than Earth's. Its surface contains lakes and seas, but they are filled with liquid methane and ethane rather than water. NASA plans to send a drone-like spacecraft called Dragonfly to explore Titan in the 2030s.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Mars,", "B": "Mars—", "C": "Mars.", "D": "Mars;"}, "answer": "A", "explanation": "\"Though smaller than Mars\" is a shortened dependent clause; follow it with a comma before the main clause."}, {"number": 119, "rule": "Commas & dashes (essential / nonessential)", "skill": "No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置", "passage": "Dinosaurs dominated life on land for more than 150 million years. For a long time, they were imagined as slow, cold-blooded creatures similar to modern lizards. Scientists are still debating ______ dinosaurs were warm-blooded like birds or cold-blooded like reptiles. Evidence from bone growth rings suggests that many dinosaurs grew quickly, a trait associated with warm-bloodedness. Some researchers now argue that dinosaurs fell somewhere between the two categories.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "whether", "B": ": whether", "C": ", whether", "D": "whether,"}, "answer": "A", "explanation": "No punctuation between the verb \"debating\" and its object clause \"whether…\"."}, {"number": 120, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Chess is believed to have originated in India around the sixth century CE. The early game, called chaturanga, represented four divisions of an army. Chess spread to Persia and later to ______ its rules changed along the way. The queen, once one of the weakest pieces, became the most powerful in the late 1400s. This change made the game much faster.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Europe,", "B": "Europe and,", "C": "Europe; and,", "D": "Europe, and"}, "answer": "D", "explanation": "\", and\" joins two independent clauses. A comma alone = comma splice."}, {"number": 121, "rule": "Colons", "skill": "Colon introducing a list / item ｜ 冒號引出列舉", "passage": "Ravens belong to the crow family, a group known for its intelligence. In laboratory studies, ravens have solved puzzles that challenge young children. They have also shown a skill once thought to be uniquely ______ for the future. In one experiment, ravens chose and saved a tool that they would need to open a box the next day. Researchers say that this ability likely evolved independently in birds and primates.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "human, such as: planning", "B": "human that is planning", "C": "human; planning", "D": "human: planning"}, "answer": "D", "explanation": "A colon after a complete clause introduces the specific skill. A semicolon needs a full clause after it."}, {"number": 122, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Louis Braille lost his sight in an accident at the age of three. As a teenager in Paris, he learned a system of raised dots designed for soldiers to read messages at ______ the system was too complicated for most readers. Braille simplified it into a code in which each letter fits under a single fingertip. He published his system in 1829, when he was just 20 years old. Today, braille is used by blind readers around the world.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "night; however,", "B": "night; however", "C": "night however,", "D": "night, however,"}, "answer": "A", "explanation": "Semicolon before \"however,\" comma after it."}, {"number": 123, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Most adults need seven to nine hours of sleep each night. ______ need even more, about eight to ten hours. During adolescence, the body's internal clock shifts later, making it hard for teens to fall asleep early. Many high schools start classes before 8:00 a.m., forcing students to wake up before they are fully rested. Some school districts have moved start times later and reported improved attendance and grades.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Teenagers though,", "B": "Teenagers; though,", "C": "Teenagers, though", "D": "Teenagers, though,"}, "answer": "D", "explanation": "\"Though\" (= however) interrupts subject and verb: pair of commas."}, {"number": 124, "rule": "Commas & dashes (essential / nonessential)", "skill": "Single dash ｜ 單一破折號", "passage": "Coast redwoods grow only in a narrow strip along the Pacific coast of California and southern Oregon. They thrive in the region's frequent summer fog, which provides moisture. The tallest known living tree is one of these redwoods in ______ giant named Hyperion that stands about 116 meters tall. Its exact location is kept secret to protect it from damage. Officials have even banned visitors from the area after hikers trampled the surrounding soil.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "California. A", "B": "California—a", "C": "California a", "D": "California; a"}, "answer": "B", "explanation": "A dash can introduce a phrase that renames/explains. A semicolon or period would leave \"a giant named Hyperion…\" as a fragment (no main verb)."}, {"number": 125, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "Greenland is the world's largest island, and about 80 percent of it is covered by ice. In some places, the ice sheet is more than three kilometers thick. If all of that ice were to ______ global sea levels would rise by about seven meters. Such a complete melt would take centuries or longer. Even so, the ice sheet is currently losing hundreds of billions of tons of ice each year.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "melt.", "B": "melt:", "C": "melt;", "D": "melt,"}, "answer": "D", "explanation": "An introductory \"If\" clause is followed by a comma."}, {"number": 126, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "William Shakespeare wrote about 37 plays between roughly 1590 and 1613. Many of them were performed at the Globe Theatre in London. The plays were popular during his ______ only about half of them were printed before his death in 1616. In 1623, two of his fellow actors collected his plays in a single volume now known as the First Folio. Without that book, plays such as Macbeth and The Tempest might have been lost forever.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "lifetime, however,", "B": "lifetime however,", "C": "lifetime. However,", "D": "lifetime. However"}, "answer": "C", "explanation": "Period + \"However,\" + new sentence. \", however,\" = comma splice."}, {"number": 127, "rule": "however", "skill": "“, however;” — however ends clause 1 ｜ however 置於第一句句尾", "passage": "The Great Wall of China stretches thousands of kilometers across northern China. Many people believe that it is the only human-made structure visible from the Moon. The claim is ______ the wall is only a few meters wide and is similar in color to the land around it. Even from low Earth orbit, astronauts have struggled to spot it without a camera. Highways and cities, by contrast, are much easier to see from space.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "false, however;", "B": "false, however,", "C": "false; however", "D": "false however;"}, "answer": "A", "explanation": "\"However\" closes the first clause → \", however;\"."}, {"number": 128, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Japan's first high-speed rail line opened in 1964, just before the Tokyo Olympics. Its trains are famous for their speed and punctuality. Travelers going from Tokyo to Osaka can take the train, which takes about two and a half ______ they can take a short flight, which requires extra time for airport security. Many travelers prefer the train because stations are located in city centers. The average delay on the line is measured in seconds rather than minutes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "hours or,", "B": "hours, or", "C": "hours, otherwise", "D": "hours; or"}, "answer": "B", "explanation": "\", or\" joins two independent clauses. \"Otherwise\" is an adverb → comma splice."}, {"number": 129, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Robots have taken over many repetitive tasks in car factories and warehouses. They can weld, paint, and lift heavy parts with great precision. Folding laundry remains surprisingly difficult for ______ soft fabrics bend and change shape in unpredictable ways. A robot must recognize each item and plan a new sequence of movements for it. Several companies have built laundry-folding machines, but most have been too slow or expensive to succeed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "them, though,", "B": "them; though", "C": "them, though;", "D": "them though"}, "answer": "C", "explanation": "\"Though\" (= however) ends the first clause → \", though;\"."}, {"number": 130, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "Cuttlefish can change the color and pattern of their skin in less than a second. They use this ability to hide from predators and to communicate with one another. Yet experiments suggest that cuttlefish are colorblind. This raises a puzzling ______ can an animal match colors it cannot see? Some researchers think that light-sensitive proteins in the skin itself may help.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "question: how", "B": "question how", "C": "question, how", "D": "question; and how"}, "answer": "A", "explanation": "A colon after a complete clause can introduce a question that explains \"a puzzling question.\""}, {"number": 131, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Emperor penguins breed during the Antarctic winter, when temperatures can fall below –40°C. While most birds build nests in trees or on the ______ emperor penguins build no nests at all. Instead, the male balances the single egg on his feet and covers it with a warm fold of skin. He then goes without food for about two months while the egg incubates. Males huddle together in large groups, taking turns on the cold outer edge.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "ground.", "B": "ground,", "C": "ground;", "D": "ground; however,"}, "answer": "B", "explanation": "Introductory \"While\" clause + comma. Adding \"however\" is redundant; a period or semicolon creates a fragment."}, {"number": 132, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Many common words in English come from other languages. The word ______ probably comes from a Hokkien Chinese word for a fermented fish sauce. Similarly, the word shampoo comes from Hindi, and the word robot comes from Czech. English has borrowed so freely that only a minority of its words come directly from Old English. These borrowed words reflect centuries of trade, conquest, and cultural exchange.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "ketchup for example,", "B": "ketchup, for example,", "C": "ketchup, for example", "D": "ketchup; for example,"}, "answer": "B", "explanation": "\"For example\" interrupts subject and verb: pair of commas."}, {"number": 133, "rule": "Commas & dashes (essential / nonessential)", "skill": "Paired dashes ｜ 成對破折號", "passage": "The kiwi—a flightless bird found only in New ______ lays one of the largest eggs relative to body size of any bird. A female kiwi's egg can weigh about a fifth of her body weight. Carrying it is a huge burden, and in the final days before laying, the female has little room left to eat. Kiwis are also unusual in having nostrils at the tip of their long bills. They use their keen sense of smell to find worms and insects in the soil at night.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Zealand—", "B": "Zealand,", "C": "Zealand;", "D": "Zealand"}, "answer": "A", "explanation": "Opening dash → closing dash."}, {"number": 134, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "For thousands of years, people chewed willow bark to relieve pain and fever. The bark works because it contains a compound called ______ the compound can cause stomach irritation when taken in large amounts. In 1897, chemists at the German company Bayer produced a modified version that was gentler on the stomach. The company named the new drug aspirin. Today, people around the world take many billions of aspirin tablets each year.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "salicin; however,", "B": "salicin; however", "C": "salicin, however,", "D": "salicin however,"}, "answer": "A", "explanation": "Semicolon before \"however,\" comma after it."}, {"number": 135, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Iceland has one of the smallest populations in Europe. Its language, Icelandic, has changed remarkably little over the past thousand years. Modern Icelanders can read medieval sagas with relative ease. Icelandic does need new words for modern ______ language committee creates many of them from old roots. The word for computer, tölva, combines words meaning \"number\" and \"prophetess.\"", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "inventions however. A", "B": "inventions, however, a", "C": "inventions; however a", "D": "inventions, however. A"}, "answer": "D", "explanation": "\", however.\" can end a sentence; the next clause becomes a new sentence. \", however, a…\" = comma splice."}, {"number": 136, "rule": "Sentence boundaries (period / semicolon)", "skill": "Semicolon between independent clauses ｜ 分號連接兩獨立子句", "passage": "The first vaccine was developed by Edward Jenner in 1796. Jenner noticed that milkmaids who had caught cowpox seemed protected from ______ this observation led him to test the idea on a young boy. He infected the boy with cowpox and later exposed him to smallpox, and the boy did not become ill. The word vaccine comes from vacca, the Latin word for cow. Smallpox was declared eradicated worldwide in 1980.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "smallpox, which", "B": "smallpox", "C": "smallpox;", "D": "smallpox,"}, "answer": "C", "explanation": "Two independent clauses, no conjunction → semicolon."}, {"number": 137, "rule": "Colons", "skill": "Colon traps (after verb / such as / including) ｜ 冒號陷阱", "passage": "Mixing paints and mixing light produce very different results. When paints are combined, they absorb more light, so the mixture becomes darker. Light behaves in the opposite way. The three primary colors of light ______ red, green, and blue. When all three are combined in equal amounts, they produce white light, a principle used in television and computer screens.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "are:", "B": "are", "C": "are;", "D": "are—"}, "answer": "B", "explanation": "No punctuation between a verb (\"are\") and what follows it."}, {"number": 138, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Koalas live in the eucalyptus forests of eastern Australia. Though it is often called a koala ______ koala is not a bear at all. It is a marsupial, meaning that its young develop in a pouch. Koalas eat almost nothing but eucalyptus leaves, which are low in nutrients and toxic to most animals. To save energy, they sleep for up to 20 hours a day.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "bear, however, the", "B": "bear; however, the", "C": "bear, the", "D": "bear. The"}, "answer": "C", "explanation": "\"Though\" already signals contrast; the dependent clause needs only a comma. Adding \"however\" is redundant and ungrammatical."}, {"number": 139, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Saturn is the second-largest planet in the solar ______ it is so light for its size that it would float in a giant bathtub of water. Saturn's average density is less than that of water because it is made mostly of hydrogen and helium. Its famous rings are made of countless pieces of ice and rock. Some pieces are as small as grains of sand, while others are as large as houses. Galileo first observed the rings in 1610, but his telescope was too weak to show their shape clearly.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "system; yet,", "B": "system, nevertheless", "C": "system, yet", "D": "system yet,"}, "answer": "C", "explanation": "\", yet\" joins two clauses. \", nevertheless\" (adverb) = comma splice."}, {"number": 140, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Bamboo is technically a grass, not a tree. Some species can grow nearly a meter in a single ______ bamboo can be harvested far more often than timber from trees. Builders in Asia have used bamboo for scaffolding for centuries. The material is lightweight but has a tensile strength comparable to that of some steels. Bamboo is now being promoted as a sustainable building material.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "day as a result", "B": "day, as a result,", "C": "day. As a result,", "D": "day, as a result"}, "answer": "C", "explanation": "Period + \"As a result,\" starts a new sentence. A comma before it creates a comma splice."}, {"number": 141, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Before the telegraph, messages could travel no faster than a horse or a ship. In 1844, Samuel Morse sent the first official long-distance telegraph message, from Washington, D.C., to Baltimore. Within two decades, telegraph lines connected cities across the United States. Crossing the Atlantic ______ proved far more difficult. A cable laid in 1858 failed after only a few weeks, and a lasting connection was not established until 1866.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Ocean however,", "B": "Ocean; however,", "C": "Ocean, however,", "D": "Ocean, however"}, "answer": "C", "explanation": "\"However\" interrupts subject (\"Crossing the Atlantic Ocean\") and verb (\"proved\"): pair of commas."}, {"number": 142, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "Octopuses are notorious escape artists in aquariums. One octopus in New Zealand famously slipped out of its tank and made its way down a drainpipe to the sea. Since octopuses have no ______ they can squeeze through any opening larger than their hard beak. Their soft bodies also let them hide in narrow cracks in rocks. Aquarium staff often have to secure tank lids with locks or weights.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "bones;", "B": "bones,", "C": "bones:", "D": "bones."}, "answer": "B", "explanation": "An introductory \"Since\" (= because) clause is followed by a comma."}, {"number": 143, "rule": "Colons", "skill": "Colon introducing a list / item ｜ 冒號引出列舉", "passage": "Predicting volcanic eruptions can save thousands of lives. Before most eruptions, magma rises toward the surface and changes the volcano in measurable ways. Scientists therefore monitor active volcanoes for several warning ______ small earthquakes, swelling of the ground, and increased release of gases such as sulfur dioxide. In 1991, such signs allowed officials to evacuate tens of thousands of people before Mount Pinatubo erupted in the Philippines. Still, the exact timing of an eruption remains difficult to predict.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "signs:", "B": "signs;", "C": "signs, such as:", "D": "signs including:"}, "answer": "A", "explanation": "Colon after a complete clause introduces the list."}, {"number": 144, "rule": "Sentence boundaries (period / semicolon)", "skill": "Sentence boundary: period / run-on / comma splice ｜ 句子界線", "passage": "Sourdough bread is made with a starter, a mixture of flour and water that contains wild yeast and bacteria. Bakers keep their starters alive by feeding them fresh flour regularly. Some bakeries claim that their starters are more than a century ______ microbes in a starter produce gases that make dough rise and acids that give the bread its tangy flavor. Scientists studying starters from around the world have found surprising diversity in the microbes they contain.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "old the", "B": "old. The", "C": "old, the", "D": "old. Which"}, "answer": "B", "explanation": "Two complete sentences must be separated by a period (or semicolon). Comma = comma splice; nothing = run-on; \"Which\" starts a fragment."}, {"number": 145, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "The Perseverance rover landed on Mars in February ______ it carried a small helicopter named Ingenuity. Ingenuity was designed to make up to five test flights over about a month. Flying on Mars is difficult because the planet's atmosphere is only about 1 percent as dense as Earth's. Ingenuity exceeded all expectations and made 72 flights before a damaged rotor ended its mission in 2024. Its success has encouraged engineers to design larger helicopters for future missions.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "2021; and,", "B": "2021,", "C": "2021 and,", "D": "2021, and"}, "answer": "D", "explanation": "\", and\" joins two clauses. A comma alone = comma splice."}, {"number": 146, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "The blue whale is the largest animal known to have ever lived. Though it can grow to about 30 meters long, it feeds almost entirely on krill, tiny shrimp-like animals. A single blue whale can eat several tons of krill a day. How such a huge animal finds enough food in the vast ocean was long a mystery. Recent ______ though, suggest that blue whales remember the locations of past feeding grounds.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "studies;", "B": "studies,", "C": "studies", "D": "studies:"}, "answer": "B", "explanation": "Note the two uses: \"Though it can grow…,\" = conjunction; \"Recent studies, though, suggest\" = adverb interrupting subject and verb → needs commas on both sides."}, {"number": 147, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "The Statue of Liberty was not always green. When it was dedicated in 1886, it had the reddish-brown shine of a new penny. The change came from a natural ______ on the statue's surface reacted with air and water over about 30 years, forming a green layer called a patina. This patina actually protects the copper beneath it from further corrosion. For that reason, it has never been removed.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "process copper", "B": "process: and copper", "C": "process: copper", "D": "process, copper"}, "answer": "C", "explanation": "Colon after a complete clause introduces the explanation of the \"natural process.\""}, {"number": 148, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Polynesian navigators settled islands across a vast area of the Pacific Ocean, from Hawaii to New Zealand. They traveled in double-hulled canoes, guided by the stars, ocean swells, and the flight paths of birds. The sweet potato, which originated in South America, was being grown in Polynesia centuries before Europeans arrived. Genetic studies suggest that Polynesians and Native South Americans met around 1200 ______ exactly where and how they met remains uncertain. Some researchers think that South Americans may have sailed west instead.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "CE. Though", "B": "CE: though", "C": "CE; though", "D": "CE—though"}, "answer": "D", "explanation": "\"Though\" here is a conjunction; a dash (or comma) can attach its clause. A semicolon, period, or colon leaves \"though…\" as a fragment."}, {"number": 149, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Butterflies and moths belong to the same group of insects. Butterflies usually fly during the day and often have brightly colored wings. Most ______ are active at night and tend to have duller colors that help them hide. Their antennae also differ: butterfly antennae end in small clubs, while moth antennae are often feathery. There are exceptions, however, and some moths are as colorful as any butterfly.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "moths, in contrast,", "B": "moths; in contrast,", "C": "moths in contrast,", "D": "moths, in contrast"}, "answer": "A", "explanation": "\"In contrast\" interrupts subject and verb: pair of commas."}, {"number": 150, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "A popular story claims that educated Europeans in the 1400s believed the Earth was flat. In fact, scholars had known that the Earth was round since ancient Greek times. The experts who doubted Christopher Columbus's plan did not think the Earth was ______ they believed he had greatly underestimated the distance from Europe to Asia. They were right. Columbus survived only because the Americas lay between Europe and Asia.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "flat, instead,", "B": "flat; instead", "C": "flat; instead,", "D": "flat instead,"}, "answer": "C", "explanation": "\"Instead\" begins the second clause: semicolon before, comma after."}, {"number": 151, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "The world's oceans absorb about a quarter of the carbon dioxide released by human activities. This process slows global ______ it also makes seawater more acidic. More acidic water makes it harder for oysters, corals, and other animals to build their shells and skeletons. Since the Industrial Revolution, the ocean's surface has become about 30 percent more acidic. Scientists warn that the trend could disrupt entire marine food webs.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "warming however", "B": "warming; however,", "C": "warming; however", "D": "warming, however,"}, "answer": "B", "explanation": "Semicolon before \"however,\" comma after it."}, {"number": 152, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Mount Kilimanjaro in Tanzania is the tallest mountain in Africa. Although it lies just south of the equator, its summit has been capped with ice for thousands of years. That ice is disappearing ______ than 80 percent of the mountain's ice has vanished since 1912. Scientists estimate that the remaining glaciers could be gone within a few decades. Rising temperatures and drier air are both thought to play a role.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "quickly; though more", "B": "quickly, though, more", "C": "quickly, though. More", "D": "quickly though, more"}, "answer": "C", "explanation": "\", though.\" ends a sentence (though = however); a new sentence follows. \", though, more\" = comma splice."}, {"number": 153, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Botanists define a fruit as the part of a plant that develops from a flower and contains seeds. By this definition, tomatoes, cucumbers, and peppers are all fruits. Tomatoes are botanically ______ the U.S. Supreme Court ruled in 1893 that they should be taxed as vegetables. The case, Nix v. Hedden, turned on how ordinary people used the word, not on science. Most cooks still treat tomatoes as vegetables because they are usually eaten in savory dishes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "fruits,", "B": "fruits; but,", "C": "fruits, but", "D": "fruits but,"}, "answer": "C", "explanation": "\", but\" joins two clauses. A comma alone = comma splice."}, {"number": 154, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "The giant panda lives in the mountain forests of central China. The animal presents biologists with a nutritional ______ has the digestive system of a meat eater but eats almost nothing except bamboo. Because its gut digests bamboo poorly, a panda must eat for up to 14 hours a day. Pandas also conserve energy by moving slowly and resting often. Their thyroid hormone levels are unusually low, which further reduces their energy needs.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "puzzle, it", "B": "puzzle; because it", "C": "puzzle it", "D": "puzzle: it"}, "answer": "D", "explanation": "Colon after a complete clause introduces the explanation of the \"puzzle.\""}, {"number": 155, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Cultivated meat is produced by growing animal cells in large steel tanks rather than raising whole animals. Supporters say that it could greatly reduce land use and greenhouse gas emissions. In 2020, Singapore became the first country to approve its sale. Its high ______ remains a major obstacle to widespread use. Producing large amounts of the nutrient-rich liquid that feeds the cells is still very expensive.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "cost, however", "B": "cost; however,", "C": "cost however,", "D": "cost, however,"}, "answer": "D", "explanation": "\"However\" interrupts subject (\"Its high cost\") and verb (\"remains\"): pair of commas."}, {"number": 156, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Chameleons are lizards known for their ability to change color. Many people assume that they do so mainly to match their ______ although camouflage is only part of the story. Chameleons also change color to regulate body temperature and to signal to other chameleons. A male may turn bright colors to warn rivals or attract a mate. The color change is controlled by tiny crystals in skin cells that reflect light differently as they move closer together or farther apart.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "surroundings,", "B": "surroundings;", "C": "surroundings:", "D": "surroundings."}, "answer": "A", "explanation": "\"Although\" introduces a dependent clause; attach it with a comma. Stronger marks leave a fragment."}, {"number": 157, "rule": "Commas & dashes (essential / nonessential)", "skill": "Nonessential element: paired commas ｜ 非必要成分：成對逗號", "passage": "The Mariana Trench, the deepest known part of Earth's ______ lies in the western Pacific Ocean, east of the Philippines. Its deepest point, called the Challenger Deep, is nearly 11,000 meters below the surface. If Mount Everest were placed there, its peak would still be about two kilometers underwater. Only a handful of people have ever visited the bottom. The first two, Jacques Piccard and Don Walsh, made the trip in 1960.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "oceans—", "B": "oceans,", "C": "oceans", "D": "oceans;"}, "answer": "B", "explanation": "The appositive opened with a comma, so it must close with a comma (not a dash)."}, {"number": 158, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Mercury orbits closer to the sun than any other planet. Its daytime temperatures can reach about 430°C. Nevertheless, Mercury is not the hottest ______ even though it is the closest to the sun. That title belongs to Venus, whose thick atmosphere traps heat. Because Mercury has almost no atmosphere, its nighttime temperatures plunge to about –180°C.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "planet;", "B": "planet.", "C": "planet,", "D": "planet:"}, "answer": "C", "explanation": "\"Even though\" clause after the main clause: comma OK; a period, semicolon, or colon creates a fragment."}, {"number": 159, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Ancient Greek and Roman statues are often imagined as gleaming white sculptures. Artists of the Renaissance admired the statues' bare ______ many of these sculptures were originally painted in bright colors. Over the centuries, most of the paint wore away. Using ultraviolet light and chemical analysis, scientists have detected traces of red, blue, and gold pigments on many works. Some museums now display painted replicas to show how the statues once looked.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "marble, however, many", "B": "marble. However many", "C": "marble. However, many", "D": "marble however, many"}, "answer": "C", "explanation": "Period + \"However,\" + new sentence."}, {"number": 160, "rule": "Sentence boundaries (period / semicolon)", "skill": "Semicolon between independent clauses ｜ 分號連接兩獨立子句", "passage": "Venus is unusual in several ways. It rotates very slowly, taking about 243 Earth days to spin once on its axis. It also spins in the opposite direction from most ______ on Venus, the sun rises in the west and sets in the east. A day on Venus is therefore longer than its year, which lasts about 225 Earth days. Scientists are not sure why Venus spins backward.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "planets, so,", "B": "planets;", "C": "planets,", "D": "planets"}, "answer": "B", "explanation": "Two independent clauses, no conjunction → semicolon."}, {"number": 161, "rule": "Colons", "skill": "Colon traps (after verb / such as / including) ｜ 冒號陷阱", "passage": "The Arctic tundra is a treeless region where the ground beneath the surface stays frozen all year. Summers are short, and winters are long and dark. Despite these harsh conditions, the tundra supports many animals well adapted to the ______ caribou, arctic foxes, and snowy owls. Many birds migrate to the tundra each summer to nest. As the climate warms, shrubs are spreading northward into areas that were once open tundra.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "cold: such as", "B": "cold, such as:", "C": "cold, such as", "D": "cold such as:"}, "answer": "C", "explanation": "No colon before or after \"such as\"; a comma introduces the examples."}, {"number": 162, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "In the 1960s, the United States and the Soviet Union raced to land people on the Moon. The Soviet Union achieved many early firsts, including the first satellite and the first human in ______ the United States invested heavily in the Apollo program. In July 1969, Apollo 11 astronauts Neil Armstrong and Buzz Aldrin became the first people to walk on the Moon. In total, twelve astronauts walked on the lunar surface between 1969 and 1972. No one has returned since the final Apollo mission.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "orbit, meanwhile,", "B": "orbit; meanwhile", "C": "orbit; meanwhile,", "D": "orbit meanwhile,"}, "answer": "C", "explanation": "\"Meanwhile\" begins the second clause: semicolon before, comma after."}, {"number": 163, "rule": "however", "skill": "“, however;” — however ends clause 1 ｜ however 置於第一句句尾", "passage": "Microplastics are plastic particles smaller than five millimeters. They have been found in ocean water, soil, drinking water, and even the air. Scientists have documented harm to fish and seabirds that swallow plastic. The effects on human health are less ______ researchers have only recently begun to study them in detail. Reducing plastic waste remains the most reliable way to limit exposure.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "clear; however", "B": "clear, however,", "C": "clear however;", "D": "clear, however;"}, "answer": "D", "explanation": "\"However\" closes the first clause → \", however;\"."}, {"number": 164, "rule": "Commas & dashes (essential / nonessential)", "skill": "Paired dashes ｜ 成對破折號", "passage": "Tardigrades—microscopic animals often called water ______ can survive conditions that would kill almost any other creature. When their environment dries out, they curl up and enter a state in which their metabolism nearly stops. In this state, they can withstand extreme cold and heat for short periods. In 2007, tardigrades survived ten days exposed to outer space. When water returns, they can revive and resume normal life.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "bears", "B": "bears;", "C": "bears,", "D": "bears—"}, "answer": "D", "explanation": "Opening dash → closing dash."}, {"number": 165, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "For decades, most scientists doubted that plants could communicate. In recent ______ studies have shown that some plants release chemicals that warn their neighbors of insect attacks. When caterpillars chew on certain plants, the plants release airborne chemicals. Nearby plants detect these signals and begin producing substances that make their leaves less tasty. Some researchers describe this as a kind of plant communication, though others prefer more cautious terms.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "years, though", "B": "years; though,", "C": "years though,", "D": "years, though,"}, "answer": "D", "explanation": "\"Though\" (= however) follows the introductory phrase inside one clause: pair of commas. Compare the last sentence, where \", though others prefer…\" uses \"though\" as a conjunction."}, {"number": 166, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Owls are skilled nighttime hunters. They have excellent hearing and can locate prey in total darkness. Many owls can also fly almost ______ the edges of their wing feathers are soft and fringed, which breaks up the air turbulence that creates noise. Engineers have studied owl feathers to design quieter fans and wind turbines. Some owls' ears are placed at different heights on their heads, helping them pinpoint sounds.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "silently because", "B": "silently. Because", "C": "silently, because of this,", "D": "silently; because"}, "answer": "A", "explanation": "\"Because\" clause after the main clause: no punctuation needed. \", because of this,\" between two clauses is a comma splice."}, {"number": 167, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "The first emoji were created in Japan in 1999 by designer Shigetaka Kurita. His goal was ______ wanted to help people convey emotions in short text messages. His original set of 176 small images included symbols for weather, food, and facial expressions. In 2016, the Museum of Modern Art in New York added the set to its collection. Today, thousands of emoji are used by billions of people around the world.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "practical: he", "B": "practical he", "C": "practical, he", "D": "practical: and he"}, "answer": "A", "explanation": "Colon after a complete clause introduces the explanation."}, {"number": 168, "rule": "Commas & dashes (essential / nonessential)", "skill": "Essential element: no commas ｜ 必要成分：不加逗號", "passage": "In the summer of 1816, a group of writers gathered at a villa near Lake Geneva in Switzerland. Stormy weather kept them indoors, so they challenged one another to write ghost stories. Mary Shelley, then just 18 years old, began a story that would become one of the most famous novels ever written. The novel ______ is often considered the first work of science fiction. It tells the story of a scientist who creates life and then abandons his creation.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": ", Frankenstein", "B": ", Frankenstein,", "C": "Frankenstein,", "D": "Frankenstein"}, "answer": "D", "explanation": "The title identifies which novel (essential), so no commas. A single comma would also split subject and verb."}, {"number": 169, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Chocolate is made from the seeds of the cacao tree, which grows in tropical regions. The Aztecs valued cacao seeds so highly that they used them as money. They drank chocolate as a bitter, frothy ______ Europeans who encountered chocolate in the 1500s soon began sweetening it with sugar. Solid chocolate bars did not appear until the 1840s. Milk chocolate followed a few decades later, developed in Switzerland.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "beverage, however,", "B": "beverage. However,", "C": "beverage; however", "D": "beverage however,"}, "answer": "B", "explanation": "Period + \"However,\" + new sentence. \", however,\" = comma splice."}, {"number": 170, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Archerfish live in mangrove swamps and rivers in Southeast Asia and northern Australia. They have an unusual hunting technique. An archerfish spots an insect resting on a leaf above the ______ shoots it down with a powerful jet of water from its mouth. The fish can adjust for the way light bends at the water's surface. Some can hit targets more than a meter away.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "water and", "B": "water, and", "C": "water. And", "D": "water; and"}, "answer": "A", "explanation": "\"Spots… and shoots…\" is ONE subject with two verbs (compound predicate), so no comma before \"and.\" Use \", and\" only between two independent clauses."}, {"number": 171, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "The heart beats roughly 100,000 times each day. Though only about the size of a ______ it pumps around 7,000 liters of blood through the body daily. Blood travels through a network of vessels that would stretch about 100,000 kilometers if laid end to end. That is long enough to circle Earth more than twice. The heart's steady rhythm is controlled by electrical signals from a small cluster of cells called the sinoatrial node.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "fist;", "B": "fist,", "C": "fist—", "D": "fist."}, "answer": "B", "explanation": "\"Though only about the size of a fist\" is a shortened dependent clause; follow it with a comma."}, {"number": 172, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "Camels are well suited to life in the desert. Contrary to popular belief, a camel's hump does not hold water. To survive long journeys without ______ camels store fat in their humps, which they can break down for energy. They can also drink more than 100 liters of water in just a few minutes. Their oval red blood cells keep flowing even when the camel is dehydrated.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "food.", "B": "food,", "C": "food:", "D": "food;"}, "answer": "B", "explanation": "An introductory infinitive phrase (\"To survive…\") is followed by a comma."}, {"number": 173, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "The paintings in Lascaux Cave in southwestern France were created about 17,000 years ago. Four teenagers discovered them in 1940. The cave was opened to the public in 1948 and soon attracted more than 1,000 visitors a day. The ______ brought warmth, moisture, and carbon dioxide that damaged the paintings. The cave was closed in 1963, and today visitors explore a detailed replica built nearby.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "crowds, however,", "B": "crowds, however", "C": "crowds however,", "D": "crowds; however,"}, "answer": "A", "explanation": "\"However\" interrupts subject (\"The crowds\") and verb (\"brought\"): pair of commas."}, {"number": 174, "rule": "Commas & dashes (essential / nonessential)", "skill": "No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置", "passage": "The giant anteater of Central and South America has no teeth. Instead, it uses a sticky tongue up to 60 centimeters long to collect insects. Its diet consists almost entirely ______ ants and termites. An anteater can eat about 30,000 insects in a single day. To avoid destroying its food supply, it feeds at each nest for only a minute or so before moving on.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "of:", "B": "of", "C": ": of", "D": "of—"}, "answer": "B", "explanation": "No punctuation between a preposition (\"of\") and its object."}, {"number": 175, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Deciduous trees lose their leaves each autumn. Before the leaves fall, they often turn brilliant shades of yellow, orange, and red. The change ______ shorter days cause the trees to stop producing chlorophyll, the green pigment used in photosynthesis. As the chlorophyll breaks down, other pigments that were present all along become visible. Red colors, however, come from new pigments that some trees produce in the fall.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English
