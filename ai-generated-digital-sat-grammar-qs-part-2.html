?", "options": {"A": "begins. When", "B": "begins, when,", "C": "begins when", "D": "begins; when"}, "answer": "C", "explanation": "\"When\" clause after the verb completes the sentence; no punctuation. A period/semicolon creates fragments."}, {"number": 176, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Nearly all bananas sold in supermarkets today belong to a single variety called the Cavendish. Cavendish bananas are cheap to grow and easy to ______ their lack of genetic diversity makes them vulnerable to disease. Because they are seedless, new plants are grown from cuttings, so the plants are genetically almost identical. A fungal disease wiped out the previous dominant variety, the Gros Michel, in the mid-twentieth century. A new strain of the same disease is now spreading through Cavendish plantations.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "ship, however,", "B": "ship however,", "C": "ship; however,", "D": "ship; however"}, "answer": "C", "explanation": "Semicolon before \"however,\" comma after it."}, {"number": 177, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Chili peppers get their heat from a compound called capsaicin. Eating a hot pepper can make the mouth feel as if it is on fire. No real damage occurs in most ______ simply triggers the same nerve receptors that respond to actual heat. Birds, which spread pepper seeds, lack these receptors. As a result, they can eat even the hottest peppers without discomfort.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "cases; though capsaicin", "B": "cases though, capsaicin", "C": "cases, though, capsaicin", "D": "cases, though. Capsaicin"}, "answer": "D", "explanation": "\", though.\" ends the sentence; a new sentence begins. \", though, capsaicin…\" = comma splice."}, {"number": 178, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Fireflies are beetles that produce light through a chemical reaction in their abdomens. The light is extremely efficient, giving off almost no heat. Each species has its own distinctive pattern of ______ females can recognize males of their own kind. Some predatory fireflies imitate the flashes of other species to lure males and eat them. Light pollution can interfere with these signals and make it harder for fireflies to find mates.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "flashes; so,", "B": "flashes, so", "C": "flashes so,", "D": "flashes, therefore"}, "answer": "B", "explanation": "\", so\" joins two clauses. \", therefore\" = comma splice."}, {"number": 179, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "Humans begin yawning even before birth. Many other animals, including dogs, snakes, and fish, yawn as well. Scientists have proposed many explanations for this behavior, but one idea has gained ______ may help cool the brain. A deep yawn draws in air and increases blood flow to the head. Studies have found that people yawn less often when the surrounding air is very hot.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "support, yawning", "B": "support: yawning", "C": "support: that yawning", "D": "support yawning"}, "answer": "B", "explanation": "Colon after a complete clause introduces the explanation. \"that yawning may help…\" after a colon is not a complete clause."}, {"number": 180, "rule": "Commas & dashes (essential / nonessential)", "skill": "Paired dashes ｜ 成對破折號", "passage": "Glass frogs—so called because the skin on their bellies is ______ live in the rainforests of Central and South America. Through this see-through skin, an observer can watch the frog's heart beating. While sleeping, the frogs can hide most of their red blood cells in their livers, making their bodies even more transparent. This trick helps them avoid predators during the day. Scientists hope that studying it could lead to new treatments for blood clots.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "transparent—", "B": "transparent;", "C": "transparent,", "D": "transparent"}, "answer": "A", "explanation": "Opening dash → closing dash."}, {"number": 181, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Gold is one of the least reactive metals. It does not rust or tarnish, which is why ancient gold jewelry still shines today. Pure gold ______ too soft for most everyday uses. Jewelers therefore mix it with other metals such as copper and silver. The purity of gold is measured in karats, with 24-karat gold being pure.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "is, however,", "B": "is however,", "C": "is, however", "D": "is; however,"}, "answer": "A", "explanation": "\"However\" interrupts the verb and its complement within one clause: pair of commas."}, {"number": 182, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞", "passage": "Pacific salmon hatch in freshwater streams and soon migrate to the ocean. They spend several years growing in the open ______ they return to the very stream where they hatched to spawn. Scientists believe that salmon use Earth's magnetic field to find the right stretch of coast. Once near their home river, they follow its distinctive smell upstream. Most Pacific salmon die soon after spawning, and their bodies provide nutrients to the surrounding forest.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "ocean. Before", "B": "ocean before", "C": "ocean, before,", "D": "ocean; before"}, "answer": "B", "explanation": "\"Before\" clause after the main clause: no punctuation. A period/semicolon creates a fragment."}, {"number": 183, "rule": "Commas & dashes (essential / nonessential)", "skill": "Nonessential element: paired commas ｜ 非必要成分：成對逗號", "passage": "Before the 1960s, scientists widely believed that only humans made and used tools. Jane Goodall, who began studying wild chimpanzees in Tanzania in ______ challenged that belief. She watched chimpanzees strip leaves from twigs and use them to fish termites out of their mounds. Her discovery forced scientists to rethink what made humans unique. Goodall's research continued for decades and transformed how people understand animal behavior.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "1960,", "B": "1960—", "C": "1960;", "D": "1960"}, "answer": "A", "explanation": "The nonessential \"who\" clause opened with a comma, so it must close with a comma before the verb \"challenged.\""}, {"number": 184, "rule": "Colons", "skill": "Colon introducing a list / item ｜ 冒號引出列舉", "passage": "Earth's atmosphere is a thin layer of gases held in place by gravity. It is made mostly of two ______ nitrogen, which makes up about 78 percent, and oxygen, which makes up about 21 percent. The remaining one percent includes argon, carbon dioxide, and water vapor. Although carbon dioxide is present only in small amounts, it plays an important role in trapping heat. Without the atmosphere, Earth's average temperature would be far below freezing.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "gases, which are:", "B": "gases:", "C": "gases, such as:", "D": "gases;"}, "answer": "B", "explanation": "Colon after a complete clause introduces the two gases. Never a colon right after a verb (\"are\") or \"such as.\""}, {"number": 185, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "Rapa Nui, also known as Easter Island, is famous for nearly 1,000 giant stone statues called moai. For decades, many writers claimed that the islanders destroyed their own society by cutting down all the trees to move the ______ recent research suggests a different story. Evidence indicates that the population remained relatively stable until European contact. Diseases and slave raids brought by outsiders in the 1800s caused the greatest devastation. Experiments have also shown that the statues could have been \"walked\" upright using ropes and a small team of people.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "statues. However,", "B": "statues however,", "C": "statues; however", "D": "statues, however,"}, "answer": "A", "explanation": "Period + \"However,\" + new sentence."}, {"number": 186, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "A desert is defined by how little precipitation it receives, not by its temperature. Many people picture deserts as places of burning sand and blazing sun. Though many deserts are ______ some, like the Gobi Desert in Asia, are bitterly cold in winter. Temperatures in the Gobi can drop below –40°C. Snow sometimes covers its dunes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "hot;", "B": "hot—", "C": "hot,", "D": "hot."}, "answer": "C", "explanation": "\"Though\" (conjunction) clause + comma + main clause."}, {"number": 187, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "Sunflowers are often said to follow the sun across the sky. Young sunflowers do turn from east to west during the ______ mature flowers usually face east all day. Researchers found that east-facing flower heads warm up faster in the morning. Warm flowers attract more bees and other pollinators. This simple behavior may therefore help sunflowers reproduce.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "day, but, however,", "B": "day, but", "C": "day but,", "D": "day, however"}, "answer": "B", "explanation": "\", but\" alone joins the clauses. \"but however\" is redundant; \", however\" = comma splice."}, {"number": 188, "rule": "Other transition adverbs", "skill": "Other transition adverbs (therefore, instead…) ｜ 其他連接副詞", "passage": "Beavers are sometimes called ecosystem engineers. Using branches, mud, and stones, they build dams across streams. These dams slow the flow of ______ they help reduce flooding and erosion downstream. The ponds that form behind the dams provide habitats for fish, frogs, birds, and insects. In some regions, conservationists have reintroduced beavers to help restore damaged wetlands.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "water; thus,", "B": "water, thus,", "C": "water thus", "D": "water; thus"}, "answer": "A", "explanation": "\"Thus\" begins the second independent clause: semicolon before, comma after."}, {"number": 189, "rule": "Colons", "skill": "Colon traps (after verb / such as / including) ｜ 冒號陷阱", "passage": "Caffeine is the most widely consumed stimulant in the world. It works by blocking a chemical in the brain called adenosine, which builds up during the day and makes people feel sleepy. Common sources of caffeine ______ coffee, tea, chocolate, and many soft drinks. The effects usually begin within about 15 to 45 minutes. Because caffeine can stay in the body for several hours, drinking it in the afternoon may interfere with sleep.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "include;", "B": "include:", "C": "include", "D": "include—"}, "answer": "C", "explanation": "No punctuation between a verb (\"include\") and its objects."}, {"number": 190, "rule": "however", "skill": "“, however;” — however ends clause 1 ｜ however 置於第一句句尾", "passage": "Scientists can identify the regions where large earthquakes are most likely to occur. Predicting exactly when an earthquake will strike is still ______ the processes deep within faults are too complex to model precisely. Instead of prediction, some countries rely on early warning systems. These systems detect the first, faster-moving waves of an earthquake and send alerts seconds before the strongest shaking arrives. In Japan, such alerts automatically slow down high-speed trains.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "impossible; however", "B": "impossible, however,", "C": "impossible however;", "D": "impossible, however;"}, "answer": "D", "explanation": "\"However\" closes the first clause → \", however;\"."}, {"number": 191, "rule": "Sentence boundaries (period / semicolon)", "skill": "Semicolon between independent clauses ｜ 分號連接兩獨立子句", "passage": "The Venus flytrap is one of the few plants that can move quickly. It grows naturally in only one small region of the ______ is found in wetlands within about 100 kilometers of Wilmington, North Carolina. Its leaves snap shut when an insect touches tiny trigger hairs inside them twice within about 20 seconds. This double-touch system prevents the plant from wasting energy on raindrops or falling debris. Once the trap closes, the plant releases digestive juices that dissolve the insect over several days.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "world, it", "B": "world it", "C": "world; it", "D": "world, and, it"}, "answer": "C", "explanation": "Two independent clauses, no conjunction → semicolon."}, {"number": 192, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Saffron is made from the dried stigmas of the crocus flower. Each flower produces only three stigmas, which must be picked by hand. About 150,000 flowers are needed to produce a single kilogram of saffron. As a result, saffron is one of the most expensive spices in the world. Its high ______ has not stopped cooks around the world from using it in dishes such as Spanish paella and Persian rice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "price, however", "B": "price however,", "C": "price; however,", "D": "price, however,"}, "answer": "D", "explanation": "\"However\" interrupts subject (\"Its high price\") and verb (\"has not stopped\"): pair of commas."}, {"number": 193, "rule": "Commas & dashes (essential / nonessential)", "skill": "Single dash ｜ 單一破折號", "passage": "During the colonial era, European powers established huge plantations in tropical regions. Workers on these plantations, many of them enslaved or forced laborers, grew crops for export to Europe. Sugar, cotton, rubber, and ______ crops shaped the economies of entire regions for centuries. In many former colonies, the effects can still be seen in patterns of land ownership. Some countries still depend heavily on exporting a single crop.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "coffee, these", "B": "coffee—these", "C": "coffee these", "D": "coffee; and these"}, "answer": "B", "explanation": "A dash can separate an introductory list from the clause that sums it up (\"these crops\"). A comma creates a confusing run-on structure."}, {"number": 194, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "On a clear night, most stars appear white to the naked eye. Viewed through a ______ stars display a range of colors from deep red to bright blue. A star's color reveals its surface temperature. Red stars are the coolest, while blue stars are the hottest. Our sun, a yellowish star, falls somewhere in the middle.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "telescope, however, though,", "B": "telescope, though,", "C": "telescope though", "D": "telescope; though,"}, "answer": "B", "explanation": "\"Though\" (= however) follows the introductory phrase and needs commas on both sides. Never use \"however\" and \"though\" together."}, {"number": 195, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號", "passage": "Octopuses differ from other animals in many surprising ways. Unlike humans and most other ______ they have three hearts. Two of the hearts pump blood through the gills, while the third pumps it to the rest of the body. Their blood is blue because it contains a copper-based protein called hemocyanin. This protein carries oxygen efficiently in cold water with little oxygen.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "animals;", "B": "animals:", "C": "animals,", "D": "animals."}, "answer": "C", "explanation": "An introductory \"Unlike…\" phrase is followed by a comma."}, {"number": 196, "rule": "Conjunctions (FANBOYS / subordinating)", "skill": "Comma + FANBOYS ｜ 逗號＋對等連接詞", "passage": "The Sahara is the largest hot desert in the world. Some parts of it receive almost no rain for years at a time. The region is extremely ______ it sits above some of the largest underground water reserves on Earth. Much of this water, called fossil water, fell as rain thousands of years ago when the region was much wetter. Because it is not replaced quickly, pumping it out faster than it refills could exhaust the supply.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "dry yet,", "B": "dry, yet", "C": "dry, however", "D": "dry; yet,"}, "answer": "B", "explanation": "\", yet\" joins two clauses. \", however\" = comma splice."}, {"number": 197, "rule": "Colons", "skill": "Colon introducing an explanation ｜ 冒號引出說明", "passage": "In 1999, NASA lost contact with the Mars Climate Orbiter as it approached the planet. The cause turned out to be a simple ______ engineering team used English units, while another used metric units. As a result, the spacecraft flew too close to Mars and was destroyed in its atmosphere. The mission had cost about 125 million dollars. The incident is now taught as a lesson in the importance of clear communication.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "error; because one", "B": "error one", "C": "error, one", "D": "error: one"}, "answer": "D", "explanation": "Colon after a complete clause introduces the explanation of the \"error.\""}, {"number": 198, "rule": "however", "skill": "“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首", "passage": "In 1874, a group of young painters held their own exhibition in Paris after years of rejection by the official Salon. A critic mocked them as \"Impressionists,\" borrowing the word from a painting by Claude ______ the artists soon adopted the name themselves. The Impressionists often painted outdoors and tried to capture the changing effects of light. Their loose brushstrokes shocked many viewers at the time. Today, their paintings are among the most popular works in museums around the world.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Monet; however,", "B": "Monet however,", "C": "Monet, however,", "D": "Monet; however"}, "answer": "A", "explanation": "Semicolon before \"however,\" comma after it."}, {"number": 199, "rule": "though", "skill": "though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞", "passage": "Penguins are usually associated with ice and snow. In fact, many penguin species live in temperate climates in South America, Africa, Australia, and New Zealand. Penguins are found almost entirely in the Southern ______ though one species, the Galápagos penguin, lives near the equator. Cool ocean currents bring cold, nutrient-rich water to the Galápagos Islands, allowing the penguins to survive there. No penguins live naturally in the Arctic.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "Hemisphere:", "B": "Hemisphere,", "C": "Hemisphere;", "D": "Hemisphere."}, "answer": "B", "explanation": "\"Though\" (conjunction) clause after the main clause: comma. Other marks create a fragment."}, {"number": 200, "rule": "however", "skill": "“, however,” — however interrupts one clause ｜ however 插入句中", "passage": "Latin has had no native speakers for more than a thousand years. The ______ remains surprisingly alive in science, law, and medicine. Biologists use Latin names to classify every known species. Lawyers still use Latin phrases such as habeas corpus. Many English words, including \"audio\" and \"video,\" come directly from Latin verbs.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "options": {"A": "language however,", "B": "language; however,", "C": "language, however,", "D": "language, however"}, "answer": "C", "explanation": "\"However\" interrupts subject (\"The language\") and verb (\"remains\"): pair of commas."}];
const STORAGE_KEY="aiGeneratedSatGrammarPart2ProgressV1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch{return {}}})();
const state={filtered:[...QUESTIONS],index:0,selected:saved.selected||{},checked:saved.checked||{},correct:saved.correct||{}};
const letters=["A","B","C","D"],el=id=>document.getElementById(id);
function esc(value){const n=document.createElement("div");n.textContent=value||"";return n.innerHTML}
function passageHtml(value){return esc(value).replace(/_{4,}/g,'<span class="blank">_______</span>')}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify({selected:state.selected,checked:state.checked,correct:state.correct}))}
function unique(field){return [...new Set(QUESTIONS.map(q=>q[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))}
function fill(id,values){const s=el(id);values.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o)})}
fill("ruleFilter",unique("rule"));fill("skillFilter",unique("skill"));
function applyFilters(){
 const term=el("search").value.trim().toLowerCase(),rule=el("ruleFilter").value,skill=el("skillFilter").value;
 state.filtered=QUESTIONS.filter(q=>{const hay=[q.rule,q.skill,q.passage,q.stem,...Object.values(q.options)].join(" ").toLowerCase();return(!term||hay.includes(term))&&(!rule||q.rule===rule)&&(!skill||q.skill===skill)});
 state.index=0;render()
}
function render(){
 const total=state.filtered.length;
 el("filterSummary").textContent=total+" of "+QUESTIONS.length+" questions";
 el("counter").textContent=total?"Question "+(state.index+1)+" of "+total:"";
 el("previous").disabled=state.index<=0;el("next").disabled=!total||state.index>=total-1;
 if(!total){el("questionHost").innerHTML='<div class="empty"><strong>No questions match these filters.</strong><p>Try clearing one or more filters.</p></div>';updateProgress();return}
 const q=state.filtered[state.index],id=String(q.number),selected=state.selected[id],checked=state.checked[id];
 const options=letters.map(letter=>{const good=checked&&letter===q.answer,bad=checked&&selected===letter&&letter!==q.answer;const cls=["option",selected===letter?"selected":"",good?"correct":"",bad?"incorrect":""].filter(Boolean).join(" ");return '<button class="'+cls+'" type="button" data-letter="'+letter+'" '+(checked?"disabled":"")+'><span class="letter">'+letter+'</span><span>'+esc(q.options[letter])+'</span></button>'}).join("");
 const result=checked?(selected===q.answer?"Correct":"Not quite"):"";
 el("questionHost").innerHTML='<article class="question-panel"><div class="question-meta"><span>Practice P'+q.number+'</span><span>'+esc(q.rule)+'</span></div><div class="question-content"><h2>Practice P'+q.number+'</h2><p class="passage">'+passageHtml(q.passage)+'</p><p class="stem">'+esc(q.stem)+'</p><div class="options">'+options+'</div><div class="actions"><button class="primary" id="checkAnswer" type="button" '+(!selected||checked?"disabled":"")+'>Check answer</button><span class="score" id="score"></span></div><div class="feedback '+(checked&&selected!==q.answer?"is-wrong":"")+'" id="feedback" style="display:'+(checked?"block":"none")+'"><h3>'+esc(result)+'</h3><p><strong>Answer: '+q.answer+')</strong> '+esc(q.options[q.answer])+'</p><p>'+esc(q.explanation)+'</p><p class="rule-note">'+esc(q.skill)+'</p></div></div></article>';
 document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{state.selected[id]=b.dataset.letter;persist();render()}));
 el("checkAnswer").addEventListener("click",()=>{state.checked[id]=true;state.correct[id]=state.selected[id]===q.answer;persist();render()});
 updateProgress()
}
function updateProgress(){const answered=Object.keys(state.checked).length,right=Object.values(state.correct).filter(Boolean).length;el("progressText").textContent=answered+" / "+QUESTIONS.length+" answered";el("progressBar").style.width=(answered/QUESTIONS.length*100)+"%";const score=el("score");if(score)score.textContent=answered?"Score: "+right+" / "+answered:""}
["search","ruleFilter","skillFilter"].forEach(id=>el(id).addEventListener(id==="search"?"input":"change",applyFilters));
el("resetFilters").addEventListener("click",()=>{["search","ruleFilter","skillFilter"].forEach(id=>el(id).value="");applyFilters()});
el("resetProgress").addEventListener("click",()=>{if(confirm("Clear all saved answers for this quiz?")){state.selected={};state.checked={};state.correct={};persist();render()}});
el("previous").addEventListener("click",()=>{if(state.index>0){state.index--;render();scrollTo({top:0,behavior:"smooth"})}});
el("next").addEventListener("click",()=>{if(state.index<state.filtered.length-1){state.index++;render();scrollTo({top:0,behavior:"smooth"})}});
document.addEventListener("keydown",event=>{if(event.target.matches("input,select"))return;if(event.key==="ArrowLeft")el("previous").click();if(event.key==="ArrowRight")el("next").click()});
render();
</script>
</body>
</html>
