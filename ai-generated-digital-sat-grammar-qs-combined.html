<style>
:root{--navy:#153a4a;--blue:#176b87;--green:#26734d;--red:#b42318;--gold:#c68a12;--ink:#1f2933;--muted:#667085;--line:#d5dde5;--paper:#fff;--wash:#f2f6f7;--focus:#ffc857}

.filters{align-self:start;position:sticky;top:90px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}

.filter-summary{color:var(--muted);font-size:14px;margin:10px 0 14px}

.question-content{padding:22px}

.option:hover{border-color:var(--blue);background:#f3fafc}
.option .letter{width:30px;height:30px;display:grid;place-items:center;border:1px solid #8393a2;border-radius:50%;font-weight:800}
.option.selected{border:2px solid var(--blue);padding:11px;background:#eaf7fb}

.option.incorrect{border-color:var(--red);background:#fff1f0}

.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:18px}

}

.cat-btn:hover{background:#f4f7f8}
.cat-btn.active{border-color:var(--blue);background:#e8f3f7;font-weight:700}
.cat-btn small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.cat-count{flex:none;color:var(--blue);font-weight:800;font-size:13px}
.src-tag{background:#eef2f5;border-radius:4px;padding:1px 6px;color:#475467;font-size:12px}

<script>
const QUESTIONS=[{"number":1,"skill":"Finite vs. nonfinite verb (main verb needed)","passage":"In the 1840s, the Irish potato crop was devastated by Phytophthora infestans, a water mold that spreads rapidly in cool, damp conditions. Many agricultural historians _______ that the island’s near-total reliance on a single potato variety, the Lumper, left the crop with almost no genetic defense against the pathogen.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"having argued","B":"to argue","C":"argue","D":"arguing"},"answer":"C","explanation":"The subject “Many agricultural historians” has no main verb yet. “Argue” is finite and plural; the participles and the infinitive are nonfinite and would leave the sentence a fragment.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Finite (main) verbs","src":"Set 1 · Q1","id":"s1-1"},{"number":2,"skill":"Finite vs. nonfinite verb (main verb needed)","passage":"To conserve energy during the long Arctic winter, when air temperatures can fall below −30°C, Arctic ground squirrels in hibernation _______ their core body temperature to drop below the freezing point of water. No other mammal is known to survive such a low body temperature.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"to allow","B":"allow","C":"having allowed","D":"allowing"},"answer":"B","explanation":"Strip the interrupters: “Arctic ground squirrels [blank] their core body temperature to drop.” The subject needs a finite main verb, and only “allow” is finite.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Finite (main) verbs","src":"Set 1 · Q2","id":"s1-2"},{"number":3,"skill":"Finite vs. nonfinite verb (main verb needed)","passage":"For centuries, weavers on the Indonesian island of Sumba _______ ikat, a technique in which bundles of thread are tightly bound and dyed before being woven, to produce textiles that mark births, marriages, and funerals. Remarkably, a single large cloth can take a weaver more than a year to complete.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have practiced","B":"to practice","C":"having practiced","D":"practicing"},"answer":"A","explanation":"The subject “weavers” needs a finite main verb. “Have practiced” is finite, and the present perfect fits an activity that began in the past and continues (“For centuries”). The other choices are nonfinite.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Finite (main) verbs","src":"Set 1 · Q3","id":"s1-3"},{"number":4,"skill":"Finite verb in a relative clause","passage":"A largely self-taught mathematician from southern India, Srinivasa Ramanujan is celebrated for the notebooks he filled before his death in 1920, which _______ thousands of formulas that researchers are still working to prove.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"containing","B":"contain","C":"to contain","D":"having contained"},"answer":"B","explanation":"The relative clause “which [blank] thousands of formulas” needs its own finite verb. “Contain” is finite and agrees with the plural “notebooks.” The nonfinite forms leave the clause without a verb.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Finite (main) verbs","src":"Set 1 · Q4","id":"s1-4"},{"number":5,"skill":"Finite vs. nonfinite verb (main verb needed)","passage":"A honeybee that has located a rich patch of flowers does not simply return to it; she first spends valuable time performing an elaborate “waggle dance” inside the dark hive. Research by Austrian ethologist Karl von Frisch _______ why: the angle and duration of the dance tell nestmates the direction and distance of the food source, allowing the entire colony to exploit it.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"revealing","B":"having revealed","C":"to reveal","D":"reveals"},"answer":"D","explanation":"The subject “Research” (ignore “by Austrian ethologist Karl von Frisch”) needs a finite main verb before the colon: “reveals.” The other choices are nonfinite.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Finite (main) verbs","src":"Set 1 · Q5","id":"s1-5"},{"number":6,"skill":"Finite vs. nonfinite verb (main verb needed)","passage":"In 1928, Scottish physician Alexander Fleming noticed that a mold contaminating one of his culture plates had killed the surrounding bacteria. More than a decade later, Howard Florey and Ernst Chain _______ on Fleming’s observation to develop penicillin into a drug that could be mass-produced.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"to have built","B":"to build","C":"built","D":"building"},"answer":"C","explanation":"The subject “Howard Florey and Ernst Chain” needs a finite main verb. “Built” is finite and in the simple past, matching “noticed” and “More than a decade later.”","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Finite (main) verbs","src":"Set 1 · Q6","id":"s1-6"},{"number":7,"skill":"Finite vs. nonfinite verb (main verb needed)","passage":"How do monarch butterflies, which weigh less than a gram, navigate thousands of kilometers to the same mountain forests in central Mexico each autumn? Neurobiologist Steven Reppert suspected that part of the answer lay in the insects’ antennae. In 2009, Reppert and his colleagues _______ evidence that the antennae contain a light-sensitive clock that helps the butterflies orient themselves by the Sun.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"having reported","B":"to report","C":"reporting","D":"reported"},"answer":"D","explanation":"The subject “Reppert and his colleagues” needs a finite main verb; “reported” is finite and past tense (“In 2009”). The other choices are nonfinite.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Finite (main) verbs","src":"Set 1 · Q7","id":"s1-7"},{"number":8,"skill":"Finite vs. nonfinite verb (main verb needed)","passage":"In 1955, Marian Anderson became the first African American singer to perform a principal role at the Metropolitan Opera. Her decades of acclaimed concert tours across Europe and her celebrated 1939 recital on the steps of the Lincoln Memorial before a crowd of 75,000 _______ pave the way for the generations of Black opera singers who followed.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"listeners helped","B":"listeners to help","C":"listeners that helped","D":"listeners, helping"},"answer":"A","explanation":"The long compound subject (“Her decades of... tours... and her... recital...”) still needs a finite main verb: “helped.” The other choices turn “help” into a participle, a relative clause, or an infinitive, leaving the sentence without a main verb.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Finite (main) verbs","src":"Set 1 · Q8","id":"s1-8"},{"number":9,"skill":"Participial phrase showing result (nonfinite)","passage":"In summer, the hunting habits of polar bears along Hudson Bay are shaped more by ice conditions than by preference. Although the bears rely on sea ice as a platform for catching seals, that platform may disappear for months as the bay thaws, _______ the animals to come ashore and subsist on stored fat, bird eggs, and whatever carcasses they can scavenge.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"drove","B":"driving","C":"to drive","D":"drives"},"answer":"B","explanation":"The main clause (“that platform may disappear”) is already complete, so what follows the comma must be a nonfinite participial phrase showing the result: “driving the animals to come ashore.” “Drives” and “drove” are finite verbs with no subject or conjunction; “to drive” would wrongly suggest purpose.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q9","id":"s1-9"},{"number":10,"skill":"Parallel verbs after a modal (would + base form)","passage":"To reduce the urban heat island effect, in which paved surfaces cause cities to be warmer than surrounding rural areas, some planners have proposed that reflective coatings be applied to rooftops and roads. Such coatings would lower surface temperatures during heat waves and _______ the amount of electricity that buildings consume for air conditioning.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"decreases","B":"decreased","C":"decreasing","D":"decrease"},"answer":"D","explanation":"Two verbs share the modal “would”: “would lower... and (would) decrease.” After a modal, each verb must be in the base form, parallel to “lower.”","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q10","id":"s1-10"},{"number":11,"skill":"Infinitive of purpose","passage":"Drawing on decades of research into how the immune system recognizes foreign molecules, biochemists Katalin Karikó and Drew Weissman—recipients of the 2023 Nobel Prize in Physiology or Medicine—chemically modified one of the building blocks of messenger RNA _______ a molecule that cells would accept without triggering a harmful inflammatory response.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"to produce","B":"and producing","C":"produces","D":"produced"},"answer":"A","explanation":"The sentence already has its main verb (“modified”). The blank explains WHY they modified the RNA, so an infinitive of purpose is needed: “to produce a molecule.” “Produced” and “produces” add a second finite verb with no conjunction; “and producing” is not parallel to “modified.”","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q11","id":"s1-11"},{"number":12,"skill":"Participial phrase as supplement (nonfinite) + paired commas","passage":"Japanese artist Yayoi _______ her mirrored installations to give viewers the sensation of standing in a space without boundaries, lines the walls, floors, and ceilings of small rooms with reflective panels that multiply hanging lights into seemingly endless fields.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Kusama, designs","B":"Kusama, designing","C":"Kusama is designing","D":"Kusama designs"},"answer":"B","explanation":"The main verb is “lines” (“Yayoi Kusama... lines the walls”). Everything between the commas is a supplement, so it must be a nonfinite participial phrase opened with a comma: “Kusama, designing her mirrored installations...,”. The other choices give the subject two finite verbs.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q12","id":"s1-12"},{"number":13,"skill":"Past participle as introductory modifier","passage":"The Rosenwald schools were among the most important educational institutions for Black children in the rural American South in the early twentieth century. _______ through a partnership between educator Booker T. Washington and philanthropist Julius Rosenwald, the schools eventually numbered nearly five thousand across fifteen states.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Established","B":"Establishes","C":"Establishing","D":"Establish"},"answer":"A","explanation":"The opening phrase modifies “the schools,” which RECEIVED the action (they were established), so the past participle is required. “Establishing” would mean the schools did the establishing; the finite forms cannot begin a modifier.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q13","id":"s1-13"},{"number":14,"skill":"Past participle as modifier (nonfinite)","passage":"Built around a steady pulse and short melodic cells that shift gradually over time, Steve Reich’s 1976 composition Music for 18 Musicians is a landmark of minimalism, a style of music _______ by the repetition and slow transformation of simple patterns rather than by dramatic contrasts.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will be defined","B":"has been defined","C":"defined","D":"is defined"},"answer":"C","explanation":"“A style of music...” is an appositive renaming “minimalism,” not a new clause, so it cannot take a finite verb. The past participle “defined” (= “that is defined”) correctly modifies “style.”","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q14","id":"s1-14"},{"number":15,"skill":"Infinitive after certain verbs (decide to)","passage":"Today, the marathon is fixed at 42.195 kilometers, a distance that runners around the world train for years to complete. Curiously, organizers of the 1908 London Olympics chose _______ the course so that it would begin at Windsor Castle and end in front of the royal box, and the resulting distance later became the official standard.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"arranged","B":"arrange","C":"arranging","D":"to arrange"},"answer":"D","explanation":"The verb “chose” is followed by an infinitive: “chose to arrange.” (Compare decide to, plan to, agree to.)","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q15","id":"s1-15"},{"number":16,"skill":"Participle as modifier (main verb elsewhere)","passage":"Analyses of ancient DNA have led some geneticists to propose that farming spread across Europe mainly through the migration of farmers rather than through the adoption of agriculture by local hunter-gatherers. This model _______ that incoming populations almost entirely replaced existing ones cannot be accepted, some archaeologists counter, until evidence of intermarriage between the two groups has been accounted for.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"implying","B":"has implied","C":"implied","D":"implies"},"answer":"A","explanation":"Read to the end: the main verb of “This model” is “cannot be accepted.” The blank must therefore be a nonfinite modifier of “model”: “This model implying that... cannot be accepted.” Any finite choice gives the subject two main verbs.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q16","id":"s1-16"},{"number":17,"skill":"Infinitive of purpose","passage":"In the graphic memoir Persepolis, Iranian-born author Marjane Satrapi uses stark black-and-white drawings rather than conventional prose _______ her experience of growing up in Tehran during and after the 1979 revolution.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"is recounting","B":"to recount","C":"recounts","D":"recounted"},"answer":"B","explanation":"The main verb is “uses.” The blank gives the purpose of using drawings, so an infinitive is needed: “uses... drawings... to recount her experience.” The finite choices create a second main verb.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q17","id":"s1-17"},{"number":18,"skill":"Absolute phrase (nonfinite participle)","passage":"In the mid-fifteenth century, Johannes Gutenberg’s workshop in Mainz produced roughly 180 copies of a Latin Bible using movable metal type. Regarded as the first major book printed in Europe by this method, the Gutenberg Bible is admired for the clarity and evenness of its pages, its surviving copies _______ by libraries and museums as among the most valuable books in the world.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"were now treasured","B":"are now treasured","C":"now treasured","D":"have now been treasured"},"answer":"C","explanation":"After the comma comes an absolute phrase (noun + participle): “its surviving copies now treasured by libraries.” A finite verb here (“are,” “were,” “have been”) would create a second independent clause joined only by a comma—a comma splice.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Nonfinite verbs (participles, infinitives)","src":"Set 1 · Q18","id":"s1-18"},{"number":19,"skill":"Simple present (time marker \"today\")","passage":"In her 1962 book Silent Spring, marine biologist Rachel Carson documented how the pesticide DDT was accumulating in food chains and killing birds. Today, the book _______ widely credited with launching the modern environmental movement in the United States.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will be","B":"is","C":"had been","D":"was"},"answer":"B","explanation":"“Today” signals a present state, so the simple present “is” is required.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Verb tense","src":"Set 1 · Q19","id":"s1-19"},{"number":20,"skill":"Past perfect (by + past time)","passage":"Launched in 1977 to study Jupiter and Saturn, NASA’s Voyager 1 spacecraft completed its planetary flybys by 1980 and then continued toward the edge of the solar system. By the time it crossed into interstellar space in 2012, the probe _______ more than 18 billion kilometers from Earth.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"travels","B":"has traveled","C":"had traveled","D":"will travel"},"answer":"C","explanation":"“By the time it crossed... in 2012” sets a past reference point; the traveling was completed before that point, so the past perfect “had traveled” is required.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Verb tense","src":"Set 1 · Q20","id":"s1-20"},{"number":21,"skill":"Tense consistency (literary present)","passage":"Memory and its unreliability are recurring concerns in Kazuo Ishiguro’s fiction. In The Remains of the Day, for example, the butler Stevens reconsiders decades of loyal service during a drive through the English countryside, while in Never Let Me Go, the narrator Kathy _______ her years at a secluded boarding school whose true purpose she only gradually comes to understand.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"recalls","B":"had recalled","C":"will be recalling","D":"recalled"},"answer":"A","explanation":"Events in a literary work are described in the present tense, and the parallel verbs “reconsiders” and “comes” are present. “Recalls” keeps the tense consistent.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Verb tense","src":"Set 1 · Q21","id":"s1-21"},{"number":22,"skill":"Tense consistency (simple past)","passage":"In 1968, Spencer Silver, a chemist at the company 3M, was trying to develop an exceptionally strong adhesive when he instead produced a weak one that could be peeled away without leaving a residue. Years later, his colleague Art Fry realized that the adhesive could keep bookmarks from slipping out of his hymnal. Soon afterward, Fry _______ coating small sheets of paper with it, and the Post-it Note was born.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"proposes","B":"had proposed","C":"proposed","D":"was proposing"},"answer":"C","explanation":"The passage narrates a sequence of completed past events (“realized,” “was born”). The simple past “proposed” keeps the sequence; the past perfect would wrongly place this event BEFORE Fry’s realization.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Verb tense","src":"Set 1 · Q22","id":"s1-22"},{"number":23,"skill":"Simple present for general process","passage":"Water droplets inside a cumulonimbus cloud are carried upward by powerful air currents, freezing and accumulating layer upon layer of ice until they _______ a weight the updraft can no longer support, at which point they fall to the ground as hailstones.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will reach","B":"reach","C":"are reaching","D":"had reached"},"answer":"B","explanation":"The sentence describes a general, repeated process in the simple present (“are carried,” “fall”). “Reach” matches.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Verb tense","src":"Set 1 · Q23","id":"s1-23"},{"number":24,"skill":"Simple present for general fact","passage":"Unlike most desert mammals, the kangaroo rat (Dipodomys) can go its entire life without drinking, so during the hottest and driest months of the year, it _______ on the small amount of water its body produces when metabolizing the dry seeds it eats.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"had relied","B":"would rely","C":"relied","D":"relies"},"answer":"D","explanation":"The sentence states a general fact about the species in the present tense (“can go,” “produces,” “eats”), so the simple present “relies” is correct.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Verb tense","src":"Set 1 · Q24","id":"s1-24"},{"number":25,"skill":"Simple past (completed past event)","passage":"The Year Without a Summer followed the eruption of Mount Tambora in Indonesia in April 1815. During 1816, volcanic ash and gases in the atmosphere _______ temperatures across much of the Northern Hemisphere. Snow even fell in New England in June.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will have lowered","B":"will lower","C":"are lowering","D":"lowered"},"answer":"D","explanation":"The event took place in 1816 and the neighboring verbs (“followed,” “fell”) are in the simple past, so “lowered” is correct.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Verb tense","src":"Set 1 · Q25","id":"s1-25"},{"number":26,"skill":"Simple past (specific past date)","passage":"The Tacoma Narrows Bridge in Washington State was celebrated at its opening as the third-longest suspension bridge in the world. On November 7, 1940, the bridge’s deck _______ violently in a steady wind and then tore apart. No one died, but after only four months in service the original bridge was gone.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"twisted","B":"has twisted","C":"will twist","D":"twists"},"answer":"A","explanation":"A specific past date (“On November 7, 1940”) and the parallel verb “tore” require the simple past “twisted.” The present perfect cannot be used with a finished, dated time.","cat":"1. Verb Forms & Tense","catzh":"動詞形式與時態","sub":"Verb tense","src":"Set 1 · Q26","id":"s1-26"},{"number":27,"skill":"Subject–verb agreement (gerund subject)","passage":"The ancient Chinese game of Go is played on a grid of nineteen horizontal and nineteen vertical lines. Players take turns placing black or white stones on the grid’s intersections; surrounding a group of the opponent’s stones _______ a player to remove them from the board and claim the territory they occupied.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have permitted","B":"permits","C":"are permitting","D":"permit"},"answer":"B","explanation":"The subject is the gerund phrase “surrounding a group of the opponent’s stones,” which is singular (the nearby plural “stones” is not the subject). Only “permits” is singular.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q27","id":"s1-27"},{"number":28,"skill":"Subject–verb agreement + present perfect","passage":"Colson Whitehead’s The Underground Railroad (2016), which imagines the historical network of safe houses as a literal subterranean train line, won both the National Book Award and the Pulitzer Prize for Fiction. The awards brought Whitehead a far wider readership, but his fiction _______ praised before. His 2001 novel John Henry Days, for instance, was a finalist for the Pulitzer.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"has been","B":"were","C":"have been","D":"are"},"answer":"A","explanation":"The subject “his fiction” is singular, and “before” signals experience up to now, so the singular present perfect “has been” is correct. The other choices are plural.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q28","id":"s1-28"},{"number":29,"skill":"Subject–verb agreement (singular title; ignore interrupter)","passage":"Zora Neale Hurston’s Mules and Men (1935), a collection of African American folktales and songs that the author gathered in Florida and Louisiana, _______ folklorists’ understanding of the oral traditions that flourished in Black communities of the rural South.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"deepen","B":"has deepened","C":"have deepened","D":"are deepening"},"answer":"B","explanation":"The subject is the title Mules and Men, a single book, so the verb must be singular even though the title contains plural nouns. Ignore the appositive between the commas (“a collection of... folktales and songs”).","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q29","id":"s1-29"},{"number":30,"skill":"Subject–verb agreement in relative clause","passage":"Chemists Dmitri Mendeleev and Lothar Meyer independently developed early versions of the periodic table, a chart that _______ the chemical elements according to recurring patterns in their properties.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have arranged","B":"arrange","C":"arranges","D":"were arranging"},"answer":"C","explanation":"In the relative clause, “that” refers to the singular noun “a chart,” so the verb must be singular: “arranges.” The plural “Mendeleev and Meyer” and “versions” are not the subject of this clause.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q30","id":"s1-30"},{"number":31,"skill":"Subject–verb agreement in inverted sentence","passage":"The Harlem Renaissance of the 1920s saw the emergence of numerous literary magazines, publications that gave young Black writers a national audience. Among the magazines’ most influential editors _______ Jessie Redmon Fauset, literary editor of The Crisis.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"was","B":"are","C":"were","D":"have been"},"answer":"A","explanation":"The sentence is inverted: the subject follows the verb. The subject is “Jessie Redmon Fauset,” one person, so the singular “was” is correct. “Editors” is the object of the preposition “among.”","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q31","id":"s1-31"},{"number":32,"skill":"Subject–verb agreement (singular subject + modifier)","passage":"In many of his woodblock prints from the 1830s, Japanese artist Katsushika Hokusai sought to convey the presence of Mount Fuji from dozens of vantage points, filling the foreground with fishermen, travelers, and laborers. Notably, the mountain framed by these busy human scenes _______ often among the smallest elements in the composition.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"were","B":"have been","C":"is","D":"are"},"answer":"C","explanation":"The subject is the singular “the mountain”; “framed by these busy human scenes” is a modifier whose plural noun “scenes” does not affect the verb. Only “is” is singular.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q32","id":"s1-32"},{"number":33,"skill":"Subject–verb agreement (gerund subject)","passage":"A researcher who publishes findings without sharing the underlying data makes it difficult for others to verify the results. For this reason, many journals now encourage authors to deposit their data in public repositories. Making these data sets freely available _______ that other scientists can attempt to reproduce an experiment’s conclusions.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are meaning","B":"means","C":"have meant","D":"mean"},"answer":"B","explanation":"The subject is the gerund phrase “Making these data sets freely available,” which is singular. The plural “data sets” is the object of “making,” not the subject.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q33","id":"s1-33"},{"number":34,"skill":"Subject–verb agreement (plural subject + interrupter)","passage":"In her 1974–79 installation The Dinner Party, artist Judy Chicago set a triangular table with thirty-nine elaborate place settings. These place settings, each crafted in a style evoking the era of the woman it honors and arranged along a table nearly fifteen meters long on each side, _______ figures ranging from the ancient poet Sappho to the painter Georgia O’Keeffe.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"commemorate","B":"has commemorated","C":"commemorates","D":"was commemorating"},"answer":"A","explanation":"Cross out the long interrupter between the commas. The subject is the plural “These place settings,” so the plural “commemorate” is required; the singular nouns inside the interrupter (“woman,” “table,” “side”) are traps.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q34","id":"s1-34"},{"number":35,"skill":"Subject–verb agreement (plural subject + interrupter)","passage":"In his 1983 book Imagined Communities, political scientist Benedict Anderson first developed at length his account of nationalism—the idea that the shared texts a population reads in a common language (newspapers, novels, official documents, etc.) _______ a sense of belonging among millions of people who will never meet one another.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"fosters","B":"is fostering","C":"foster","D":"has been fostering"},"answer":"C","explanation":"The subject of the clause is the plural “the shared texts.” “A population reads in a common language” is a relative clause modifying “texts,” and the parenthesis is an interrupter. The verb must be plural: “foster.”","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q35","id":"s1-35"},{"number":36,"skill":"Subject–verb agreement in relative clause","passage":"“I came, I saw, I conquered.” This famous line is attributed to the Roman general Julius Caesar. It’s an example of asyndeton, a rhetorical device that _______ speed and force by omitting the conjunctions that would normally join a series of clauses.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have conveyed","B":"convey","C":"are conveying","D":"conveys"},"answer":"D","explanation":"“That” refers to the singular “a rhetorical device,” so the verb in the relative clause must be singular: “conveys.”","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q36","id":"s1-36"},{"number":37,"skill":"Subject–verb agreement (plural subject + interrupter)","passage":"In her photograph Migrant Mother, taken in California in 1936, Dorothea Lange shows a weary woman flanked by two of her children. Such stark images, made by Lange, a photographer employed by the federal Resettlement Administration, _______ the hardships endured by farmworkers during the Great Depression.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"documents","B":"has documented","C":"was documenting","D":"document"},"answer":"D","explanation":"The subject is the plural “Such stark images.” Everything between the commas—including the singular nouns “Lange,” “photographer,” and “Administration”—is an interrupter. The plural “document” is correct.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q37","id":"s1-37"},{"number":38,"skill":"Subject–verb agreement (plural subject + interrupter)","passage":"Milkweed plants produce bitter compounds called cardenolides to discourage animals from eating their leaves. However, in some cases, the compounds the plant makes to defend itself against herbivores actually _______ its appeal to certain insects. The monarch caterpillar, for example, not only tolerates cardenolides but stores them in its own tissues, becoming poisonous to birds.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"has enhanced","B":"enhances","C":"is enhancing","D":"enhance"},"answer":"D","explanation":"The subject is the plural “the compounds”; “the plant makes to defend itself against herbivores” is a relative clause describing them. The verb must be plural: “enhance.”","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q38","id":"s1-38"},{"number":39,"skill":"Subject–verb agreement + parallel verbs","passage":"One of the oldest surviving star charts is a Chinese manuscript discovered in a cave near Dunhuang and thought to date from about 700 CE. The chart _______ more than 1,300 stars, groups them into constellations, and includes captions naming each one.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"depict","B":"depicts","C":"are depicting","D":"have depicted"},"answer":"B","explanation":"The subject “The chart” is singular, and the verb must be parallel to “groups” and “includes” (singular simple present): “depicts.”","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q39","id":"s1-39"},{"number":40,"skill":"Subject–verb agreement (plural subject + interrupter)","passage":"Laboratory methods for editing genes are transforming agricultural research, according to many plant biologists. The recent achievements of researchers at the International Rice Research Institute, the organization whose high-yield variety IR8 helped avert famine in Asia in the 1960s, _______ to the continuing importance of publicly funded crop science in feeding a growing population.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"testifies","B":"is testifying","C":"testify","D":"has testified"},"answer":"C","explanation":"The subject is the plural “achievements,” not “Institute,” “organization,” or “variety.” Cross out the prepositional phrases and the appositive between the commas, and the verb must be plural: “testify.”","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q40","id":"s1-40"},{"number":41,"skill":"Subject–verb agreement (singular subject + interrupter)","passage":"Biologists studying humpback whales, the baleen whales known for their long migrations and complex songs, have long relied on the fact that the pattern of markings on the underside of each whale’s tail flukes, like the pattern of ridges on a person’s fingertips, _______ distinctive enough to identify an individual.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"is","B":"have been","C":"are","D":"were"},"answer":"A","explanation":"The subject is the singular “the pattern.” “Of markings on the underside of each whale’s tail flukes” is a chain of prepositional phrases, and “like the pattern of ridges...” is an interrupter. The singular present “is” is correct.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q41","id":"s1-41"},{"number":42,"skill":"Subject–verb agreement (plural subject + interrupter)","passage":"Interest in bioluminescence, the process by which living organisms produce light through chemical reactions, is growing because of fieldwork by marine biologists—many of whom, like deep-sea researcher Edith Widder, _______ the phenomenon to learn how animals communicate in the darkness of the open ocean.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"investigate","B":"investigates","C":"has investigated","D":"is investigating"},"answer":"A","explanation":"The subject of the clause is “many (of whom),” which is plural. “Like deep-sea researcher Edith Widder” is an interrupter and does not make the subject singular. The plural “investigate” is correct.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q42","id":"s1-42"},{"number":43,"skill":"Subject–verb agreement (each one = singular)","passage":"The sonnet sequence, a form popularized in sixteenth-century England, balances unity and independence. Literary scholars note that each one of the 154 poems in Shakespeare’s sequence, while sharing the meter, rhyme scheme, and recurring concerns of the poems around it, _______ capable of being read as a complete work in its own right.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have been","B":"were","C":"are","D":"is"},"answer":"D","explanation":"“Each one” is always singular, no matter what plural noun follows “of.” The singular “is” is correct.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q43","id":"s1-43"},{"number":44,"skill":"Subject–verb agreement (\"in conjunction with\" doesn't pluralize)","passage":"Physicist Lise Meitner, together with her nephew Otto Frisch and the chemists Otto Hahn and Fritz Strassmann, _______ credited with the discovery of nuclear fission. Although Hahn alone received the 1944 Nobel Prize in Chemistry for the work, it was Meitner and Frisch who first explained the physics behind his puzzling experimental results.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are being","B":"is","C":"have been","D":"are"},"answer":"B","explanation":"The subject is the singular “Physicist Lise Meitner.” A phrase beginning with “together with” (like “along with” or “in conjunction with”) does not make the subject plural. The singular “is” is correct.","cat":"2. Agreement","catzh":"一致性","sub":"Subject–verb agreement","src":"Set 1 · Q44","id":"s1-44"},{"number":45,"skill":"Pronoun–antecedent agreement (plural)","passage":"Programs designed to encourage retirement saving can be remarkably effective, behavioral economists have found, when the programs change the default option: for example, one large company saw participation rise sharply after new employees were enrolled automatically and then asked whether _______ wished to opt out.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"one","B":"you","C":"it","D":"they"},"answer":"D","explanation":"The pronoun refers to the plural noun “new employees,” so “they” is required. “It” is singular; “one” and “you” shift the person.","cat":"2. Agreement","catzh":"一致性","sub":"Pronoun & determiner agreement","src":"Set 1 · Q45","id":"s1-45"},{"number":46,"skill":"Possessive pronoun (their vs. they’re/its)","passage":"American astronomers Arno Penzias and Robert Wilson shared the 1978 Nobel Prize in Physics for detecting the cosmic microwave background, the faint radiation left over from the early universe, but it would be misleading to say that the two men set out to find it. _______ discovery began as an effort to eliminate a persistent hiss from a radio antenna in New Jersey.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Their","B":"They’re","C":"It’s","D":"Its"},"answer":"A","explanation":"A plural possessive is needed to show that the discovery belongs to Penzias and Wilson: “Their.” “They’re” and “It’s” are contractions (they are / it is); “Its” is singular.","cat":"2. Agreement","catzh":"一致性","sub":"Pronoun & determiner agreement","src":"Set 1 · Q46","id":"s1-46"},{"number":47,"skill":"Reflexive pronoun agreement (plural)","passage":"Researchers report that, unlike most other fish, cleaner wrasses (Labroides dimidiatus) seem able to recognize _______ in a mirror, a capacity previously documented in only a handful of mammals and birds.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"them","B":"themselves","C":"itself","D":"it"},"answer":"B","explanation":"The wrasses are both the ones recognizing and the ones recognized, so a reflexive pronoun is needed, and it must be plural to match “wrasses”: “themselves.” “Them” would refer to some other group; “it/itself” are singular.","cat":"2. Agreement","catzh":"一致性","sub":"Pronoun & determiner agreement","src":"Set 1 · Q47","id":"s1-47"},{"number":48,"skill":"Pronoun–antecedent agreement (singular)","passage":"Kenyan environmentalist Wangari Maathai, founder of the tree-planting Green Belt Movement, was awarded the Nobel Peace Prize in October 2004, making _______ the first time the committee had honored an African woman.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"this","B":"some","C":"those","D":"these"},"answer":"A","explanation":"The pronoun refers to a single event (Maathai’s receiving the prize) and is renamed by the singular “the first time,” so the singular “this” is correct.","cat":"2. Agreement","catzh":"一致性","sub":"Pronoun & determiner agreement","src":"Set 1 · Q48","id":"s1-48"},{"number":49,"skill":"Pronoun–antecedent agreement (plural)","passage":"When they were first carried on the streets of London in the mid-eighteenth century, umbrellas were met with open hostility. The city’s hackney coachmen, who earned much of their income on rainy days, denounced the devices because the drivers considered _______ unwelcome rivals to their covered carriages.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"it","B":"that","C":"them","D":"this"},"answer":"C","explanation":"The pronoun refers to the plural “umbrellas” / “the devices” (and is renamed by the plural “rivals”), so the plural object pronoun “them” is required.","cat":"2. Agreement","catzh":"一致性","sub":"Pronoun & determiner agreement","src":"Set 1 · Q49","id":"s1-49"},{"number":50,"skill":"Determiner/pronoun–noun number agreement","passage":"Thousands of glass-plate photographs examined by astronomer Williamina Fleming and her colleagues at the Harvard College Observatory have recently been digitized. _______ photographs record the spectra of stars that Fleming used to develop an early system of stellar classification.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"These","B":"This","C":"One","D":"That"},"answer":"A","explanation":"The determiner must agree with the plural noun “photographs” that follows it: “These photographs.”","cat":"2. Agreement","catzh":"一致性","sub":"Pronoun & determiner agreement","src":"Set 1 · Q50","id":"s1-50"},{"number":51,"skill":"Pronoun–antecedent agreement (singular)","passage":"When a given ecosystem—coral reefs and kelp forests are two familiar examples—depends on a single species to keep the populations of other organisms in check, _______ dramatic changes if that species disappears. Such organisms are known as keystone species.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"this often undergoes","B":"these often undergo","C":"it often undergoes","D":"they often undergo"},"answer":"C","explanation":"The antecedent is the singular “a given ecosystem” (the plural examples between the dashes are an interrupter), so the singular personal pronoun and verb are needed: “it often undergoes.” “This” is not used alone to refer back to a specific noun in this way.","cat":"2. Agreement","catzh":"一致性","sub":"Pronoun & determiner agreement","src":"Set 1 · Q51","id":"s1-51"},{"number":52,"skill":"Pronoun–antecedent agreement (plural)","passage":"In 1960, British primatologist Jane Goodall recorded two chimpanzee behaviors that overturned long-standing assumptions about the species: toolmaking and meat eating. Within a few years, _______ accepted by most scientists as evidence that the boundary between humans and other animals was less sharp than previously believed.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"some were","B":"they were","C":"this was","D":"it was"},"answer":"B","explanation":"The pronoun refers to the two behaviors (toolmaking and meat eating), so the plural “they were” is correct. “Some were” would illogically mean only part of the two.","cat":"2. Agreement","catzh":"一致性","sub":"Pronoun & determiner agreement","src":"Set 1 · Q52","id":"s1-52"},{"number":53,"skill":"Possessive pronoun (their vs. its/it’s/they’re)","passage":"In architect Lina Bo Bardi’s 1968 design for the São Paulo Museum of Art, absent are the interior walls that typically divide a museum into separate rooms. In _______ place stand rows of glass easels, each holding a single painting that appears to float in the open hall.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"its","B":"it’s","C":"they’re","D":"their"},"answer":"D","explanation":"The pronoun refers to the plural “the interior walls,” so the plural possessive “their” is needed. “They’re” and “it’s” are contractions; “its” is singular.","cat":"2. Agreement","catzh":"一致性","sub":"Pronoun & determiner agreement","src":"Set 1 · Q53","id":"s1-53"},{"number":54,"skill":"Dangling modifier (subject after introductory phrase)","passage":"In 1911, Polish-born physicist Marie Curie received the Nobel Prize in Chemistry for isolating radium, eight years after sharing the prize in physics. When war broke out in 1914, she set her research aside. After equipping a fleet of vehicles with portable X-ray machines, _______ training some 150 women to operate the equipment and helping surgeons locate shrapnel in wounded soldiers.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Curie drove to the front lines herself,","B":"the front lines were where Curie herself drove,","C":"Curie’s drive to the front lines began,","D":"it was Curie who drove to the front lines herself,"},"answer":"A","explanation":"“After equipping a fleet of vehicles...” describes the person who did the equipping—Curie—so “Curie” must be the subject immediately after the comma. “The front lines,” “Curie’s drive,” and “it” did not equip anything (dangling modifier).","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q54","id":"s1-54"},{"number":55,"skill":"Dangling modifier (subject after introductory phrase)","passage":"Although prized for being lightweight, rechargeable, and capable of storing large amounts of energy, _______ they rely on cobalt and other metals that are costly to mine, and they can overheat dangerously if damaged.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"two notable drawbacks are associated with lithium-ion batteries:","B":"there are two notable drawbacks to lithium-ion batteries:","C":"lithium-ion batteries have two notable drawbacks:","D":"lithium-ion batteries’ two notable drawbacks are that"},"answer":"C","explanation":"The opening phrase describes the things that are prized for being lightweight and rechargeable—the batteries—so “lithium-ion batteries” must be the subject right after the comma. In the other choices the subject is “there” or “drawbacks,” so the modifier dangles.","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q55","id":"s1-55"},{"number":56,"skill":"Dangling modifier (subject after introductory phrase)","passage":"In evaluating the career of Mexican painter Frida Kahlo, _______ have overlooked her equally sustained interest in the conventions of Mexican folk art, such as the small devotional paintings known as retablos.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Kahlo’s turbulent personal life has been the emphasis of many biographers, who","B":"many biographers have emphasized Kahlo’s turbulent personal life but","C":"there are many biographers who have emphasized Kahlo’s turbulent personal life, but they","D":"the emphasis of many biographers has been on Kahlo’s turbulent personal life; they"},"answer":"B","explanation":"The people “evaluating the career” are the biographers, so “many biographers” must directly follow the introductory phrase. The other choices begin with “Kahlo’s... life,” “there,” or “the emphasis,” none of which can evaluate.","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q56","id":"s1-56"},{"number":57,"skill":"Dangling modifier (subject after introductory phrase)","passage":"Scholars once believed that people first fermented beverages in the Middle East roughly 5,000 years ago. However, since analyzing residues on 9,000-year-old pottery fragments from the village of Jiahu in northern China, _______ arose much earlier and in more than one region.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"archaeochemist Patrick McGovern’s argument is that the practice","B":"the argument archaeochemist Patrick McGovern has made is that the practice","C":"archaeochemist Patrick McGovern has argued that the practice","D":"the practice, archaeochemist Patrick McGovern has argued,"},"answer":"C","explanation":"The one who analyzed the residues is McGovern, so “archaeochemist Patrick McGovern” must be the subject after the comma. In the other choices the subject is “argument” or “the practice”—neither analyzed anything.","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q57","id":"s1-57"},{"number":58,"skill":"Dangling modifier (subject after introductory phrase)","passage":"Chinese pharmacologist Tu Youyou was a researcher whose work has saved millions of lives. Recognized with a Nobel Prize in 2015 as one of the most significant medical advances of the twentieth century, _______ gave doctors a powerful new treatment for malaria.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"in 1972 Tu extracted the compound artemisinin, which","B":"the compound artemisinin was extracted by Tu in 1972 and","C":"Tu extracted the compound artemisinin in 1972; it","D":"Tu’s 1972 extraction of the compound artemisinin"},"answer":"D","explanation":"What was recognized as “one of the most significant medical advances” is the extraction (an achievement), not Tu herself, so “Tu’s 1972 extraction” must follow the comma. Beginning with “Tu” or “in 1972 Tu” wrongly makes the person the “advance.”","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q58","id":"s1-58"},{"number":59,"skill":"Dangling modifier (subject after introductory phrase)","passage":"In 2003, the city of Seoul began dismantling an elevated highway in order to uncover the Cheonggyecheon, a stream that had been paved over decades earlier, and to line its banks with vegetation. By drawing cooler air through the dense city center, _______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"the restored stream has lowered summer temperatures in the surrounding neighborhoods by several degrees.","B":"the restored stream’s lowering of summer temperatures in the surrounding neighborhoods by several degrees has been achieved.","C":"summer temperatures in the surrounding neighborhoods have been lowered by several degrees by the restored stream.","D":"the lowering of summer temperatures in the surrounding neighborhoods by several degrees has been achieved by the restored stream."},"answer":"A","explanation":"What draws cooler air through the city? The restored stream. It must therefore be the subject right after the modifier. The other choices begin with “the lowering,” “the restored stream’s lowering,” or “summer temperatures,” none of which draws air.","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q59","id":"s1-59"},{"number":60,"skill":"Dangling modifier (subject after introductory phrase)","passage":"The first woman to earn a degree from the Massachusetts Institute of Technology, _______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"the 1880s were the years in which Ellen Swallow Richards conducted pioneering surveys of water quality across Massachusetts.","B":"Massachusetts was where Ellen Swallow Richards conducted pioneering surveys of water quality in the 1880s.","C":"pioneering surveys of water quality across Massachusetts were conducted by Ellen Swallow Richards in the 1880s.","D":"Ellen Swallow Richards conducted pioneering surveys of water quality across Massachusetts in the 1880s."},"answer":"D","explanation":"The opening phrase describes a person (“The first woman to earn a degree...”), so the person’s name must come right after the comma. “The 1880s,” “Massachusetts,” and “surveys” are not the first woman.","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q60","id":"s1-60"},{"number":61,"skill":"Dangling modifier (subject after introductory phrase)","passage":"Assembled from thousands of flattened liquor-bottle caps and stitched together with copper wire by teams of assistants in the artist’s Nigerian studio, _______ so supple and shimmering that viewers often mistake them for woven cloth.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"when he creates his wall hangings, Ghanaian sculptor El Anatsui makes them","B":"the wall hangings of Ghanaian sculptor El Anatsui are","C":"the Ghanaian sculptor El Anatsui creates wall hangings that are","D":"El Anatsui is a Ghanaian sculptor whose wall hangings are"},"answer":"B","explanation":"What is “assembled from... bottle caps and stitched together”? The wall hangings, not the artist. “The wall hangings” must be the subject after the comma.","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q61","id":"s1-61"},{"number":62,"skill":"Dangling modifier (subject after introductory phrase)","passage":"Hoping to solve the problem of determining a ship’s longitude at sea, _______ up with a practical method. Clockmaker John Harrison eventually claimed most of the reward for his marine chronometer.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"up to £20,000 would be paid to anyone by the British Parliament under a prize established in 1714 for coming","B":"the British Parliament established a prize in 1714 that would pay up to £20,000 to anyone who came","C":"a payment of up to £20,000 would go to anyone under a prize established by the British Parliament in 1714 for coming","D":"a prize established by the British Parliament in 1714 would pay up to £20,000 to anyone who came"},"answer":"B","explanation":"Who was “hoping to solve the problem”? The British Parliament. It must be the subject after the comma. A prize, a payment, and a sum of money cannot hope.","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q62","id":"s1-62"},{"number":63,"skill":"Logical comparison / modifier placement","passage":"Compared to that of a typical bony fish, _______ the animal’s tissues retain high levels of urea, keeping its internal fluids nearly as salty as seawater.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"a shark’s blood chemistry is far more concentrated, giving the shark a significant advantage in the ocean:","B":"a shark has a significant advantage in the ocean due to its far more concentrated blood chemistry:","C":"a significant advantage of a shark in the ocean is that its blood chemistry is far more concentrated:","D":"a shark has far more concentrated blood chemistry, resulting in a significant advantage in the ocean:"},"answer":"A","explanation":"“That of a typical bony fish” means “the blood chemistry of a bony fish,” so it must be compared with “a shark’s blood chemistry,” not with “a shark” or “a significant advantage.” Compare like with like.","cat":"3. Modifiers & Comparisons","catzh":"修飾語與比較","sub":"Dangling modifiers & logical comparisons","src":"Set 1 · Q63","id":"s1-63"},{"number":64,"skill":"Semicolon between independent clauses ｜ 分號連接兩獨立子句","passage":"Coral reefs cover less than one percent of the ocean floor. They support roughly a quarter of all known marine ______ many of these species are found nowhere else. Reefs also protect coastlines and support fishing and tourism industries. Rising ocean temperatures, however, threaten their survival. When water becomes too warm, corals expel the algae that live in their tissues and turn white.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"species which","B":"species","C":"species;","D":"species,"},"answer":"C","explanation":"Two independent clauses with no conjunction need a semicolon (or period). A comma = comma splice; nothing = run-on; \"which\" makes the sentence ungrammatical.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Semicolons & periods (run-ons, comma splices)","src":"Set 2 · Q21","id":"s2-21"},{"number":65,"skill":"Semicolon between independent clauses ｜ 分號連接兩獨立子句","passage":"Rubber trees are native to the Amazon rainforest. In the nineteenth century, demand for rubber soared as factories began producing tires, hoses, and waterproof clothing. In 1876, the British explorer Henry Wickham shipped about 70,000 rubber tree seeds from Brazil to ______ seedlings grown from them were later sent to British colonies in Asia. Within a few decades, plantations in Southeast Asia dominated the world's rubber supply. Brazil's rubber boom, meanwhile, collapsed.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"London, which","B":"London","C":"London,","D":"London;"},"answer":"D","explanation":"Two independent clauses with no conjunction need a semicolon. Comma = comma splice; nothing = run-on.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Semicolons & periods (run-ons, comma splices)","src":"Set 2 · Q36","id":"s2-36"},{"number":66,"skill":"Semicolon between independent clauses ｜ 分號連接兩獨立子句","passage":"The violin family includes four main instruments: the violin, the viola, the cello, and the double bass. The cello is played sitting down, with the instrument resting between the player's knees. The double bass is even ______ is often taller than the musician playing it. Its deep notes provide the foundation of an orchestra's sound. Jazz musicians frequently pluck the bass instead of using a bow.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"larger, it","B":"larger, and, it","C":"larger; it","D":"larger it"},"answer":"C","explanation":"Two independent clauses, no conjunction → semicolon. Comma = comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Semicolons & periods (run-ons, comma splices)","src":"Set 2 · Q87","id":"s2-87"},{"number":67,"skill":"Semicolon between independent clauses ｜ 分號連接兩獨立子句","passage":"The Titanic was the largest ship afloat when it set out on its first voyage in April 1912. Four days into the trip, it struck an iceberg in the North Atlantic. The ship carried lifeboats for only about half of the people on ______ more than 1,500 people died when it sank. The disaster led to new international rules requiring enough lifeboat space for everyone on board. It also led to the creation of an ice patrol to track icebergs in shipping lanes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"board,","B":"board","C":"board;","D":"board, and,"},"answer":"C","explanation":"Two independent clauses, no conjunction → semicolon.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Semicolons & periods (run-ons, comma splices)","src":"Set 2 · Q115","id":"s2-115"},{"number":68,"skill":"Semicolon between independent clauses ｜ 分號連接兩獨立子句","passage":"The first vaccine was developed by Edward Jenner in 1796. Jenner noticed that milkmaids who had caught cowpox seemed protected from ______ this observation led him to test the idea on a young boy. He infected the boy with cowpox and later exposed him to smallpox, and the boy did not become ill. The word vaccine comes from vacca, the Latin word for cow. Smallpox was declared eradicated worldwide in 1980.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"smallpox, which","B":"smallpox","C":"smallpox;","D":"smallpox,"},"answer":"C","explanation":"Two independent clauses, no conjunction → semicolon.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Semicolons & periods (run-ons, comma splices)","src":"Set 2 · Q136","id":"s2-136"},{"number":69,"skill":"Sentence boundary: period / run-on / comma splice ｜ 句子界線","passage":"Sourdough bread is made with a starter, a mixture of flour and water that contains wild yeast and bacteria. Bakers keep their starters alive by feeding them fresh flour regularly. Some bakeries claim that their starters are more than a century ______ microbes in a starter produce gases that make dough rise and acids that give the bread its tangy flavor. Scientists studying starters from around the world have found surprising diversity in the microbes they contain.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"old the","B":"old. The","C":"old, the","D":"old. Which"},"answer":"B","explanation":"Two complete sentences must be separated by a period (or semicolon). Comma = comma splice; nothing = run-on; \"Which\" starts a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Semicolons & periods (run-ons, comma splices)","src":"Set 2 · Q144","id":"s2-144"},{"number":70,"skill":"Semicolon between independent clauses ｜ 分號連接兩獨立子句","passage":"Venus is unusual in several ways. It rotates very slowly, taking about 243 Earth days to spin once on its axis. It also spins in the opposite direction from most ______ on Venus, the sun rises in the west and sets in the east. A day on Venus is therefore longer than its year, which lasts about 225 Earth days. Scientists are not sure why Venus spins backward.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"planets, so,","B":"planets;","C":"planets,","D":"planets"},"answer":"B","explanation":"Two independent clauses, no conjunction → semicolon.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Semicolons & periods (run-ons, comma splices)","src":"Set 2 · Q160","id":"s2-160"},{"number":71,"skill":"Semicolon between independent clauses ｜ 分號連接兩獨立子句","passage":"The Venus flytrap is one of the few plants that can move quickly. It grows naturally in only one small region of the ______ is found in wetlands within about 100 kilometers of Wilmington, North Carolina. Its leaves snap shut when an insect touches tiny trigger hairs inside them twice within about 20 seconds. This double-touch system prevents the plant from wasting energy on raindrops or falling debris. Once the trap closes, the plant releases digestive juices that dissolve the insect over several days.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"world, it","B":"world it","C":"world; it","D":"world, and, it"},"answer":"C","explanation":"Two independent clauses, no conjunction → semicolon.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Semicolons & periods (run-ons, comma splices)","src":"Set 2 · Q191","id":"s2-191"},{"number":72,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Bees are often credited with pollinating most of the world's crops. Flies, beetles, and moths also play important ______ some plants depend on them almost entirely. The cacao tree, the source of chocolate, is pollinated mainly by tiny midges. Without these insects, cacao farms would produce very little fruit. Protecting the damp, shady habitats that midges need is therefore a priority for many growers.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"roles,","B":"roles, and","C":"roles and","D":"roles and,"},"answer":"B","explanation":"Two independent clauses joined by a FANBOYS conjunction need a comma BEFORE the conjunction. A comma alone = comma splice; no comma = run-on.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q6","id":"s2-6"},{"number":73,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Venus is nearly the same size as Earth and is sometimes called Earth's twin. The two planets share a similar size and rocky ______ conditions on their surfaces could hardly be more different. Venus's thick carbon dioxide atmosphere traps so much heat that surface temperatures reach about 465°C. Its air pressure is roughly 90 times that of Earth at sea level. Soviet landers that reached the surface in the 1970s and 1980s survived for about two hours at most.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"composition,","B":"composition, however,","C":"composition, but","D":"composition but,"},"answer":"C","explanation":"\", but\" correctly joins two independent clauses. \", however,\" between two clauses is a comma splice—\"however\" is an adverb, not a conjunction.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q16","id":"s2-16"},{"number":74,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Lightning heats the air around it to about 30,000°C in a fraction of a second. That is roughly five times hotter than the surface of the sun. The heated air expands ______ it produces a powerful shock wave that we hear as thunder. Because light travels much faster than sound, we see a flash before we hear the thunder. Counting the seconds between the two can help estimate how far away a storm is.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"explosively so,","B":"explosively, so","C":"explosively,","D":"explosively; so,"},"answer":"B","explanation":"\", so\" correctly joins two independent clauses. A comma alone = comma splice; never put a comma after \"so\" here.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q30","id":"s2-30"},{"number":75,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Hummingbirds have the highest metabolism of any warm-blooded animal. Their hearts can beat more than 1,200 times per minute during flight. Ruby-throated hummingbirds weigh only about three ______ many of them fly nonstop across the Gulf of Mexico, a journey of about 800 kilometers. To prepare, the birds nearly double their body weight by storing fat. Researchers are still studying how such tiny animals navigate so accurately.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"grams, yet","B":"grams, yet,","C":"grams; yet,","D":"grams yet,"},"answer":"A","explanation":"\", yet\" (FANBOYS) joins two independent clauses with contrast. No comma after \"yet.\"","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q45","id":"s2-45"},{"number":76,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Paper money first appeared in China during the Tang dynasty and became widespread under the Song dynasty. Merchants found heavy strings of copper coins inconvenient for large ______ they began depositing coins with trusted shops in exchange for paper receipts. Over time, the government took control of issuing these notes. When Marco Polo visited China in the late 1200s, he was amazed that paper could be used as money. Europe would not widely adopt paper currency for several more centuries.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"transactions, so","B":"transactions,","C":"transactions so,","D":"transactions; so,"},"answer":"A","explanation":"\", so\" joins two independent clauses. A comma alone = comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q49","id":"s2-49"},{"number":77,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"The ancient Olympic Games were held in Olympia, Greece, for more than a thousand years. In the 1890s, the French educator Pierre de Coubertin proposed reviving the tradition. The first modern Games took place in Athens in 1896. About 240 athletes from 14 nations ______ none of them were women. Women first competed four years later, at the 1900 Games in Paris.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"competed; but,","B":"competed, but","C":"competed, however","D":"competed but,"},"answer":"B","explanation":"\", but\" joins two independent clauses. \", however\" between clauses is a comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q54","id":"s2-54"},{"number":78,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Visitors to Iceland can explore glaciers, volcanoes, and black-sand beaches. Many travelers come in winter hoping to see the northern ______ they visit in summer to experience the midnight sun. In June, the sun barely sets in the northern part of the country. In December, by contrast, daylight in Reykjavík lasts only about four hours. Each season offers a very different experience of the island.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"lights or,","B":"lights, or,","C":"lights, or","D":"lights; or"},"answer":"C","explanation":"\", or\" joins two independent clauses. No comma after the conjunction; a semicolon before \"or\" is not standard.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q62","id":"s2-62"},{"number":79,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"The ostrich is the largest living bird, standing up to 2.7 meters tall. Its wings are far too small to lift its heavy body off the ground. The bird has long, powerful ______ it can outrun most of its predators, reaching speeds of about 70 kilometers per hour. Each foot has only two toes, an adaptation that helps with speed. When cornered, an ostrich can deliver a kick strong enough to injure a lion.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"legs, therefore","B":"legs, so","C":"legs so,","D":"legs; so,"},"answer":"B","explanation":"\", so\" joins two clauses. \"Therefore\" is an adverb, so \", therefore\" between clauses is a comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q72","id":"s2-72"},{"number":80,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Pompeii was a busy Roman city near the Bay of Naples. In 79 CE, nearby Mount Vesuvius ______ ash and pumice buried the city within hours. The ash preserved buildings, paintings, and even loaves of bread. Archaeologists later poured plaster into hollow spaces left by victims' bodies, creating detailed casts. Today, Pompeii is one of the most visited archaeological sites in the world.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"erupted,","B":"erupted; and,","C":"erupted and,","D":"erupted, and"},"answer":"D","explanation":"\", and\" joins two independent clauses. A comma alone = comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q81","id":"s2-81"},{"number":81,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Hardness measures how well a material resists scratching. On the Mohs scale, diamonds rank 10, the highest possible score. Diamonds are the hardest natural ______ they can shatter if struck sharply at the right angle. This is because hardness and toughness are different properties. Jade, for example, is much softer than diamond but far more resistant to breaking.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"material, yet","B":"material; yet,","C":"material, though,","D":"material yet,"},"answer":"A","explanation":"\", yet\" joins two independent clauses. \", though,\" (adverb) between two clauses is a comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q94","id":"s2-94"},{"number":82,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"The Netherlands is one of the flattest countries in the world. About a quarter of its land lies below sea ______ the Dutch have built an extensive system of dikes, dams, and storm barriers to keep the water out. Windmills were once used to pump water from low-lying fields. Today, electric pumps do most of this work. The country's expertise in water management is now sought by cities around the world.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"level, so","B":"level, thus","C":"level; so,","D":"level so,"},"answer":"A","explanation":"\", so\" joins two clauses. \"Thus\" is an adverb, so \", thus\" between clauses is a comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q103","id":"s2-103"},{"number":83,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"For astronomers, Earth's atmosphere is a nuisance because it blurs and distorts starlight. Placing a telescope in orbit avoids this problem. The Hubble Space Telescope was launched in ______ its first images were disappointingly blurry because its main mirror had been ground to the wrong shape. In 1993, astronauts installed corrective optics during a spacewalk mission. Since then, Hubble has produced some of the most famous images in the history of astronomy.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"1990; but,","B":"1990 but,","C":"1990, however","D":"1990, but"},"answer":"D","explanation":"\", but\" joins two clauses. \", however\" between clauses is a comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q110","id":"s2-110"},{"number":84,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Chess is believed to have originated in India around the sixth century CE. The early game, called chaturanga, represented four divisions of an army. Chess spread to Persia and later to ______ its rules changed along the way. The queen, once one of the weakest pieces, became the most powerful in the late 1400s. This change made the game much faster.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Europe,","B":"Europe and,","C":"Europe; and,","D":"Europe, and"},"answer":"D","explanation":"\", and\" joins two independent clauses. A comma alone =
