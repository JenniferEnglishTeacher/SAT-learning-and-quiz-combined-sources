comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q120","id":"s2-120"},{"number":85,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Japan's first high-speed rail line opened in 1964, just before the Tokyo Olympics. Its trains are famous for their speed and punctuality. Travelers going from Tokyo to Osaka can take the train, which takes about two and a half ______ they can take a short flight, which requires extra time for airport security. Many travelers prefer the train because stations are located in city centers. The average delay on the line is measured in seconds rather than minutes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"hours or,","B":"hours, or","C":"hours, otherwise","D":"hours; or"},"answer":"B","explanation":"\", or\" joins two independent clauses. \"Otherwise\" is an adverb → comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q128","id":"s2-128"},{"number":86,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Saturn is the second-largest planet in the solar ______ it is so light for its size that it would float in a giant bathtub of water. Saturn's average density is less than that of water because it is made mostly of hydrogen and helium. Its famous rings are made of countless pieces of ice and rock. Some pieces are as small as grains of sand, while others are as large as houses. Galileo first observed the rings in 1610, but his telescope was too weak to show their shape clearly.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"system; yet,","B":"system, nevertheless","C":"system, yet","D":"system yet,"},"answer":"C","explanation":"\", yet\" joins two clauses. \", nevertheless\" (adverb) = comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q139","id":"s2-139"},{"number":87,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"The Perseverance rover landed on Mars in February ______ it carried a small helicopter named Ingenuity. Ingenuity was designed to make up to five test flights over about a month. Flying on Mars is difficult because the planet's atmosphere is only about 1 percent as dense as Earth's. Ingenuity exceeded all expectations and made 72 flights before a damaged rotor ended its mission in 2024. Its success has encouraged engineers to design larger helicopters for future missions.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"2021; and,","B":"2021,","C":"2021 and,","D":"2021, and"},"answer":"D","explanation":"\", and\" joins two clauses. A comma alone = comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q145","id":"s2-145"},{"number":88,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Botanists define a fruit as the part of a plant that develops from a flower and contains seeds. By this definition, tomatoes, cucumbers, and peppers are all fruits. Tomatoes are botanically ______ the U.S. Supreme Court ruled in 1893 that they should be taxed as vegetables. The case, Nix v. Hedden, turned on how ordinary people used the word, not on science. Most cooks still treat tomatoes as vegetables because they are usually eaten in savory dishes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"fruits,","B":"fruits; but,","C":"fruits, but","D":"fruits but,"},"answer":"C","explanation":"\", but\" joins two clauses. A comma alone = comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q153","id":"s2-153"},{"number":89,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Archerfish live in mangrove swamps and rivers in Southeast Asia and northern Australia. They have an unusual hunting technique. An archerfish spots an insect resting on a leaf above the ______ shoots it down with a powerful jet of water from its mouth. The fish can adjust for the way light bends at the water's surface. Some can hit targets more than a meter away.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"water and","B":"water, and","C":"water. And","D":"water; and"},"answer":"A","explanation":"\"Spots… and shoots…\" is ONE subject with two verbs (compound predicate), so no comma before \"and.\" Use \", and\" only between two independent clauses.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q170","id":"s2-170"},{"number":90,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Fireflies are beetles that produce light through a chemical reaction in their abdomens. The light is extremely efficient, giving off almost no heat. Each species has its own distinctive pattern of ______ females can recognize males of their own kind. Some predatory fireflies imitate the flashes of other species to lure males and eat them. Light pollution can interfere with these signals and make it harder for fireflies to find mates.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"flashes; so,","B":"flashes, so","C":"flashes so,","D":"flashes, therefore"},"answer":"B","explanation":"\", so\" joins two clauses. \", therefore\" = comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q178","id":"s2-178"},{"number":91,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"Sunflowers are often said to follow the sun across the sky. Young sunflowers do turn from east to west during the ______ mature flowers usually face east all day. Researchers found that east-facing flower heads warm up faster in the morning. Warm flowers attract more bees and other pollinators. This simple behavior may therefore help sunflowers reproduce.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"day, but, however,","B":"day, but","C":"day but,","D":"day, however"},"answer":"B","explanation":"\", but\" alone joins the clauses. \"but however\" is redundant; \", however\" = comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q187","id":"s2-187"},{"number":92,"skill":"Comma + FANBOYS ｜ 逗號＋對等連接詞","passage":"The Sahara is the largest hot desert in the world. Some parts of it receive almost no rain for years at a time. The region is extremely ______ it sits above some of the largest underground water reserves on Earth. Much of this water, called fossil water, fell as rain thousands of years ago when the region was much wetter. Because it is not replaced quickly, pumping it out faster than it refills could exhaust the supply.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"dry yet,","B":"dry, yet","C":"dry, however","D":"dry; yet,"},"answer":"B","explanation":"\", yet\" joins two clauses. \", however\" = comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma + FANBOYS","src":"Set 2 · Q196","id":"s2-196"},{"number":93,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"The platypus, which lives in the rivers of eastern Australia, has puzzled scientists since the 1790s. When the first preserved specimen reached Britain, some researchers suspected it was a hoax. The animal has a duck-like bill, a beaver-like tail, and webbed feet, and it lays eggs. Although the platypus is a ______ it has no nipples. Females instead release milk through patches of skin on their bellies, and the young lap it up.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"mammal;","B":"mammal.","C":"mammal","D":"mammal,"},"answer":"D","explanation":"An introductory \"Although\" clause is followed by a comma before the main clause. A semicolon or period would create a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q20","id":"s2-20"},{"number":94,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"The Amazon River flows about 6,400 kilometers across South America before reaching the Atlantic Ocean. It discharges more water than any other river on Earth. Even though it is one of the world's most important ______ no bridge crosses the Amazon anywhere along its main channel. Much of the river runs through sparsely populated rainforest, where roads are few. In addition, its banks are soft and shift frequently during the rainy season.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"rivers;","B":"rivers.","C":"rivers,","D":"rivers:"},"answer":"C","explanation":"An introductory \"Even though\" clause ends with a comma before the main clause. Any stronger mark leaves the dependent clause as a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q34","id":"s2-34"},{"number":95,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"Arctic ground squirrels hibernate for up to eight months each year. During hibernation, their body temperature can drop below the freezing point of water. When a squirrel wakes briefly every few ______ its body temperature rapidly climbs back to about 36°C. Scientists are not sure why the animals undergo these costly warm-ups. One hypothesis is that the periods of warmth allow the brain to repair itself.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"weeks,","B":"weeks;","C":"weeks.","D":"weeks:"},"answer":"A","explanation":"An introductory \"When\" clause is followed by a comma before the main clause.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q41","id":"s2-41"},{"number":96,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"Frogs live on every continent except Antarctica. Their life cycle usually begins with a cluster of jelly-coated eggs. While most frogs lay their eggs in ______ some species have developed very different strategies. The male Darwin's frog, for example, carries tadpoles in his vocal sac until they become tiny froglets. Such adaptations protect the young from predators and from ponds that may dry up.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"water.","B":"water;","C":"water—","D":"water,"},"answer":"D","explanation":"An introductory \"While\" clause is followed by a comma. Other marks leave the dependent clause as a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q47","id":"s2-47"},{"number":97,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"The Dead Sea lies on the border between Jordan and the West Bank, more than 400 meters below sea level. Its shoreline is the lowest point of dry land on Earth. Because the lake is nearly ten times saltier than the ______ swimmers float on its surface with almost no effort. The high salt content also means that fish and plants cannot survive in its waters. Over the past several decades, the Dead Sea's surface has dropped by about one meter per year.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"ocean—","B":"ocean,","C":"ocean.","D":"ocean;"},"answer":"B","explanation":"An introductory \"Because\" clause is followed by a comma before the main clause.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q53","id":"s2-53"},{"number":98,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"Before the 1450s, most books in Europe were copied by hand, often by monks. A single Bible could take a scribe more than a year to complete. Johannes Gutenberg's printing press, which used movable metal type, changed this dramatically. Since the invention of the printing ______ books have been produced in ever-increasing numbers. By 1500, presses across Europe had printed millions of copies of thousands of different titles.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"press:","B":"press,","C":"press.","D":"press;"},"answer":"B","explanation":"A comma follows the long introductory phrase \"Since the invention of the printing press.\"","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q59","id":"s2-59"},{"number":99,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"Today, the Eiffel Tower is the most recognizable symbol of Paris. When it was completed in 1889, however, many Parisians considered it ugly. A group of artists and writers even signed a public letter protesting its construction. Built as a temporary entrance arch for a world's ______ the tower was supposed to be taken down after 20 years. It was saved partly because it proved useful as a radio transmission tower.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"fair;","B":"fair.","C":"fair:","D":"fair,"},"answer":"D","explanation":"An introductory participial phrase (\"Built as…\") is followed by a comma before the subject.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q84","id":"s2-84"},{"number":100,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"About 20,000 years ago, vast ice sheets covered much of North America and northern Europe. So much water was locked in ice that sea levels were far lower than they are today. A land bridge called Beringia connected Siberia and Alaska. As the climate warmed at the end of the last Ice ______ melting glaciers raised sea levels by more than 100 meters. Beringia disappeared beneath the waves, separating Asia from North America.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Age.","B":"Age;","C":"Age—","D":"Age,"},"answer":"D","explanation":"An introductory \"As\" clause is followed by a comma.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q100","id":"s2-100"},{"number":101,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"Greenland is the world's largest island, and about 80 percent of it is covered by ice. In some places, the ice sheet is more than three kilometers thick. If all of that ice were to ______ global sea levels would rise by about seven meters. Such a complete melt would take centuries or longer. Even so, the ice sheet is currently losing hundreds of billions of tons of ice each year.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"melt.","B":"melt:","C":"melt;","D":"melt,"},"answer":"D","explanation":"An introductory \"If\" clause is followed by a comma.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q125","id":"s2-125"},{"number":102,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"Octopuses are notorious escape artists in aquariums. One octopus in New Zealand famously slipped out of its tank and made its way down a drainpipe to the sea. Since octopuses have no ______ they can squeeze through any opening larger than their hard beak. Their soft bodies also let them hide in narrow cracks in rocks. Aquarium staff often have to secure tank lids with locks or weights.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"bones;","B":"bones,","C":"bones:","D":"bones."},"answer":"B","explanation":"An introductory \"Since\" (= because) clause is followed by a comma.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q142","id":"s2-142"},{"number":103,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"Camels are well suited to life in the desert. Contrary to popular belief, a camel's hump does not hold water. To survive long journeys without ______ camels store fat in their humps, which they can break down for energy. They can also drink more than 100 liters of water in just a few minutes. Their oval red blood cells keep flowing even when the camel is dehydrated.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"food.","B":"food,","C":"food:","D":"food;"},"answer":"B","explanation":"An introductory infinitive phrase (\"To survive…\") is followed by a comma.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q172","id":"s2-172"},{"number":104,"skill":"Comma after introductory clause/phrase ｜ 前置從屬子句/片語後加逗號","passage":"Octopuses differ from other animals in many surprising ways. Unlike humans and most other ______ they have three hearts. Two of the hearts pump blood through the gills, while the third pumps it to the rest of the body. Their blood is blue because it contains a copper-based protein called hemocyanin. This protein carries oxygen efficiently in cold water with little oxygen.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"animals;","B":"animals:","C":"animals,","D":"animals."},"answer":"C","explanation":"An introductory \"Unlike…\" phrase is followed by a comma.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Comma after introductory clause/phrase","src":"Set 2 · Q195","id":"s2-195"},{"number":105,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Sea otters spend nearly their entire lives in cold Pacific waters. Unlike whales and seals, they have no thick layer of blubber to keep them warm. Instead, they rely on extremely dense fur, which traps a layer of air against their skin. They must also eat about a quarter of their body weight in food each ______ their high metabolism burns energy quickly to generate heat. By keeping sea urchin populations in check, otters help kelp forests thrive.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"day. Because","B":"day, because,","C":"day; because","D":"day because"},"answer":"D","explanation":"A \"because\" clause that follows the main clause needs no punctuation. A period or semicolon leaves \"Because…\" as a fragment; a comma AFTER \"because\" is never correct.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q7","id":"s2-7"},{"number":106,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Alligators and crocodiles are often confused with each other. Both are large reptiles with powerful jaws and armored skin. An alligator has a broad, U-shaped ______ a crocodile has a narrower, V-shaped one. When a crocodile closes its mouth, its large fourth lower tooth remains visible. Alligators, by contrast, tend to hide their lower teeth when their jaws are shut.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"snout. Whereas","B":"snout; whereas","C":"snout whereas,","D":"snout, whereas"},"answer":"D","explanation":"\"Whereas\" is a subordinating conjunction; \", whereas\" attaches its clause to the main clause. A period or semicolon before it leaves a fragment; a comma after it is wrong.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q25","id":"s2-25"},{"number":107,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"The Great Barrier Reef is the largest structure built by living things on Earth, stretching more than 2,000 kilometers along Australia's coast. It is made up of nearly 3,000 individual reefs and hundreds of islands. Remarkably, the reef is large enough to be seen from ______ it was built by coral polyps, tiny animals that are often only a few millimeters across. Over thousands of years, the polyps' limestone skeletons accumulated into massive structures. Today, the reef is home to about 1,500 species of fish.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"space, even though","B":"space. Even though","C":"space, however,","D":"space; even though"},"answer":"A","explanation":"\"Even though\" introduces a dependent clause that can follow the main clause after a comma. \", however,\" is a comma splice; a semicolon or period before \"Even though\" leaves a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q29","id":"s2-29"},{"number":108,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Many hospitals now use ultraviolet robots to disinfect rooms. The devices emit UV-C light, which damages the genetic material of bacteria and viruses. The light works only on surfaces that it can reach directly. Shadowed areas remain ______ the robot is moved to a new position. Hospital staff therefore still clean rooms by hand before using the robots.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"contaminated; unless","B":"contaminated. Unless","C":"contaminated unless","D":"contaminated, unless,"},"answer":"C","explanation":"An \"unless\" clause following the main clause needs no punctuation. A period or semicolon creates a fragment; never place a comma after \"unless.\"","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q43","id":"s2-43"},{"number":109,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Washington, D.C., is famous for its cherry blossoms. The city's first cherry trees were planted in ______ the mayor of Tokyo sent more than 3,000 of them as a gift of friendship. An earlier shipment in 1910 had to be destroyed because the trees were infested with insects. Today, the blossoms attract more than a million visitors each spring. The peak bloom usually occurs in late March or early April.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"1912. After","B":"1912; after","C":"1912, after,","D":"1912, after"},"answer":"D","explanation":"\"After\" introduces a dependent clause attached to the main clause. A period or semicolon creates a fragment; no comma after \"after.\"","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q68","id":"s2-68"},{"number":110,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"The Great Fire of London began in a bakery on Pudding Lane in September 1666. Over four days, it destroyed more than 13,000 houses and nearly 90 churches. The fire spread ______ most buildings were made of timber and packed tightly together. Afterward, the city was rebuilt with wider streets and buildings of brick and stone. The architect Christopher Wren designed a new St. Paul's Cathedral, which was completed in 1711.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"quickly. Because","B":"quickly, because,","C":"quickly because","D":"quickly; because"},"answer":"C","explanation":"A \"because\" clause after the main clause needs no punctuation. A period/semicolon creates a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q70","id":"s2-70"},{"number":111,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Earth's North and South Poles are both cold, but they differ in important ways. The North Pole sits on floating sea ice in the middle of the Arctic ______ the South Pole lies on a thick ice sheet covering solid land. Because of its higher elevation, the South Pole is much colder. Its average annual temperature is about –49°C, compared with about –18°C at the North Pole. Polar bears live only in the Arctic, and penguins live mainly in the Southern Hemisphere.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Ocean. While","B":"Ocean while,","C":"Ocean; while","D":"Ocean, while"},"answer":"D","explanation":"\", while\" (contrast) attaches a dependent clause to the main clause. A semicolon or period before \"while\" creates a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q79","id":"s2-79"},{"number":112,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Sloths are famous for moving slowly, and their low metabolism lets them survive on a diet of leaves. Although these animals spend most of their lives hanging in ______ they climb down to the ground about once a week to relieve themselves. The trip is dangerous because sloths are slow and vulnerable on the ground. Scientists are still debating why sloths take this risk. One hypothesis suggests that the behavior helps support moths and algae that live in sloth fur.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"trees,","B":"trees, however,","C":"trees. However,","D":"trees; however,"},"answer":"A","explanation":"\"Although\" already shows contrast; it needs only a comma before the main clause. Adding \"however\" is redundant and creates a fragment or comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q85","id":"s2-85"},{"number":113,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Living in space changes the human body in many ways. Without gravity pulling on them, muscles and bones no longer work to support the body's weight. Astronauts on the International Space Station exercise about two hours every ______ their muscles and bones do not weaken too much. Even so, some astronauts lose bone density during long missions. After returning to Earth, they may need weeks or months of rehabilitation to walk normally again.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"day so that","B":"day; so that","C":"day, so that,","D":"day. So that"},"answer":"A","explanation":"\"So that\" (purpose) introduces a dependent clause; no comma is needed. A period or semicolon creates a fragment; never a comma after \"that.\"","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q95","id":"s2-95"},{"number":114,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Emperor penguins breed during the Antarctic winter, when temperatures can fall below –40°C. While most birds build nests in trees or on the ______ emperor penguins build no nests at all. Instead, the male balances the single egg on his feet and covers it with a warm fold of skin. He then goes without food for about two months while the egg incubates. Males huddle together in large groups, taking turns on the cold outer edge.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"ground.","B":"ground,","C":"ground;","D":"ground; however,"},"answer":"B","explanation":"Introductory \"While\" clause + comma. Adding \"however\" is redundant; a period or semicolon creates a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q131","id":"s2-131"},{"number":115,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Chameleons are lizards known for their ability to change color. Many people assume that they do so mainly to match their ______ although camouflage is only part of the story. Chameleons also change color to regulate body temperature and to signal to other chameleons. A male may turn bright colors to warn rivals or attract a mate. The color change is controlled by tiny crystals in skin cells that reflect light differently as they move closer together or farther apart.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"surroundings,","B":"surroundings;","C":"surroundings:","D":"surroundings."},"answer":"A","explanation":"\"Although\" introduces a dependent clause; attach it with a comma. Stronger marks leave a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q156","id":"s2-156"},{"number":116,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Owls are skilled nighttime hunters. They have excellent hearing and can locate prey in total darkness. Many owls can also fly almost ______ the edges of their wing feathers are soft and fringed, which breaks up the air turbulence that creates noise. Engineers have studied owl feathers to design quieter fans and wind turbines. Some owls' ears are placed at different heights on their heads, helping them pinpoint sounds.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"silently because","B":"silently. Because","C":"silently, because of this,","D":"silently; because"},"answer":"A","explanation":"\"Because\" clause after the main clause: no punctuation needed. \", because of this,\" between two clauses is a comma splice.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q166","id":"s2-166"},{"number":117,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Deciduous trees lose their leaves each autumn. Before the leaves fall, they often turn brilliant shades of yellow, orange, and red. The change ______ shorter days cause the trees to stop producing chlorophyll, the green pigment used in photosynthesis. As the chlorophyll breaks down, other pigments that were present all along become visible. Red colors, however, come from new pigments that some trees produce in the fall.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"begins. When","B":"begins, when,","C":"begins when","D":"begins; when"},"answer":"C","explanation":"\"When\" clause after the verb completes the sentence; no punctuation. A period/semicolon creates fragments.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q175","id":"s2-175"},{"number":118,"skill":"Subordinating conjunction (because, while, unless…) ｜ 從屬連接詞","passage":"Pacific salmon hatch in freshwater streams and soon migrate to the ocean. They spend several years growing in the open ______ they return to the very stream where they hatched to spawn. Scientists believe that salmon use Earth's magnetic field to find the right stretch of coast. Once near their home river, they follow its distinctive smell upstream. Most Pacific salmon die soon after spawning, and their bodies provide nutrients to the surrounding forest.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"ocean. Before","B":"ocean before","C":"ocean, before,","D":"ocean; before"},"answer":"B","explanation":"\"Before\" clause after the main clause: no punctuation. A period/semicolon creates a fragment.","cat":"4. Sentence Boundaries & Conjunctions","catzh":"句子界線與連接詞","sub":"Subordinating conjunctions","src":"Set 2 · Q182","id":"s2-182"},{"number":119,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"For centuries, sailors could measure latitude by observing the height of the sun or the North Star. Longitude was a much harder problem. The difficulty was fundamentally about ______ calculate longitude, a navigator needed to know the exact time at a home port while at sea. Pendulum clocks, however, lost accuracy on rolling ships. In the 1760s, the English clockmaker John Harrison finally built a marine timekeeper reliable enough for the task.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"time; and to","B":"time, to","C":"time: to","D":"time to"},"answer":"C","explanation":"A colon after a complete independent clause introduces the explanation of \"the difficulty.\" A comma creates a comma splice; no punctuation creates a run-on; \"; and\" is not a standard way to join clauses.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q8","id":"s2-8"},{"number":120,"skill":"Colon introducing a list / item ｜ 冒號引出列舉","passage":"The James Webb Space Telescope observes the universe primarily in infrared light. This choice allows it to study objects that visible-light telescopes struggle to ______ newly forming stars hidden inside dust clouds, the atmospheres of distant planets, and the faint light of the earliest galaxies. To detect such weak signals, the telescope's instruments must be kept extremely cold. A tennis-court-sized sunshield blocks heat from the sun, Earth, and Moon. Behind it, some instruments operate at temperatures below –260°C.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"see, such as:","B":"see;","C":"see, including:","D":"see:"},"answer":"D","explanation":"A colon after a complete clause introduces a list. Never put a colon after \"such as\" or \"including\"; a semicolon cannot introduce a list.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q9","id":"s2-9"},{"number":121,"skill":"Colon traps (after verb / such as / including) ｜ 冒號陷阱","passage":"Mangrove forests grow along tropical coastlines where land meets the sea. Their tangled roots slow incoming waves and trap sediment. As a result, mangroves protect nearby communities ______ storm surges, erosion, and flooding. They also store large amounts of carbon in their waterlogged soils. Despite these benefits, many mangrove forests have been cleared for shrimp farms and coastal development.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"from","B":"from:","C":"from;","D":"from—"},"answer":"A","explanation":"No punctuation between a preposition (\"from\") and its object. A colon can only follow a complete independent clause.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q10","id":"s2-10"},{"number":122,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"Many early photographs show people with stiff, serious expressions. This was not necessarily because people in the 1800s were unhappy. One reason was ______ early cameras required subjects to hold still for long periods, and a smile is hard to keep steady. Another reason was cultural, since formal portraits were expected to look dignified. By the early twentieth century, faster cameras and changing fashions made smiling portraits common.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"practical early","B":"practical, because, early","C":"practical, early","D":"practical: early"},"answer":"D","explanation":"The colon follows a complete clause and introduces the explanation of what the \"practical\" reason was. A comma = comma splice; nothing = run-on.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q31","id":"s2-31"},{"number":123,"skill":"Colon introducing a list / item ｜ 冒號引出列舉","passage":"Marie Curie remains the only person to have won Nobel Prizes in two different sciences. Her research focused on radioactivity, a term she helped popularize. Together with her husband, Pierre, she discovered two new ______ polonium and radium. Polonium was named after Poland, Marie's homeland. Curie's notebooks are still so radioactive that they are stored in lead-lined boxes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"elements;","B":"elements, such as:","C":"elements:","D":"elements, including:"},"answer":"C","explanation":"A colon after a complete clause introduces the two specific elements. No colon after \"including\" or \"such as\"; a semicolon cannot introduce a list.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q32","id":"s2-32"},{"number":124,"skill":"Colon introducing a list / item ｜ 冒號引出列舉","passage":"Some of the most valuable spices in history came from tropical islands. In the 1600s, Dutch and English merchants fought bitterly over a small group of Indonesian islands known as the Banda Islands. These islands were then the world's only source of two prized ______ nutmeg and mace. Both spices come from the same tree, Myristica fragrans. In 1667, the Dutch gave up their claim to Manhattan partly in exchange for Run, one of the Banda Islands.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"spices, such as:","B":"spices:","C":"spices;","D":"spices, including:"},"answer":"B","explanation":"A colon after the complete clause introduces the two spices. No colon after \"such as\" or \"including\"; a semicolon cannot introduce a list.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q42","id":"s2-42"},{"number":125,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"Honey can last for thousands of years without spoiling. Archaeologists have found pots of honey in ancient Egyptian tombs that were still edible. The reason is ______ honey contains very little water and is highly acidic, conditions in which most bacteria cannot survive. Bees also add an enzyme that produces small amounts of hydrogen peroxide, which further protects the honey. As long as it is sealed to keep out moisture, honey can be stored almost indefinitely.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"chemical, because, honey","B":"chemical: honey","C":"chemical honey","D":"chemical, honey"},"answer":"B","explanation":"Colon after a complete clause introduces the explanation. Comma = comma splice; nothing = run-on.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q55","id":"s2-55"},{"number":126,"skill":"Colon introducing a list / item ｜ 冒號引出列舉","passage":"The ancient Romans built a road network that stretched for tens of thousands of kilometers. The most important roads were paved with stone and carefully engineered to last. A typical Roman road was built in several ______ a foundation of large stones, a middle layer of gravel or crushed rock, and a smooth surface of fitted paving stones. The roads were slightly curved so that rainwater would drain to the sides. Some of them, such as the Appian Way, are still in use today.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"layers, including:","B":"layers, such as:","C":"layers:","D":"layers;"},"answer":"C","explanation":"A colon after a complete clause introduces the list of layers.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q56","id":"s2-56"},{"number":127,"skill":"Colon traps (after verb / such as / including) ｜ 冒號陷阱","passage":"A healthy honeybee hive contains three types of bees. The colony ______ a single queen, thousands of female worker bees, and a few hundred male drones. The queen lays up to 2,000 eggs a day during the summer. Workers gather food, build the comb, and defend the hive. Drones exist mainly to mate with queens from other colonies.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"includes;","B":"includes:","C":"includes","D":"includes—"},"answer":"C","explanation":"No colon (or any mark) between a verb and its object. A colon must follow a complete clause.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q65","id":"s2-65"},{"number":128,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"Elephants that raid farms can destroy a season's crops in a single night. Traditional fences are expensive and often fail to stop them. Farmers in Kenya have found a creative ______ hang beehives on wires strung between fence posts. When an elephant bumps the wire, the hives swing and the bees swarm out. Elephants avoid bees, which can sting the sensitive skin around their eyes and trunks.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"alternative: and they","B":"alternative, they","C":"alternative: they","D":"alternative they"},"answer":"C","explanation":"Colon after a complete clause introduces what the alternative is. Comma = comma splice; nothing = run-on.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q71","id":"s2-71"},{"number":129,"skill":"Colon introducing a list / item ｜ 冒號引出列舉","passage":"Hearing begins when sound waves enter the ear canal and strike the eardrum. The human ear has three main ______ the outer ear, the middle ear, and the inner ear. The middle ear contains the three smallest bones in the body. The smallest of these, the stapes, is about the size of a grain of rice. In the inner ear, tiny hair cells convert vibrations into electrical signals that travel to the brain.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"parts;","B":"parts, such as:","C":"parts:","D":"parts, including:"},"answer":"C","explanation":"A colon after a complete clause introduces the list of three parts.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q80","id":"s2-80"},{"number":130,"skill":"Colon traps (after verb / such as / including) ｜ 冒號陷阱","passage":"Before 1492, Europe, Asia, and Africa had no contact with the plants grown in the Americas. The exchange that followed Columbus's voyages transformed diets around the world. Many foods now considered staples elsewhere originated in the Americas, ______ potatoes, tomatoes, corn, and cacao. Italian cooking had no tomato sauce before the sixteenth century. Similarly, chili peppers did not reach India and Thailand until traders brought them from the Americas.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"including—","B":": including","C":"including","D":"including:"},"answer":"C","explanation":"Never place a colon (or dash) right after \"including.\" The list simply follows it.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q89","id":"s2-89"},{"number":131,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"Most people throw away a cup or bowl once it breaks. The Japanese art of kintsugi treats broken pottery in an unusual ______ of hiding the cracks, artisans fill them with lacquer mixed with powdered gold. The repaired object often looks more striking than the original. The practice reflects the idea that damage and repair are part of an object's history. Kintsugi has inspired artists and designers around the world.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"way: and instead","B":"way: instead","C":"way instead","D":"way, instead"},"answer":"B","explanation":"Colon after a complete clause introduces the explanation of the \"unusual way.\"","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q96","id":"s2-96"},{"number":132,"skill":"Colon traps (after verb / such as / including) ｜ 冒號陷阱","passage":"The International Space Station orbits Earth about 16 times a day. The station has been continuously occupied since November 2000. Its crew members, who come from many countries, conduct experiments in ______ biology, physics, and medicine. Many experiments study how plants, animals, and people respond to long periods of weightlessness. The station is roughly the size of a football field, including its solar panels.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"fields such as:","B":"fields, such as:","C":"fields such as","D":"fields; such as"},"answer":"C","explanation":"No colon after \"such as\"; a semicolon cannot introduce examples.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q97","id":"s2-97"},{"number":133,"skill":"Colon introducing a list / item ｜ 冒號引出列舉","passage":"Qin Shi Huang became the first emperor of a unified China in 221 BCE. He standardized weights, measures, coins, and writing across his empire. He also ordered the construction of two enormous ______ an early version of the Great Wall and a vast tomb guarded by thousands of life-size clay soldiers. Farmers digging a well discovered the clay army in 1974. Archaeologists have uncovered only a small part of the tomb complex so far.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"projects, including:","B":"projects;","C":"projects, such as:","D":"projects:"},"answer":"D","explanation":"Colon after a complete clause introduces the two projects.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q111","id":"s2-111"},{"number":134,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"Flamingos are wading birds found in parts of Africa, Asia, Europe, and the Americas. Young flamingos are covered in gray or white feathers. The adults' famous pink color is not ______ comes from pigments in the algae and tiny shrimp they eat. Flamingos in zoos may fade if their diet lacks these pigments. For this reason, zookeepers often add special supplements to the birds' food.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"inherited it","B":"inherited: because it","C":"inherited: it","D":"inherited, it"},"answer":"C","explanation":"Colon after a complete clause introduces the explanation. Comma = comma splice; \"because\" after a colon makes a fragment.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q116","id":"s2-116"},{"number":135,"skill":"Colon introducing a list / item ｜ 冒號引出列舉","passage":"Ravens belong to the crow family, a group known for its intelligence. In laboratory studies, ravens have solved puzzles that challenge young children. They have also shown a skill once thought to be uniquely ______ for the future. In one experiment, ravens chose and saved a tool that they would need to open a box the next day. Researchers say that this ability likely evolved independently in birds and primates.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"human, such as: planning","B":"human that is planning","C":"human; planning","D":"human: planning"},"answer":"D","explanation":"A colon after a complete clause introduces the specific skill. A semicolon needs a full clause after it.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q121","id":"s2-121"},{"number":136,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"Cuttlefish can change the color and pattern of their skin in less than a second. They use this ability to hide from predators and to communicate with one another. Yet experiments suggest that cuttlefish are colorblind. This raises a puzzling ______ can an animal match colors it cannot see? Some researchers think that light-sensitive proteins in the skin itself may help.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"question: how","B":"question how","C":"question, how","D":"question; and how"},"answer":"A","explanation":"A colon after a complete clause can introduce a question that explains \"a puzzling question.\"","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q130","id":"s2-130"},{"number":137,"skill":"Colon traps (after verb / such as / including) ｜ 冒號陷阱","passage":"Mixing paints and mixing light produce very different results. When paints are combined, they absorb more light, so the mixture becomes darker. Light behaves in the opposite way. The three primary colors of light ______ red, green, and blue. When all three are combined in equal amounts, they produce white light, a principle used in television and computer screens.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are:","B":"are","C":"are;","D":"are—"},"answer":"B","explanation":"No punctuation between a verb (\"are\") and what follows it.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q137","id":"s2-137"},{"number":138,"skill":"Colon introducing a list / item ｜ 冒號引出列舉","passage":"Predicting volcanic eruptions can save thousands of lives. Before most eruptions, magma rises toward the surface and changes the volcano in measurable ways. Scientists therefore monitor active volcanoes for several warning ______ small earthquakes, swelling of the ground, and increased release of gases such as sulfur dioxide. In 1991, such signs allowed officials to evacuate tens of thousands of people before Mount Pinatubo erupted in the Philippines. Still, the exact timing of an eruption remains difficult to predict.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"signs:","B":"signs;","C":"signs, such as:","D":"signs including:"},"answer":"A","explanation":"Colon after a complete clause introduces the list.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q143","id":"s2-143"},{"number":139,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"The Statue of Liberty was not always green. When it was dedicated in 1886, it had the reddish-brown shine of a new penny. The change came from a natural ______ on the statue's surface reacted with air and water over about 30 years, forming a green layer called a patina. This patina actually protects the copper beneath it from further corrosion. For that reason, it has never been removed.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"process copper","B":"process: and copper","C":"process: copper","D":"process, copper"},"answer":"C","explanation":"Colon after a complete clause introduces the explanation of the \"natural process.\"","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q147","id":"s2-147"},{"number":140,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"The giant panda lives in the mountain forests of central China. The animal presents biologists with a nutritional ______ has the digestive system of a meat eater but eats almost nothing except bamboo. Because its gut digests bamboo poorly, a panda must eat for up to 14 hours a day. Pandas also conserve energy by moving slowly and resting often. Their thyroid hormone levels are unusually low, which further reduces their energy needs.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"puzzle, it","B":"puzzle; because it","C":"puzzle it","D":"puzzle: it"},"answer":"D","explanation":"Colon after a complete clause introduces the explanation of the \"puzzle.\"","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q154","id":"s2-154"},{"number":141,"skill":"Colon traps (after verb / such as / including) ｜ 冒號陷阱","passage":"The Arctic tundra is a treeless region where the ground beneath the surface stays frozen all year. Summers are short, and winters are long and dark. Despite these harsh conditions, the tundra supports many animals well adapted to the ______ caribou, arctic foxes, and snowy owls. Many birds migrate to the tundra each summer to nest. As the climate warms, shrubs are spreading northward into areas that were once open tundra.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"cold: such as","B":"cold, such as:","C":"cold, such as","D":"cold such as:"},"answer":"C","explanation":"No colon before or after \"such as\"; a comma introduces the examples.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q161","id":"s2-161"},{"number":142,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"The first emoji were created in Japan in 1999 by designer Shigetaka Kurita. His goal was ______ wanted to help people convey emotions in short text messages. His original set of 176 small images included symbols for weather, food, and facial expressions. In 2016, the Museum of Modern Art in New York added the set to its collection. Today, thousands of emoji are used by billions of people around the world.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"practical: he","B":"practical he","C":"practical, he","D":"practical: and he"},"answer":"A","explanation":"Colon after a complete clause introduces the explanation.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q167","id":"s2-167"},{"number":143,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"Humans begin yawning even before birth. Many other animals, including dogs, snakes, and fish, yawn as well. Scientists have proposed many explanations for this behavior, but one idea has gained ______ may help cool the brain. A deep yawn draws in air and increases blood flow to the head. Studies have found that people yawn less often when the surrounding air is very hot.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"support, yawning","B":"support: yawning","C":"support: that yawning","D":"support yawning"},"answer":"B","explanation":"Colon after a complete clause introduces the explanation. \"that yawning may help…\" after a colon is not a complete clause.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q179","id":"s2-179"},{"number":144,"skill":"Colon introducing a list / item ｜ 冒號引出列舉","passage":"Earth's atmosphere is a thin layer of gases held in place by gravity. It is made mostly of two ______ nitrogen, which makes up about 78 percent, and oxygen, which makes up about 21 percent. The remaining one percent includes argon, carbon dioxide, and water vapor. Although carbon dioxide is present only in small amounts, it plays an important role in trapping heat. Without the atmosphere, Earth's average temperature would be far below freezing.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"gases, which are:","B":"gases:","C":"gases, such as:","D":"gases;"},"answer":"B","explanation":"Colon after a complete clause introduces the two gases. Never a colon right after a verb (\"are\") or \"such as.\"","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q184","id":"s2-184"},{"number":145,"skill":"Colon traps (after verb / such as / including) ｜ 冒號陷阱","passage":"Caffeine is the most widely consumed stimulant in the world. It works by blocking a chemical in the brain called adenosine, which builds up during the day and makes people feel sleepy. Common sources of caffeine ______ coffee, tea, chocolate, and many soft drinks. The effects usually begin within about 15 to 45 minutes. Because caffeine can stay in the body for several hours, drinking it in the afternoon may interfere with sleep.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"include;","B":"include:","C":"include","D":"include—"},"answer":"C","explanation":"No punctuation between a verb (\"include\") and its objects.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q189","id":"s2-189"},{"number":146,"skill":"Colon introducing an explanation ｜ 冒號引出說明","passage":"In 1999, NASA lost contact with the Mars Climate Orbiter as it approached the planet. The cause turned out to be a simple ______ engineering team used English units, while another used metric units. As a result, the spacecraft flew too close to Mars and was destroyed in its atmosphere. The mission had cost about 125 million dollars. The incident is now taught as a lesson in the importance of clear communication.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"error; because one","B":"error one","C":"error, one","D":"error: one"},"answer":"D","explanation":"Colon after a complete clause introduces the explanation of the \"error.\"","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Colons","src":"Set 2 · Q197","id":"s2-197"},{"number":147,"skill":"Nonessential element: paired commas ｜ 非必要成分：成對逗號","passage":"Honeybee colonies make collective decisions in a surprisingly democratic way. When a colony needs a new home, a few hundred scout bees fly out to inspect possible sites. Each scout that finds a promising cavity returns and performs a waggle ______ which tells other bees the site's direction and distance. Over several days, more and more scouts join the dances for the best site. Once enough scouts gather at one location, the whole swarm takes off for its new home.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"dance,","B":"dance:","C":"dance.","D":"dance;"},"answer":"A","explanation":"A nonessential \"which\" clause is set off with a comma. A semicolon or period would leave \"which tells…\" as a fragment; a colon cannot introduce a \"which\" clause.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q11","id":"s2-11"},{"number":148,"skill":"Paired dashes ｜ 成對破折號","passage":"In 1903, Wilbur and Orville Wright made the first controlled, powered airplane flight near Kitty Hawk, North Carolina. That first flight lasted only 12 seconds and covered about 120 feet. The brothers' success depended less on engine power than on control. Their system of wing warping—twisting the wingtips to roll the aircraft into a ______ allowed the pilot to keep the plane balanced. Later aircraft replaced wing warping with hinged panels called ailerons, but the principle remained the same.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"turn","B":"turn,","C":"turn;","D":"turn—"},"answer":"D","explanation":"The interruption opens with a dash, so it must close with a dash. Mixing a dash with a comma (or using nothing) breaks the pair.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q12","id":"s2-12"},{"number":149,"skill":"Single dash ｜ 單一破折號","passage":"Ancient Roman concrete has survived for two thousand years in harbors and monuments. Modern concrete, by contrast, can crack within decades. Scientists studying Roman structures have identified one likely reason for the ______ lumps of lime that can react with water to seal cracks as they form. This self-healing ability may help explain why Roman harbor walls are still standing. Engineers are now testing whether similar ingredients could make modern concrete more durable.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"difference small","B":"difference. Small","C":"difference; small","D":"difference—small"},"answer":"D","explanation":"A single dash after a complete clause can introduce an explanation (like a colon). A semicolon or period would leave \"small lumps…\" as a fragment (no verb).","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q13","id":"s2-13"},{"number":150,"skill":"Nonessential element: paired commas ｜ 非必要成分：成對逗號","passage":"Many people believe that reading on screens harms comprehension. A recent study of college students tested this belief directly. The ______ found that students who read printed texts remembered key details better than those who read the same texts on tablets. The difference was largest for long, complex passages. The researchers suggest that scrolling may make it harder for readers to build a mental map of a text.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"study; though small,","B":"study, though small,","C":"study, though small","D":"study though small,"},"answer":"B","explanation":"\"Though small\" is a nonessential interrupter between subject and verb, so it needs a pair of commas. A semicolon would cut the subject off from its verb.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q22","id":"s2-22"},{"number":151,"skill":"No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置","passage":"Tomatoes originated in western South America and were brought to Europe in the 1500s. Italians and Spaniards soon began cooking with them. In parts of northern Europe, however, the plant was grown mainly as a decoration. The belief that tomatoes might be ______ was common there for many years, partly because the plant belongs to the same family as deadly nightshade. By the 1800s, tomatoes had become a popular ingredient across the continent.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"poisonous—","B":"poisonous","C":"poisonous,","D":"poisonous;"},"answer":"B","explanation":"The whole phrase \"The belief that tomatoes might be poisonous\" is the subject; no punctuation can separate a subject from its verb (\"was\").","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q23","id":"s2-23"},{"number":152,"skill":"Paired dashes ｜ 成對破折號","passage":"In 2019, astronomers released the first image of a black hole. The picture shows a glowing ring of hot gas surrounding a dark center. Producing it was an enormous technical challenge. The project linked eight radio observatories—located on four different ______ that together functioned as a single telescope the size of Earth. The black hole, which sits at the center of the galaxy M87, is about 55 million light-years away.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"continents;","B":"continents","C":"continents,","D":"continents—"},"answer":"D","explanation":"The interrupting phrase opened with a dash, so it must close with a dash.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q33","id":"s2-33"},{"number":153,"skill":"Essential element: no commas ｜ 必要成分：不加逗號","passage":"The discovery of DNA's double-helix structure in 1953 is usually credited to James Watson and Francis Crick. Their work, however, relied heavily on data gathered by other scientists. In 1952, British chemist ______ produced an X-ray image of DNA known as Photo 51. Watson saw the image without her knowledge, and it helped him confirm the molecule's helical shape. Franklin died in 1958, four years before Watson, Crick, and Maurice Wilkins received the Nobel Prize.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":", Rosalind Franklin","B":", Rosalind Franklin,","C":"Rosalind Franklin","D":"Rosalind Franklin,"},"answer":"C","explanation":"Title + name (\"British chemist Rosalind Franklin\") with no \"the\" is essential, so no commas. A comma before the verb \"produced\" separates subject and verb.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q39","id":"s2-39"},{"number":154,"skill":"Nonessential element: paired commas ｜ 非必要成分：成對逗號","passage":"In the 1830s, the English mathematician Charles Babbage designed a machine called the Analytical Engine. The machine was never completed, but its design contained many features of modern computers. Ada Lovelace, the daughter of the poet Lord ______ wrote detailed notes explaining how the engine could work. Her notes included a step-by-step method for calculating a series of numbers called Bernoulli numbers. For this reason, she is often described as the first computer programmer.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Byron—","B":"Byron;","C":"Byron","D":"Byron,"},"answer":"D","explanation":"The appositive \"the daughter of the poet Lord Byron\" opened with a comma, so it must close with a comma.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q44","id":"s2-44"},{"number":155,"skill":"Paired dashes ｜ 成對破折號","passage":"Mount Everest grows a little taller each year. The Indian tectonic plate continues to push northward into the Eurasian plate, lifting the Himalayas upward. The rate of growth—about four millimeters per ______ is tiny compared with the mountain's total height. Everest's official height of 8,849 meters was announced jointly by China and Nepal in 2020. Earthquakes and erosion can also slightly change the mountain's height over time.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"year","B":"year;","C":"year,","D":"year—"},"answer":"D","explanation":"Opening dash → closing dash.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q57","id":"s2-57"},{"number":156,"skill":"No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置","passage":"Learning to play a musical instrument requires coordinating the eyes, ears, and hands. Researchers have found ______ children who take music lessons often show improvements in memory and attention. It is not yet clear whether music itself causes these benefits. Children who take lessons may differ in other ways, such as family income or parental involvement. Long-term studies that randomly assign children to music lessons may help answer the question.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":", that","B":"that","C":"that,","D":": that"},"answer":"B","explanation":"No punctuation between a verb (\"found\") and its object clause (\"that…\").","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q63","id":"s2-63"},{"number":157,"skill":"Nonessential element: paired commas ｜ 非必要成分：成對逗號","passage":"For centuries, no one could read Egyptian hieroglyphs. The Rosetta Stone, a stone slab inscribed with the same decree in three ______ was discovered by French soldiers in Egypt in 1799. Two of the scripts were Egyptian, and the third was ancient Greek, which scholars could already read. By comparing the texts, the French scholar Jean-François Champollion deciphered the hieroglyphs in 1822. The stone is now displayed in the British Museum in London.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"scripts,","B":"scripts—","C":"scripts","D":"scripts;"},"answer":"A","explanation":"The appositive opened with a comma, so it must close with a comma before the verb \"was discovered.\"","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q67","id":"s2-67"},{"number":158,"skill":"Essential element: no commas ｜ 必要成分：不加逗號","passage":"Rachel Carson is best known for Silent Spring, her 1962 book about the dangers of pesticides. That book helped launch the modern environmental movement. However, the ______ made Carson famous was an earlier work about the ocean. The Sea Around Us, published in 1951, spent more than 80 weeks on the New York Times bestseller list. Its success allowed Carson to leave her government job and write full-time.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"book that first","B":"book, that first","C":"book that first,","D":"book, that first,"},"answer":"A","explanation":"A \"that\" clause is essential and never takes commas. A comma before the verb \"made\" would also separate subject and verb.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q74","id":"s2-74"},{"number":159,"skill":"Paired dashes ｜ 成對破折號","passage":"A total solar eclipse occurs when the moon passes directly between Earth and the sun. For a few minutes, the sky darkens and the sun's glowing outer atmosphere, the corona, becomes visible. Total solar eclipses—though visible somewhere on Earth about every 18 ______ occur at any single location only about once every 375 years on average. As a result, many people travel great distances to see one. In April 2024, millions of people gathered along a narrow path from Mexico to Canada to watch the event.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"months;","B":"months—","C":"months","D":"months,"},"answer":"B","explanation":"Opening dash → closing dash. (Note \"though visible…\" inside is a reduced conjunction clause.)","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q83","id":"s2-83"},{"number":160,"skill":"Nonessential element: paired commas ｜ 非必要成分：成對逗號","passage":"Diamonds are made of carbon atoms arranged in a rigid crystal structure. Pure diamonds are colorless, but small amounts of other elements can tint them. The Hope Diamond, whose deep blue color comes from traces of the element ______ is one of the most famous gems in the world. It weighs about 45 carats. Since 1958, it has been displayed at the Smithsonian's National Museum of Natural History in Washington, D.C.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"boron,","B":"boron;","C":"boron:","D":"boron"},"answer":"A","explanation":"The nonessential \"whose\" clause opened with a comma, so it must close with a comma before the verb \"is.\"","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q91","id":"s2-91"},{"number":161,"skill":"Single dash ｜ 單一破折號","passage":"The axolotl is a salamander native to the lakes around Mexico City. Unlike most salamanders, it keeps its feathery gills and lives in water its entire life. The axolotl also has an extraordinary ______ can regrow lost limbs, parts of its heart, and even portions of its brain. Scientists study the animal in hopes of learning how to improve healing in humans. In the wild, however, axolotls are critically endangered because of pollution and urban growth.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"ability, it","B":"ability it","C":"ability that it","D":"ability—it"},"answer":"D","explanation":"A single dash after a complete clause can introduce an explanation. A comma = comma splice; nothing = run-on.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q93","id":"s2-93"},{"number":162,"skill":"No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置","passage":"Sunlight contains all the colors of the rainbow. As it passes through the atmosphere, it collides with gas molecules. The reason the sky looks blue is ______ these molecules scatter short blue wavelengths of light much more than longer red ones. At sunrise and sunset, sunlight travels through more of the atmosphere before reaching our eyes. By then, much of the blue light has been scattered away, leaving the sky orange and red.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":": that","B":"that","C":"that,","D":"that:"},"answer":"B","explanation":"No punctuation between \"is\" and its complement clause \"that…\". A colon needs a complete clause before it.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q104","id":"s2-104"},{"number":163,"skill":"Nonessential element: paired commas ｜ 非必要成分：成對逗號","passage":"Earth has just one natural satellite, the Moon. Several planets in our solar ______ including Jupiter and Saturn, have dozens of moons. Saturn has the most known moons of any planet. Many of these moons are only a few kilometers across. Mercury and Venus, by contrast, have no moons at all.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"system","B":"system;","C":"system:","D":"system,"},"answer":"D","explanation":"The nonessential phrase \"including Jupiter and Saturn\" closes with a comma, so it must open with a comma too.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q108","id":"s2-108"},{"number":164,"skill":"Paired dashes ｜ 成對破折號","passage":"The bristlecone pines of California's White Mountains are among the oldest living things on Earth. One tree—nicknamed Methuselah by the researchers who studied ______ is estimated to be more than 4,800 years old. The trees grow extremely slowly in the cold, dry mountain air. Their dense wood resists insects, fungi, and decay. To protect Methuselah from vandals, the Forest Service keeps its exact location secret.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"it,","B":"it—","C":"it","D":"it;"},"answer":"B","explanation":"Opening dash → closing dash.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q109","id":"s2-109"},{"number":165,"skill":"No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置","passage":"Dinosaurs dominated life on land for more than 150 million years. For a long time, they were imagined as slow, cold-blooded creatures similar to modern lizards. Scientists are still debating ______ dinosaurs were warm-blooded like birds or cold-blooded like reptiles. Evidence from bone growth rings suggests that many dinosaurs grew quickly, a trait associated with warm-bloodedness. Some researchers now argue that dinosaurs fell somewhere between the two categories.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"whether","B":": whether","C":", whether","D":"whether,"},"answer":"A","explanation":"No punctuation between the verb \"debating\" and its object clause \"whether…\".","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q119","id":"s2-119"},{"number":166,"skill":"Single dash ｜ 單一破折號","passage":"Coast redwoods grow only in a narrow strip along the Pacific coast of California and southern Oregon. They thrive in the region's frequent summer fog, which provides moisture. The tallest known living tree is one of these redwoods in ______ giant named Hyperion that stands about 116 meters tall. Its exact location is kept secret to protect it from damage. Officials have even banned visitors from the area after hikers trampled the surrounding soil.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"California. A","B":"California—a","C":"California a","D":"California; a"},"answer":"B","explanation":"A dash can introduce a phrase that renames/explains. A semicolon or period would leave \"a giant named Hyperion…\" as a fragment (no main verb).","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q124","id":"s2-124"},{"number":167,"skill":"Paired dashes ｜ 成對破折號","passage":"The kiwi—a flightless bird found only in New ______ lays one of the largest eggs relative to body size of any bird. A female kiwi's egg can weigh about a fifth of her body weight. Carrying it is a huge burden, and in the final days before laying, the female has little room left to eat. Kiwis are also unusual in having nostrils at the tip of their long bills. They use their keen sense of smell to find worms and insects in the soil at night.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Zealand—","B":"Zealand,","C":"Zealand;","D":"Zealand"},"answer":"A","explanation":"Opening dash → closing dash.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q133","id":"s2-133"},{"number":168,"skill":"Nonessential element: paired commas ｜ 非必要成分：成對逗號","passage":"The Mariana Trench, the deepest known part of Earth's ______ lies in the western Pacific Ocean, east of the Philippines. Its deepest point, called the Challenger Deep, is nearly 11,000 meters below the surface. If Mount Everest were placed there, its peak would still be about two kilometers underwater. Only a handful of people have ever visited the bottom. The first two, Jacques Piccard and Don Walsh, made the trip in 1960.","stem":"Which choice completes the text so that it conforms to th
