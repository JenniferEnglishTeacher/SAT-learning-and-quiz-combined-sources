e conventions of Standard English?","options":{"A":"oceans—","B":"oceans,","C":"oceans","D":"oceans;"},"answer":"B","explanation":"The appositive opened with a comma, so it must close with a comma (not a dash).","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q157","id":"s2-157"},{"number":169,"skill":"Paired dashes ｜ 成對破折號","passage":"Tardigrades—microscopic animals often called water ______ can survive conditions that would kill almost any other creature. When their environment dries out, they curl up and enter a state in which their metabolism nearly stops. In this state, they can withstand extreme cold and heat for short periods. In 2007, tardigrades survived ten days exposed to outer space. When water returns, they can revive and resume normal life.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"bears","B":"bears;","C":"bears,","D":"bears—"},"answer":"D","explanation":"Opening dash → closing dash.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q164","id":"s2-164"},{"number":170,"skill":"Essential element: no commas ｜ 必要成分：不加逗號","passage":"In the summer of 1816, a group of writers gathered at a villa near Lake Geneva in Switzerland. Stormy weather kept them indoors, so they challenged one another to write ghost stories. Mary Shelley, then just 18 years old, began a story that would become one of the most famous novels ever written. The novel ______ is often considered the first work of science fiction. It tells the story of a scientist who creates life and then abandons his creation.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":", Frankenstein","B":", Frankenstein,","C":"Frankenstein,","D":"Frankenstein"},"answer":"D","explanation":"The title identifies which novel (essential), so no commas. A single comma would also split subject and verb.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q168","id":"s2-168"},{"number":171,"skill":"No punctuation between subject–verb / verb–object / prep–object ｜ 禁止加標點的位置","passage":"The giant anteater of Central and South America has no teeth. Instead, it uses a sticky tongue up to 60 centimeters long to collect insects. Its diet consists almost entirely ______ ants and termites. An anteater can eat about 30,000 insects in a single day. To avoid destroying its food supply, it feeds at each nest for only a minute or so before moving on.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"of:","B":"of","C":": of","D":"of—"},"answer":"B","explanation":"No punctuation between a preposition (\"of\") and its object.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q174","id":"s2-174"},{"number":172,"skill":"Paired dashes ｜ 成對破折號","passage":"Glass frogs—so called because the skin on their bellies is ______ live in the rainforests of Central and South America. Through this see-through skin, an observer can watch the frog's heart beating. While sleeping, the frogs can hide most of their red blood cells in their livers, making their bodies even more transparent. This trick helps them avoid predators during the day. Scientists hope that studying it could lead to new treatments for blood clots.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"transparent—","B":"transparent;","C":"transparent,","D":"transparent"},"answer":"A","explanation":"Opening dash → closing dash.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q180","id":"s2-180"},{"number":173,"skill":"Nonessential element: paired commas ｜ 非必要成分：成對逗號","passage":"Before the 1960s, scientists widely believed that only humans made and used tools. Jane Goodall, who began studying wild chimpanzees in Tanzania in ______ challenged that belief. She watched chimpanzees strip leaves from twigs and use them to fish termites out of their mounds. Her discovery forced scientists to rethink what made humans unique. Goodall's research continued for decades and transformed how people understand animal behavior.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"1960,","B":"1960—","C":"1960;","D":"1960"},"answer":"A","explanation":"The nonessential \"who\" clause opened with a comma, so it must close with a comma before the verb \"challenged.\"","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q183","id":"s2-183"},{"number":174,"skill":"Single dash ｜ 單一破折號","passage":"During the colonial era, European powers established huge plantations in tropical regions. Workers on these plantations, many of them enslaved or forced laborers, grew crops for export to Europe. Sugar, cotton, rubber, and ______ crops shaped the economies of entire regions for centuries. In many former colonies, the effects can still be seen in patterns of land ownership. Some countries still depend heavily on exporting a single crop.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"coffee, these","B":"coffee—these","C":"coffee these","D":"coffee; and these"},"answer":"B","explanation":"A dash can separate an introductory list from the clause that sums it up (\"these crops\"). A comma creates a confusing run-on structure.","cat":"5. Colons, Commas & Dashes","catzh":"冒號、逗號與破折號","sub":"Commas & dashes (essential vs. nonessential)","src":"Set 2 · Q193","id":"s2-193"},{"number":175,"skill":"“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首","passage":"Monarch butterflies travel up to 4,800 kilometers each autumn to reach their wintering grounds in central Mexico. For decades, researchers assumed the insects relied mainly on the sun to find their way. The sun is an unreliable guide on cloudy ______ monarchs still manage to stay on course when skies are overcast. Later studies found that the butterflies can also sense Earth's magnetic field. This backup system may explain how the migration survives unpredictable autumn weather.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"days; however,","B":"days, however,","C":"days however,","D":"days; however"},"answer":"A","explanation":"Two independent clauses joined by \"however\" need a semicolon (or period) BEFORE it and a comma AFTER it. A comma alone = comma splice; no comma after \"however\" is also wrong.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q1","id":"s2-1"},{"number":176,"skill":"“, however;” — however ends clause 1 ｜ however 置於第一句句尾","passage":"Community gardens have spread rapidly through American cities over the past two decades. Supporters often describe them as a simple way to increase access to fresh produce. The gardens' nutritional impact is difficult to ______ their social effects are easier to document. Surveys show that gardeners report knowing more of their neighbors after a single growing season. For many city planners, that finding alone justifies the modest public investment the gardens require.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"measure, however,","B":"measure; however","C":"measure however;","D":"measure, however;"},"answer":"D","explanation":"Here \"however\" ends the first clause (contrasting it with the previous sentence), so it takes \", however;\" and the semicolon separates the two independent clauses. \", however,\" creates a comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q2","id":"s2-2"},{"number":177,"skill":"“, however,” — however interrupts one clause ｜ however 插入句中","passage":"Johann Sebastian Bach was admired in his lifetime mainly as an organist rather than as a composer. After his death in 1750, much of his music was rarely performed. The young composer ______ helped change that in 1829 when he conducted a revival of the St. Matthew Passion in Berlin. The performance drew large crowds and sparked new interest in Bach's work across Europe. Today, Bach is regarded as one of the greatest composers in Western history.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Felix Mendelssohn; however,","B":"Felix Mendelssohn, however","C":"Felix Mendelssohn however,","D":"Felix Mendelssohn, however,"},"answer":"D","explanation":"\"However\" interrupts a single clause (subject … verb), so it needs a PAIR of commas. A semicolon would cut the subject off from its verb.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q3","id":"s2-3"},{"number":178,"skill":"“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首","passage":"For much of the twentieth century, scientists believed that adult human brains could not grow new neurons. Brain cells, they thought, were formed only before birth and in early childhood. The idea seemed to match what doctors observed in patients with brain ______ studies in the 1990s found evidence that new neurons can form in the adult hippocampus, a region linked to memory. The extent of this process in humans is still debated. Even so, the discovery transformed how scientists think about learning and recovery.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"injuries. However,","B":"injuries however","C":"injuries, however,","D":"injuries. However"},"answer":"A","explanation":"A period before \"However\" and a comma after it correctly separates the two sentences. \", however,\" between two clauses is a comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q17","id":"s2-17"},{"number":179,"skill":"“, however,” — however interrupts one clause ｜ however 插入句中","passage":"In 2004, NASA's Spirit and Opportunity rovers landed on opposite sides of Mars. Each was designed to operate for about 90 Martian days. Engineers expected dust to gradually cover the rovers' solar panels and cut off their power. ______ continued exploring for nearly fifteen years. Wind gusts periodically cleaned its panels, allowing it to keep running until a planet-wide dust storm in 2018.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Opportunity however,","B":"Opportunity, however","C":"Opportunity; however,","D":"Opportunity, however,"},"answer":"D","explanation":"\"However\" sits between the subject (Opportunity) and the verb, so it needs commas on both sides. A semicolon would separate the subject from its verb.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q18","id":"s2-18"},{"number":180,"skill":"“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首","passage":"The Silk Road was not a single road but a network of trade routes linking China with the Mediterranean world. Silk was among the most famous goods carried along these routes. Merchants also traded spices, glass, horses, and ______ ideas and technologies may have been the network's most lasting cargo. Buddhism, for example, spread from India into China along these routes. Papermaking techniques later traveled west, reaching the Islamic world by the eighth century.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"paper, however,","B":"paper however,","C":"paper; however,","D":"paper; however"},"answer":"C","explanation":"Between two independent clauses, \"however\" needs a semicolon before and a comma after. A comma before it = comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q26","id":"s2-26"},{"number":181,"skill":"“, however,” — however interrupts one clause ｜ however 插入句中","passage":"Yellowstone National Park sits on top of one of the largest volcanic systems on Earth. The supervolcano has erupted massively three times over the past 2.1 million years. Scientists monitor the area constantly for signs of change; a major ______ is considered extremely unlikely in the near future. Most of the region's volcanic activity appears as geysers, hot springs, and mud pots. Old Faithful, the park's most famous geyser, erupts roughly every 60 to 110 minutes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"eruption, however,","B":"eruption however,","C":"eruption, however","D":"eruption; however,"},"answer":"A","explanation":"The semicolon already separates the clauses; inside the second clause, \"however\" interrupts subject and verb, so it needs a pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q28","id":"s2-28"},{"number":182,"skill":"“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首","passage":"Glass appears to be a solid, and in everyday life it behaves like one. A popular myth claims that glass is actually a slow-moving liquid. As evidence, people point to old church windows that are thicker at the bottom than at the ______ the uneven thickness was caused by the way old glass was made, not by centuries of slow flow. Glassmakers often installed the panes with the thicker edge at the bottom for stability. Calculations show that glass at room temperature would take far longer than the age of the universe to flow noticeably.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"top. However","B":"top. However,","C":"top, however,","D":"top however,"},"answer":"B","explanation":"Period before \"However,\" comma after it. \", however,\" between two independent clauses = comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q35","id":"s2-35"},{"number":183,"skill":"“, however;” — however ends clause 1 ｜ however 置於第一句句尾","passage":"Smartphones contain small amounts of gold, silver, and copper. Recovering these metals from discarded phones could reduce the need for new mining. Recycling rates for electronics remain ______ most old phones end up forgotten in drawers or thrown away with regular trash. Some companies now offer cash or store credit for used devices. Experts say that convenient drop-off programs are the most effective way to increase recycling.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"low, however,","B":"low; however","C":"low however;","D":"low, however;"},"answer":"D","explanation":"\"However\" ends the first clause (contrasting with the previous sentence) → \", however;\". The semicolon separates the two clauses.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q38","id":"s2-38"},{"number":184,"skill":"“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首","passage":"Venice, Italy, is built on more than 100 small islands in a shallow lagoon. Its buildings rest on millions of wooden piles driven into the mud centuries ago. The wood has survived because the oxygen-poor mud prevents decay. Over the centuries, though, the city has slowly sunk while sea levels have risen. In 2020, Venice began operating movable barriers to block high tides from the ______ the barriers are costly to raise, and critics worry that frequent closures could harm the lagoon's ecosystem.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Adriatic, however,","B":"Adriatic; however","C":"Adriatic. Though,","D":"Adriatic. However,"},"answer":"D","explanation":"Period + \"However,\" starts a new sentence correctly. \"Though,\" cannot start a sentence as an adverb; \", however,\" = comma splice; \"; however\" lacks the comma.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q46","id":"s2-46"},{"number":185,"skill":"“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首","passage":"The Great Pyramid of Giza was the tallest human-made structure in the world for nearly 4,000 years. It was long assumed that the pyramid was built by enslaved ______ archaeological evidence now suggests that it was built largely by paid laborers. Excavations near the site have uncovered workers' villages, bakeries, and cemeteries. Some workers were buried with bread and beer for the afterlife, an honor unlikely to be given to slaves. The workforce may have included farmers who served during the months when the Nile flooded their fields.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"people; however,","B":"people however,","C":"people, however,","D":"people; however"},"answer":"A","explanation":"\"However\" begins the second independent clause: semicolon before, comma after.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q51","id":"s2-51"},{"number":186,"skill":"“, however,” — however interrupts one clause ｜ however 插入句中","passage":"Most volcanoes form along the boundaries between tectonic plates. The Hawaiian ______ formed far from any plate boundary. Scientists believe they were created by a hot spot, a plume of hot mater ance were created about 17,000 years ago. Four teenagers discovered them in 1940. The cave was opened to the public in 1948 and soon attracted more than 1,000 visitors a day. The ______ brought warmth, moisture, and carbon dioxide that damaged the paintings. The cave was closed in 1963, and today visitors explore a detailed replica built nearby.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"crowds, however,","B":"crowds, however","C":"crowds however,","D":"crowds; however,"},"answer":"A","explanation":"\"However\" interrupts subject (\"The crowds\") and verb (\"brought\"): pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q173","id":"s2-173"},{"number":214,"skill":"“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首","passage":"Nearly all bananas sold in supermarkets today belong to a single variety called the Cavendish. Cavendish bananas are cheap to grow and easy to ______ their lack of genetic diversity makes them vulnerable to disease. Because they are seedless, new plants are grown from cuttings, so the plants are genetically almost identical. A fungal disease wiped out the previous dominant variety, the Gros Michel, in the mid-twentieth century. A new strain of the same disease is now spreading through Cavendish plantations.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"ship, however,","B":"ship however,","C":"ship; however,","D":"ship; however"},"answer":"C","explanation":"Semicolon before \"however,\" comma after it.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q176","id":"s2-176"},{"number":215,"skill":"“, however,” — however interrupts one clause ｜ however 插入句中","passage":"Gold is one of the least reactive metals. It does not rust or tarnish, which is why ancient gold jewelry still shines today. Pure gold ______ too soft for most everyday uses. Jewelers therefore mix it with other metals such as copper and silver. The purity of gold is measured in karats, with 24-karat gold being pure.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"is, however,","B":"is however,","C":"is, however","D":"is; however,"},"answer":"A","explanation":"\"However\" interrupts the verb and its complement within one clause: pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q181","id":"s2-181"},{"number":216,"skill":"“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首","passage":"Rapa Nui, also known as Easter Island, is famous for nearly 1,000 giant stone statues called moai. For decades, many writers claimed that the islanders destroyed their own society by cutting down all the trees to move the ______ recent research suggests a different story. Evidence indicates that the population remained relatively stable until European contact. Diseases and slave raids brought by outsiders in the 1800s caused the greatest devastation. Experiments have also shown that the statues could have been \"walked\" upright using ropes and a small team of people.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"statues. However,","B":"statues however,","C":"statues; however","D":"statues, however,"},"answer":"A","explanation":"Period + \"However,\" + new sentence.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q185","id":"s2-185"},{"number":217,"skill":"“, however;” — however ends clause 1 ｜ however 置於第一句句尾","passage":"Scientists can identify the regions where large earthquakes are most likely to occur. Predicting exactly when an earthquake will strike is still ______ the processes deep within faults are too complex to model precisely. Instead of prediction, some countries rely on early warning systems. These systems detect the first, faster-moving waves of an earthquake and send alerts seconds before the strongest shaking arrives. In Japan, such alerts automatically slow down high-speed trains.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"impossible; however","B":"impossible, however,","C":"impossible however;","D":"impossible, however;"},"answer":"D","explanation":"\"However\" closes the first clause → \", however;\".","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q190","id":"s2-190"},{"number":218,"skill":"“, however,” — however interrupts one clause ｜ however 插入句中","passage":"Saffron is made from the dried stigmas of the crocus flower. Each flower produces only three stigmas, which must be picked by hand. About 150,000 flowers are needed to produce a single kilogram of saffron. As a result, saffron is one of the most expensive spices in the world. Its high ______ has not stopped cooks around the world from using it in dishes such as Spanish paella and Persian rice.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"price, however","B":"price however,","C":"price; however,","D":"price, however,"},"answer":"D","explanation":"\"However\" interrupts subject (\"Its high price\") and verb (\"has not stopped\"): pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q192","id":"s2-192"},{"number":219,"skill":"“; however,” / “. However,” — however starts clause 2 ｜ however 置於第二句句首","passage":"In 1874, a group of young painters held their own exhibition in Paris after years of rejection by the official Salon. A critic mocked them as \"Impressionists,\" borrowing the word from a painting by Claude ______ the artists soon adopted the name themselves. The Impressionists often painted outdoors and tried to capture the changing effects of light. Their loose brushstrokes shocked many viewers at the time. Today, their paintings are among the most popular works in museums around the world.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Monet; however,","B":"Monet however,","C":"Monet, however,","D":"Monet; however"},"answer":"A","explanation":"Semicolon before \"however,\" comma after it.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q198","id":"s2-198"},{"number":220,"skill":"“, however,” — however interrupts one clause ｜ however 插入句中","passage":"Latin has had no native speakers for more than a thousand years. The ______ remains surprisingly alive in science, law, and medicine. Biologists use Latin names to classify every known species. Lawyers still use Latin phrases such as habeas corpus. Many English words, including \"audio\" and \"video,\" come directly from Latin verbs.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"language however,","B":"language; however,","C":"language, however,","D":"language, however"},"answer":"C","explanation":"\"However\" interrupts subject (\"The language\") and verb (\"remains\"): pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"however","src":"Set 2 · Q200","id":"s2-200"},{"number":221,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Octopuses are famous for solving puzzles in laboratory tanks, and some can even unscrew jar lids to reach food. In several ways, their intelligence resembles that of mammals such as dogs. The organization of that intelligence is very ______ about two-thirds of an octopus's neurons are located in its arms rather than in its brain. Each arm can taste, touch, and react to its surroundings with surprising independence. Researchers are still investigating how the brain and the arms coordinate their activity.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"different; though","B":"different though,","C":"different, though,","D":"different, though;"},"answer":"D","explanation":"\"Though\" here is an adverb meaning \"however\" that ends the first clause, so it works like \", however;\". \"; though + clause\" makes \"though\" a conjunction and leaves a fragment after the semicolon.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q4","id":"s2-4"},{"number":222,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Emily Dickinson wrote nearly 1,800 poems during her lifetime. Fewer than a dozen of them were published while she was alive, and most of those appeared without her name. Though she rarely left her family's home in Amherst, ______ she exchanged letters with dozens of friends, editors, and relatives. These letters reveal a sharp, witty writer deeply engaged with the ideas of her time. After her death in 1886, her sister Lavinia discovered the hidden poems and worked to have them published.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Massachusetts:","B":"Massachusetts,","C":"Massachusetts;","D":"Massachusetts."},"answer":"B","explanation":"\"Though\" is a subordinating conjunction here (= although). Dependent clause + COMMA + independent clause. A semicolon, period, or colon would leave the \"Though\" clause as a fragment.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q5","id":"s2-5"},{"number":223,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"The Maya city of Tikal once supported tens of thousands of residents. Its stone temples rise more than 60 meters above the surrounding rainforest. The city's population declined sharply in the ninth ______ archaeologists are still debating the causes. Some point to prolonged droughts, while others emphasize warfare and political instability. Most researchers now believe that several factors worked together.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"century though;","B":"century; though","C":"century, though;","D":"century, though,"},"answer":"C","explanation":"\"Though\" = however, ending the first clause: \", though;\". \"; though + clause\" turns \"though\" into a conjunction and leaves a fragment; \", though,\" is a comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q15","id":"s2-15"},{"number":224,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"The Leaning Tower of Pisa began tilting during its construction in the twelfth century. Builders had placed it on soft, unstable soil. Over the centuries, the lean grew so severe that engineers closed the tower to visitors in 1990. A decade of careful work removed soil from beneath the higher ______ though the tower still leans about four degrees today. Engineers estimate that it will remain stable for at least two hundred years.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"side,","B":"side;","C":"side:","D":"side."},"answer":"A","explanation":"\"Though\" here is a conjunction (= although) introducing a dependent clause after the main clause; a comma is correct. A semicolon, period, or colon leaves \"though the tower…\" as a fragment.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q19","id":"s2-19"},{"number":225,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Most people picture the Sahara as an endless sea of sand dunes. Dunes cover only about a quarter of the ______ of the rest consists of rocky plateaus, gravel plains, and mountains. The desert's highest peak, Emi Koussi in Chad, rises more than 3,400 meters. Thousands of years ago, the Sahara was much greener than it is today. Rock paintings show giraffes, cattle, and even swimmers in places that are now completely dry.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"desert, though. Much","B":"desert; though much","C":"desert though. Much","D":"desert, though, much"},"answer":"A","explanation":"\"Though\" (= however) can end a sentence after a comma: \", though.\" Then a new sentence begins. \", though, much\" is a comma splice; \"; though much…\" leaves a fragment.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q27","id":"s2-27"},{"number":226,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Electric cars produce no tailpipe emissions while they are being driven. Building their large ______ requires mining lithium, cobalt, and nickel, which can damage local environments. Researchers are developing batteries that use more common materials, such as sodium. Recycling old batteries could also reduce the need for new mining. Over its full lifetime, a typical electric car still produces fewer emissions than a comparable gasoline car.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"batteries, though","B":"batteries, though,","C":"batteries though,","D":"batteries; though,"},"answer":"B","explanation":"\"Though\" (= however) interrupts the subject and verb of one clause, so it needs a pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q40","id":"s2-40"},{"number":227,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"The violin was developed in northern Italy in the early 1500s. Instruments made by Antonio Stradivari around 1700 are among the most valuable in the world. Many musicians claim that a Stradivarius has an unmatched sound. Listeners in blind tests have struggled to tell the ______ in several studies, professional violinists actually preferred new instruments. Some researchers argue that a famous instrument's reputation shapes how listeners hear it.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"difference though","B":"difference, though,","C":"difference; though,","D":"difference, though;"},"answer":"D","explanation":"\"Though\" = however, ending the first clause → \", though;\". \", though,\" is a comma splice; no punctuation is a run-on.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q48","id":"s2-48"},{"number":228,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Sharks have existed for more than 400 million years, longer than trees have. They have survived several mass extinctions. Their ______ is far from certain. Each year, tens of millions of sharks are caught, many for their fins. Because most shark species grow slowly and produce few young, their populations recover very slowly from overfishing.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"future though,","B":"future, though,","C":"future; though,","D":"future, though"},"answer":"B","explanation":"\"Though\" (= however) interrupts the subject \"future\" and the verb \"is,\" so it needs commas on both sides.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q52","id":"s2-52"},{"number":229,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Goldfish are often said to have memories lasting only three seconds. The claim is repeated in jokes, cartoons, and even advertisements. It has no scientific ______ laboratory experiments, goldfish have learned to push levers for food and remembered the task for months. Some fish have even learned to respond to particular sounds at feeding time. Scientists now consider goldfish surprisingly capable learners.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"basis, though, in","B":"basis; though in","C":"basis, though. In","D":"basis though, in"},"answer":"C","explanation":"\"Though\" (= however) ends the sentence: \", though.\" A new sentence begins with \"In.\" \", though, in…\" is a comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q66","id":"s2-66"},{"number":230,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Antarctica is the coldest, windiest, and highest continent on average. Its ice sheet averages nearly two kilometers thick. Surprisingly, Antarctica is also the largest desert on ______ though it holds about 70 percent of the planet's fresh water. Most of the interior receives less than 50 millimeters of precipitation a year. The continent is classified as a desert because so little new snow falls there.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Earth:","B":"Earth,","C":"Earth.","D":"Earth;"},"answer":"B","explanation":"\"Though\" here is a conjunction (= although) introducing a dependent clause; join it with a comma. A period, semicolon, or colon creates a fragment.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q75","id":"s2-75"},{"number":231,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Desalination plants turn seawater into drinking water. The technology is especially important in dry countries such as Saudi Arabia and Israel. The process requires a great deal of energy; its leftover ______ may be the bigger environmental concern. Brine is about twice as salty as seawater and can form oxygen-poor layers on the sea floor. Engineers are testing ways to dilute the brine or extract useful minerals from it.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"brine though,","B":"brine, though,","C":"brine, though","D":"brine; though,"},"answer":"B","explanation":"The semicolon separates the clauses; inside the second clause, \"though\" (= however) interrupts subject and verb, so it needs a pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q78","id":"s2-78"},{"number":232,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"The Dutch tulip craze of the 1630s is often described as the first financial bubble. According to popular accounts, people sold houses to buy single tulip bulbs. Prices for rare bulbs did rise ______ historians have found little evidence that the crash ruined many people. Most buyers were wealthy merchants who could absorb their losses. Some historians argue that the story was exaggerated by moralists who disapproved of speculation.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"dramatically, though,","B":"dramatically; though","C":"dramatically though","D":"dramatically, though;"},"answer":"D","explanation":"\"Though\" (= however) ends the first clause → \", though;\". \"; though + clause\" leaves a fragment; \", though,\" = comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q90","id":"s2-90"},{"number":233,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Planting trees is often promoted as a simple way to fight climate change. Trees absorb carbon dioxide as they grow and store carbon in their wood. Planting the wrong trees in the wrong ______ can do more harm than good. In grasslands, for example, dense tree plantations can use up scarce water and crowd out native species. Many scientists argue that protecting existing forests is more effective than planting new ones.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"places, though","B":"places, though,","C":"places though,","D":"places; though,"},"answer":"B","explanation":"\"Though\" interrupts the subject (\"Planting…places\") and verb (\"can do\"): pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q99","id":"s2-99"},{"number":234,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Bananas contain potassium, a mineral the body needs. A tiny fraction of natural potassium is radioactive. As a result, bananas are very slightly radioactive. There is no need to give up ______ person would have to eat millions of bananas at once to receive a dangerous dose. The body also regulates its potassium levels, so eating more bananas does not cause radiation to build up.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"bananas, though. A","B":"bananas, though, a","C":"bananas; though a","D":"bananas though, a"},"answer":"A","explanation":"\", though.\" ends the sentence (though = however). \", though, a…\" is a comma splice; \"; though a…\" leaves a fragment.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q102","id":"s2-102"},{"number":235,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Pluto was discovered in 1930 by Clyde Tombaugh, a young astronomer working in Arizona. For decades, it was taught as the ninth planet in our solar system. The International Astronomical Union reclassified Pluto as a dwarf planet in ______ even though many people objected to the change. The decision followed the discovery of other icy objects of similar size beyond Neptune. To be considered a planet, an object must clear other material from its orbit, which Pluto has not done.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"2006,","B":"2006:","C":"2006;","D":"2006."},"answer":"A","explanation":"\"Even though\" introduces a dependent clause after the main clause; a comma is fine, but a semicolon, period, or colon leaves a fragment.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q106","id":"s2-106"},{"number":236,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"A cheetah can accelerate from 0 to about 95 kilometers per hour in roughly three seconds. Its flexible spine and long legs allow it to cover up to seven meters in a single stride. Though the cheetah is the fastest land ______ it can maintain its top speed for only about 20 to 30 seconds. After a chase, it must rest before eating, and larger predators sometimes steal its meal. For this reason, cheetahs often hunt during the day, when lions and hyenas are less active.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"animal;","B":"animal,","C":"animal; however,","D":"animal."},"answer":"B","explanation":"\"Though\" (conjunction) + dependent clause + COMMA + main clause. Adding \"however\" is redundant and creates an error.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q113","id":"s2-113"},{"number":237,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Titan is the largest of Saturn's many moons. It is even bigger than the planet Mercury. Though smaller than ______ Titan has an atmosphere that is denser than Earth's. Its surface contains lakes and seas, but they are filled with liquid methane and ethane rather than water. NASA plans to send a drone-like spacecraft called Dragonfly to explore Titan in the 2030s.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Mars,","B":"Mars—","C":"Mars.","D":"Mars;"},"answer":"A","explanation":"\"Though smaller than Mars\" is a shortened dependent clause; follow it with a comma before the main clause.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q118","id":"s2-118"},{"number":238,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Most adults need seven to nine hours of sleep each night. ______ need even more, about eight to ten hours. During adolescence, the body's internal clock shifts later, making it hard for teens to fall asleep early. Many high schools start classes before 8:00 a.m., forcing students to wake up before they are fully rested. Some school districts have moved start times later and reported improved attendance and grades.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Teenagers though,","B":"Teenagers; though,","C":"Teenagers, though","D":"Teenagers, though,"},"answer":"D","explanation":"\"Though\" (= however) interrupts subject and verb: pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q123","id":"s2-123"},{"number":239,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Robots have taken over many repetitive tasks in car factories and warehouses. They can weld, paint, and lift heavy parts with great precision. Folding laundry remains surprisingly difficult for ______ soft fabrics bend and change shape in unpredictable ways. A robot must recognize each item and plan a new sequence of movements for it. Several companies have built laundry-folding machines, but most have been too slow or expensive to succeed.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"them, though,","B":"them; though","C":"them, though;","D":"them though"},"answer":"C","explanation":"\"Though\" (= however) ends the first clause → \", though;\".","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q129","id":"s2-129"},{"number":240,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Koalas live in the eucalyptus forests of eastern Australia. Though it is often called a koala ______ koala is not a bear at all. It is a marsupial, meaning that its young develop in a pouch. Koalas eat almost nothing but eucalyptus leaves, which are low in nutrients and toxic to most animals. To save energy, they sleep for up to 20 hours a day.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"bear, however, the","B":"bear; however, the","C":"bear, the","D":"bear. The"},"answer":"C","explanation":"\"Though\" already signals contrast; the dependent clause needs only a comma. Adding \"however\" is redundant and ungrammatical.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q138","id":"s2-138"},{"number":241,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"The blue whale is the largest animal known to have ever lived. Though it can grow to about 30 meters long, it feeds almost entirely on krill, tiny shrimp-like animals. A single blue whale can eat several tons of krill a day. How such a huge animal finds enough food in the vast ocean was long a mystery. Recent ______ though, suggest that blue whales remember the locations of past feeding grounds.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"studies;","B":"studies,","C":"studies","D":"studies:"},"answer":"B","explanation":"Note the two uses: \"Though it can grow…,\" = conjunction; \"Recent studies, though, suggest\" = adverb interrupting subject and verb → needs commas on both sides.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q146","id":"s2-146"},{"number":242,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Polynesian navigators settled islands across a vast area of the Pacific Ocean, from Hawaii to New Zealand. They traveled in double-hulled canoes, guided by the stars, ocean swells, and the flight paths of birds. The sweet potato, which originated in South America, was being grown in Polynesia centuries before Europeans arrived. Genetic studies suggest that Polynesians and Native South Americans met around 1200 ______ exactly where and how they met remains uncertain. Some researchers think that South Americans may have sailed west instead.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"CE. Though","B":"CE: though","C":"CE; though","D":"CE—though"},"answer":"D","explanation":"\"Though\" here is a conjunction; a dash (or comma) can attach its clause. A semicolon, period, or colon leaves \"though…\" as a fragment.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q148","id":"s2-148"},{"number":243,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Mount Kilimanjaro in Tanzania is the tallest mountain in Africa. Although it lies just south of the equator, its summit has been capped with ice for thousands of years. That ice is disappearing ______ than 80 percent of the mountain's ice has vanished since 1912. Scientists estimate that the remaining glaciers could be gone within a few decades. Rising temperatures and drier air are both thought to play a role.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"quickly; though more","B":"quickly, though, more","C":"quickly, though. More","D":"quickly though, more"},"answer":"C","explanation":"\", though.\" ends a sentence (though = however); a new sentence follows. \", though, more\" = comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q152","id":"s2-152"},{"number":244,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Mercury orbits closer to the sun than any other planet. Its daytime temperatures can reach about 430°C. Nevertheless, Mercury is not the hottest ______ even though it is the closest to the sun. That title belongs to Venus, whose thick atmosphere traps heat. Because Mercury has almost no atmosphere, its nighttime temperatures plunge to about –180°C.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"planet;","B":"planet.","C":"planet,","D":"planet:"},"answer":"C","explanation":"\"Even though\" clause after the main clause: comma OK; a period, semicolon, or colon creates a fragment.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q158","id":"s2-158"},{"number":245,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"For decades, most scientists doubted that plants could communicate. In recent ______ studies have shown that some plants release chemicals that warn their neighbors of insect attacks. When caterpillars chew on certain plants, the plants release airborne chemicals. Nearby plants detect these signals and begin producing substances that make their leaves less tasty. Some researchers describe this as a kind of plant communication, though others prefer more cautious terms.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"years, though","B":"years; though,","C":"years though,","D":"years, though,"},"answer":"D","explanation":"\"Though\" (= however) follows the introductory phrase inside one clause: pair of commas. Compare the last sentence, where \", though others prefer…\" uses \"though\" as a conjunction.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q165","id":"s2-165"},{"number":246,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"The heart beats roughly 100,000 times each day. Though only about the size of a ______ it pumps around 7,000 liters of blood through the body daily. Blood travels through a network of vessels that would stretch about 100,000 kilometers if laid end to end. That is long enough to circle Earth more than twice. The heart's steady rhythm is controlled by electrical signals from a small cluster of cells called the sinoatrial node.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"fist;","B":"fist,","C":"fist—","D":"fist."},"answer":"B","explanation":"\"Though only about the size of a fist\" is a shortened dependent clause; follow it with a comma.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q171","id":"s2-171"},{"number":247,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Chili peppers get their heat from a compound called capsaicin. Eating a hot pepper can make the mouth feel as if it is on fire. No real damage occurs in most ______ simply triggers the same nerve receptors that respond to actual heat. Birds, which spread pepper seeds, lack these receptors. As a result, they can eat even the hottest peppers without discomfort.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"cases; though capsaicin","B":"cases though, capsaicin","C":"cases, though, capsaicin","D":"cases, though. Capsaicin"},"answer":"D","explanation":"\", though.\" ends the sentence; a new sentence begins. \", though, capsaicin…\" = comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q177","id":"s2-177"},{"number":248,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"A desert is defined by how little precipitation it receives, not by its temperature. Many people picture deserts as places of burning sand and blazing sun. Though many deserts are ______ some, like the Gobi Desert in Asia, are bitterly cold in winter. Temperatures in the Gobi can drop below –40°C. Snow sometimes covers its dunes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"hot;","B":"hot—","C":"hot,","D":"hot."},"answer":"C","explanation":"\"Though\" (conjunction) clause + comma + main clause.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q186","id":"s2-186"},{"number":249,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"On a clear night, most stars appear white to the naked eye. Viewed through a ______ stars display a range of colors from deep red to bright blue. A star's color reveals its surface temperature. Red stars are the coolest, while blue stars are the hottest. Our sun, a yellowish star, falls somewhere in the middle.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"telescope, however, though,","B":"telescope, though,","C":"telescope though","D":"telescope; though,"},"answer":"B","explanation":"\"Though\" (= however) follows the introductory phrase and needs commas on both sides. Never use \"however\" and \"though\" together.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q194","id":"s2-194"},{"number":250,"skill":"though: adverb (= however) vs. conjunction (= although) ｜ though 副詞 vs. 連接詞","passage":"Penguins are usually associated with ice and snow. In fact, many penguin species live in temperate climates in South America, Africa, Australia, and New Zealand. Penguins are found almost entirely in the Southern ______ though one species, the Galápagos penguin, lives near the equator. Cool ocean currents bring cold, nutrient-rich water to the Galápagos Islands, allowing the penguins to survive there. No penguins live naturally in the Arctic.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Hemisphere:","B":"Hemisphere,","C":"Hemisphere;","D":"Hemisphere."},"answer":"B","explanation":"\"Though\" (conjunction) clause after the main clause: comma. Other marks create a fragment.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"though","src":"Set 2 · Q199","id":"s2-199"},{"number":251,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Many deserts receive less than 25 centimeters of rain a year. Plants in these environments must store water whenever it becomes available. The saguaro cactus has pleated stems that can expand like an accordion after a ______ a single large saguaro can absorb hundreds of liters of water in a day. This stored water allows the cactus to survive months of drought. Its waxy skin and spines further reduce water loss.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"storm; in fact,","B":"storm; in fact","C":"storm, in fact,","D":"storm in fact,"},"answer":"A","explanation":"\"In fact\" is a transition that begins the second independent clause: semicolon before, comma after. A comma before it creates a comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q14","id":"s2-14"},{"number":252,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Penguins cannot fly, but they are superb swimmers. Their wings have evolved into stiff flippers that propel them through the water. Their bones are also denser than those of flying ______ the birds can dive deep without struggling against buoyancy. Emperor penguins have been recorded diving more than 500 meters below the surface. Some of their dives last over twenty minutes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"birds, therefore,","B":"birds; therefore,","C":"birds; therefore","D":"birds therefore"},"answer":"B","explanation":"\"Therefore\" begins a new independent clause: semicolon before, comma after. \", therefore,\" between clauses is a comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q24","id":"s2-24"},{"number":253,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Many animals use tools, a behavior once thought to be uniquely human. Chimpanzees strip leaves from twigs and use them to fish termites from their mounds. Birds can be skilled tool users as ______ New Caledonian crows shape twigs into hooked tools to pull insects out of tree bark. Some sea otters use rocks to crack open shellfish while floating on their backs. These examples suggest that tool use has evolved independently many times.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"well; for example,","B":"well; for example","C":"well for example,","D":"well, for example,"},"answer":"A","explanation":"\"For example\" introduces a new independent clause: semicolon before, comma after.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q37","id":"s2-37"},{"number":254,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"The kakapo is a large, flightless parrot found only in New Zealand. Introduced predators such as cats and stoats nearly drove it to extinction. By 1995, only about 50 birds remained. The kakapo breeds slowly, and many of its eggs are ______ conservationists have steadily increased its population by moving the birds to predator-free islands. Today, more than 200 kakapo are alive.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"infertile; nevertheless,","B":"infertile, nevertheless,","C":"infertile nevertheless","D":"infertile; nevertheless"},"answer":"A","explanation":"\"Nevertheless\" (like \"however\") begins a new independent clause: semicolon before, comma after.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q50","id":"s2-50"},{"number":255,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Vampire bats are the only mammals that feed entirely on blood. They live in Central and South America and usually feed on cattle, horses, and birds. Despite their reputation, vampire bats do not suck ______ they make a small cut with their sharp teeth and lap up the blood with their tongues. Their saliva contains a substance that keeps blood from clotting. Scientists have studied this substance, called draculin, as a possible medicine for stroke patients.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"blood; instead,","B":"blood instead,","C":"blood; instead","D":"blood, instead,"},"answer":"A","explanation":"\"Instead\" begins a new independent clause: semicolon before, comma after.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q60","id":"s2-60"},{"number":256,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Coffee plants grow best in a narrow range of temperatures. Rising global temperatures are making some traditional growing regions too ______ farmers in some countries are moving their coffee fields to higher, cooler elevations. Arabica coffee, which accounts for most of the world's production, is especially sensitive to heat. Researchers are also studying wild coffee species that may tolerate warmer conditions. One such species, Coffea stenophylla, was rediscovered in the wild in Sierra Leone in 2018.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"hot consequently,","B":"hot, consequently,","C":"hot; consequently,","D":"hot; consequently"},"answer":"C","explanation":"\"Consequently\" begins a new independent clause: semicolon before, comma after.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q86","id":"s2-86"},{"number":257,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Walking is one of the simplest forms of exercise. It requires no special equipment, and most people can do it almost ______ studies link regular walking to lower rates of heart disease, diabetes, and depression. Even short walks after meals can help control blood sugar. Some researchers recommend aiming for about 7,000 to 10,000 steps a day. Walking with friends can add social benefits as well.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"anywhere; moreover,","B":"anywhere, moreover,","C":"anywhere; moreover","D":"anywhere moreover,"},"answer":"A","explanation":"\"Moreover\" starts a new independent clause: semicolon before, comma after.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q112","id":"s2-112"},{"number":258,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Many common words in English come from other languages. The word ______ probably comes from a Hokkien Chinese word for a fermented fish sauce. Similarly, the word shampoo comes from Hindi, and the word robot comes from Czech. English has borrowed so freely that only a minority of its words come directly from Old English. These borrowed words reflect centuries of trade, conquest, and cultural exchange.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"ketchup for example,","B":"ketchup, for example,","C":"ketchup, for example","D":"ketchup; for example,"},"answer":"B","explanation":"\"For example\" interrupts subject and verb: pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q132","id":"s2-132"},{"number":259,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Bamboo is technically a grass, not a tree. Some species can grow nearly a meter in a single ______ bamboo can be harvested far more often than timber from trees. Builders in Asia have used bamboo for scaffolding for centuries. The material is lightweight but has a tensile strength comparable to that of some steels. Bamboo is now being promoted as a sustainable building material.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"day as a result","B":"day, as a result,","C":"day. As a result,","D":"day, as a result"},"answer":"C","explanation":"Period + \"As a result,\" starts a new sentence. A comma before it creates a comma splice.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q140","id":"s2-140"},{"number":260,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Butterflies and moths belong to the same group of insects. Butterflies usually fly during the day and often have brightly colored wings. Most ______ are active at night and tend to have duller colors that help them hide. Their antennae also differ: butterfly antennae end in small clubs, while moth antennae are often feathery. There are exceptions, however, and some moths are as colorful as any butterfly.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"moths, in contrast,","B":"moths; in contrast,","C":"moths in contrast,","D":"moths, in contrast"},"answer":"A","explanation":"\"In contrast\" interrupts subject and verb: pair of commas.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q149","id":"s2-149"},{"number":261,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"A popular story claims that educated Europeans in the 1400s believed the Earth was flat. In fact, scholars had known that the Earth was round since ancient Greek times. The experts who doubted Christopher Columbus's plan did not think the Earth was ______ they believed he had greatly underestimated the distance from Europe to Asia. They were right. Columbus survived only because the Americas lay between Europe and Asia.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"flat, instead,","B":"flat; instead","C":"flat; instead,","D":"flat instead,"},"answer":"C","explanation":"\"Instead\" begins the second clause: semicolon before, comma after.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q150","id":"s2-150"},{"number":262,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"In the 1960s, the United States and the Soviet Union raced to land people on the Moon. The Soviet Union achieved many early firsts, including the first satellite and the first human in ______ the United States invested heavily in the Apollo program. In July 1969, Apollo 11 astronauts Neil Armstrong and Buzz Aldrin became the first people to walk on the Moon. In total, twelve astronauts walked on the lunar surface between 1969 and 1972. No one has returned since the final Apollo mission.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"orbit, meanwhile,","B":"orbit; meanwhile","C":"orbit; meanwhile,","D":"orbit meanwhile,"},"answer":"C","explanation":"\"Meanwhile\" begins the second clause: semicolon before, comma after.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q162","id":"s2-162"},{"number":263,"skill":"Other transition adverbs (therefore, instead…) ｜ 其他連接副詞","passage":"Beavers are sometimes called ecosystem engineers. Using branches, mud, and stones, they build dams across streams. These dams slow the flow of ______ they help reduce flooding and erosion downstream. The ponds that form behind the dams provide habitats for fish, frogs, birds, and insects. In some regions, conservationists have reintroduced beavers to help restore damaged wetlands.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"water; thus,","B":"water, thus,","C":"water thus","D":"water; thus"},"answer":"A","explanation":"\"Thus\" begins the second independent clause: semicolon before, comma after.","cat":"6. Punctuating Transition Words","catzh":"轉折副詞的標點","sub":"Other transition adverbs (therefore, instead…)","src":"Set 2 · Q188","id":"s2-188"},{"number":264,"skill":"Contrast","passage":"Within hours of hatching, the chicks of megapodes, a family of ground-dwelling birds, can run, feed themselves, and even fly. The chicks of most songbirds, _______ emerge blind and featherless and must be fed by their parents for weeks. This difference in development reflects a trade-off: megapode eggs are unusually large and rich in yolk, allowing the embryo to mature fully before it hatches.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in other words,","B":"by contrast,","C":"accordingly,","D":"for instance,"},"answer":"B","explanation":"Songbird chicks are helpless, the opposite of the independent megapode chicks; the next sentence even names “this difference.” “By contrast” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q80","id":"s1-80"},{"number":265,"skill":"Contrast / concession","passage":"In 1845, Frederick Douglass was enjoying what must have seemed like an extraordinary reception in Great Britain and Ireland. He was lecturing to enthusiastic crowds and, for the first time in his life, moving about without fear of being captured and returned to slavery. _______ Douglass was determined to go back to the United States; only there, he felt, could he work effectively for abolition.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Indeed,","B":"Still,","C":"Furthermore,","D":"Therefore,"},"answer":"B","explanation":"Despite the ideal circumstances just described, Douglass wanted to leave. “Still” signals this concession/contrast.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q81","id":"s1-81"},{"number":266,"skill":"Contrast / exception","passage":"Before a performance, American pianist Keith Jarrett typically insists on a carefully selected concert grand piano. _______ for a 1975 concert in Cologne, Germany, he agreed to play an undersized, poorly tuned instrument with malfunctioning pedals; forced to avoid the piano’s weakest registers, he produced an improvisation whose recording became one of the best-selling solo piano albums in history.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Nevertheless,","B":"Likewise,","C":"Moreover,","D":"Thus,"},"answer":"A","explanation":"The Cologne concert is an exception to Jarrett’s usual practice (“typically insists”), so a contrast transition is needed: “Nevertheless.”","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q82","id":"s1-82"},{"number":267,"skill":"Contrast","passage":"For decades, textbooks identified the Nile, at roughly 6,650 kilometers, as the longest river on Earth. _______ according to a 2007 expedition by Brazilian scientists who traced the Amazon to a more distant source in southern Peru, the Amazon is slightly longer, extending about 6,800 kilometers.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Consequently,","B":"Moreover,","C":"However,","D":"Secondly,"},"answer":"C","explanation":"The 2007 claim contradicts the long-accepted view stated in the first sentence, so “However” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q83","id":"s1-83"},{"number":268,"skill":"Contrast / concession","passage":"Scholars agree that Thomas Edison was overstating his role when he presented himself as the sole inventor of the incandescent light bulb. Few would dispute, _______ that Edison’s systematic testing of thousands of filament materials helped make electric lighting commercially practical.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"though,","B":"therefore,","C":"in other words,","D":"in the second place,"},"answer":"A","explanation":"The second sentence concedes a point in Edison’s favor after the first sentence criticized him. “Though” signals this contrast.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q84","id":"s1-84"},{"number":269,"skill":"Contrast (opposite case)","passage":"According to Bergmann’s rule, populations of warm-blooded animals living in cold climates tend to have larger bodies, which lose heat more slowly relative to their volume. _______ populations of the same or closely related species living in warm climates tend to be smaller, a build that allows excess body heat to escape more readily.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Subsequently,","B":"Conversely,","C":"In other words,","D":"For instance,"},"answer":"B","explanation":"The second sentence presents the opposite situation (warm climates → smaller bodies), so “Conversely” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q85","id":"s1-85"},{"number":270,"skill":"Contrast","passage":"In his classic studies of tide pools on the coast of Washington State, ecologist Robert Paine observed that mussels crowded the rocks in the middle of the intertidal zone. In the lowest part of the zone, _______ sea stars that prey on mussels kept the rocks nearly clear of them.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in other words,","B":"in summary,","C":"on the other hand,","D":"for instance,"},"answer":"C","explanation":"The lowest part of the zone (few mussels) differs from the middle of the zone (crowded with mussels), so the contrast transition “on the other hand” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q86","id":"s1-86"},{"number":271,"skill":"Contrast (rarely → more often)","passage":"Structures that carry water across valleys on rows of arches are known as aqueducts, from the Latin for “water conduit.” Although such elevated arcades are the most famous feature of ancient Rome’s water system, Roman engineers rarely built them when an alternative existed. _______ the water traveled through underground channels, which were cheaper to construct and easier to protect.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Additionally,","B":"Nonetheless,","C":"On the other hand,","D":"More often,"},"answer":"D","explanation":"“Rarely” in the previous sentence sets up a comparison of frequency: arcades were rare; underground channels were the usual solution. “More often” completes this contrast.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q87","id":"s1-87"},{"number":272,"skill":"Contrast / correction","passage":"Upon first seeing the ceiling of the church of Sant’Ignazio in Rome, a visitor might assume that a soaring dome rises above the crossing. _______ by skillfully applying the rules of perspective to a flat canvas, the painter Andrea Pozzo produced only the appearance of a dome.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Additionally,","B":"As a result,","C":"Next,","D":"On the contrary,"},"answer":"D","explanation":"The second sentence corrects the false assumption in the first (there is no real dome), so “On the contrary” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q88","id":"s1-88"},{"number":273,"skill":"Contrast","passage":"When a Venus flytrap’s sensitive trigger hairs are touched twice in quick succession, the plant sends an electrical signal that causes its leaf lobes to snap shut around an insect, beginning the process of digestion. _______ when a hair is touched only once, as by a falling raindrop, the trap remains open.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"By contrast,","B":"In conclusion,","C":"Specifically,","D":"For instance,"},"answer":"A","explanation":"The second sentence describes the opposite situation (one touch → trap stays open), so “By contrast” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Contrast / Concession","src":"Set 1 · Q89","id":"s1-89"},{"number":274,"skill":"Cause and effect","passage":"The feathers of a barn owl’s wings have comb-like serrations along their leading edges and soft fringes along their trailing edges. These structures break up the air flowing over the wing into smaller, quieter currents. _______ barn owls are able to approach their prey in near silence.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"However,","B":"As a result,","C":"For instance,","D":"Similarly,"},"answer":"B","explanation":"Silent flight is the consequence of the feather structures described in the previous sentences, so the cause-and-effect transition “As a result” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Cause & Effect / Conclusion","src":"Set 1 · Q90","id":"s1-90"},{"number":275,"skill":"Cause and effect / conclusion","passage":"Flight muscles are among the most energetically expensive tissues a bird maintains, and the benefits of flight depend largely on the need to escape predators. _______ from an evolutionary standpoint, birds on islands that lack ground-dwelling predators should invest less in these muscles. Island species such as the kakapo, a flightless parrot of New Zealand, offer a chance to examine this prediction.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Nevertheless,","B":"Subsequently,","C":"Besides,","D":"Thus,"},"answer":"D","explanation":"The second sentence is a logical conclusion drawn from the first (costly muscles + no predators → less investment); the passage even calls it a “prediction.” “Thus” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Cause & Effect / Conclusion","src":"Set 1 · Q91","id":"s1-91"},{"number":276,"skill":"Cause and effect / conclusion","passage":"In the 1950s, experimental archaeologists in Denmark felled trees using replicas of 5,000-year-old polished flint axes. When they tested the tools, they found that three people could clear about 500 square meters of forest in four hours. _______ the researchers, aware that pollen records showed a sudden decline of forests in the region at the time such axes appeared, concluded that early farmers could have cleared the land themselves with stone tools.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Therefore,","B":"Alternately,","C":"Likewise,","D":"Nevertheless,"},"answer":"A","explanation":"The researchers’ conclusion follows from what they observed in the experiment, so “Therefore” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Cause & Effect / Conclusion","src":"Set 1 · Q92","id":"s1-92"},{"number":277,"skill":"Cause and effect","passage":"Japanese craftspeople developed a repair technique known as kintsugi, in which a broken ceramic vessel is mended with lacquer mixed with powdered gold. This technique involves highlighting each crack rather than hiding it. _______ the repaired vessel displays a network of gleaming seams that record its history.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Previously,","B":"On the contrary,","C":"As a result,","D":"For example,"},"answer":"C","explanation":"The gleaming seams are the result of the technique described in the previous sentence, so “As a result” is logical.","cat":"7. Transitions: Logical Connectors","catzh":"轉折語：邏輯關係","sub":"Cause & Effect / Conclusion","src":"Set 1 · Q93","id":"s1-93"},{"number":278,"skill":"Cause and effect","passage":"Bats take to the air at dusk
