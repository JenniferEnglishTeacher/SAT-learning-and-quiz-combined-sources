<script>
const QUESTIONS=[{"number":1,"text":"During World War II, hundreds of scientists, including many prominent physicists such as Robert Oppenheimer, _______ the Manhattan Project, pooling their efforts and expertise in order to develop the first bombs that successfully exploited the tremendous power of nuclear energy.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"collaborated on","B":"invested with","C":"plotted against","D":"learned from"},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":2,"text":"Advising farmers on how to prevent the disruption of soil due to plowing, experts in agriculture have recommended the method of no-till farming. This _______ allows for soil to remain settled while seeds are planted, unlike traditional practices in which the soil is disturbed in order for new crops to be grown, thus making sowing easier to manage. Through no-till farming, agriculturalists are able to grow new batches with very little labor or equipment required.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"intention","B":"agenda","C":"distraction","D":"technique"},"answer":"A","module":2,"imageUrl":"","emphasis":""},{"number":3,"text":"Ethologists and beekeepers use the phrase “waggle dance” to describe the movement a bee makes in order to communicate with other bees in the colony about the location of resources. This silent _______ of information among the bees allows them to pass on knowledge of how close or far away a source is and what direction it is in. The source being broadcasted can be a site for possible nesting or an opportunity for sustenance.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"transmission","B":"confidence","C":"prolongation","D":"devastation"},"answer":"B","module":2,"imageUrl":"","emphasis":""},{"number":4,"text":"Chronic hepatitis B (CHB) can _______ affect Asian Americans and Pacific Islanders (AAPIs), who are not affected by most other major hepatitis strains. While everyone should be screened for hepatitis viruses, AAPIs are strongly encouraged to get tested and treated for chronic hepatitis B.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"disproportionately","B":"exclusively","C":"essentially","D":"initially"},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":5,"text":"There are countless stories of people whose hair turns white overnight from fright in a condition called canities subita, also known as Marie Antoinette syndrome. Scientists _______ this as historical fiction and explain that visible hair is dead material that can be changed by undergoing a chemical drying process, but not by experiencing a great shock.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"trivialize","B":"illustrate","C":"dismiss","D":"promote"},"answer":"A","module":2,"imageUrl":"","emphasis":""},{"number":6,"text":"The following text is adapted from Honoré de Balzac’s 1829 novel The Chouans. Marie, an aristocrat, is tidying a room and speaking to Francine, her maid.\nShe began to arrange the silk and muslin curtains which draped the window, making them intercept the light and produce in the room a voluptuous chiaroscuro.\n“Francine,” she said, “take away those knick-knacks on the mantelpiece; leave only the clock and the two Dresden vases. I’ll fill those vases myself with the flowers Corentin brought me. Take out the chairs, I want only this sofa and a fauteuil. Then sweep the carpet, so as to bring out the colors, and put wax candles in the sconces and on the mantel.”\nAs used in the text, what does the phrase “bring out” most nearly mean?","options":{"A":"Distribute","B":"Transport","C":"Introduce","D":"Emphasize"},"answer":"A","module":2,"imageUrl":"","emphasis":""},{"number":7,"text":"The following text is adapted from Jane Austen’s 1811 novel Sense and Sensibility. Elinor Dashwood is in her cottage speaking with her Uncle Edward and her younger sister Marianne.\n“I have frequently detected myself in such kind of mistakes,” said Elinor, “in a total misapprehension of character in some point or other: fancying people so much more gay or grave, or ingenious or stupid than they really are, and I can hardly tell why or in what the deception originated. Sometimes one is guided by what they say of themselves, and very frequently by what other people say of them, without giving oneself time to deliberate and judge.”\nWhich choice best describes the overall structure of the text?","options":{"A":"The speaker describes how someone can be deceived by the impressions of others and then promises to be more careful in the future.","B":"The speaker relates her misgivings of the character of another individual and then rationalizes her mistaken perception.","C":"The speaker considers the duplicity of human nature and then issues a warning about the misconceptions of personal opinion.","D":"The speaker describes a type of error and then reveals the sources of information that lead to such errors."},"answer":"B","module":2,"imageUrl":"","emphasis":""},{"number":8,"text":"In order to combat the effects of human life on the planet’s climate, many environmental and governmental establishments lay the foundation for forests in localities that previously did not have woodland areas, also known as afforestation. To begin the operation, potential sites are first surveyed in order to select regions with the best factors in terms of aspects such as vegetation, amount of human activity, weather, and soil quality. Once a site has been selected, the land must then be developed for planting. After the land has been prepared, trees can be planted with different methods of seeding, depending on the site and soil present.\nWhich choice best describes the overall structure of the text?","options":{"A":"It presents a solution to a widespread issue, then elaborates on why the issue should be solved.","B":"It defines a strategy, then lists the reasons why the strategy is useful.","C":"It examines an effective practice, then argues that the practice has negative consequences.","D":"It introduces a process, then explains the steps taken in executing that process."},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":9,"text":"Text 1\nA recent series of psychological studies that included subjects from different parts of the world looked at the effects that nostalgia, the feeling and experience of thinking about one’s own past, has on psychological well-being. The results of the studies demonstrated a relationship between nostalgia and authenticity, one’s sense of being aligned with one’s true self. A greater sense of authenticity was found to correlate with greater measurements of all aspects of psychological well-being.\nText 2\nWhile there has been some demonstration that nostalgia is associated with mental health benefits, it is important to remember that there are different types of nostalgia and that some can be highly destructive. A recent study performed by psychologists David B. Newman, Arthur A. Stone, and Norbert Schwarz found that conscious acts of extreme nostalgia have positive effects, while smaller and momentary, more unconscious nostalgic experiences can result in negative mental health effects, such as neuroticism.\nBased on the texts, what would Newman, Stone, and Schwarz (Text 2) say about the results of the studies discussed in Text 1?","options":{"A":"They are completely consistent with the results of other studies on the subject.","B":"They are from studies that fail to differentiate between different types of nostalgia and so provide an incomplete picture of nostalgia’s impact on mental health.","C":"They provide empirical evidence for a hypothesis long untested but assumed to be true.","D":"They suggest a possible new direction for future research but provide no definitive resolutions."},"answer":"C","module":2,"imageUrl":"","emphasis":""},{"number":10,"text":"The packaging of many fruit drinks contains health-related claims and imagery that can sometimes be misleading to parents who purchase such drinks for their children. To assess the impact of the front of packaging on consumers’ purchasing decisions, nutrition researchers Aviva A. Musicus, Christina A. Roberto, and Alyssa J. Moran conducted a study wherein participants were shown fruit drinks with high amounts of sugar added with seven different conditions of packaging: with claim and imagery (control), no claim, no imagery, no claim or imagery, disclosure of percentage of juice, a warning, and disclosure of amount of added sugar in teaspoons.\nAt the end of the study, the researchers concluded that the presence of warnings and absence of claims and imagery may reduce likelihood of purchase, whereas disclosure of percentage of juice may have very little impact.\nWhich choice most effectively uses data from the graph to support the researchers’ conclusion?","options":{"A":"The percentage of participants who selected the high-added sugar fruit drink was highest when a warning was placed on the front of the packaging.","B":"The percentage of participants who selected the high-added sugar fruit drink when the percentage of juice was disclosed on the front of the packaging was comparable to the percentage who selected the drink in the control group.","C":"The absence of the claim had the same impact as did the absence of imagery from the front of the packaging.","D":"When the front of packaging disclosed the amount of added sugar in teaspoons, participants were more likely to select a low-added sugar fruit drink than a high-added sugar fruit drink."},"answer":"B","module":2,"imageUrl":"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcpY_uDw0BEAKXeGvzYr2dEPItyWRJXPSkw1EpOcyed9BKSzKrtC9J9ERktEVRNsAEgFZslv_09LhmyA5DI7Jfs9WiHbi25BHYMD4ifE3eG45k6x16JEFDj33EEI-M1Hf9t6QmKMnLpfEL-m1ah6CDt37EWug=s2048?key=n868hl1b-xQjI09F38pAOw","emphasis":""},{"number":11,"text":"“The Emerald Eyes” is an 1861 short story by Gustavo Adolfo Bécquer, originally written in Spanish. In the story, the protagonist, Fernando, is continually drawn to a Poplar fountain in an attempt to learn the identity of a mysterious woman with emerald eyes. Fernando’s friend Iñigo is worried and tries to warn him to stay away from the fountain when he says, _______\nWhich quotation from a translation of the “The Emerald Eyes” most effectively illustrates the claim?","options":{"A":"“Do you not see that [the stag] is going toward the fountain of the Poplars, and if he lives to reach it we must give him up for lost?”","B":"“I exposed myself to death under his horse’s hoofs to hold him back.”","C":"“You do not go to the mountains now preceded by the clamorous pack of hounds, nor does the blare of your horns awake the echoes.”","D":"“I conjure you by that which you love most on earth not to return to the fountain of the Poplars.”"},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":12,"text":"Anthony Doerr won a Pulitzer Prize, among other literary awards, for his work in fiction novels, and his short stories have been anthologized in collections of American literature. In an essay about Doerr’s works, a student claims that Doerr uses children as his protagonists in order to create a story from an unbiased and hopeful perspective of humanity.\nWhich quotation from a literary critic best supports the student’s claim?","options":{"A":"“Doerr’s novels are influenced by the themes present in fables, thus presenting an ordeal through which the protagonist learns a lesson about life.”","B":"“Doerr prefers to have the protagonist’s story told through the eyes of a child who seeks to learn more about the world.”","C":"“Doerr’s novels often contain multiple story arcs or perspectives culminating in a universal truth.”","D":"“Doerr’s protagonists are often children who see the world with an open mind and contribute towards the betterment of humanity.”"},"answer":"B","module":2,"imageUrl":"","emphasis":""},{"number":13,"text":"Social exclusion can have a detrimental impact on an individual’s mental and emotional state. Psychologists Melissa Jauch, Selma Carolin Rudert, and Rainer Greifeneder hypothesized that individuals would experience equivalent effects of social exclusion regardless of whether the source of exclusion was human or computer. The researchers conducted a study in which subjects played a word riddle game. The subjects were grouped with other players who were computer-generated, though some subjects were told that they were playing with other humans. Throughout the game, the other players would either include the subjects or exclude them from participating. After the game, researchers measured the subjects’ need satisfaction (a psychological metric of the degree to which an individual’s basic needs are met) and mood on a scale of 1 to 9 immediately after the game (the reflexive stage) as well as after some time had passed (the reflective stage).\nWhich choice most effectively uses data from the table to support the researchers’ hypothesis?","options":{"A":"At the reflexive stage, subjects’ ratings in both mood and need satisfaction when excluded by a human were comparable to the corresponding ratings when excluded by a computer.","B":"Subjects reported higher mood and need satisfaction ratings when included than they did when excluded.","C":"When included by a human or a computer, subjects exhibited lower need satisfaction at the reflective stage than they did at the reflexive stage.","D":"Subjects experienced the highest mood rating when they believed they were socially included by a human."},"answer":"A","module":2,"imageUrl":"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcCchp7KAiH9dddboviAlOxTYHWHB9DdJqi6zY1hKz1FLKVfTeEpcLA_bxiA286S2gtjV8dt--QYusM3CinZZ_3wp2iKBmBgQ-vuC-XJX1VffWnwnnUTo4GqbV8HaMWPZVezwKIpYyLiUefvV2PjI_kf-Uk7g=s2048?key=n868hl1b-xQjI09F38pAOw","emphasis":""},{"number":14,"text":"It is commonly accepted that the Cretaceous–Paleogene extinction event some 66 million years ago was caused by an asteroid impact, believed to correspond to an impact crater in Chicxulub, Mexico, that dates to the same time and is the second-largest impact structure on Earth. Geologist Uisdean Nicholson discovered an undersea impact crater while reviewing seismic survey data and conducted a study that demonstrated that this crater also formed around 66 million years ago. Nicholson claims that the rock whose impact caused the formation of the undersea crater could have broken off from a parent asteroid that also caused the Chicxulub impact.\nWhich finding, if true, would most directly support Nicholson’s claim?","options":{"A":"The undersea impact would have caused major earthquakes and tsunamis, leading to significant damage to the planet.","B":"Some evidence points to a gradual Cretaceous–Paleogene extinction rather than a sudden one caused by an asteroid.","C":"Many species of marine animals, in addition to land animals, went extinct during the Cretaceous–Paleogene extinction.","D":"The undersea impact crater contains some of the same minerals not normally found on Earth that were also found at the Chicxulub impact site."},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":15,"text":"In a study of neuronal sleeping patterns, researchers tracked the electrical waves (using EEG) and blood flow patterns (using fMRI) in participants while they slept. Researchers hypothesized that a correlation between electrical wave activity and blood flow patterns could indicate which regions of the brain, if any, fell asleep or awoke first. Like with previous studies, the researchers found that the thalamus, a region located near the center of the brain, had decreased blood flow patterns in association with increased electrical sleep waves in the early minutes of sleep activity. This suggests that _______\nWhich choice most logically completes the text?","options":{"A":"the thalamus is one of the first brain regions to fall asleep.","B":"increased blood flow patterns in association with decreased electrical sleep waves indicate a brain region that is asleep.","C":"the thalamus is the last brain region to fall asleep.","D":"humans may use only one hemisphere of the brain while asleep."},"answer":"A","module":2,"imageUrl":"","emphasis":""},{"number":16,"text":"In order to avoid physical damage, a formula is used to calculate the maximum gross weight for a commercial vehicle traveling over a bridge. The Federal Bridge Gross Weight Formula takes into account not only the weight of the vehicle but also its number of axles (shafts for wheels) and the spacing between axles, given that a shorter vehicle with its weight concentrated in a smaller area could cause more damage than could a longer vehicle of the same weight whose mass is more dispersed. This suggests that, when comparing a two-axle vehicle to a four-axle vehicle, _______\nWhich choice most logically completes the text?","options":{"A":"the four-axle vehicle likely has a lower weight limit on a given bridge than does the two-axle vehicle.","B":"the vehicles likely have the same weight limit on a given bridge.","C":"the two-axle vehicle is unlikely to surpass the bridge’s weight limit, as it is smaller.","D":"the two-axle vehicle likely has a lower weight limit on a given bridge than does the four-axle vehicle."},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":17,"text":"A recent study looked at whether students who took photos of PowerPoint slides during lessons remembered the content. When students took a photo of the slides, they were able to better remember the information on those slides compared to slides _______ did not photograph.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"they","B":"one","C":"it","D":"we"},"answer":"B","module":2,"imageUrl":"","emphasis":""},{"number":18,"text":"Soft drinks have become very popular in recent years, but consuming too many is associated with many diseases and intellectual deterioration. Scientists wanted to explore another question related to this topic: _______\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"does the consumption of soft drinks cause changes in mammal behavior?","B":"does the consumption of soft drinks cause changes in mammal behavior.","C":"the consumption of soft drinks causes changes in mammal behavior?","D":"the consumption of soft drinks causes changes in mammal behavior."},"answer":"A","module":2,"imageUrl":"","emphasis":""},{"number":19,"text":"Heat islands are urban areas that, due to a high number of buildings and limited greenery, have a higher temperature compared to outlying areas. There are several strategies and technologies to counteract the higher temperatures of heat islands. For example, green roofs, which are rooftops covered in vegetation, reduce the temperatures of _______ cool pavements, which are made with materials that reflect solar energy, can lower the temperatures above the pavement surface and the surrounding air.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"roofs, while","B":"roofs; while","C":"roofs. While","D":"roofs: while"},"answer":"B","module":2,"imageUrl":"","emphasis":""},{"number":20,"text":"With a focus on public health, Abla Mehio Sibai is currently working at a university in Lebanon. She primarily focuses on the process of aging, especially in the context of different demographics, and _______ to research on noncontagious illnesses.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"contribute","B":"contributes","C":"are contributing","D":"have contributed"},"answer":"B","module":2,"imageUrl":"","emphasis":""},{"number":21,"text":"Bribery is recognized as a problem in India by local and international organizations. In response to this problem, 5th Pillar, a non-governmental organization, printed a zero-rupee _______ imitation banknote that resembles real money and is covered in anti-corruption slogans.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"note. An","B":"note, an","C":"note an","D":"note; an"},"answer":"B","module":2,"imageUrl":"","emphasis":""},{"number":22,"text":"Scientists wanted to learn how verbal statements can alter someone’s visual interpretation of a situation. Participants were shown an image of 100 colored dots alongside a written hint and asked to identify the dominant color. When the hint accurately identified the dominant color, participants self-identified as more confident and _______ quicker response times.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"exhibit","B":"exhibits","C":"exhibiting","D":"exhibited"},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":23,"text":"Quantum computers rely on entangled building blocks to perform computational calculations. Scientists are attempting to find a new source for these building _______ photons, or small quanta of light, emitted by an atom.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"blocks, such as:","B":"blocks","C":"blocks,","D":"blocks:"},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":24,"text":"Suzan Shown Harjo initially worked to write poems and produce news shows advocating for equal rights for Native Americans. _______ she moved to Washington, D.C., and served as Congressional Liaison for Indian Affairs for President Jimmy Carter while continuing to produce powerful pieces.\nWhich choice completes the text with the most logical transition?","options":{"A":"As a rule,","B":"Despite this,","C":"Conversely,","D":"After some time,"},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":25,"text":"Scientists studied how electrical stimulation to the brain affected honeybees’ ability to steer while flying. They were able to determine the parameters for honeybee flight and develop strategies to manipulate it. _______ scientists hope to use a similar technique to control the flight of miniature drones that will perform a variety of tasks for the military and other industries.\nWhich choice completes the text with the most logical transition?","options":{"A":"In contrast,","B":"Eventually,","C":"On one hand,","D":"Specifically,"},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":26,"text":"In order to study an abrupt increase in global mean lower stratosphere temperatures, scientists used a time-specific analysis of wildfires in Australia. They determined that the wildfires are the source of this abrupt increase in temperature. _______ reducing the number of wildfires in Australia may help return the temperature to a normal value.\nWhich choice completes the text with the most logical transition?","options":{"A":"On the other hand,","B":"Meanwhile,","C":"Instead,","D":"Therefore,"},"answer":"D","module":2,"imageUrl":"","emphasis":""},{"number":27,"text":"Ed Yost designed the first modern hot air balloon with an in-flight heating system after working with General Mills on the company’s research balloons. The first piloted hot air balloon was designed in France, but it heated the air on the ground and came with a large risk of explosion. _______ Yost’s balloon design involved heating the fuel in the air and was much safer.\nWhich choice completes the text with the most logical transition?","options":{"A":"Ultimately,","B":"On the other hand,","C":"Otherwise,","D":"Despite this fact,"},"answer":"A","module":2,"imageUrl":"","emphasis":""}];const KEY="princetonDigitalSatModule2V1",letters=["A","B","C","D"],el=id=>document.getElementById(id);
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}})();const state={index:saved.index||0,selected:saved.selected||{},checked:saved.checked||{},correct:saved.correct||{},flagged:saved.flagged||{}};
function esc(v){const n=document.createElement("div");n.textContent=v||"";return n.innerHTML}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function formatText(q){let h=esc(q.text).replace(/_{4,}/g,'<span class="blank">_______</span>');if(q.emphasis){const e=esc(q.emphasis);h=h.replace(e,"<u>"+e+"</u>")}return h}
function nav(){el("questionGrid").innerHTML=QUESTIONS.map((q,i)=>'<button type="button" class="qnav '+(i===state.index?"current ":"")+(state.checked[q.number]?"answered ":"")+(state.flagged[q.number]?"flagged":"")+'" data-i="'+i+'">'+q.number+'</button>').join("");document.querySelectorAll(".qnav").forEach(b=>b.addEventListener("click",()=>{state.index=Number(b.dataset.i);save();render()}))}
function render(){const q=QUESTIONS[state.index],id=String(q.number),selected=state.selected[id],checked=state.checked[id];nav();el("counter").textContent="Question "+q.number+" of 27";el("previous").disabled=state.index===0;el("next").disabled=state.index===26;const options=letters.map(l=>{const good=checked&&l===q.answer,bad=checked&&selected===l&&l!==q.answer,cls=["option",selected===l?"selected":"",good?"correct":"",bad?"incorrect":""].filter(Boolean).join(" ");return '<button class="'+cls+'" type="button" data-letter="'+l+'" '+(checked?"disabled":"")+'><span class="letter">'+l+'</span><span>'+esc(q.options[l])+'</span></button>'}).join("");const image=q.imageUrl?'<img class="evidence-image" src="'+esc(q.imageUrl)+'" alt="Data visual for question '+q.number+'" referrerpolicy="no-referrer">':"";el("host").innerHTML='<article class="panel"><div class="meta"><span>Module 2 · Question '+q.number+'</span><button class="flag '+(state.flagged[id]?"active":"")+'" id="flag" type="button">'+(state.flagged[id]?"Flagged":"Flag for review")+'</button></div><div class="content"><h2>Question '+q.number+'</h2><p class="question-text">'+formatText(q)+'</p>'+image+'<div class="options">'+options+'</div><div class="actions"><button class="check" id="check" type="button" '+(!selected||checked?"disabled":"")+'>Check answer</button><span class="score" id="score"></span></div><div class="feedback '+(checked&&selected!==q.answer?"wrong":"")+'" style="display:'+(checked?"block":"none")+'"><h3>'+(selected===q.answer?"Correct":"Not quite")+'</h3><p><strong>Answer: '+q.answer+')</strong> '+esc(q.options[q.answer])+'</p><p>Answer key supplied with the Princeton mock test.</p></div></div></article>';document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{state.selected[id]=b.dataset.letter;save();render()}));el("check").addEventListener("click",()=>{state.checked[id]=true;state.correct[id]=state.selected[id]===q.answer;save();render()});el("flag").addEventListener("click",()=>{state.flagged[id]=!state.flagged[id];save();render()});update()}
function update(){const answered=Object.keys(state.checked).length,right=Object.values(state.correct).filter(Boolean).length;el("summary").textContent=answered+" answered · "+Object.values(state.flagged).filter(Boolean).length+" flagged";el("progressBar").style.width=(answered/27*100)+"%";const s=el("score");if(s)s.textContent=answered?"Score: "+right+" / "+answered:""}
el("previous").addEventListener("click",()=>{if(state.index>0){state.index--;save();render();scrollTo({top:0,behavior:"smooth"})}});el("next").addEventListener("click",()=>{if(state.index<26){state.index++;save();render();scrollTo({top:0,behavior:"smooth"})}});el("finish").addEventListener("click",()=>{const answered=Object.keys(state.checked).length,right=Object.values(state.correct).filter(Boolean).length;el("result").style.display="block";el("result").textContent="Module result: "+right+" correct out of "+answered+" answered ("+(27-answered)+" unanswered).";scrollTo({top:0,behavior:"smooth"})});
let remaining=1920,timerId=null;function drawTimer(){const m=Math.floor(remaining/60),s=remaining%60;el("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}el("timerToggle").addEventListener("click",()=>{if(timerId){clearInterval(timerId);timerId=null;el("timerToggle").textContent="Start"}else{timerId=setInterval(()=>{if(remaining>0){remaining--;drawTimer()}else{clearInterval(timerId);timerId=null;el("timerToggle").textContent="Start"}},1000);el("timerToggle").textContent="Pause"}});el("timerReset").addEventListener("click",()=>{if(timerId)clearInterval(timerId);timerId=null;remaining=1920;drawTimer();el("timerToggle").textContent="Start"});document.addEventListener("keydown",e=>{if(e.target.matches("button,input,select,textarea"))return;if(e.key==="ArrowLeft")el("previous").click();if(e.key==="ArrowRight")el("next").click()});drawTimer();render();
</script></body></html>
