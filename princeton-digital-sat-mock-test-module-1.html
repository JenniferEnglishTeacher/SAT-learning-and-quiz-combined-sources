<script>
const QUESTIONS=[{"number":1,"text":"The Chilean volcano Calabozos is located in _______ area. Therefore, the risk of loss of human life in the event of an eruption is minimal.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"a hazardous","B":"an active","C":"a mountainous","D":"a remote"},"answer":"D","module":1,"imageUrl":"","emphasis":""},{"number":2,"text":"The intergenerational Bulgarian female choir group Bistritsa Babi has been working to preserve customary songs and dances from the Shopluk region of the country since 1939. Through these _______ performances, members of Bistritsa Babi hope to keep this centuries-old ritual of expression alive. In 2005, the group was added to the UNESCO List of Intangible Cultural Heritage for Eastern Europe.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"traditional","B":"obscure","C":"discreet","D":"eccentric"},"answer":"A","module":1,"imageUrl":"","emphasis":""},{"number":3,"text":"Located in the old city of Marrakesh, Jemaa el-Fnaa, the main square, is a marketplace and vibrant hub for residents and visitors alike. During the day, snake charmers and stalls selling beverages fill the square, while at night the _______ center is filled with throngs of people coming to hear storytellers tell traditional fables, watch the performances of magicians, and browse multiple booths offering herbal medicines. As the night goes on, dozens of food vendors set up their stalls to feed the crowds.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"formal","B":"bustling","C":"unpredictable","D":"deserted"},"answer":"B","module":1,"imageUrl":"","emphasis":""},{"number":4,"text":"When developing the procedure for LASIK eye surgery, inventor Gholam A. Peyman faced many obstacles in trying to create a way to use lasers on the delicate tissues within the eye without causing pain or scarring. Through many experiments, he was able to gather that using a flap of tissue instead of performing surgery on the surface of the cornea could greatly reduce the incidence of _______ of the procedure. Peyman was able to secure patents in the US for his ideas and furthered his research to help the field of ophthalmology.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"characteristics","B":"prospects","C":"efficacy","D":"repercussions"},"answer":"D","module":1,"imageUrl":"","emphasis":""},{"number":5,"text":"The process of rainwater harvesting includes gathering and reserving rainwater instead of allowing it to trickle away. When it rains, water is collected from an awning or roof and _______ in a large vessel like a well or reservoir where it can drain back to the ground water source for things like domestic and livestock use.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"aggregated","B":"dissipated","C":"percolated","D":"collaborated"},"answer":"A","module":1,"imageUrl":"","emphasis":""},{"number":6,"text":"In 2012, thousands of scientists working at the Large Hadron Collider in Switzerland were finally able to _______ the existence of the long-predicted Higgs boson particle, first theorized as necessary in order to explain the mass of a fundamental particle by Peter Higgs and François Englert in 1964. These scientists confirmed a pattern of decay products that could be explained only by the Higgs boson particle.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"corroborate","B":"exonerate","C":"contextualize","D":"postulate"},"answer":"A","module":1,"imageUrl":"","emphasis":""},{"number":7,"text":"A highly influential leader of the US civil rights movement, Martin Luther King Jr. _______ his commitment to nonviolent resistance by organizing and directing numerous peaceful protests and sit-ins across the United States in the 1960s: his actions revealed his unwavering dedication to advancing the cause of civil rights without resorting to violence.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"characterized","B":"evinced","C":"elided","D":"gauged"},"answer":"B","module":1,"imageUrl":"","emphasis":""},{"number":8,"text":"An experiment headed by University of Wisconsin psychologist Sohad Murrar provides compelling evidence that individuals feel more inclusive toward other groups when they are informed that pro-diversity attitudes and behaviors are extremely popular among their peers. Students were presented with either a neutrally messaged poster or a poster that displayed fellow students of diverse ethnic backgrounds, a statement about valuing diversity, and statistics indicating their fellow students’ strong support for the statement. The study found that students were more likely to embrace inclusive statements and reject racist statements even weeks after they were exposed to the pro-diversity poster.\nWhich choice best describes the function of the underlined sentence in the text as a whole?","options":{"A":"To analyze the implications of the results of the experiment","B":"To demonstrate the difficulty of assessing individuals’ views on inclusivity and racism","C":"To highlight a specific instance in which the findings of the experiment were confirmed","D":"To describe certain aspects of the design and methodology of the experiment"},"answer":"D","module":1,"imageUrl":"","emphasis":"Students were presented with either a neutrally messaged poster or a poster that displayed fellow students of diverse ethnic backgrounds, a statement about valuing diversity, and statistics indicating their fellow students’ strong support for the statement."},{"number":9,"text":"Urbanization invariably results in a decrease in overall species diversity and abundance, though certain species seem to preternaturally thrive in city environments. Columba livia, the rock pigeon, is thought to be well-suited to survival in urbanized environments because of the anthropogenic food sources supplied in the form of refuse from restaurants. Thus, researchers Jeffrey A. Brown, Susannah B. Lerman, and colleagues hypothesized that the number of nearby restaurants might be a predictor of the abundance of rock pigeons in the area. They visited 57 sites during spring and winter for three years and logged the number of restaurants and the number of rock pigeons in the vicinity. Looking at the lines of best fit for the scatterplot of the compiled data, the researchers concluded that there is indeed a relationship between proximity to restaurants and abundance of rock pigeons and that this relationship was especially strong in the spring, noting that _______.\nWhich choice completes the text with the most logical and precise word or phrase?","options":{"A":"around ten rock pigeons were observed at a site with three restaurants within one kilometer, while around thirty rock pigeons were observed at a site with six restaurants within one kilometer.","B":"around three rock pigeons were observed at a site with ten restaurants within one kilometer, while around six rock pigeons were observed at a site with thirty restaurants within one kilometer.","C":"fewer than five rock pigeons were observed at a site with ten restaurants within one kilometer, while more than ten rock pigeons were observed at a site with thirty restaurants within one kilometer.","D":"fewer than ten rock pigeons were observed at a site with five restaurants within one kilometer, while more than thirty rock pigeons were observed at a site with ten restaurants within one kilometer."},"answer":"C","module":1,"imageUrl":"https://lh7-rt.googleusercontent.com/docsz/AD_4nXdjgXJbZMhhxdCIKydw_KDCd78rtR7ZOaos-VJGsVlEQyLiuC6YmDQVQMUtGjznNmsVd8rWRD-PI2HwVLwhYoFzk9xETuVmccB9_kXpGVhGgkfoVDoOd-ZzgaA5aUA64bACak34vmiSpGmQf_TBexMxIT6K8w=s2048?key=n868hl1b-xQjI09F38pAOw","emphasis":""},{"number":10,"text":"Chandra Wickramasinghe, director of the University of Buckingham’s Centre for Astrobiology, is an influential proponent of the controversial theory of panspermia, which suggests that life on Earth originated from microorganisms that were carried to our planet by comets or other celestial bodies. Wickramasinghe has argued for panspermia using several sources of scientific data including the detection of living microorganisms at extremely high altitudes in Earth’s atmosphere and the confirmation of complex organic molecules in interstellar dust and comets.\nWhich choice best describes the main idea of the text?","options":{"A":"Wickramasinghe’s theory of panspermia is far too controversial to be accepted by other astrobiologists.","B":"Wickramasinghe has presented evidence that life on Earth may in fact come from somewhere beyond Earth.","C":"The preponderance of available scientific data strongly supports Wickramasinghe’s theory of panspermia.","D":"If microorganisms can survive at extremely high altitudes in Earth’s atmosphere, then they can also survive space travel."},"answer":"B","module":1,"imageUrl":"","emphasis":""},{"number":11,"text":"C. difficile is a bacterium that causes an inflammation of the colon that can be life-threatening. The metabolic processes by which C. difficile takes advantage of a host’s inflammatory process to increase toxin production are not well understood. Previously, higher levels of sorbitol (a sugar alcohol) were found to be released by the immune system during inflammation from toxin production. Thus, a team of researchers decided to investigate sorbitol metabolism in C. difficile and its effect on toxin production in mice. In the study, mice with C. difficile that ingested sorbitol were found to have lower levels of toxin production than mice that did not ingest sorbitol. One possible explanation is that metabolizing sorbitol prevents C. difficile from producing toxins.\nWhich finding, if true, would most directly strengthen the potential explanation?","options":{"A":"C. difficile lacks the enzyme that metabolizes sorbitol and thus reduces its production of toxins when sorbitol is ingested.","B":"C. difficile metabolizes sorbitol at a faster rate than it does other naturally occurring sugar alcohols.","C":"Low levels of sorbitol reduce inflammation in mice and prevent toxin production.","D":"Mice naturally produce sorbitol in their intestines and do not contract C. difficile."},"answer":"A","module":1,"imageUrl":"","emphasis":""},{"number":12,"text":"Scholars generally agree that amputations were dangerous and deadly prior to 10,000 years ago due to a lack of proper surgical tools and techniques. The earliest evidence of a successful limb-removal surgery was a 7,000-year-old skeleton found in France that had an amputation above the elbow. Recently, archeologists uncovered a 31,000-year-old skeleton with an amputated leg in Indonesia. Analysis of the early stone age skeleton shows that the amputation occurred when the man was just a child and lacked any evidence of infection. Thus, _______\nWhich choice most logically completes the text?","options":{"A":"early stone age people must have had doctors who performed these successful amputations.","B":"life as an amputee must have been difficult for early stone age people without access to postoperational care.","C":"there is insufficient evidence to support that most amputations performed prior to 10,000 years ago were deadly.","D":"early stone age people prior to 10,000 years ago may have been more advanced than was previously acknowledged."},"answer":"D","module":1,"imageUrl":"","emphasis":""},{"number":13,"text":"In game theory, the prisoner’s dilemma is a thought experiment in which two people who are isolated from each other each have the choice to betray the other. An individual who betrays the other person will experience a personal benefit; however, if both players choose to betray each other then they will both experience a worse punishment than if neither betrays the other. Game theorists generally agree that the choice to cooperate (that is, refusing to betray the other person) is irrational, as it defies one’s self-interest; therefore, these game theorists suggest that _______\nWhich choice most logically completes the text?","options":{"A":"it is more rational for one to betray the other participant.","B":"both individuals should cooperate, as their punishment will be reduced.","C":"people always act in their own self-interest, as it is the rational choice.","D":"the thought experiment likely has limited relevance in everyday life."},"answer":"C","module":1,"imageUrl":"","emphasis":""},{"number":14,"text":"Karni Mata Temple is a Hindu temple located in the town of Deshnoke in India. The temple is dedicated to Karni Mata and is an important pilgrimage site. Numerous rats, known as kaba and considered holy, live in Karni Mata Temple, earning the temple _______ nickname, “Temple of Rats.”\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"it’s","B":"its","C":"their","D":"they’re"},"answer":"B","module":1,"imageUrl":"","emphasis":""},{"number":15,"text":"In addition to her research into the effects of hormones, ultraviolet light, and chemotherapy agents on cell _______, Jewel Plummer Cobb served as dean at Connecticut College and Rutgers University and as president of California State University, Fullerton, where she led many projects expanding the school’s facilities.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"division: biologist","B":"division. Biologist","C":"division biologist","D":"division, biologist"},"answer":"D","module":1,"imageUrl":"","emphasis":""},{"number":16,"text":"Poetra Asantewa is a performer from Ghana who combines three elements to create her _______ lyrics incorporating social issues, vocalization evoking different emotions, and rhythms using soulful elements.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"pieces","B":"pieces,","C":"pieces:","D":"pieces;"},"answer":"C","module":1,"imageUrl":"","emphasis":""},{"number":17,"text":"Compared to other Ukrainian scientists and mathematicians, _______ she has worked with differential equations, partial differential equations, and integrable systems in Dnipro, Cyprus, and Kyiv.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"there is a wide range of fields and Ukrainian cities that Olena Vaneeva has worked in:","B":"many Ukrainian cities and fields have been home to Olena Vaneeva:","C":"the range of fields and Ukrainian cities that Olena Vaneeva has worked in is very wide:","D":"Olena Vaneeva has worked in a wide range of fields and Ukrainian cities:"},"answer":"D","module":1,"imageUrl":"","emphasis":""},{"number":18,"text":"Astronaut William Anders was a member of the Apollo 8 mission, the first human spaceflight to reach the Moon and orbit it. During the mission, Anders took a photo of Earth rising above the lunar surface, an _______ was later named Earthrise.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"image, that","B":"image","C":"image that","D":"image,"},"answer":"C","module":1,"imageUrl":"","emphasis":""},{"number":19,"text":"French philosopher Denis Diderot was the chief editor of the Encyclopédie, which was completed by 1772. Motivated by the principles of the Enlightenment, the writers of the Encyclopédie _______ to compile all of the world’s knowledge in a single resource available to the ordinary person.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"attempted","B":"are attempting","C":"will attempt","D":"attempt"},"answer":"A","module":1,"imageUrl":"","emphasis":""},{"number":20,"text":"As one of the most prominent French astrophysicists, Françoise Combes has contributed to research about how galaxies form and _______ she has studied the composition of galaxies and how they interact with each other.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"evolve; additionally,","B":"evolve additionally","C":"evolve, additionally,","D":"evolve, additionally;"},"answer":"A","module":1,"imageUrl":"","emphasis":""},{"number":21,"text":"American avant-garde jazz composer and guitarist Mary Halvorson’s musical discography includes Dragon’s Head, an album created with bassist John Hébert and drummer Ches _______ a solo album; and Away with You, which featured pedal steel player Susan Alcorn, cellist Tomeka Reid, and saxophonist Ingrid Laubrock.\nWhich choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Smith; Meltframe,","B":"Smith; Meltframe","C":"Smith, Meltframe,","D":"Smith, Meltframe:"},"answer":"C","module":1,"imageUrl":"","emphasis":""},{"number":22,"text":"Mice were studied in an experiment focused on the relationship between room temperature and cancer growth. Cooler room temperatures were found to stimulate fat cells that eradicate the sugar molecules that sustain cancer cells. _______ the cancer cells started to die off in the mice exposed to cooler room temperatures.\nWhich choice completes the text with the most logical transition?","options":{"A":"Consequently,","B":"For example,","C":"However,","D":"In comparison,"},"answer":"A","module":1,"imageUrl":"","emphasis":""},{"number":23,"text":"While researching a topic, a student has taken the following notes:\nSatyajit Ray was an Indian filmmaker.\nHe is well-known for The Apu Trilogy.\nThe first film in the trilogy, Pather Panchali, is about the childhood of a small Bengali boy named Apu.\nThe second film, Aparajito, depicts Apu in his adolescence and his relationship to both his mother and their home.\nIn Apur Sansar, the third film, adult Apu marries Aparna and has a son, Kajal.\nThe student wants to emphasize how Apu changed throughout the trilogy. Which choice most effectively uses relevant information from the notes to accomplish this goal?","options":{"A":"Apu went from being a child in Pather Panchali to an adult with his own family in Apur Sansar.","B":"Satyajit Ray, an Indian filmmaker, made The Apu Trilogy about a boy named Apu.","C":"The three films of The Apu Trilogy are Pather Panchali, Aparajito, and Apur Sansar.","D":"The character Apu grew up in Bengal and eventually marries and has a son."},"answer":"A","module":1,"imageUrl":"","emphasis":""},{"number":24,"text":"While researching a topic, a student has taken the following notes:\nHaenyeo are female divers on Jeju Island, a Korean province.\nHaenyeo earn money by harvesting mollusks and shellfish, such as abalone, sea urchins, and oysters.\nThey dive without the use of oxygen masks and tanks.\nThey can hold their breath for over three minutes.\nThey can dive up to 30 meters below the surface of the water.\nJellyfish, sharks, and poor weather are different dangers they face while diving.\nThe student wants to emphasize the abilities of haenyeo. Which choice most effectively uses relevant information from the notes to accomplish this goal?","options":{"A":"Haenyeo are female divers on Jeju Island who harvest shellfish.","B":"While diving, haenyeo contend with jellyfish, sharks, and poor weather.","C":"Haenyeo earn money by selling abalone, sea urchins, and oysters, which they harvest by diving without oxygen masks and tanks.","D":"Haenyeo can dive 30 meters below the surface and hold their breath for over three minutes."},"answer":"D","module":1,"imageUrl":"","emphasis":""},{"number":25,"text":"While researching a topic, a student has taken the following notes:\nHeliconian Hall was built in 1876 as the Olivet Congregational Church.\nHeliconian Hall is in the Yorkville neighborhood of Toronto.\nThe Heliconian Club purchased and renamed Heliconian Hall in 1923.\nThe Heliconian Club’s membership includes women professional artists.\nHeliconian Hall hosts music, art, dance, drama, and literature events.\nThe student wants to describe the history of Heliconian Hall to an audience familiar with the Heliconian Club. Which choice most effectively uses relevant information from the notes to accomplish this goal?","options":{"A":"Heliconian Hall was purchased in 1923 by the Heliconian Club, an organization which includes women professional artists.","B":"Heliconian Hall, located in the Yorkville neighborhood of Toronto, hosts music, art, dance, drama, and literature events.","C":"Heliconian Hall, formerly known as the Olivet Congregational Church, is in the Yorkville neighborhood of Toronto.","D":"Heliconian Hall, built as the Olivet Congregational Church in 1876, was purchased and renamed by the Heliconian Club in 1923."},"answer":"D","module":1,"imageUrl":"","emphasis":""},{"number":26,"text":"While researching a topic, a student has taken the following notes:\nEvan Adams is an Indigenous Canadian actor.\nHe is well-known for his role as Thomas in the film Smoke Signals.\nThe film was released in 1998.\nIt is about two friends, Thomas and Victor, and their complicated relationships with Victor’s father, Arnold.\nAdams is also known for his role as Seymour in The Business of Fancydancing (2002).\nThe student wants to introduce Evan Adams and his role in Smoke Signals to a new audience. Which choice most effectively uses relevant information from the notes to accomplish this goal?","options":{"A":"Evan Adams, an Indigenous Canadian actor, has starred as Thomas in Smoke Signals and Seymour in The Business of Fancydancing.","B":"Smoke Signals, released in 1998, explores the complicated relationships of friends Thomas and Victor.","C":"Evan Adams starred in the film Smoke Signals before he starred in The Business of Fancydancing.","D":"Indigenous Canadian actor Evan Adams starred as Thomas in the 1998 film Smoke Signals, which depicts two friends, Thomas and Victor, and their complicated relationships with Victor’s father, Arnold."},"answer":"D","module":1,"imageUrl":"","emphasis":""},{"number":27,"text":"While researching a topic, a student has taken the following notes:\nMarie Byrd Land is an unclaimed region of Antarctica.\nConstruction of Byrd Station in Marie Byrd Land was begun in 1956 by the US.\nByrd Station was abandoned in 1972.\nJohn Carpenter used Byrd Station as a model for an Antarctic station in crisis for his movie The Thing.\nJames Rollins used Byrd Station as a model for an Antarctic station in crisis for his novel The 6th Extinction.\nThe student wants to highlight a similarity between fictional depictions of a real-world location. Which choice most effectively uses relevant information from the notes to accomplish this goal?","options":{"A":"Both John Carpenter’s movie The Thing and James Rollins’s novel The 6th Extinction used Byrd Station as a model for an Antarctic station in crisis.","B":"In 1956, the US began construction of Byrd Station in Marie Byrd Land, an unclaimed region of Antarctica.","C":"Abandoned in 1972, Byrd Station was the model for an Antarctic station in crisis in John Carpenter’s The Thing.","D":"John Carpenter used Byrd Station as a model for an Antarctic station in crisis for his movie The Thing; however, James Rollins used Byrd Station as a model for an Antarctic station in crisis for his novel The 6th Extinction."},"answer":"A","module":1,"imageUrl":"","emphasis":""}];const KEY="princetonDigitalSatModule1V1",letters=["A","B","C","D"],el=id=>document.getElementById(id);
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch{return {}}})();const state={index:saved.index||0,selected:saved.selected||{},checked:saved.checked||{},correct:saved.correct||{},flagged:saved.flagged||{}};
function esc(v){const n=document.createElement("div");n.textContent=v||"";return n.innerHTML}function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function formatText(q){let h=esc(q.text).replace(/_{4,}/g,'<span class="blank">_______</span>');if(q.emphasis){const e=esc(q.emphasis);h=h.replace(e,"<u>"+e+"</u>")}return h}
function nav(){el("questionGrid").innerHTML=QUESTIONS.map((q,i)=>'<button type="button" class="qnav '+(i===state.index?"current ":"")+(state.checked[q.number]?"answered ":"")+(state.flagged[q.number]?"flagged":"")+'" data-i="'+i+'">'+q.number+'</button>').join("");document.querySelectorAll(".qnav").forEach(b=>b.addEventListener("click",()=>{state.index=Number(b.dataset.i);save();render()}))}
function render(){const q=QUESTIONS[state.index],id=String(q.number),selected=state.selected[id],checked=state.checked[id];nav();el("counter").textContent="Question "+q.number+" of 27";el("previous").disabled=state.index===0;el("next").disabled=state.index===26;const options=letters.map(l=>{const good=checked&&l===q.answer,bad=checked&&selected===l&&l!==q.answer,cls=["option",selected===l?"selected":"",good?"correct":"",bad?"incorrect":""].filter(Boolean).join(" ");return '<button class="'+cls+'" type="button" data-letter="'+l+'" '+(checked?"disabled":"")+'><span class="letter">'+l+'</span><span>'+esc(q.options[l])+'</span></button>'}).join("");const image=q.imageUrl?'<img class="evidence-image" src="'+esc(q.imageUrl)+'" alt="Data visual for question '+q.number+'" referrerpolicy="no-referrer">':"";el("host").innerHTML='<article class="panel"><div class="meta"><span>Module 1 · Question '+q.number+'</span><button class="flag '+(state.flagged[id]?"active":"")+'" id="flag" type="button">'+(state.flagged[id]?"Flagged":"Flag for review")+'</button></div><div class="content"><h2>Question '+q.number+'</h2><p class="question-text">'+formatText(q)+'</p>'+image+'<div class="options">'+options+'</div><div class="actions"><button class="check" id="check" type="button" '+(!selected||checked?"disabled":"")+'>Check answer</button><span class="score" id="score"></span></div><div class="feedback '+(checked&&selected!==q.answer?"wrong":"")+'" style="display:'+(checked?"block":"none")+'"><h3>'+(selected===q.answer?"Correct":"Not quite")+'</h3><p><strong>Answer: '+q.answer+')</strong> '+esc(q.options[q.answer])+'</p><p>Answer key supplied with the Princeton mock test.</p></div></div></article>';document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{state.selected[id]=b.dataset.letter;save();render()}));el("check").addEventListener("click",()=>{state.checked[id]=true;state.correct[id]=state.selected[id]===q.answer;save();render()});el("flag").addEventListener("click",()=>{state.flagged[id]=!state.flagged[id];save();render()});update()}
function update(){const answered=Object.keys(state.checked).length,right=Object.values(state.correct).filter(Boolean).length;el("summary").textContent=answered+" answered · "+Object.values(state.flagged).filter(Boolean).length+" flagged";el("progressBar").style.width=(answered/27*100)+"%";const s=el("score");if(s)s.textContent=answered?"Score: "+right+" / "+answered:""}
el("previous").addEventListener("click",()=>{if(state.index>0){state.index--;save();render();scrollTo({top:0,behavior:"smooth"})}});el("next").addEventListener("click",()=>{if(state.index<26){state.index++;save();render();scrollTo({top:0,behavior:"smooth"})}});el("finish").addEventListener("click",()=>{const answered=Object.keys(state.checked).length,right=Object.values(state.correct).filter(Boolean).length;el("result").style.display="block";el("result").textContent="Module result: "+right+" correct out of "+answered+" answered ("+(27-answered)+" unanswered).";scrollTo({top:0,behavior:"smooth"})});
let remaining=1920,timerId=null;function drawTimer(){const m=Math.floor(remaining/60),s=remaining%60;el("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}el("timerToggle").addEventListener("click",()=>{if(timerId){clearInterval(timerId);timerId=null;el("timerToggle").textContent="Start"}else{timerId=setInterval(()=>{if(remaining>0){remaining--;drawTimer()}else{clearInterval(timerId);timerId=null;el("timerToggle").textContent="Start"}},1000);el("timerToggle").textContent="Pause"}});el("timerReset").addEventListener("click",()=>{if(timerId)clearInterval(timerId);timerId=null;remaining=1920;drawTimer();el("timerToggle").textContent="Start"});document.addEventListener("keydown",e=>{if(e.target.matches("button,input,select,textarea"))return;if(e.key==="ArrowLeft")el("previous").click();if(e.key==="ArrowRight")el("next").click()});drawTimer();render();
</script></body></html>
