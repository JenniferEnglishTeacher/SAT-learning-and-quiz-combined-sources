<style>
:root{--ink:#1d2430;--muted:#667085;--line:#d8dee8;--paper:#fff;--wash:#f4f7fa;--blue:#1769aa;--blue2:#0f4f82;--green:#237a4b;--red:#b42318;--amber:#925d00;--focus:#f5b942}
*{box-sizing:border-box}
body{margin:0;background:var(--wash);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55;letter-spacing:0}
button,select,input{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:auto;min-height:64px;padding:10px 20px;display:flex;align-items:center;gap:16px}
.back{color:var(--blue2);text-decoration:none;font-weight:700;white-space:nowrap}
.back:hover{text-decoration:underline}
.title-wrap{min-width:0;flex:1}
h1{font-size:clamp(20px,3vw,28px);line-height:1.15;margin:0}
.subtitle{margin:3px 0 0;color:var(--muted);font-size:14px}
.progress-text{font-weight:700;color:var(--blue2);white-space:nowrap}
.progress-track{height:5px;background:#e8edf3}
.progress-bar{height:100%;width:0;background:var(--blue);transition:width .2s ease}
.layout{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:22px;padding:22px 20px 56px}
.filters{align-self:start;position:sticky;top:86px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
.filters h2{font-size:17px;margin:0 0 14px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:700;color:#344054}
.field input,.field select{width:100%;border:1px solid #b8c2d0;border-radius:5px;background:#fff;padding:9px 10px;color:var(--ink)}
.field input:focus,.field select:focus,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.filter-summary{font-size:14px;color:var(--muted);margin:10px 0 14px}
.secondary{width:100%;border:1px solid #98a6b8;background:#fff;color:#253448;border-radius:5px;padding:9px 12px;font-weight:700}
.secondary:hover{background:#f5f7fa}
.quiz{min-width:0}
.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav-group{display:flex;gap:8px}
.nav-btn{border:1px solid #98a6b8;background:#fff;border-radius:5px;padding:8px 13px;font-weight:700}
.nav-btn:disabled{opacity:.45;cursor:not-allowed}
.counter{color:var(--muted);font-weight:700}
.question-panel{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.question-meta{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;background:#eef3f7;border-bottom:1px solid var(--line)}
.tag{font-size:13px;font-weight:700;color:#344054}
.tag+.tag:before{content:"•";margin-right:8px;color:#98a2b3}
.question-content{padding:22px}
.question-content h2{font-size:19px;margin:0 0 14px;color:var(--blue2)}
.passage{font-size:17px;margin:0 0 15px;white-space:pre-wrap}
.blank{font-weight:800;color:var(--blue2);letter-spacing:1px}
.stem{font-weight:700;margin:0 0 15px}
.options{display:grid;gap:10px}
.option{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;gap:10px;width:100%;text-align:left;border:1px solid #b9c3d0;background:#fff;border-radius:6px;padding:12px;color:var(--ink)}
.option:hover{border-color:var(--blue);background:#f6faff}
.option .letter{display:grid;place-items:center;width:30px;height:30px;border:1px solid #8e9bac;border-radius:50%;font-weight:800}
.option.selected{border:2px solid var(--blue);padding:11px;background:#eef7ff}
.option.correct{border-color:var(--green);background:#edf9f2}
.option.incorrect{border-color:var(--red);background:#fff1f0}
.option:disabled{cursor:default;opacity:1}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.primary{border:1px solid var(--blue2);background:var(--blue);color:#fff;border-radius:5px;padding:10px 16px;font-weight:800}
.primary:hover{background:var(--blue2)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.feedback{display:none;margin-top:18px;padding:15px;border-left:4px solid var(--green);background:#f0f8f4}
.feedback.is-wrong{border-color:var(--red);background:#fff3f2}
.feedback h3{font-size:16px;margin:0 0 6px}
.feedback p{margin:5px 0}
.duplicate{color:var(--muted);font-size:13px}
.empty{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px;text-align:center}
.score{font-size:14px;color:var(--muted);margin-left:auto}
@media(max-width:820px){
 .layout{grid-template-columns:1fr;padding:14px 12px 40px}
 .filters{position:static}
 .topbar-inner{align-items:flex-start;flex-wrap:wrap;padding:10px 12px}
 .progress-text{margin-left:auto}
 .question-content{padding:17px}
 .passage{font-size:16px}
 .toolbar{align-items:flex-start;flex-direction:column}
 .nav-group{width:100%}
 .nav-btn{flex:1}
}
</style>

<script>
const QUESTIONS=[{"no":"1","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"19","passage":"Public-awareness campaigns about the need to reduce single-use plastics can be successful, says researcher Kim Borg of Monash University in Australia, when these campaigns give consumers a choice: for example, Japan achieved a 40 percent reduction in plastic-bag use after cashiers were instructed to ask customers whether _______ wanted a bag.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"they","B":"one","C":"you","D":"it"},"answer":"A","explanation":"The pronoun refers to the plural \"customers,\" so \"they\" is required.","category":"Agreement (Pronoun)","skill":"Pronoun–antecedent agreement (plural)","alsoAppears":"SAT 10 M2 Q18"},{"no":"2","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"20","passage":"In ancient Greece, an Epicurean was a follower of Epicurus, a philosopher whose beliefs revolved around the pursuit of pleasure. Epicurus defined pleasure as “the absence of pain in the body and of trouble in the _______ that all life’s virtues derived from this absence.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"soul,” positing","B":"soul”: positing","C":"soul”; positing","D":"soul.” Positing"},"answer":"A","explanation":"\"Positing that all life’s virtues derived...\" is a participial phrase (no subject, no finite verb) describing Epicurus, so it attaches to the main clause with a comma, placed inside the closing quotation mark. A semicolon or period (C, D) would leave the phrase as a fragment; a colon (B) is not used before a participial phrase.","category":"Punctuation","skill":"Comma before participial phrase + quotation marks","alsoAppears":""},{"no":"3","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"21","passage":"British scientists James Watson and Francis Crick won the Nobel Prize in part for their 1953 paper announcing the double helix structure of DNA, but it is misleading to say that Watson and Crick discovered the double helix. _______ findings were based on a famous X-ray image of DNA fibers, “Photo 51,” developed by X-ray crystallographer Rosalind Franklin and her graduate student Raymond Gosling.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"They’re","B":"It’s","C":"Their","D":"Its"},"answer":"C","explanation":"A plural possessive determiner is needed to show the findings belong to Watson and Crick: \"Their.\" \"They’re\" and \"It’s\" are contractions; \"Its\" is singular.","category":"Agreement (Pronoun)","skill":"Possessive pronoun (their vs. they’re/its)","alsoAppears":"SAT 9 M2 Q19"},{"no":"4","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"22","passage":"In 1937, Chinese American screen actor Anna May Wong, who had portrayed numerous villains and secondary characters but never a heroine, finally got a starring role in Paramount Pictures’ Daughter of Shanghai, a film that _______ “expanded the range of possibilities for Asian images on screen.”","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"critic, Stina Chyn, claims","B":"critic, Stina Chyn, claims,","C":"critic Stina Chyn claims","D":"critic Stina Chyn, claims,"},"answer":"C","explanation":"\"Critic Stina Chyn\" is a title + name (restrictive appositive), so no commas around the name. No comma belongs between the subject and the verb \"claims\" or between \"claims\" and the quotation that serves as its content.","category":"Punctuation","skill":"Restrictive appositive (title + name) – no commas","alsoAppears":""},{"no":"5","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"23","passage":"In 1637, the price of tulips skyrocketed in Amsterdam, with single bulbs of rare varieties selling for up to the equivalent of $200,000 in today’s US dollars. Some historians _______ that this “tulip mania” was the first historical instance of an asset bubble, which occurs when investors drive prices to highs not supported by actual demand.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"claiming","B":"claim","C":"having claimed","D":"to claim"},"answer":"B","explanation":"The subject \"Some historians\" needs a finite main verb. \"Claim\" is finite and plural; the other choices are nonfinite and leave the sentence without a main verb.","category":"Verb Form","skill":"Finite vs. nonfinite verb (main verb needed)","alsoAppears":""},{"no":"6","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"24","passage":"Researchers studying magnetosensation have determined why some soil-dwelling roundworms in the Southern Hemisphere move in the opposite direction of Earth’s magnetic field when searching for _______ in the Northern Hemisphere, the magnetic field points down, into the ground, but in the Southern Hemisphere, it points up, toward the surface and away from worms’ food sources.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"food:","B":"food,","C":"food while","D":"food"},"answer":"A","explanation":"The second independent clause explains why the worms behave this way, so a colon is appropriate. B is a comma splice, D a run-on, C creates a confusing structure.","category":"Punctuation","skill":"Colon introducing an explanation","alsoAppears":"SAT 10 M2 Q25"},{"no":"7","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"25","passage":"Scientists believe that, unlike most other species of barnacle, turtle barnacles (Chelonibia testudinari) can dissolve the cement-like secretions they use to attach _______ to a sea turtle shell, enabling the barnacles to move short distances across the shell’s surface.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"it","B":"themselves","C":"them","D":"itself"},"answer":"B","explanation":"The barnacles (\"they\") attach their own bodies to the shell, so the object refers back to the subject and must be reflexive and plural: \"themselves.\" \"Them\" would refer to some other group; \"it/itself\" are singular.","category":"Agreement (Pronoun)","skill":"Reflexive pronoun agreement (plural)","alsoAppears":""},{"no":"8","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"26","passage":"The classic children’s board game Chutes and Ladders is a version of an ancient Nepalese game, Paramapada Sopanapata. In both games, players encounter “good” or “bad” spaces while traveling along a path; landing on one of the good spaces _______ a player to skip ahead and arrive closer to the end goal.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"allows","B":"are allowing","C":"have allowed","D":"allow"},"answer":"A","explanation":"The subject is the gerund phrase \"landing on one of the good spaces,\" which is singular (not \"spaces\"), so the singular \"allows\" is correct.","category":"Agreement (S-V)","skill":"Subject–verb agreement (gerund subject)","alsoAppears":"SAT 9 M1 Q20"},{"no":"9","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"27","passage":"In 1943, in the midst of World War II, mathematics professor Grace Hopper was recruited by the US military to help the war effort by solving complex equations. Hopper’s subsequent career would involve more than just _______ as a pioneering computer programmer, Hopper would help usher in the digital age.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"equations, though:","B":"equations, though,","C":"equations. Though,","D":"equations though"},"answer":"A","explanation":"\"Though\" is an adverb ending the first clause (set off by a comma). The second independent clause explains what \"more than just equations\" means, so a colon is appropriate. B is a comma splice; C makes \"Though,\" start a fragment; D is a run-on.","category":"Punctuation","skill":"Colon between independent clauses + adverb placement","alsoAppears":"SAT 8 M1 Q22"},{"no":"10","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"28","passage":"In 1453, English King Henry VI became unfit to rule after falling gravely ill. As a result, Parliament appointed Richard, Third Duke of York, who had a strong claim to the English throne, to rule as Lord Protector. Upon recovering two years later, _______ forcing an angered Richard from the royal court and precipitating a series of battles later known as the Wars of the Roses.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Henry resumed his reign,","B":"the reign of Henry resumed,","C":"Henry’s reign resumed,","D":"it was Henry who resumed his reign,"},"answer":"A","explanation":"The modifier \"Upon recovering two years later\" describes the person who recovered—Henry—so \"Henry\" must be the subject right after the comma. The reign didn't recover, and \"it\" is not Henry (dangling modifier).","category":"Modifier","skill":"Dangling modifier (subject after introductory phrase)","alsoAppears":""},{"no":"11","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"29","passage":"Although novels and poems are considered distinct literary forms, many authors have created hybrid works that incorporate elements of both. Bernardine Evaristo’s The Emperor’s Babe, _______ is a verse novel, a book-length narrative complete with characters and a plot but conveyed in short, crisp lines of poetry rather than prose.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"by contrast,","B":"consequently,","C":"secondly,","D":"for example,"},"answer":"D","explanation":"The Emperor’s Babe is a specific instance of the \"hybrid works\" described in the previous sentence, so \"for example\" is logical.","category":"Transition","skill":"Example / illustration","alsoAppears":""},{"no":"12","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"30","passage":"At two weeks old, the time their critical socialization period begins, wolves can smell but cannot yet see or hear. Domesticated dogs, _______ can see, hear, and smell by the end of two weeks. This relative lack of sensory input may help explain why wolves behave so differently around humans than dogs do: from a very young age, wolves are more wary and less exploratory.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in other words,","B":"for instance,","C":"by contrast,","D":"accordingly,"},"answer":"C","explanation":"Dogs differ from wolves in sensory development at two weeks, so \"by contrast\" is logical.","category":"Transition","skill":"Contrast","alsoAppears":"SAT 8 M2 Q29"},{"no":"13","source":"Digital SAT 1 – Module 1","test":"1","module":"1","originalQuestion":"31","passage":"Researchers Helena Mihaljević-Brandt, Lucía Santamaría, and Marco Tullney report that while mathematicians may have traditionally worked alone, evidence points to a shift in the opposite direction. _______ mathematicians are choosing to collaborate with their peers—a trend illustrated by a rise in the number of mathematics publications credited to multiple authors.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Similarly,","B":"For this reason,","C":"Furthermore,","D":"Increasingly,"},"answer":"D","explanation":"The sentence describes a growing trend (\"a shift\"), so \"Increasingly\" is logical.","category":"Transition","skill":"Trend / change over time","alsoAppears":"SAT 10 M2 Q30"},{"no":"14","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"19","passage":"When writing The Other Black Girl (2021), novelist Zakiya Dalila Harris drew on her own experiences working at a publishing office. The award-winning book is Harris’s first novel, but her writing _______ honored before. At the age of twelve, she entered a contest to have a story published in American Girl magazine—and won.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"were","B":"have been","C":"has been","D":"are"},"answer":"C","explanation":"The subject \"her writing\" is singular, and \"before\" signals an experience up to now, so the singular present perfect \"has been\" is correct.","category":"Agreement (S-V)","skill":"Subject–verb agreement + present perfect","alsoAppears":"SAT 8 M1 Q19"},{"no":"15","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"20","passage":"The Alvarez theory, developed in 1980 by physicist Luis Walter Alvarez and his geologist son Walter Alvarez, maintained that the secondary effects of an asteroid impact caused many dinosaurs and other animals to die _______ it left unexplored the question of whether unrelated volcanic activity might have also contributed to the mass extinctions.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"out but","B":"out, but","C":"out","D":"out,"},"answer":"B","explanation":"Two independent clauses are joined with a comma plus the coordinating conjunction \"but.\" A lacks the comma, C is a run-on, D is a comma splice.","category":"Punctuation","skill":"Comma + FANBOYS between independent clauses","alsoAppears":"SAT 10 M1 Q20"},{"no":"16","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"21","passage":"In winter, the diets of Japanese macaques, also known as snow monkeys, are influenced more by food availability than by food preference. Although the monkeys prefer to eat vegetation and land-dwelling invertebrates, those food sources may become unavailable because of extensive snow and ice cover, _______ the monkeys to hunt for marine animals in any streams that have not frozen over.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"forces","B":"to force","C":"forcing","D":"forced"},"answer":"C","explanation":"\"Forcing the monkeys to hunt...\" is a participial phrase describing the result of the snow cover; it attaches with a comma. A finite verb (A, D) would create a comma splice; \"to force\" suggests purpose, which is illogical.","category":"Verb Form","skill":"Participial phrase showing result (nonfinite)","alsoAppears":"SAT 10 M1 Q22"},{"no":"17","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"22","passage":"Lucía Michel of the University of Chile observed that alkaline soils contain an insoluble form of iron that blueberry plants cannot absorb, thus inhibiting blueberry growth. If these plants were grown in alkaline soil alongside grasses that aid in iron solubilization, _______ Michel was determined to find out.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"could the blueberries thrive.","B":"the blueberries could thrive.","C":"the blueberries could thrive?","D":"could the blueberries thrive?"},"answer":"D","explanation":"This is a direct question that Michel wanted answered (\"...could the blueberries thrive? Michel was determined to find out.\"). A direct question uses inverted word order and a question mark.","category":"Sentence Structure","skill":"Direct question – word order & question mark","alsoAppears":"SAT 10 M2 Q19"},{"no":"18","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"23","passage":"In his 1963 exhibition Exposition of Music—Electronic Television, Korean American artist Nam June Paik showed how television images could be manipulated to express an artist’s perspective. Today, Paik _______ considered the first video artist.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will be","B":"had been","C":"was","D":"is"},"answer":"D","explanation":"\"Today\" signals the present, so the simple present \"is\" is correct.","category":"Verb Tense","skill":"Simple present (time marker \"today\")","alsoAppears":"SAT 10 M2 Q21"},{"no":"19","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"24","passage":"The first computerized spreadsheet, Dan Bricklin’s VisiCalc, improved financial recordkeeping not only by providing users with an easy means of adjusting data in spreadsheets but also by automatically updating all calculations that were dependent on these _______ to VisiCalc’s release, changing a paper spreadsheet often required redoing the entire sheet by hand, a process that could take days.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"adjustments prior","B":"adjustments, prior","C":"adjustments. Prior","D":"adjustments and prior"},"answer":"C","explanation":"\"Prior to VisiCalc’s release, changing a paper spreadsheet often required...\" is a new independent clause, so a period is needed after \"adjustments.\" B is a comma splice; A and D fuse the sentences and make \"prior to\" illogically modify \"adjustments.\"","category":"Punctuation","skill":"Sentence boundary – independent clauses (period)","alsoAppears":""},{"no":"20","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"25","passage":"In order to prevent nonnative fish species from moving freely between the Mediterranean and Red Seas, marine biologist Bella Galil has proposed that a saline lock system be installed along the Suez Canal in Egypt’s Great Bitter Lakes. The lock would increase the salinity of the lakes and _______ a natural barrier of water most marine creatures would be unable to cross.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"creates","B":"create","C":"creating","D":"created"},"answer":"B","explanation":"The verb is parallel with \"increase\" after the modal \"would\" (would increase...and create), so the base form \"create\" is required.","category":"Verb Form","skill":"Parallel verbs after a modal (would + base form)","alsoAppears":"SAT 8 M1 Q20"},{"no":"21","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"26","passage":"Despite being cheap, versatile, and easy to produce, _______ they are made from nonrenewable petroleum, and most do not biodegrade in landfills.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"there are two problems associated with commercial plastics:","B":"two problems are associated with commercial plastics:","C":"commercial plastics’ two associated problems are that","D":"commercial plastics have two associated problems:"},"answer":"D","explanation":"The modifier \"Despite being cheap, versatile, and easy to produce\" describes the plastics, so \"commercial plastics\" must be the subject right after the comma. A starts with \"there,\" B with \"two problems,\" and C with \"problems\" (dangling modifier).","category":"Modifier","skill":"Dangling modifier (subject after introductory phrase)","alsoAppears":""},{"no":"22","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"27","passage":"Stomata, tiny pore structures in a leaf that absorb gases needed for plant growth, open when guard cells surrounding each pore swell with water. In a pivotal 2007 article, plant cell _______ showed that lipid molecules called phosphatidylinositol phosphates are responsible for signaling guard cells to open stomata.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"biologist, Yuree Lee","B":"biologist Yuree Lee,","C":"biologist Yuree Lee","D":"biologist, Yuree Lee,"},"answer":"C","explanation":"\"Plant cell biologist Yuree Lee\" is a title + name (restrictive), so no commas. No punctuation belongs between the subject and the verb \"showed.\"","category":"Punctuation","skill":"Restrictive appositive (title + name) – no commas","alsoAppears":"SAT 9 M1 Q23"},{"no":"23","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"28","passage":"Small, flat structures called spatulae are found at the tips of the hairs on a spider’s leg. These spatulae temporarily bond with the atoms of whatever they touch. _______ spiders are able to cling to and climb almost any surface.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For instance,","B":"However,","C":"Similarly,","D":"As a result,"},"answer":"D","explanation":"Spiders can cling to surfaces because the spatulae bond with atoms—a cause-and-effect relationship, so \"As a result\" is logical.","category":"Transition","skill":"Cause and effect","alsoAppears":""},{"no":"24","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"29","passage":"In November 1934, Amrita Sher-Gil was living in what must have seemed like the ideal city for a young artist: Paris. She was studying firsthand the color-saturated style of France’s modernist masters and beginning to make a name for herself as a painter. _______ Sher-Gil longed to return to her childhood home of India; only there, she believed, could her art truly flourish.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Still,","B":"Therefore,","C":"Indeed,","D":"Furthermore,"},"answer":"A","explanation":"Despite ideal conditions in Paris, she wanted to leave. \"Still\" signals this unexpected contrast.","category":"Transition","skill":"Contrast / concession","alsoAppears":"SAT 8 M1 Q27"},{"no":"25","source":"Digital SAT 1 – Module 2","test":"1","module":"2","originalQuestion":"30","passage":"Before California’s 1911 election to approve a proposition granting women the right to vote, activists across the state sold tea to promote the cause of suffrage. In San Francisco, the Woman’s Suffrage Party sold Equality Tea at local fairs. _______ in Los Angeles, activist Nancy Tuttle Craig, who ran one of California’s largest grocery store firms, distributed Votes for Women Tea.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For example,","B":"To conclude,","C":"Similarly,","D":"In other words,"},"answer":"C","explanation":"The Los Angeles activity is parallel to the San Francisco one (both sold tea for suffrage), so \"Similarly\" is logical.","category":"Transition","skill":"Similarity / comparison","alsoAppears":"SAT 9 M2 Q27"},{"no":"26","source":"Digital SAT 2 – Module 1","test":"2","module":"1","originalQuestion":"20","passage":"To survive when water is scarce, embryos inside African turquoise killifish eggs _______ a dormant state known as diapause. In this state, embryonic development is paused for as long as two years—longer than the life span of an adult killifish.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"enter","B":"to enter","C":"having entered","D":"entering"},"answer":"A","explanation":"The subject \"embryos\" needs a main (finite) verb. \"Enter\" is a finite plural present-tense verb. The infinitive (B) and participles (C, D) cannot serve as the main verb, leaving the sentence incomplete.","category":"Verb Form","skill":"Finite vs. nonfinite verb (main verb needed)","alsoAppears":"SAT 8 M2 Q19"},{"no":"27","source":"Digital SAT 2 – Module 1","test":"2","module":"1","originalQuestion":"21","passage":"Formed in 1967 to foster political and economic stability within the Asia-Pacific region, the Association of Southeast Asian Nations was originally made up of five members: Thailand, the Philippines, Singapore, Malaysia, and Indonesia. By the end of the 1990s, the organization _______ its initial membership.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"has doubled","B":"had doubled","C":"doubles","D":"will double"},"answer":"B","explanation":"\"By the end of the 1990s\" marks an action completed before a specific past point, which requires the past perfect \"had doubled.\"","category":"Verb Tense","skill":"Past perfect (by + past time)","alsoAppears":"SAT 8 M2 Q20"},{"no":"28","source":"Digital SAT 2 – Module 1","test":"2","module":"1","originalQuestion":"22","passage":"The intense pressure found in the deep ocean can affect the structure of proteins in fish’s cells, distorting the proteins’ shape. The chemical trimethylamine N-oxide (TMAO) counters this effect, ensuring that proteins retain their original _______ is found in high concentrations in the cells of the deepest-dwelling fish.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"configurations. TMAO","B":"configurations TMAO","C":"configurations, TMAO","D":"configurations and TMAO"},"answer":"A","explanation":"Two independent clauses (\"The chemical TMAO counters...\" and \"TMAO is found...\") must be separated. A period does this correctly. B is a run-on, C a comma splice, and D joins them with \"and\" but no comma and creates confusion with \"configurations and TMAO\" as a compound object.","category":"Punctuation","skill":"Sentence boundary – independent clauses (period)","alsoAppears":""},{"no":"29","source":"Digital SAT 2 – Module 1","test":"2","module":"1","originalQuestion":"23","passage":"Food and the sensation of taste are central to Monique Truong’s novels. In The Book of Salt, for example, the exiled character of Bình connects to his native Saigon through the food he prepares, while in Bitter in the Mouth, the character of Linda _______ a form of synesthesia whereby the words she hears evoke tastes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"experienced","B":"had experienced","C":"experiences","D":"will be experiencing"},"answer":"C","explanation":"The sentence uses the literary present (\"connects\") to describe events in novels. The parallel verb for Linda must also be simple present: \"experiences.\"","category":"Verb Tense","skill":"Tense consistency (literary present)","alsoAppears":"SAT 10 M1 Q24"},{"no":"30","source":"Digital SAT 2 – Module 1","test":"2","module":"1","originalQuestion":"24","passage":"Inventor John Friedman created a prototype of the first flexible straw by inserting a screw into a paper straw and, using dental floss, binding the straw tightly around the _______ When the floss and screw were removed, the resulting corrugations in the paper allowed the straw to bend easily over the edge of a glass.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"screw’s thread’s.","B":"screws’ threads.","C":"screw’s threads.","D":"screws threads’."},"answer":"C","explanation":"There is one screw (\"a screw\"), so the singular possessive \"screw’s\" is needed. The threads belong to the screw and are plural but do not possess anything, so \"threads\" takes no apostrophe.","category":"Possessive/Plural","skill":"Singular possessive + plural noun","alsoAppears":""},{"no":"31","source":"Digital SAT 2 – Module 1","test":"2","module":"1","originalQuestion":"25","passage":"In her analysis of Edith Wharton’s The House of Mirth (1905), scholar Candace Waid observes that the novel depicts the upper classes of New York society as “consumed by the appetite of a soulless _______ an apt assessment given that The House of Mirth is set during the Gilded Age, a period marked by rapid industrialization, economic greed, and widening wealth disparities.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"materialism”; and","B":"materialism” and","C":"materialism,”","D":"materialism”"},"answer":"C","explanation":"\"An apt assessment...\" is a noun phrase that renames/comments on the preceding clause, so it is set off with a comma. In American style, the comma goes inside the closing quotation mark. A and B wrongly add \"and\" to a phrase that isn't a clause; D has no punctuation.","category":"Punctuation","skill":"Comma before supplementary noun phrase (appositive) + quotation marks","alsoAppears":""},{"no":"32","source":"Digital SAT 2 – Module 1","test":"2","module":"1","originalQuestion":"26","passage":"To humans, it does not appear that the golden orb-weaver spider uses camouflage to capture its _______ the brightly colored arachnid seems to wait conspicuously in the center of its large circular web for insects to approach. Researcher Po Peng of the University of Melbourne has explained that the spider’s distinctive coloration may in fact be part of its appeal.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"prey, rather,","B":"prey rather,","C":"prey, rather;","D":"prey; rather,"},"answer":"D","explanation":"Two independent clauses are joined here. \"Rather\" is a conjunctive adverb that begins the second clause, so a semicolon goes before it and a comma after it. A is a comma splice; B is a run-on; C puts the semicolon in the wrong place.","category":"Punctuation","skill":"Semicolon + conjunctive adverb between independent clauses","alsoAppears":""},{"no":"33","source":"Digital SAT 2 – Module 1","test":"2","module":"1","originalQuestion":"27","passage":"In Death Valley National Park’s Racetrack Playa, a flat, dry lakebed, are 162 rocks—some weighing less than a pound but others almost 700 pounds—that move periodically from place to place, seemingly of their own volition. Racetrack-like trails in the _______ mysterious migration.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"playas sediment mark the rock’s","B":"playa’s sediment mark the rocks","C":"playa’s sediment mark the rocks’","D":"playas’ sediment mark the rocks’"},"answer":"C","explanation":"There is one playa, so \"playa’s\" (singular possessive) is correct. The migration belongs to the 162 rocks, so the plural possessive \"rocks’\" is required.","category":"Possessive/Plural","skill":"Singular possessive vs. plural possessive","alsoAppears":""},{"no":"34","source":"Digital SAT 2 – Module 1","test":"2","module":"1","originalQuestion":"28","passage":"In crafting her fantasy fiction, Nigerian-born British author Helen Oyeyemi has drawn inspiration from the classic nineteenth-century fairy tales of the Brothers Grimm. Her 2014 novel Boy, Snow, Bird, for instance, is a complex retelling of the story of Snow White, while her 2019 novel _______ offers a delicious twist on the classic tale of Hansel and Gretel.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Gingerbread—","B":"Gingerbread,","C":"Gingerbread","D":"Gingerbread:"},"answer":"C","explanation":"\"Her 2019 novel Gingerbread\" is the subject of the clause and \"offers\" is its verb. No punctuation should separate a subject from its verb, and the title is an essential (restrictive) identifier.","category":"Punctuation","skill":"No punctuation between subject and verb / restrictive appositive","alsoAppears":"SAT 9 M2 Q22"},{"no":"35","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"18","passage":"For thousands of years, people in the Americas _______ the bottle gourd, a large bitter fruit with a thick rind, to make bottles, other types of containers, and even musical instruments. Oddly, there is no evidence that any type of bottle gourd is native to the Western Hemisphere; either the fruit or its seeds must have somehow been carried from Asia or Africa.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"to use","B":"have used","C":"having used","D":"using"},"answer":"B","explanation":"The subject \"people\" needs a finite main verb. \"Have used\" is finite, and the present perfect fits an action continuing \"for thousands of years.\" A, C, and D are nonfinite and leave the sentence without a main verb.","category":"Verb Form","skill":"Finite vs. nonfinite verb (main verb needed)","alsoAppears":""},{"no":"36","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"19","passage":"While many video game creators strive to make their graphics ever more _______ others look to the past, developing titles with visuals inspired by the “8-bit” games of the 1980s and 1990s. (The term “8-bit” refers to a console whose processor could only handle eight bits of data at once.)","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"lifelike but","B":"lifelike","C":"lifelike,","D":"lifelike, but"},"answer":"C","explanation":"\"While…lifelike\" is an introductory dependent clause, so a comma separates it from the main clause \"others look to the past.\" Adding \"but\" (A, D) is wrong because \"while\" already links the clauses; B lacks the needed comma.","category":"Punctuation","skill":"Comma after introductory dependent clause","alsoAppears":"SAT 10 M1 Q23"},{"no":"37","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"20","passage":"In the 1950s, a man named Joseph McVicker was struggling to keep his business afloat when his sister-in-law Kay Zufall advised him to repurpose the company’s product, a nontoxic, clay-like substance for removing soot from wallpaper, as a modeling putty for kids. In addition, Zufall _______ selling the product under a child-friendly name: Play-Doh.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"suggested","B":"suggests","C":"had suggested","D":"was suggesting"},"answer":"A","explanation":"The story is told in the simple past (\"advised\"). Zufall's suggestion is another completed past action in sequence, so the simple past \"suggested\" is consistent.","category":"Verb Tense","skill":"Tense consistency (simple past)","alsoAppears":""},{"no":"38","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"21","passage":"Beatrix Potter is perhaps best known for writing and illustrating children’s books such as The Tale of Peter Rabbit (1902), but she also dedicated herself to mycology, the study of _______ more than 350 paintings of the fungal species she observed in nature and submitting her research on spore germination to the Linnean Society of London.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"fungi; producing","B":"fungi. Producing","C":"fungi producing","D":"fungi, producing"},"answer":"D","explanation":"\"Producing...and submitting...\" is a participial phrase describing how Potter dedicated herself, so it is joined to the main clause with a comma. A semicolon (A) or period (B) would leave the phrase as an incomplete sentence; C makes it seem the fungi are producing paintings.","category":"Punctuation","skill":"Comma before participial phrase (supplement)","alsoAppears":""},{"no":"39","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"22","passage":"In assessing the films of Japanese director Akira Kurosawa, _______ have missed his equally deep engagement with Japanese artistic traditions such as Noh theater.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"many critics have focused on Kurosawa’s use of Western literary sources but","B":"Kurosawa’s use of Western literary sources has been the focus of many critics, who","C":"there are many critics who have focused on Kurosawa’s use of Western literary sources, but they","D":"the focus of many critics has been on Kurosawa’s use of Western literary sources; they"},"answer":"A","explanation":"The introductory modifier \"In assessing the films...\" must be followed immediately by the people doing the assessing: \"many critics.\" Only A places \"many critics\" right after the modifier; the others make \"Kurosawa’s use,\" \"there,\" or \"the focus\" do the assessing (dangling modifier).","category":"Modifier","skill":"Dangling modifier (subject after introductory phrase)","alsoAppears":""},{"no":"40","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"23","passage":"Joshua Hinson, director of the language revitalization program of the Chickasaw Nation in Oklahoma, helped produce the world’s first Indigenous-language instructional app, Chickasaw _______ Chickasaw TV, in 2010; and a Rosetta Stone language course in Chickasaw, in 2015.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Basic; in 2009, an online television network;","B":"Basic; in 2009, an online television network,","C":"Basic, in 2009; an online television network,","D":"Basic, in 2009, an online television network,"},"answer":"C","explanation":"This is a list of three items that contain internal commas, so the items are separated by semicolons. Item 1 is \"the...app, Chickasaw Basic, in 2009\"; the semicolon comes after \"2009,\" and item 2 begins \"an online television network, Chickasaw TV, in 2010.\"","category":"Punctuation","skill":"Semicolons in a complex series","alsoAppears":""},{"no":"41","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"24","passage":"The forty-seven geothermal springs of Arkansas’ Hot Springs National Park are sourced via a process known as natural groundwater recharge, in which rainwater percolates downward through the earth—in this case, the porous rocks of the hills around Hot _______ collect in a subterranean basin.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Springs to","B":"Springs: to","C":"Springs—to","D":"Springs, to"},"answer":"C","explanation":"The supplementary phrase \"in this case, the porous rocks...Hot Springs\" opens with a dash, so it must close with a matching dash before the sentence resumes (\"percolates downward through the earth...to collect\").","category":"Punctuation","skill":"Paired dashes around a supplementary element","alsoAppears":"SAT 8 M2 Q23"},{"no":"42","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"25","passage":"Over twenty years ago, in a landmark experiment in the psychology of choice, professor Sheena Iyengar set up a jam-tasting booth at a grocery store. The number of jams available for tasting _______ some shoppers had twenty-four different options, others only six. Interestingly, the shoppers with fewer jams to choose from purchased more jam.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"varied:","B":"varied,","C":"varied, while","D":"varied while"},"answer":"A","explanation":"The second part explains how the number varied, so a colon (which introduces an explanation after an independent clause) is correct. B is a comma splice; C and D create an illogical/garbled structure with \"while\" followed by another comma-joined clause.","category":"Punctuation","skill":"Colon introducing an explanation","alsoAppears":"SAT 8 M2 Q24"},{"no":"43","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"26","passage":"Nigerian author Buchi Emecheta’s celebrated literary oeuvre includes The Joys of Motherhood, a novel about the changing roles of women in 1950s _______ a television play about the private struggles of a newlywed couple in Nigeria; and Head Above Water, her autobiography.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Lagos, A Kind of Marriage,","B":"Lagos; A Kind of Marriage,","C":"Lagos, A Kind of Marriage:","D":"Lagos; A Kind of Marriage"},"answer":"B","explanation":"The list items contain internal commas, so semicolons separate them (matching the later \"; and Head Above Water\"). Within item 2, a comma sets off the appositive \"a television play...\" after the title.","category":"Punctuation","skill":"Semicolons in a complex series + appositive comma","alsoAppears":"SAT 8 M2 Q25"},{"no":"44","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"27","passage":"Chimamanda Ngozi Adichie’s 2013 novel Americanah chronicles the divergent experiences of Ifemelu and Obinze, a young Nigerian couple, after high school. Ifemelu moves to the United States to attend a prestigious university. _______ Obinze travels to London, hoping to start a career there. However, frustrated with the lack of opportunities, he soon returns to Nigeria.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Meanwhile,","B":"Nevertheless,","C":"Secondly,","D":"In fact,"},"answer":"A","explanation":"The two events happen at the same time to two different characters. \"Meanwhile\" signals simultaneous action.","category":"Transition","skill":"Time / simultaneity","alsoAppears":"SAT 9 M1 Q27"},{"no":"45","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"28","passage":"Organisms have evolved a number of surprising adaptations to ensure their survival in adverse conditions. Tadpole shrimp (Triops longicaudatus) embryos, _______ can pause development for over ten years during extended periods of drought.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in contrast,","B":"for example,","C":"meanwhile,","D":"consequently,"},"answer":"B","explanation":"Tadpole shrimp embryos are a specific instance of the \"surprising adaptations\" mentioned in the first sentence, so \"for example\" is logical.","category":"Transition","skill":"Example / illustration","alsoAppears":"SAT 10 M1 Q28"},{"no":"46","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"29","passage":"In 1933, the Twentieth Amendment to the US Constitution was ratified. The amendment mandates that presidential inaugurations be held on January 20, approximately ten weeks after the November election. _______ this amendment requires newly elected US senators and representatives to be sworn into their respective offices on January 3.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Instead,","B":"For instance,","C":"Specifically,","D":"In addition,"},"answer":"D","explanation":"The sentence adds a second, separate requirement of the amendment, so \"In addition\" (addition) is correct.","category":"Transition","skill":"Addition","alsoAppears":""},{"no":"47","source":"Digital SAT 2 – Module 2","test":"2","module":"2","originalQuestion":"30","passage":"In her poetry collection Thomas and Beulah, Rita Dove interweaves the titular characters’ personal stories with broader historical narratives. She places Thomas’s journey from the American South to the Midwest in the early 1900s within the larger context of the Great Migration. _______ Dove sets events from Beulah’s personal life against the backdrop of the US Civil Rights Movement.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Specifically,","B":"Thus,","C":"Regardless,","D":"Similarly,"},"answer":"D","explanation":"Dove does the same thing for Beulah that she did for Thomas (placing a personal story in a historical context). \"Similarly\" signals this parallel.","category":"Transition","skill":"Similarity / comparison","alsoAppears":""},{"no":"48","source":"Digital SAT 3 – Module 1","test":"3","module":"1","originalQuestion":"20","passage":"A member of the Cherokee Nation, Mary Golda Ross is renowned for her contributions to NASA’s Planetary Flight Handbook, which _______ detailed mathematical guidance for missions to Mars and Venus.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"provided","B":"having provided","C":"to provide","D":"providing"},"answer":"A","explanation":"The relative clause \"which ___ detailed mathematical guidance\" needs a finite verb. \"Provided\" is finite; the other choices are nonfinite and leave the clause without a verb.","category":"Verb Form","skill":"Finite verb in a relative clause","alsoAppears":"SAT 9 M1 Q19"},{"no":"49","source":"Digital SAT 3 – Module 1","test":"3","module":"1","originalQuestion":"21","passage":"Typically, underlines, scribbles, and notes left in the margins by a former owner lower a book’s _______ when the former owner is a famous poet like Walt Whitman, such markings, known as marginalia, can be a gold mine to literary scholars.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"value, but","B":"value","C":"value,","D":"value but"},"answer":"A","explanation":"Two independent clauses with contrasting ideas are joined; a comma plus the coordinating conjunction \"but\" is correct. B is a run-on, C a comma splice, D lacks the comma before \"but.\"","category":"Punctuation","skill":"Comma + FANBOYS between independent clauses","alsoAppears":"SAT 10 M1 Q21"},{"no":"50","source":"Digital SAT 3 – Module 1","test":"3","module":"1","originalQuestion":"22","passage":"After the United Kingdom began rolling out taxes equivalent to a few cents on single-use plastic grocery bags in 2011, plastic-bag consumption decreased by up to ninety _______ taxes are subject to what economists call the “rebound effect”: as the change became normalized, plastic-bag use started to creep back up.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"percent, such","B":"percent and such","C":"percent. Such","D":"percent such"},"answer":"C","explanation":"Two independent clauses must be separated; a period does this. A is a comma splice, D is a run-on, and B needs a comma before \"and.\"","category":"Punctuation","skill":"Sentence boundary – independent clauses (period)","alsoAppears":"SAT 8 M2 Q21"},{"no":"51","source":"Digital SAT 3 – Module 1","test":"3","module":"1","originalQuestion":"23","passage":"As British scientist Peter Whibberley has observed, “the Earth is not a very good timekeeper.” Earth’s slightly irregular rotation rate means that measurements of time must be periodically adjusted. Specifically, an extra “leap second” (the 86,401st second of the day) is _______ time based on the planet’s rotation lags a full nine-tenths of a second behind time kept by precise atomic clocks.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"added, whenever","B":"added; whenever","C":"added. Whenever","D":"added whenever"},"answer":"D","explanation":"\"Whenever time...lags\" is an essential dependent clause telling when the second is added, so no punctuation is needed. B and C would leave the dependent clause as a fragment; A inserts an unnecessary comma.","category":"Punctuation","skill":"No punctuation before essential dependent clause","alsoAppears":""},{"no":"52","source":"Digital SAT 3 – Module 1","test":"3","module":"1","originalQuestion":"24","passage":"Bengali author Toru Dutt’s A Sheaf Gleaned in French Fields (1876), a volume of English translations of French poems, _______ scholars’ understanding of the transnational and multilingual contexts in which Dutt lived and worked.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"has enhanced","B":"are enhancing","C":"have enhanced","D":"enhance"},"answer":"A","explanation":"The subject is the singular book title \"A Sheaf Gleaned in French Fields\" (ignore the appositive and \"poems\"). It takes the singular verb \"has enhanced.\"","category":"Agreement (S-V)","skill":"Subject–verb agreement (singular title; ignore interrupter)","alsoAppears":""},{"no":"53","source":"Digital SAT 3 – Module 1","test":"3","module":"1","originalQuestion":"25","passage":"Journalists have dubbed Gil Scott-Heron the “godfather of rap,” a title that has appeared in hundreds of articles about him since the 1990s. Scott-Heron himself resisted the godfather _______ feeling that it didn’t encapsulate his devotion to the broader African American blues music tradition as well as “bluesologist,” the moniker he preferred.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"nickname, however","B":"nickname, however;","C":"nickname, however,","D":"nickname; however,"},"answer":"C","explanation":"\"However\" interrupts one sentence (the participial phrase \"feeling that...\" is not an independent clause), so it is set off by a pair of commas. D uses a semicolon, which would require an independent clause after it.","category":"Punctuation","skill":"Commas around an interrupting conjunctive adverb","alsoAppears":"SAT 9 M1 Q22"},{"no":"54","source":"Digital SAT 3 – Module 1","test":"3","module":"1","originalQuestion":"26","passage":"From afar, African American fiber artist Bisa Butler’s portraits look like paintings, their depictions of human faces, bodies, and clothing so intricate that it seems only a fine brush could have rendered them. When viewed up close, however, the portraits reveal themselves to be _______ stitching barely visible among the thousands of pieces of printed, microcut fabric.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"quilts, and the","B":"quilts, the","C":"quilts; the","D":"quilts. The"},"answer":"B","explanation":"\"The stitching barely visible...\" is an absolute phrase (no finite verb), so it attaches to the main clause with a comma. A, C, and D treat it as an independent clause, which it is not.","category":"Punctuation","skill":"Comma before an absolute phrase","alsoAppears":""},{"no":"55","source":"Digital SAT 3 – Module 1","test":"3","module":"1","originalQuestion":"27","passage":"Most conifers (trees belonging to the phylum Coniferophyta) are evergreen. That is, they keep their green leaves or needles year-round. However, not all conifer species are evergreen. Larch trees, _______ lose their needles every fall.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"for instance,","B":"nevertheless,","C":"meanwhile,","D":"in addition,"},"answer":"A","explanation":"Larch trees are an example of a conifer that is not evergreen, so \"for instance\" is logical.","category":"Transition","skill":"Example / illustration","alsoAppears":"SAT 10 M2 Q26"},{"no":"56","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"18","passage":"Atoms in a synchrotron, a type of circular particle accelerator, travel faster and faster until they _______ a desired energy level, at which point they are diverted to collide with a target, smashing the atoms.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will reach","B":"reach","C":"had reached","D":"are reaching"},"answer":"B","explanation":"The text describes a general, repeated process in the simple present (\"travel,\" \"are diverted\"), so the simple present \"reach\" is consistent.","category":"Verb Tense","skill":"Simple present for general process","alsoAppears":"SAT 10 M2 Q20"},{"no":"57","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"19","passage":"Even though bats prefer very sweet nectar, the plants that attract them have evolved to produce nectar that is only moderately sweet. A recent study _______ why: making sugar is energy-intensive, and it is more advantageous for plants to make a large amount of low-sugar nectar than a small amount of high-sugar nectar.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"explains","B":"explaining","C":"having explained","D":"to explain"},"answer":"A","explanation":"The subject \"A recent study\" needs a finite main verb: \"explains.\" The other choices are nonfinite.","category":"Verb Form","skill":"Finite vs. nonfinite verb (main verb needed)","alsoAppears":""},{"no":"58","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"20","passage":"Former First Lady of the United States Eleanor Roosevelt and Indian activist and educator Hansa Mehta were instrumental in drafting the United Nations’ Universal Declaration of Human Rights, a document that _______ the basic freedoms to which all people are entitled.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have outlined","B":"were outlining","C":"outlines","D":"outline"},"answer":"C","explanation":"The relative pronoun \"that\" refers to the singular \"a document,\" so the singular verb \"outlines\" is required. The present tense suits a document that still exists.","category":"Agreement (S-V)","skill":"Subject–verb agreement in relative clause","alsoAppears":"SAT 10 M2 Q22"},{"no":"59","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"21","passage":"The life spans of rockfish vary greatly by species. For instance, the colorful calico rockfish (Sebastes dalli) can survive for a little over a _______ the rougheye rockfish (Sebastes aleutianus) boasts a maximum life span of about two centuries.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"decade: while","B":"decade. While","C":"decade; while","D":"decade, while"},"answer":"D","explanation":"\"While the rougheye rockfish boasts...\" is a dependent clause showing contrast, so it is joined to the main clause with a comma. A period or semicolon (B, C) would leave it as a fragment; a colon (A) is not used before a dependent clause here.","category":"Punctuation","skill":"Comma before contrasting dependent clause (while)","alsoAppears":""},{"no":"60","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"22","passage":"The Lion Light system, developed by Kenyan inventor Richard Turere, consists of LED lights installed around the perimeter of livestock pastures. Powered with _______ the blinking LEDs keep lions away at night, thus protecting the livestock without risking harm to the endangered lions.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"energy collected, by solar panels, during the day","B":"energy collected by solar panels during the day","C":"energy collected by solar panels during the day,","D":"energy, collected by solar panels during the day,"},"answer":"C","explanation":"The introductory phrase \"Powered with energy collected by solar panels during the day\" must be followed by a comma before the main clause. Its internal parts are essential, so no internal commas are needed.","category":"Punctuation","skill":"Comma after introductory phrase; no commas in essential phrase","alsoAppears":""},{"no":"61","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"23","passage":"Materials scientist Marie-Agathe Charpagne and her colleagues believed they could improve on the multicomponent alloy NiCoCr, an equal-proportions mixture of nickel (Ni), cobalt (Co), and chromium (Cr), by replacing chromium with ruthenium _______ the alloy that resulted, NiCoRu, turned out to be an unsuitable replacement for NiCoCr.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"(Ru)","B":"(Ru) but","C":"(Ru),","D":"(Ru), but"},"answer":"D","explanation":"Two contrasting independent clauses are joined with a comma plus \"but.\" A is a run-on, B lacks the comma, C is a comma splice.","category":"Punctuation","skill":"Comma + FANBOYS between independent clauses","alsoAppears":""},{"no":"62","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"24","passage":"The Progressive Era in the United States witnessed the rise of numerous Black women’s clubs, local organizations that advocated for racial and gender equality. Among the clubs’ leaders _______ Josephine St. Pierre Ruffin, founder of the Women’s Era Club of Boston.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"was","B":"were","C":"are","D":"have been"},"answer":"A","explanation":"The sentence is inverted; the true subject is the singular \"Josephine St. Pierre Ruffin\" (not \"leaders\"). The historical context calls for past tense, so \"was.\"","category":"Agreement (S-V)","skill":"Subject–verb agreement in inverted sentence","alsoAppears":""},{"no":"63","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"25","passage":"Based on genetic evidence, archaeologists have generally agreed that reindeer domestication began in the eleventh century CE. However, since uncovering fragments of a 2,000-year-old reindeer training harness in northern Siberia, _______ may have begun much earlier.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"researcher Robert Losey has argued that domestication","B":"researcher Robert Losey’s argument is that domestication","C":"domestication, researcher Robert Losey has argued,","D":"the argument researcher Robert Losey has made is that domestication"},"answer":"A","explanation":"The modifier \"since uncovering fragments...\" describes a person who uncovered them, so the subject right after the comma must be \"researcher Robert Losey.\" The other choices create dangling modifiers (an argument or domestication did not uncover anything).","category":"Modifier","skill":"Dangling modifier (subject after introductory phrase)","alsoAppears":""},{"no":"64","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"26","passage":"Hegra is an archaeological site in present-day Saudi Arabia and was the second largest city of the Nabataean Kingdom (fourth century BCE to first century CE). Archaeologist Laila Nehmé recently traveled to Hegra to study its ancient _______ into the rocky outcrops of a vast desert, these burial chambers seem to blend seamlessly with nature.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"tombs. Built","B":"tombs, built","C":"tombs and built","D":"tombs built"},"answer":"A","explanation":"\"Built into the rocky outcrops...\" introduces the second independent clause (\"these burial chambers seem...\"). A period separates the two sentences. B–D create a run-on/comma splice or misattach the modifier.","category":"Punctuation","skill":"Sentence boundary – independent clauses (period)","alsoAppears":""},{"no":"65","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"27","passage":"When external forces are applied to common glass made from silicates, energy builds up around minuscule defects in the material, resulting in fractures. Recently, engineer Erkka Frankberg of Tampere University in Finland used the chemical _______ to make a glassy solid that can withstand higher strain than silicate glass can before fracturing.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"compound, aluminum oxide","B":"compound aluminum oxide,","C":"compound, aluminum oxide,","D":"compound aluminum oxide"},"answer":"D","explanation":"\"Aluminum oxide\" is an essential (restrictive) appositive identifying which compound; it takes no commas. Nothing should separate the object from \"to make.\"","category":"Punctuation","skill":"Restrictive appositive – no commas","alsoAppears":"SAT 9 M2 Q24"},{"no":"66","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"28","passage":"Etched into Peru’s Nazca Desert are line drawings so large that they can only be fully seen from high above. Archaeologists have known of the lines since the 1920s, when a researcher spotted some from a nearby foothill, and they have been studying the markings ever since. _______ archaeologists’ efforts are aided by drones that capture high-resolution aerial photographs of the lines.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Currently,","B":"In comparison,","C":"Still,","D":"However,"},"answer":"A","explanation":"The text moves from past study (since the 1920s) to present practice (\"are aided\"). \"Currently\" marks this time shift.","category":"Transition","skill":"Time / sequence","alsoAppears":"SAT 8 M2 Q28"},{"no":"67","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"29","passage":"Archaeologist Sue Brunning explains why the seventh-century ship burial site at Sutton Hoo in England was likely the tomb of a king. First, the gold artifacts inside the ship suggest that the person buried with them was a wealthy and respected leader. _______ the massive effort required to bury the ship would likely only have been undertaken for a king.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Instead,","B":"Still,","C":"Specifically,","D":"Second,"},"answer":"D","explanation":"The text lists reasons beginning with \"First\"; the next reason is introduced by \"Second.\"","category":"Transition","skill":"Sequence / enumeration","alsoAppears":""},{"no":"68","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"30","passage":"The more diverse and wide ranging an animal’s behaviors, the larger and more energy demanding the animal’s brain tends to be. _______ from an evolutionary perspective, animals that perform only basic actions should allocate fewer resources to growing and maintaining brain tissue. The specialized subtypes of ants within colonies provide an opportunity to explore this hypothesis.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Subsequently,","B":"Besides,","C":"Nevertheless,","D":"Thus,"},"answer":"D","explanation":"The second sentence is a logical conclusion drawn from the first, so \"Thus\" (cause–effect) fits.","category":"Transition","skill":"Cause and effect / conclusion","alsoAppears":"SAT 9 M1 Q29"},{"no":"69","source":"Digital SAT 3 – Module 2","test":"3","module":"2","originalQuestion":"31","passage":"When designing costumes for film, American artist Suttirat Larlarb typically custom fits the garments to each actor. _______ for the film Sunshine, in which astronauts must reignite a dying Sun, she designed a golden spacesuit and had a factory reproduce it in a few standard sizes; lacking a tailor-made quality, the final creations reflected the ungainliness of actual spacesuits.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Nevertheless,","B":"Thus,","C":"Likewise,","D":"Moreover,"},"answer":"A","explanation":"Standard-size spacesuits contrast with her usual custom-fitting practice. \"Nevertheless\" signals this exception/contrast.","category":"Transition","skill":"Contrast / exception","alsoAppears":""},{"no":"70","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"19","passage":"Literary agents estimate that more than half of all nonfiction books credited to a celebrity or other public figure are in fact written by ghostwriters, professional authors who are paid to write other _______ but whose names never appear on book covers.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"people’s stories","B":"peoples story’s","C":"peoples stories","D":"people’s story’s"},"answer":"A","explanation":"\"People\" is already plural, so its possessive is \"people’s.\" \"Stories\" is a plural noun that owns nothing, so it takes no apostrophe.","category":"Possessive/Plural","skill":"Possessive of irregular plural + plural noun","alsoAppears":""},{"no":"71","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"20","passage":"Like other amphibians, the wood frog (Rana sylvatica) is unable to generate its own heat, so during periods of subfreezing temperatures, it _______ by producing large amounts of glucose, a sugar that helps prevent damaging ice from forming inside its cells.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"had survived","B":"survived","C":"would survive","D":"survives"},"answer":"D","explanation":"The text states a general scientific fact in the present tense (\"is unable\"), so the simple present \"survives\" is consistent.","category":"Verb Tense","skill":"Simple present for general fact","alsoAppears":""},{"no":"72","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"21","passage":"After a spate of illnesses as a child, Wilma Rudolph was told she might never walk again. Defying all odds, Rudolph didn’t just walk, she _______ the 1960 Summer Olympics in Rome, she won both the 100- and 200-meter dashes and clinched first place for her team in the 4 ×100-meter relay, becoming the first US woman to win three gold medals in a single Olympics.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"ran—fast—during","B":"ran—fast during","C":"ran—fast, during","D":"ran—fast. During"},"answer":"D","explanation":"\"During the 1960 Summer Olympics in Rome, she won...\" is a new independent clause, so a period is needed after \"fast.\" The other choices fuse the two sentences.","category":"Punctuation","skill":"Sentence boundary – independent clauses (period)","alsoAppears":""},{"no":"73","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"22","passage":"In many of her landscape paintings from the 1970s and 1980s, Lebanese American artist Etel Adnan worked to capture the essence of California’s fog-shrouded Mount Tamalpais region through abstraction, using splotches of color to represent the area’s features. Interestingly, the triangle representing the mountain itself _______ among the few defined figures in her paintings.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are","B":"have been","C":"were","D":"is"},"answer":"D","explanation":"The subject is the singular \"the triangle\" (ignore \"representing the mountain itself\"), so the singular \"is\" is needed. Present tense suits describing existing paintings.","category":"Agreement (S-V)","skill":"Subject–verb agreement (singular subject + modifier)","alsoAppears":""},{"no":"74","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"23","passage":"Seneca sculptor Marie Watt’s blanket art comes in a range of shapes and sizes. In 2004, Watt sewed strips of blankets together to craft a 10-by-13-inch _______ in 2014, she arranged folded blankets into two large stacks and then cast them in bronze, creating two curving 18-foot-tall blue-bronze pillars.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"sampler later,","B":"sampler;","C":"sampler,","D":"sampler, later,"},"answer":"B","explanation":"Two independent clauses (\"In 2004, Watt sewed...\" / \"in 2014, she arranged...\") are joined without a conjunction, so a semicolon is required. C and D are comma splices; A is a run-on.","category":"Punctuation","skill":"Semicolon between independent clauses","alsoAppears":""},{"no":"75","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"24","passage":"African American Percy Julian was a scientist and entrepreneur whose work helped people around the world to see. Named in 1999 as one of the greatest achievements by a US chemist in the past hundred years, _______ led to the first mass-produced treatment for glaucoma.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Julian synthesized the alkaloid physostigmine in 1935; it","B":"in 1935 Julian synthesized the alkaloid physostigmine, which","C":"Julian’s 1935 synthesis of the alkaloid physostigmine","D":"the alkaloid physostigmine was synthesized by Julian in 1935 and"},"answer":"C","explanation":"The introductory modifier says something was \"named...as one of the greatest achievements.\" The achievement is Julian’s synthesis, so \"Julian’s 1935 synthesis...\" must come right after the comma. The other choices make Julian or the alkaloid the \"achievement\" (dangling modifier).","category":"Modifier","skill":"Dangling modifier (subject after introductory phrase)","alsoAppears":""},{"no":"76","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"25","passage":"The Arctic-Alpine Botanic Garden in Norway and the Jardim Botânico of Rio de Janeiro in Brazil are two of many botanical gardens around the world dedicated to growing diverse plant _______ fostering scientific research; and educating the public about plant conservation.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"species, both native and nonnative,","B":"species, both native and nonnative;","C":"species; both native and nonnative,","D":"species both native and nonnative,"},"answer":"B","explanation":"This is a series of three items separated by semicolons (\"; and educating...\"). Item 1 contains an internal comma (\"species, both native and nonnative\"), so it ends with a semicolon.","category":"Punctuation","skill":"Semicolons in a complex series","alsoAppears":""},{"no":"77","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"26","passage":"Sociologist Alton Okinaka sits on the review board tasked with adding new sites to the Hawai‘i Register of Historic Places, which includes Pi‘ilanihale Heiau and the ‘Ōpaeka‘a Road Bridge. Okinaka doesn’t make such decisions _______ all historical designations must be approved by a group of nine other experts from the fields of architecture, archaeology, history, and Hawaiian culture.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"single-handedly, however;","B":"single-handedly; however,","C":"single-handedly, however,","D":"single-handedly however"},"answer":"A","explanation":"\"However\" belongs to the first clause (it contrasts with the previous sentence), so it is set off with a comma and followed by a semicolon that separates the two independent clauses. B would link \"however\" illogically to the second clause.","category":"Punctuation","skill":"Semicolon + conjunctive adverb placement","alsoAppears":""},{"no":"78","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"27","passage":"In 1968, US Congressman John Conyers introduced a bill to establish a national holiday in honor of Dr. Martin Luther King Jr. The bill didn’t make it to a vote, but Conyers was determined. He teamed up with Shirley Chisholm, the first Black woman to be elected to Congress, and they resubmitted the bill every session for the next fifteen years. _______ in 1983, the bill passed.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Instead,","B":"Likewise,","C":"Finally,","D":"Additionally,"},"answer":"C","explanation":"After fifteen years of effort, the bill passed at last. \"Finally\" signals the end of a long sequence.","category":"Transition","skill":"Sequence / conclusion of a process","alsoAppears":""},{"no":"79","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"28","passage":"Geoscientists have long considered Hawaii’s Mauna Loa volcano to be Earth’s largest shield volcano by volume, measuring approximately 74,000 cubic kilometers. _______ according to a 2020 study by local geoscientist Michael Garcia, Hawaii’s Pūhāhonu shield volcano is significantly larger, boasting a volume of about 148,000 cubic kilometers.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Secondly,","B":"Consequently,","C":"Moreover,","D":"However,"},"answer":"D","explanation":"The new study contradicts the long-held view, so the contrast word \"However\" is needed.","category":"Transition","skill":"Contrast","alsoAppears":""},{"no":"80","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"29","passage":"Samuel Coleridge-Taylor was a prominent classical music composer from England who toured the US three times in the early 1900s. The child of a West African father and an English mother, Coleridge-Taylor emphasized his mixed-race ancestry. For example, he referred to himself as Anglo-African. _______ he incorporated the sounds of traditional African music into his classical music compositions.","stem":"Which choice completes the text with the most lo
