gical transition?","options":{"A":"In addition,","B":"Actually,","C":"However,","D":"Regardless,"},"answer":"A","explanation":"The sentence gives a second example of how he emphasized his ancestry, so \"In addition\" is logical.","category":"Transition","skill":"Addition","alsoAppears":""},{"no":"81","source":"Digital SAT 4 – Module 1","test":"4","module":"1","originalQuestion":"30","passage":"In 2019, researcher Patricia Jurado Gonzalez and food historian Nawal Nasrallah prepared a stew from a 4,000-year-old recipe found on a Mesopotamian clay tablet. When they tasted the dish, known as pašrūtum (“unwinding”), they found that it had a mild taste and inspired a sense of calm. _______ the researchers, knowing that dishes were sometimes named after their intended effects, theorized that the dish’s name, “unwinding,” referred to its function: to help ancient diners relax.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Therefore,","B":"Alternately,","C":"Nevertheless,","D":"Likewise,"},"answer":"A","explanation":"The researchers' theory is a conclusion drawn from their experience of the dish's calming effect. \"Therefore\" signals this result.","category":"Transition","skill":"Cause and effect / conclusion","alsoAppears":""},{"no":"82","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"19","passage":"In his groundbreaking book Bengali Harlem and the Lost Histories of South Asian America, Vivek Bald uses newspaper articles, census records, ships’ logs, and memoirs to tell the _______ who made New York City their home in the early twentieth century.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"story’s of the South Asian immigrants","B":"story’s of the South Asian immigrants’","C":"stories of the South Asian immigrants","D":"stories’ of the South Asian immigrant’s"},"answer":"C","explanation":"Neither \"stories\" nor \"immigrants\" possesses anything here, so both are simple plurals without apostrophes.","category":"Possessive/Plural","skill":"Plural vs. possessive (no apostrophe needed)","alsoAppears":""},{"no":"83","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"20","passage":"In her two major series “Memory Test” and “Autobiography,” painter Howardena Pindell explored themes _______ healing, self-discovery, and memory by cutting and sewing back together pieces of canvas and inserting personal artifacts, such as postcards, into some of the paintings.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"of","B":"of,","C":"of—","D":"of:"},"answer":"A","explanation":"No punctuation belongs between a preposition (\"of\") and its object (\"healing, self-discovery, and memory\").","category":"Punctuation","skill":"No punctuation between preposition and object","alsoAppears":""},{"no":"84","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"21","passage":"Both Sona Charaipotra, an Indian American, and Dhonielle Clayton, an African American, grew up frustrated by the lack of diverse characters in books for young people. In 2011, these two writers joined forces to found CAKE Literary, a book packaging _______ specializes in the creation and promotion of stories told from diverse perspectives for children and young adults.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"company,","B":"company that","C":"company","D":"company, that"},"answer":"B","explanation":"\"That specializes in...\" is an essential relative clause describing the company; it needs the relative pronoun \"that\" and no comma. A and C lack a connecting word; D wrongly uses a comma before \"that.\"","category":"Sentence Structure","skill":"Restrictive relative clause (that, no comma)","alsoAppears":""},{"no":"85","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"22","passage":"A study led by scientist Rebecca Kirby at the University of Wisconsin–Madison found that black bears that eat human food before hibernation have increased levels of a rare carbon isotope, _______ due to the higher 13C levels in corn and cane sugar. Bears with these elevated levels were also found to have much shorter hibernation periods on average.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"carbon-13, (13C)","B":"carbon-13 (13C)","C":"carbon-13, (13C),","D":"carbon-13 (13C),"},"answer":"D","explanation":"\"Carbon-13 (13C)\" is a nonessential appositive opened by the comma after \"isotope,\" so it must close with a comma. The parenthetical abbreviation stays attached to \"carbon-13\" with no comma in between.","category":"Punctuation","skill":"Paired commas around appositive (with parenthesis)","alsoAppears":""},{"no":"86","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"23","passage":"In 2010, archaeologist Noel Hidalgo Tan was visiting the twelfth-century temple of Angkor Wat in Cambodia when he noticed markings of red paint on the temple _______ the help of digital imaging techniques, he discovered the markings to be part of an elaborate mural containing over 200 paintings.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"walls, with","B":"walls with","C":"walls so with","D":"walls. With"},"answer":"D","explanation":"\"With the help of digital imaging techniques, he discovered...\" is a new independent clause, so a period is needed. A is a comma splice, B a run-on, C illogical.","category":"Punctuation","skill":"Sentence boundary – independent clauses (period)","alsoAppears":""},{"no":"87","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"24","passage":"Working from an earlier discovery of Charpentier’s, chemists Emmanuelle Charpentier and Jennifer Doudna—winners of the 2020 Nobel Prize in Chemistry—re-created and then reprogrammed the so-called “genetic scissors” of a species of DNA-cleaving bacteria _______ a tool that is revolutionizing the field of gene technology.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"to forge","B":"forging","C":"forged","D":"and forging"},"answer":"A","explanation":"The infinitive \"to forge\" expresses purpose (they reprogrammed the scissors in order to forge a tool). \"Forging\" (B) would illogically modify \"bacteria,\" and C/D create faulty structure.","category":"Verb Form","skill":"Infinitive of purpose","alsoAppears":""},{"no":"88","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"25","passage":"In 2016, engineer Vanessa Galvez oversaw the installation of 164 bioswales, vegetated channels designed to absorb and divert stormwater, along the streets of Queens, New York. By reducing the runoff flowing into city sewers, _______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"the mitigation of both street flooding and the resulting pollution of nearby waterways has been achieved by bioswales.","B":"the bioswales have mitigated both street flooding and the resulting pollution of nearby waterways.","C":"the bioswales’ mitigation of both street flooding and the resulting pollution of nearby waterways has been achieved.","D":"both street flooding and the resulting pollution of nearby waterways have been mitigated by bioswales."},"answer":"B","explanation":"\"By reducing the runoff\" describes what the bioswales did, so \"the bioswales\" must be the subject immediately after the comma. The other choices make \"the mitigation,\" \"the bioswales’ mitigation,\" or \"flooding\" do the reducing.","category":"Modifier","skill":"Dangling modifier (subject after introductory phrase)","alsoAppears":""},{"no":"89","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"26","passage":"A study published by Rice University geoscientist Ming Tang in 2019 offers a new explanation for the origin of Earth’s _______ structures called arcs, towering ridges that form when a dense oceanic plate subducts under a less dense continental plate, melts in the mantle below, and then rises and bursts through the continental crust above.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"continents geological","B":"continents: geological","C":"continents; geological","D":"continents. Geological"},"answer":"B","explanation":"The first part is an independent clause, and what follows (\"geological structures called arcs...\") is a noun phrase that specifies the explanation. A colon correctly introduces it. C and D would leave a fragment; A runs the two together.","category":"Punctuation","skill":"Colon introducing an explanation/specification","alsoAppears":""},{"no":"90","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"27","passage":"During a 2021 launch, Rocket Labs’ Electron rocket experienced an unexpected failure: its second-stage booster shut down suddenly after ignition. _______ instead of downplaying the incident, Rocket Labs’ CEO publicly acknowledged what happened and apologized for the loss of the rocket’s payload, which had consisted of two satellites.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Afterward,","B":"Additionally,","C":"Indeed,","D":"Similarly,"},"answer":"A","explanation":"The CEO’s response came after the failure, so the time-sequence transition \"Afterward\" is logical.","category":"Transition","skill":"Time / sequence","alsoAppears":""},{"no":"91","source":"Digital SAT 4 – Module 2","test":"4","module":"2","originalQuestion":"28","passage":"When soil becomes contaminated by toxic metals, it can be removed from the ground and disposed of in a landfill. _______ contaminated soil can be detoxified via phytoremediation: plants that can withstand high concentrations of metals absorb the pollutants and store them in their shoots, which are then cut off and safely disposed of, preserving the health of the plants.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Alternatively,","B":"Specifically,","C":"For example,","D":"As a result,"},"answer":"A","explanation":"Phytoremediation is a different option from removing the soil to a landfill. \"Alternatively\" introduces another possible method.","category":"Transition","skill":"Alternative","alsoAppears":""},{"no":"92","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"20","passage":"Lê Lương Minh became the thirteenth secretary-general of the Association of Southeast Asian Nations (ASEAN) in January 2013, making _______ the first time the organization would appoint a Vietnamese leader.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"these","B":"those","C":"this","D":"some"},"answer":"C","explanation":"The pronoun refers to a single event—Minh becoming secretary-general—so the singular \"this\" is required.","category":"Agreement (Pronoun)","skill":"Pronoun–antecedent agreement (singular)","alsoAppears":""},{"no":"93","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"21","passage":"In 1929, Edwin Herbert Land invented a polarizing filter that was featured in a number of products, from sunglasses to 3D movies. A decade later, Land _______ his technology to invent the world’s first instant camera, the Polaroid Land camera.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"used","B":"to have used","C":"to use","D":"using"},"answer":"A","explanation":"The subject \"Land\" needs a finite main verb. \"Used\" is finite and in the past tense, matching \"invented\" and \"a decade later.\"","category":"Verb Form","skill":"Finite vs. nonfinite verb (main verb needed)","alsoAppears":""},{"no":"94","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"22","passage":"An online content creator who uses copyrighted songs without permission risks being demonetized (prohibited from including paid advertisements in content). The best way to avoid demonetization is to choose music from the public domain. Using one of these noncopyrighted songs _______ a creator won’t lose advertising revenue.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are ensuring","B":"have ensured","C":"ensure","D":"ensures"},"answer":"D","explanation":"The subject is the gerund phrase \"Using one of these noncopyrighted songs,\" which is singular, so it takes the singular verb \"ensures.\"","category":"Agreement (S-V)","skill":"Subject–verb agreement (gerund subject)","alsoAppears":""},{"no":"95","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"23","passage":"What makes the theremin a unique musical instrument? You play it without touching it. When you place your _______ the pitch will shift as your hands move through the air.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"hand’s between the two antenna’s,","B":"hands between the two antennas,","C":"hands’ between the two antennas’,","D":"hands’ between the two antennas,"},"answer":"B","explanation":"\"Hands\" and \"antennas\" are simple plurals that do not possess anything, so neither takes an apostrophe. (Note: the source prints the transition stem for this item, but it tests Standard English conventions.)","category":"Possessive/Plural","skill":"Plural vs. possessive (no apostrophe needed)","alsoAppears":""},{"no":"96","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"24","passage":"In the music video for the song “We Didn’t Start the Fire” by Billy Joel, the singer lists 118 political and cultural references. Such iconic references, cited in rapid and frenetic procession by the musician, who is seated impassively at a dinner table, _______ key moments and personalities of the twentieth century.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"represents","B":"has represented","C":"was representing","D":"represent"},"answer":"D","explanation":"The subject is the plural \"Such iconic references\" (the long interrupter doesn't change it), so the plural verb \"represent\" is needed.","category":"Agreement (S-V)","skill":"Subject–verb agreement (plural subject + interrupter)","alsoAppears":""},{"no":"97","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"25","passage":"Long attributed to Jacques-Louis David, the preeminent Neoclassical painter of his day, the 1801 painting Marie Joséphine Charlotte du Val d’Ognes gained fresh attention in the 1990s when art historians discovered that the painting—which depicts a solitary young woman sketching—was actually the work of little-known French portrait _______ Marie-Denise Villers (1774–1821).","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"artist—","B":"artist","C":"artist:","D":"artist,"},"answer":"B","explanation":"\"Marie-Denise Villers\" is an essential (restrictive) appositive identifying which portrait artist, so no punctuation separates it from \"artist.\"","category":"Punctuation","skill":"Restrictive appositive – no punctuation (title + name)","alsoAppears":""},{"no":"98","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"26","passage":"In 1986, conceptual artist Sophie Calle asked twenty-three people, all of whom had been born without sight, to describe “their image of beauty” in rich detail. Calle paired excerpts of these conversations with photographs—both of interviewees and the items they _______ to powerful effect in her exhibition The Blind.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"described, from hair to grass to sculptures","B":"described, from hair to grass to sculptures—","C":"described—from hair to grass to sculptures,","D":"described: from hair to grass to sculptures"},"answer":"B","explanation":"The supplementary element begins with a dash after \"photographs,\" so it must close with a dash before \"to powerful effect.\" Inside it, a comma sets off the examples \"from hair to grass to sculptures.\"","category":"Punctuation","skill":"Paired dashes around a supplementary element","alsoAppears":""},{"no":"99","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"27","passage":"Celebrated Tewa potter Maria Martinez (1887–1980) made her signature all-black ceramic vessels using a heating technique called reduction firing. This technique involves smothering the flame surrounding the clay vessel. _______ the vessel takes on a shiny, black hue.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"On the contrary,","B":"For example,","C":"Previously,","D":"As a result,"},"answer":"D","explanation":"The black hue is the effect of smothering the flame, so \"As a result\" (cause–effect) is correct.","category":"Transition","skill":"Cause and effect","alsoAppears":""},{"no":"100","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"28","passage":"Historians agree that the jazz pianist Jelly Roll Morton was exaggerating when he claimed to have invented jazz music. No one can deny, _______ that Morton’s innovative compositions and remarkable improvisational skills helped shape jazz as a genre during its early years.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"therefore,","B":"in the second place,","C":"in other words,","D":"though,"},"answer":"D","explanation":"The sentence concedes Morton's real importance in contrast to his exaggeration. \"Though\" signals this contrast.","category":"Transition","skill":"Contrast / concession","alsoAppears":""},{"no":"101","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"29","passage":"According to Duverger’s law, countries with single-ballot majoritarian elections for single-member districts tend to polarize into two-party systems, wherein dueling political parties consistently dominate the political system. _______ countries with proportional-representation electoral systems tend to support multi-partyism, under which power gets distributed among many political parties.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Subsequently,","B":"Conversely,","C":"For instance,","D":"In other words,"},"answer":"B","explanation":"The sentence describes the opposite situation (multi-party vs. two-party), so \"Conversely\" is logical.","category":"Transition","skill":"Contrast (opposite case)","alsoAppears":""},{"no":"102","source":"Digital SAT 5 – Module 1","test":"5","module":"1","originalQuestion":"30","passage":"A turtle shell appears external to the animal, protecting its body like armor. _______ the shell is often incorrectly assumed to be an exoskeleton, a rigid outer casing like that of a crustacean or an insect, when in fact it is an endoskeleton, a part of the turtle’s internal bone structure, more akin to a spine or a pair of ribs.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"That being said,","B":"However,","C":"For instance,","D":"Hence,"},"answer":"D","explanation":"Because the shell looks external, people assume it is an exoskeleton. \"Hence\" shows that this assumption follows from the previous sentence.","category":"Transition","skill":"Cause and effect","alsoAppears":""},{"no":"103","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"18","passage":"How did whales, once no bigger than seals, evolve to become the largest animals on Earth? Brazilian biologist Mariana Nery believes the answer might be found in whales’ DNA. In January 2023, Nery and her colleagues _______ a study showing changes over time in four whale genes associated with body size.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"published","B":"publishing","C":"having published","D":"to publish"},"answer":"A","explanation":"The subject \"Nery and her colleagues\" needs a finite main verb; \"published\" is finite and past tense (January 2023).","category":"Verb Form","skill":"Finite vs. nonfinite verb (main verb needed)","alsoAppears":""},{"no":"104","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"19","passage":"A harpsichord may look just like a piano, but the difference between the two instruments is easy to hear. When a harpsichord’s keys are pressed, the strings inside the _______ are plucked, not struck.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"instrument:","B":"instrument","C":"instrument—","D":"instrument,"},"answer":"B","explanation":"\"The strings inside the instrument\" is the subject and \"are plucked\" is the verb. No punctuation belongs between a subject and its verb.","category":"Punctuation","skill":"No punctuation between subject and verb","alsoAppears":""},{"no":"105","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"20","passage":"When they were first introduced to western Europe from Byzantium in the eleventh century, table forks were met with much resistance. The Bishop of Ostia, St. Peter Damian, condemned the eating utensils because he considered _______ dangerous and unnecessary luxury items.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"them","B":"this","C":"that","D":"it"},"answer":"A","explanation":"The pronoun refers to the plural \"the eating utensils\" (table forks) and must match \"items,\" so the plural \"them\" is correct.","category":"Agreement (Pronoun)","skill":"Pronoun–antecedent agreement (plural)","alsoAppears":""},{"no":"106","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"21","passage":"Julia Alvarez’s 1994 novel In the Time of the Butterflies, a fictionalized account of the lives of the Mirabal _______ can serve as a starting point for those wanting to explore how the rule of dictator Rafael Trujillo has been represented in Dominican American literature.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"sisters, and","B":"sisters and","C":"sisters,","D":"sisters"},"answer":"C","explanation":"The appositive \"a fictionalized account...Mirabal sisters\" is opened with a comma, so it must close with a comma before the verb \"can serve.\" Adding \"and\" would create a compound subject with no verb logic.","category":"Punctuation","skill":"Paired commas around a nonessential appositive","alsoAppears":""},{"no":"107","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"22","passage":"On March 23, 2021, a gust of wind wreaked havoc on global trade. Ever Given, an international shipping container vessel, became lodged in Egypt’s Suez Canal, a major shipping route between Europe and Asia. The vessel took six days to _______ it’s as heavy as two thousand blue whales when fully loaded.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"dislodge in part due to its sheer size,","B":"dislodge, in part due to its sheer size:","C":"dislodge, in part due to its sheer size,","D":"dislodge, in part, due to its sheer size"},"answer":"B","explanation":"\"In part due to its sheer size\" is a supplementary phrase set off with a comma. The next part (\"it’s as heavy as...\") is an independent clause that explains the size, so a colon is appropriate. A and C create comma splices; D is a run-on.","category":"Punctuation","skill":"Colon between independent clauses (explanation)","alsoAppears":""},{"no":"108","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"23","passage":"Fans of the film Moana (2016) may not know that the deep and humorous voice behind the _______ belongs to comedian, actor, and musician Jemaine Clement. The versatile performer has appeared in everything from television commercials to action movies, but voice acting, specifically, has become a notable part of his career.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"character Tamatoa the crab","B":"character Tamatoa the crab,","C":"character: Tamatoa the crab,","D":"character, Tamatoa the crab"},"answer":"A","explanation":"\"Tamatoa the crab\" is a restrictive appositive identifying which character, so no commas are used. Also, no punctuation belongs between the subject (\"the...voice behind the character Tamatoa the crab\") and the verb \"belongs.\"","category":"Punctuation","skill":"Restrictive appositive; no comma before verb","alsoAppears":""},{"no":"109","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"24","passage":"In her 1983 book The Managed Heart: Commercialization of Human Feeling, sociologist Arlie Russell Hochschild first explored at length her conception of a “sociology of emotions”—the idea that the various cultural and ideological frameworks a person has internalized (class, gender, political affiliation, etc.) _______ each emotional reaction that person has within a situation.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"underlies","B":"is underlying","C":"underlie","D":"has been underlying"},"answer":"C","explanation":"The subject is the plural \"the various cultural and ideological frameworks,\" so the plural verb \"underlie\" is required. Present tense fits a general idea.","category":"Agreement (S-V)","skill":"Subject–verb agreement (plural subject + interrupter)","alsoAppears":""},{"no":"110","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"25","passage":"American abstract artist Richard _______ his installations to make passersby keenly aware of how one’s movements are affected by the physical features of one’s environment, assembles large-scale steel plates into sculptures that dominate the outdoor spaces they occupy.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Serra is intending","B":"Serra, intends","C":"Serra, intending","D":"Serra intends"},"answer":"C","explanation":"The main verb is \"assembles.\" The words between the commas must be a nonessential participial phrase (\"intending his installations to...\"), so \"Serra, intending\" is correct. A finite verb (A, B, D) would create two main verbs.","category":"Verb Form","skill":"Participial phrase as supplement (nonfinite) + paired commas","alsoAppears":""},{"no":"111","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"26","passage":"In 1949, Frank Zamboni developed an ice rink resurfacing machine. As Zamboni’s machine moved along the rink’s surface, it first scraped off the top layer of ice. _______ it sprayed water into the deep grooves left behind by customers’ skates. Lastly, it smoothed over the newly formed ice.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For example,","B":"Next,","C":"Similarly,","D":"In contrast,"},"answer":"B","explanation":"The steps are in order: \"first,\" ___, \"Lastly.\" \"Next\" fits the middle step.","category":"Transition","skill":"Sequence","alsoAppears":""},{"no":"112","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"27","passage":"In 2014, Nestor Gomez won his first-ever storytelling competition, relating a tale about his life as a Guatemalan immigrant living in Chicago. _______ in 2017, Gomez created the show 80 Minutes Around the World as a platform for others to share stories about their immigration experiences.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Instead,","B":"For example,","C":"Later,","D":"In other words,"},"answer":"C","explanation":"The 2017 event came after the 2014 event, so the time transition \"Later\" is logical.","category":"Transition","skill":"Time / sequence","alsoAppears":""},{"no":"113","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"28","passage":"To guarantee the validity of experimental results, scientists rely on precise, unchanging standards of measurement. _______ metrologists (scientists who study measurement) developed the SI, or International System of Units. The SI’s units of measurement are based on unchanging values in nature, such as the mass of an electron or the speed of light.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In contrast,","B":"Regardless,","C":"In addition,","D":"For this reason,"},"answer":"D","explanation":"Metrologists developed the SI because scientists need unchanging standards. \"For this reason\" signals cause–effect.","category":"Transition","skill":"Cause and effect","alsoAppears":""},{"no":"114","source":"Digital SAT 5 – Module 2","test":"5","module":"2","originalQuestion":"29","passage":"In retrospect, one of the lessons of the 2003 Human Genome Project is that a gene is affected by many factors, not the least of which is its interactions with the protein products of other genes. _______ rather than just focusing on the human genome, efforts to better understand gene mutations related to disease have begun to consider the human proteome, the complete set of proteins expressed by human genes.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In other words,","B":"That said,","C":"For example,","D":"Accordingly,"},"answer":"D","explanation":"The shift in research focus is a consequence of the lesson learned. \"Accordingly\" signals a response that follows logically.","category":"Transition","skill":"Cause and effect / consequence","alsoAppears":""},{"no":"115","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"19","passage":"The Boston Saloon was one of the most popular African American–owned establishments in nineteenth-century Nevada. _______ by businessman William A.G. Brown, the saloon was known to offer elegant accommodations and an inclusive environment.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Created","B":"Creates","C":"Creating","D":"Create"},"answer":"A","explanation":"The introductory phrase modifies \"the saloon,\" which was created (passive meaning) by Brown. The past participle \"Created\" expresses this. \"Creating\" would mean the saloon did the creating; B and D are finite verbs that don't fit an introductory modifier.","category":"Verb Form","skill":"Past participle as introductory modifier","alsoAppears":""},{"no":"116","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"20","passage":"Louise Bennett (1919–2006), also known as “Miss Lou,” was an influential Jamaican poet and folklorist. Her innovative poems _______ the use of Jamaican Creole (a spoken language) in literature.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"popularized;","B":"popularized,","C":"popularized","D":"popularized:"},"answer":"C","explanation":"\"The use of Jamaican Creole\" is the direct object of \"popularized.\" No punctuation belongs between a verb and its object.","category":"Punctuation","skill":"No punctuation between verb and object","alsoAppears":""},{"no":"117","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"21","passage":"“He was just the man for such a place, and it was just the place for such a man.” This line is from Frederick Douglass’s autobiography Narrative of the Life of Frederick Douglass (1845). It’s an example of antimetabole, a writing technique that _______ emphasis by repeating a statement in a reversed order.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"create","B":"are creating","C":"have created","D":"creates"},"answer":"D","explanation":"\"That\" refers to the singular \"a writing technique,\" so the singular present-tense \"creates\" is correct (general definition).","category":"Agreement (S-V)","skill":"Subject–verb agreement in relative clause","alsoAppears":""},{"no":"118","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"22","passage":"Researchers Amit Kumar and Nicholas Epley investigated how _______ In a series of experiments conducted in 2022, they found that people performing small acts of kindness underestimated the positive effect their actions had on others.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"do people perceive acts of kindness.","B":"do people perceive acts of kindness?","C":"people perceive acts of kindness?","D":"people perceive acts of kindness."},"answer":"D","explanation":"This is an indirect (embedded) question inside a statement, so it uses statement word order (subject + verb: \"people perceive\") and ends with a period, not a question mark.","category":"Sentence Structure","skill":"Indirect question – word order & end punctuation","alsoAppears":""},{"no":"119","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"23","passage":"In a painting titled “The Milkmaid” by Johannes Vermeer, the artist prominently features a bread basket, milk pitcher, and bowl. Such quotidian objects, depicted in exquisite detail by Vermeer, a painter celebrated for his naturalism, _______ the daily minutiae of a seventeenth-century Dutch household.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"was revealing","B":"has revealed","C":"reveals","D":"reveal"},"answer":"D","explanation":"The subject is the plural \"Such quotidian objects\" (ignore the long interrupter), so the plural verb \"reveal\" is needed.","category":"Agreement (S-V)","skill":"Subject–verb agreement (plural subject + interrupter)","alsoAppears":""},{"no":"120","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"24","passage":"Jamaican British artist Willard Wigan is known for his remarkable _______ so small that they are best viewed through a microscope, Wigan’s sculptures are made from tiny natural materials, such as spiderweb strands.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"microsculptures creations","B":"microsculptures, creations","C":"microsculptures. Creations","D":"microsculptures and creations"},"answer":"C","explanation":"\"Creations so small that...microscope\" is an introductory appositive for the second sentence's subject \"Wigan’s sculptures.\" A period ends the first sentence; the other options fuse two independent clauses.","category":"Punctuation","skill":"Sentence boundary – independent clauses (period)","alsoAppears":""},{"no":"121","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"25","passage":"Consider the mechanics of the pinhole camera: light passes through a small hole, resulting in a focused projected image. A ray diagram reveals how this _______ the hole’s small size restricts light to a single ray, all light passing through the hole can only arrive at a single destination, eliminating diffraction and ensuring a clear image.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"works because","B":"works. Because","C":"works, it’s because","D":"works: it’s because"},"answer":"B","explanation":"\"Because the hole’s small size restricts light..., all light...can only arrive...\" is a complete sentence (dependent clause + main clause). A period ends the previous sentence. C and D create a comma splice after \"ray\"; A fuses the sentences.","category":"Punctuation","skill":"Sentence boundary (dependent clause starts new sentence)","alsoAppears":""},{"no":"122","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"26","passage":"In the search for extraterrestrial life, astrobiologists Stuart Bartlett and Michael L. Wong propose that scientists avoid using the term “life.” _______ researchers should use another word: “lyfe.” This new term, they argue, could be used to draw distinctions between the known characteristics of life on Earth and the potentially differing characteristics of lyfe on other planets.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Previously,","B":"Regardless,","C":"There,","D":"Instead,"},"answer":"D","explanation":"Using \"lyfe\" is proposed as a replacement for \"life,\" so \"Instead\" is logical.","category":"Transition","skill":"Alternative / replacement","alsoAppears":""},{"no":"123","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"27","passage":"Before it unveiled a massive new gallery in 2009, the Art Institute of Chicago was only able to display about 5% of its art collection. _______ the museum is able to display close to 30% of its collection.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Additionally,","B":"For example,","C":"Nevertheless,","D":"Today,"},"answer":"D","explanation":"The text contrasts the past (before 2009) with the present (\"is able\"), so \"Today\" is the logical time transition.","category":"Transition","skill":"Time (past vs. present)","alsoAppears":""},{"no":"124","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"28","passage":"Working together with the Navajo Nation Department of Water Resources, Dr. Lani Tsinnajinnie analyzed data about snowpack levels in the Chuska Mountains. She found that the snowpack (the amount of snow on the ground) was deepest in early March at lower elevations. At higher elevations, _______ the snowpack was deepest in mid-March.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in other words,","B":"for instance,","C":"on the other hand,","D":"in summary,"},"answer":"C","explanation":"Higher elevations show a different result than lower elevations. \"On the other hand\" signals this contrast.","category":"Transition","skill":"Contrast","alsoAppears":""},{"no":"125","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"29","passage":"The Inca of South America used intricately knotted string devices called quipus to record countable information, like population data and payments. _______ they may have used quipus to record more complex information, like stories and myths, according to researchers.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"As a result,","B":"In other words,","C":"In addition,","D":"For example,"},"answer":"C","explanation":"Recording stories is an additional possible use of quipus, so \"In addition\" is logical.","category":"Transition","skill":"Addition","alsoAppears":""},{"no":"126","source":"Digital SAT 6 – Module 1","test":"6","module":"1","originalQuestion":"30","passage":"In hindsight, given the ideas about the natural world circulating among British scientists in the 1800s, the theory of natural selection was an obvious next step. It may not have been a coincidence, _______ that Charles Darwin and Alfred Wallace arrived at the concept independently. Indeed, contrary to the popular myth of the lone genius, theirs is not the first paradigm-shifting theory to have emerged from multiple scholars working in parallel.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"however,","B":"then,","C":"moreover,","D":"for example,"},"answer":"B","explanation":"The sentence draws a conclusion from the previous one (since the theory was an obvious next step, simultaneous discovery was likely no coincidence). \"Then\" here means \"therefore/in that case.\"","category":"Transition","skill":"Conclusion / inference","alsoAppears":""},{"no":"127","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"19","passage":"In forecasting weather events, meteorologists sometimes discuss the role of atmospheric rivers. What are atmospheric rivers, and how _______ Part of the water cycle, atmospheric rivers are narrow channels of moisture moving through the atmosphere. In certain conditions, these “rivers” can release some of their moisture as precipitation.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"do they affect our weather.","B":"they do affect our weather.","C":"do they affect our weather?","D":"they do affect our weather?"},"answer":"C","explanation":"This is a direct question (\"What are atmospheric rivers, and how...\"), so it needs question word order (\"do they affect\") and a question mark.","category":"Sentence Structure","skill":"Direct question – word order & question mark","alsoAppears":""},{"no":"128","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"20","passage":"One of the few African American global explorers during the turn of the 20th century, _______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Matthew Henson made several treks across Greenland between 1891 and 1909.","B":"1891 and 1909 were the years between which Matthew Henson made several treks across Greenland.","C":"Greenland was where Matthew Henson made several treks between 1891 and 1909.","D":"several treks across Greenland were made by Matthew Henson between 1891 and 1909."},"answer":"A","explanation":"The introductory phrase describes a person (an explorer), so the subject right after the comma must be \"Matthew Henson.\" The other choices make years, Greenland, or treks the explorer (dangling modifier).","category":"Modifier","skill":"Dangling modifier (subject after introductory phrase)","alsoAppears":""},{"no":"129","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"21","passage":"Woven from recycled yarn and hand tufted using a carpet weaving technique passed down by the artist’s Turkish grandmother, _______ so lush and tactilely inviting that you are tempted to reach out and touch them.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"the topological tapestries of Argentine textile artist Alexandra Kehayoglou are","B":"the Argentine textile artist Alexandra Kehayoglou creates topological tapestries that are","C":"when she creates her topological tapestries, Argentine textile artist Alexandra Kehayoglou makes them","D":"Alexandra Kehayoglou is an Argentine textile artist whose topological tapestries are"},"answer":"A","explanation":"Things \"woven from recycled yarn\" are the tapestries, so \"the topological tapestries\" must immediately follow the modifier. The other choices put the artist (or a clause) there, creating a dangling modifier.","category":"Modifier","skill":"Dangling modifier (subject after introductory phrase)","alsoAppears":""},{"no":"130","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"22","passage":"Physical materials can be classified by how much light passes through them. Clear glass, which is classified as transparent, allows all (or almost all) light to pass _______ wax paper, which is classified as translucent, allows only some light to pass through.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"through,","B":"through","C":"through;","D":"through and"},"answer":"C","explanation":"Two independent clauses are joined with no conjunction, so a semicolon is required. A is a comma splice; B is a run-on; D lacks the needed comma before \"and.\"","category":"Punctuation","skill":"Semicolon between independent clauses","alsoAppears":""},{"no":"131","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"23","passage":"Using natural debris, such as dried _______ such as plastic bags; and more traditional art supplies, such as tree glue, Ghanaian artist Ed Franklin Gavua creates his striking Yiiiiikakaii African masks, which he hopes can help viewers rethink how waste is used in their communities.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"leaves, man-made trash:","B":"leaves; man-made trash,","C":"leaves, man-made trash,","D":"leaves; man-made trash;"},"answer":"B","explanation":"The list items contain internal commas, so items are separated with semicolons (\"...leaves; man-made trash, such as plastic bags; and...\"). Within item 2, a comma precedes \"such as.\"","category":"Punctuation","skill":"Semicolons in a complex series","alsoAppears":""},{"no":"132","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"24","passage":"Latin America is known to have dozens, if not hundreds, of popular dance forms. Only five of these dances are included in international ballroom dance _______ rumba, samba, cha-cha-cha, paso doble, and jive—the last of which is grouped with the other Latin dances despite not having Latin roots.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"competitions, however:","B":"competitions, however,","C":"competitions, however;","D":"competitions; however,"},"answer":"A","explanation":"\"However\" ends the first independent clause (contrasting it with the previous sentence) and is set off by a comma. A colon then introduces the list of the five dances.","category":"Punctuation","skill":"Colon introducing a list + conjunctive adverb","alsoAppears":""},{"no":"133","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"25","passage":"For thousands of years, humans have used domesticated goats (Capra hircus) to clear land of unwanted vegetation. When it comes to their diets, goats are notoriously _______ they will devour all kinds of shrubs and weeds, leaving virtually no part of any plant unconsumed.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"indiscriminate and","B":"indiscriminate,","C":"indiscriminate","D":"indiscriminate:"},"answer":"D","explanation":"The second clause explains what \"indiscriminate\" means, so a colon (after an independent clause) is correct. B is a comma splice, C a run-on, A lacks a comma before \"and.\"","category":"Punctuation","skill":"Colon introducing an explanation","alsoAppears":""},{"no":"134","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"26","passage":"A species of Byropsis algae produces toxins to avoid being eaten by predators. However, in some cases, the toxins the organism uses to protect itself from predation actually _______ its attractiveness to predators. The Hawaiian sea slug, for example, not only tolerates Byropsis toxins but actually uses them for protection in the same way the algae does.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"is increasing","B":"increase","C":"increases","D":"has increased"},"answer":"B","explanation":"The subject is the plural \"the toxins\" (not \"the organism\" in the relative clause), so the plural verb \"increase\" is needed.","category":"Agreement (S-V)","skill":"Subject–verb agreement (plural subject + interrupter)","alsoAppears":""},{"no":"135","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"27","passage":"After appropriate permissions are granted, a typical archaeological dig begins with a surveyor making a detailed grid of the excavation site. Then, the site is carefully dug, and any artifacts found are recorded and mapped onto the site grid. _______ the artifacts are removed, cataloged, and analyzed in a laboratory.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For instance,","B":"On the contrary,","C":"Earlier,","D":"Finally,"},"answer":"D","explanation":"The text describes steps in order (\"begins,\" \"Then\"); the last step is introduced by \"Finally.\"","category":"Transition","skill":"Sequence","alsoAppears":""},{"no":"136","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"28","passage":"The liquid metals in Earth’s core circulate constantly, and this circulation generates electrical currents that flow between Earth’s North and South magnetic poles. These electrical currents, _______ create a barrier around Earth that protects us from radiation and charged particles coming from space.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in turn,","B":"likewise,","C":"nevertheless,","D":"in reality,"},"answer":"A","explanation":"Circulation creates currents, and the currents then create a barrier—a chain of cause and effect. \"In turn\" signals this next step.","category":"Transition","skill":"Cause and effect (chain)","alsoAppears":""},{"no":"137","source":"Digital SAT 6 – Module 2","test":"6","module":"2","originalQuestion":"29","passage":"Biographer Michael Gorra notes that the novelist Henry James “lived in a world of second thoughts,” frequently tinkering with his novels and stories after their initial publication. However, the differences between the 1881 first edition and the 1908 edition of his novel A Portrait of a Lady are extreme, even by James’s standards; _______ some critics regard the two editions as two different novels altogether.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"by contrast,","B":"in fact,","C":"nevertheless,","D":"in other words,"},"answer":"B","explanation":"The final clause intensifies the claim that the differences are extreme. \"In fact\" introduces this stronger supporting point.","category":"Transition","skill":"Emphasis / intensification","alsoAppears":""},{"no":"138","source":"Digital SAT 7 – Module 1","test":"7","module":"1","originalQuestion":"19","passage":"One of the earliest known maps is a Babylonian clay tablet thought to be almost 4,500 years old. The map _______ the area of a plot of land, shows a river valley, and includes the cardinal directions.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"describes","B":"describe","C":"have described","D":"are describing"},"answer":"A","explanation":"The subject \"The map\" is singular, and the other verbs in the series (\"shows,\" \"includes\") are singular simple present. \"Describes\" agrees and keeps the series parallel.","category":"Agreement (S-V)","skill":"Subject–verb agreement + parallel verbs","alsoAppears":""},{"no":"139","source":"Digital SAT 7 – Module 1","test":"7","module":"1","originalQuestion":"20","passage":"Eighteen letters written by Louisa May Alcott, author of the popular novel Little Women (1868), can be found at the New York Historical Society. _______ letters demonstrate Alcott’s keen business sense in her interactions with publishers.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"One","B":"That","C":"This","D":"These"},"answer":"D","explanation":"The determiner must match the plural noun \"letters\" (and refer back to the eighteen letters). Only \"These\" is plural.","category":"Agreement (Pronoun)","skill":"Determiner/pronoun–noun number agreement","alsoAppears":""},{"no":"140","source":"Digital SAT 7 – Module 1","test":"7","module":"1","originalQuestion":"21","passage":"The Dust Bowl was a period of severe drought that plagued the Great Plains of the US during the 1930s. During this time, dust storms _______ over 100 million acres of land. They even reached as far east as New York City.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are affecting","B":"will have affected","C":"will affect","D":"affected"},"answer":"D","explanation":"The events happened in the 1930s (\"was,\" \"plagued,\" \"reached\"), so the simple past \"affected\" is correct.","category":"Verb Tense","skill":"Simple past (completed past event)","alsoAppears":""},{"no":"141","source":"Digital SAT 7 – Module 1","test":"7","module":"1","originalQuestion":"22","passage":"Many mechanical calculators were powered by a notched cylinder mechanism called the Leibniz wheel. Leibniz wheel calculators were popular in the first half of the twentieth _______ these ingenious devices were eventually replaced by electronic calculators.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"century","B":"century,","C":"century, but","D":"century that"},"answer":"C","explanation":"Two independent clauses with a contrast are joined with a comma + \"but.\" A is a run-on, B a comma splice, D creates an illogical relative clause.","category":"Punctuation","skill":"Comma + FANBOYS between independent clauses","alsoAppears":""},{"no":"142","source":"Digital SAT 7 – Module 1","test":"7","module":"1","originalQuestion":"23","passage":"Featuring jagged peaks of black ink surrounded by hazy swirls of blue and green paint, Zhang Daqian’s 1983 painting Panorama of Mount Lu is inspired by the tradition of qinglü shanshui, a type of Chinese landscape painting _______ by the use of blue and green hues to depict ethereal, otherworldly landscapes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"has been characterized","B":"will be characterized","C":"characterized","D":"is characterized"},"answer":"C","explanation":"\"Characterized by...\" is a past-participle phrase modifying \"a type of Chinese landscape painting.\" A finite verb (A, B, D) would create a second main verb inside the appositive.","category":"Verb Form","skill":"Past participle as modifier (nonfinite)","alsoAppears":""},{"no":"143","source":"Digital SAT 7 – Module 1","test":"7","module":"1","originalQuestion":"24","passage":"Increasing the heat on an uncovered boiling pot of water does not increase the temperature of the water. What increases is the rate at which the water turns to _______ a pressure cooker pot, though, an airtight seal traps the vapor in the pot, creating pressure that allows the temperature of the water to increase past its boiling point.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"vapor. With","B":"vapor with","C":"vapor, with","D":"vapor and with"},"answer":"A","explanation":"\"With a pressure cooker pot, though, an airtight seal traps...\" is a new independent clause. A period separates the two sentences; B, C, D create a run-on or comma splice or illogical attachment.","category":"Punctuation","skill":"Sentence boundary – independent clauses (period)","alsoAppears":""},{"no":"144","source":"Digital SAT 7 – Module 1","test":"7","module":"1","originalQuestion":"25","passage":"Wanting to celebrate the 100th anniversary of the Alaska Purchase, _______ up with a motto that best captured the state’s unique character. The commission selected “North to the Future,” submitted by Juneau journalist Richard Peter, as its winning entry.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"a contest sponsored by the Alaska Centennial Commission would award $300 to an individual who came","B":"an award of $300 would go to an individual in a contest sponsored by the Alaska Centennial Commission for coming","C":"$300 would be awarded to an individual by the Alaska Centennial Commission in a contest for coming","D":"the Alaska Centennial Commission sponsored a contest that would award $300 to an individual who came"},"answer":"D","explanation":"The modifier \"Wanting to celebrate...\" must describe the entity that wanted to celebrate—the Alaska Centennial Commission—so it must come right after the comma. The other choices make a contest, an award, or $300 do the \"wanting.\"","category":"Modifier","skill":"Dangling modifier (subject after introductory phrase)","alsoAppears":""},{"no":"145","source":"Digital SAT 7 – Module 1","test":"7","module":"1","originalQuestion":"26","passage":"Recently unearthed Neronian tools in France dating to 54,000 years ago and attributed to Homo sapiens may provide evidence that interactions between Neanderthals and modern humans occurred 10,000 years earlier than was previously _______ finding that, if true, would overturn current theories about H. sapiens migration during the Upper Paleolithic.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"supposed; a","B":"supposed. A","C":"supposed a","D":"supposed, a"},"answer":"D","explanation":"\"A finding that...\" is a noun phrase (appositive) summing up the preceding clause, not an independent clause, so it is attached with a comma. A and B would leave it as a fragment; C omits needed punctuation.","category":"Punctuation","skill":"Comma before summative appositive (noun phrase)","alsoAppears":""},{"no":"146","source":"Digital SAT 7 – Module 1","test":"7","module":"1","originalQuestion":"27","passage":"Guard cells are specialized cells that are part of a plant’s pores. These cells help regulate the amount of carbon dioxide a plant takes in. _______ they help regulate a plant’s water loss.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Additionally,","B":"Previously,","C":"In conclusion,","D":"Instead,"},"answer":"A","explanation":"The sentence adds another function of guard cells, so \"Additionally\" is logical.","category":"Transition","skill":"Addition","alsoAppears":""},{"no":"147","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"19","passage":"Nowadays, tug-of-war is usually seen as an informal game one might play at a picnic or in gym class. Surprisingly, the Olympic committee once decided _______ tug-of-war as an official Olympic event! Nations competed in the event at the Olympic Games from 1900 to 1920.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"included","B":"including","C":"include","D":"to include"},"answer":"D","explanation":"The verb \"decide\" is followed by an infinitive (decide to do something), so \"to include\" is correct.","category":"Verb Form","skill":"Infinitive after certain verbs (decide to)","alsoAppears":""},{"no":"148","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"20","passage":"The Globe Theatre in London is a reconstruction of the famed venue where many of Shakespeare’s plays were first performed. In 1613, a prop cannon _______ during a performance and ignited the Globe’s thatched roof. No one was hurt, but in two hours the original Globe was gone.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"malfunctions","B":"will malfunction","C":"has malfunctioned","D":"malfunctioned"},"answer":"D","explanation":"The event occurred \"in 1613\" and is parallel with \"ignited,\" so the simple past \"malfunctioned\" is correct.","category":"Verb Tense","skill":"Simple past (specific past date)","alsoAppears":""},{"no":"149","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"21","passage":"Nigerian American artist Toyin Ojih Odutola uses black-ink pens to create highly detailed drawings of human figures. Her portrait of novelist Zadie _______ is displayed in the National Portrait Gallery in London.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Smith:","B":"Smith—","C":"Smith","D":"Smith,"},"answer":"C","explanation":"\"Her portrait of novelist Zadie Smith\" is the subject, and \"is displayed\" is its verb. No punctuation belongs between a subject and its verb.","category":"Punctuation","skill":"No punctuation between subject and verb","alsoAppears":""},{"no":"150","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"22","passage":"When a given industry—water and electricity are two well-known examples—carries high infrastructural start-up costs and other barriers that discourage competition, _______ of just one or two suppliers per municipality. Such industries are known as natural monopolies.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"these often consist","B":"they often consist","C":"it often consists","D":"this often consists"},"answer":"C","explanation":"The pronoun refers to \"a given industry,\" which is singular; the dashed examples are an interrupter. \"It often consists\" is singular and clearly refers to the industry.","category":"Agreement (Pronoun)","skill":"Pronoun–antecedent agreement (singular)","alsoAppears":""},{"no":"151","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"23","passage":"As the fourteenth US librarian of Congress, Carla Hayden has many responsibilities. These include overseeing the Library of Congress’s collections, which boast more than 162 million _______ the US Copyright Office, which registers copyright claims and advises Congress on copyright law; and appointing the US poet laureate.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"items managing","B":"items, managing","C":"items; managing","D":"items. Managing"},"answer":"C","explanation":"The list of responsibilities (overseeing...; managing...; and appointing...) has items with internal commas, so semicolons separate the items.","category":"Punctuation","skill":"Semicolons in a complex series","alsoAppears":""},{"no":"152","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"24","passage":"Digital artist Jung (Lulu) Chen primarily uses a suite of software tools to create illustrations for children’s books. To manifest the warm and welcoming atmospheres that are a signature of her _______ she occasionally relies on more traditional art techniques, such as painting with watercolors.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"work, though,","B":"work, though","C":"work; though,","D":"work, though;"},"answer":"A","explanation":"The introductory infinitive phrase ends at \"work,\" and \"though\" is an interrupting adverb within the same sentence; it needs commas on both sides before the main clause \"she occasionally relies....\" Semicolons (C, D) would require independent clauses on both sides.","category":"Punctuation","skill":"Commas around an interrupting adverb (though)","alsoAppears":""},{"no":"153","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"25","passage":"Chondrites are stony meteorites that are undifferentiated—that is, their contents have not melted and separated into distinct layers. They are hardly _______ many chondrites experience aqueous alteration as a result of exposure to fluids, as well as fracturing, veining, and localized melting due to collisions with other objects.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"pristine, though","B":"pristine, though;","C":"pristine; though","D":"pristine, though,"},"answer":"B","explanation":"\"They are hardly pristine, though\" is a complete clause (with \"though\" as an adverb at its end). A semicolon then separates it from the next independent clause \"many chondrites experience...\".","category":"Punctuation","skill":"Semicolon between independent clauses (adverb placement)","alsoAppears":""},{"no":"154","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"26","passage":"That the geographic center of North America lay in the state of North Dakota was conceded by all _______ establishing its precise coordinates proved more divisive.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"involved:","B":"involved,","C":"involved","D":"involved;"},"answer":"D","explanation":"Two independent clauses are joined without a conjunction, so a semicolon is required. B is a comma splice, C a run-on; a colon (A) does not fit because the second clause contrasts rather than explains.","category":"Punctuation","skill":"Semicolon between independent clauses","alsoAppears":""},{"no":"155","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"27","passage":"Famous for its four-degree tilt, the leaning Garisenda Tower is a popular attraction in Bologna’s city center. However, measurements taken in 2023 showed that the tower was rotating in a concerning way. _______ city officials closed the area around the tower so experts could explore solutions to stabilize the historical twelfth-century structure.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Similarly,","B":"As a result,","C":"For example,","D":"In comparison,"},"answer":"B","explanation":"Closing the area is a consequence of the concerning rotation, so \"As a result\" is logical.","category":"Transition","skill":"Cause and effect","alsoAppears":""},{"no":"156","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"28","passage":"In 2021, a model developed by astrophysicist Catherine Zucker and her research team revealed that the same supernovas responsible for the creation and ongoing expansion of the Local Bubble—a 14-million-year-old cavity in the Milky Way—are likely responsible for the formation of new stars. _______ this model detailed how the bubble’s expansion trapped interstellar clouds of gas and dust that became stars upon their eventual collapse.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Hence,","B":"However,","C":"Admittedly,","D":"Specifically,"},"answer":"D","explanation":"The sentence gives a more detailed explanation of the general claim in the previous sentence, so \"Specifically\" is correct.","category":"Transition","skill":"Specification / elaboration","alsoAppears":""},{"no":"157","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"29","passage":"Following the American Revolutionary War, North American foodways underwent a radical transformation, fueled in large part by spiking consumer demand for certain grains. The cultivation, trade, and transportation of maize and wheat, _______ reconfigured the continent’s existing regional foodways into a globally oriented food system.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in particular,","B":"alternatively,","C":"by comparison,","D":"second of all,"},"answer":"A","explanation":"Maize and wheat are the specific \"certain grains\" mentioned before, so \"in particular\" is logical.","category":"Transition","skill":"Specification / emphasis","alsoAppears":""},{"no":"158","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"30","passage":"When, in 2017, Cambridge University students Lucy Moss and Toby Marlow decided they wanted to develop a musical together, one of their goals was for their female actor friends to have good parts to play. _______ they created the show Six, a retelling of the history of King Henry VIII’s wives in which each of the six queens has a starring role.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In other words,","B":"In summary,","C":"For example,","D":"To that end,"},"answer":"D","explanation":"Creating a show with six starring female roles was done to achieve the stated goal. \"To that end\" signals purpose.","category":"Transition","skill":"Purpose","alsoAppears":""},{"no":"159","source":"Digital SAT 7 – Module 2","test":"7","module":"2","originalQuestion":"31","passage":"Mountain climbing routes that incorporate metal rungs and cables are known as via ferratas, from the Italian phrase for “iron path.” As climbing these routes has shifted from a mode of travel to a sporting activity, modern via ferratas are rarely designed to simply reach a summit. _______ new routes favor recreation over utility, aiming to provide a challenging climb or showcase dramatic scenery.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Additionally,","B":"On the other hand,","C":"More often,","D":"Nonetheless,"},"answer":"C","explanation":"The previous sentence says routes are \"rarely\" designed just to reach a summit; the next tells what they are \"more often\" designed to do. \"More often\" completes this contrast of frequency.","category":"Transition","skill":"Contrast (rarely → more often)","alsoAppears":""},{"no":"160","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"19","passage":"When writing The Other Black Girl (2021), novelist Zakiya Dalila Harris drew on her own experiences working at a publishing office. The award-winning book is Harris’s first novel, but her writing _______ honored before. At the age of twelve, she entered a contest to have a story published in American Girl magazine—and won.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"were","B":"have been","C":"has been","D":"are"},"answer":"C","explanation":"The subject \"her writing\" is singular, and \"before\" signals an experience up to now, so the singular present perfect \"has been\" is correct.","category":"Agreement (S-V)","skill":"Subject–verb agreement + present perfect","alsoAppears":"SAT 1 M2 Q19"},{"no":"161","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"20","passage":"In order to prevent nonnative fish species from moving freely between the Mediterranean and Red Seas, marine biologist Bella Galil has proposed that a saline lock system be installed along the Suez Canal in Egypt’s Great Bitter Lakes. The lock would increase the salinity of the lakes and _______ a natural barrier of water most marine creatures would be unable to cross.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"creates","B":"create","C":"creating","D":"created"},"answer":"B","explanation":"The verb is parallel with \"increase\" after the modal \"would\" (would increase...and create), so the base form \"create\" is required.","category":"Verb Form","skill":"Parallel verbs after a modal (would + base form)","alsoAppears":"SAT 1 M2 Q25"},{"no":"162","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"21","passage":"Paintings by the renowned twentieth-century US _______ were featured in Artist to Artist, an exhibition at the Smithsonian Art Museum that paired the works of artists whose career trajectories intersected in meaningful ways.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"artists: Thomas Hart Benton and Jackson Pollock,","B":"artists Thomas Hart Benton and Jackson Pollock","C":"artists Thomas Hart Benton, and Jackson Pollock,","D":"artists, Thomas Hart Benton and Jackson Pollock"},"answer":"B","explanation":"The names are a restrictive appositive identifying which artists, so no punctuation is used. Also, no punctuation belongs between the subject and the verb \"were featured.\"","category":"Punctuation","skill":"Restrictive appositive; no comma before verb","alsoAppears":""},{"no":"163","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"22","passage":"In 1943, in the midst of World War II, mathematics professor Grace Hopper was recruited by the US military to help the war effort by solving complex equations. Hopper’s subsequent career would involve more than just _______ as a pioneering computer programmer, Hopper would help usher in the digital age.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"equations, though:","B":"equations, though,","C":"equations. Though,","D":"equations though"},"answer":"A","explanation":"\"Though\" is an adverb ending the first clause (set off by a comma). The second independent clause explains what \"more than just equations\" means, so a colon is appropriate. B is a comma splice; C makes \"Though,\" start a fragment; D is a run-on.","category":"Punctuation","skill":"Colon between independent clauses + adverb placement","alsoAppears":"SAT 1 M1 Q27"},{"no":"164","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"23","passage":"Increased gender diversity is revitalizing the field of economics, according to Harvard’s Claudia Goldin. The trailblazing accomplishments of Goldin, winner of the 2023 Nobel Prize in Economics for her work on women in the labor force, _______ to the value of scholars of diverse backgrounds in spurring research into previously unexplored, but vitally important, topics.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"attests","B":"has attested","C":"is attesting","D":"attest"},"answer":"D","explanation":"The subject is the plural \"accomplishments\" (not \"Goldin\"), so the plural verb \"attest\" is required.","category":"Agreement (S-V)","skill":"Subject–verb agreement (plural subject + interrupter)","alsoAppears":""},{"no":"165","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"24","passage":"During the English neoclassical period (1660–1789), many writers imitated the epic poetry and satires of ancient Greece and Rome. They were not the first in England to adopt the literary modes of classical _______ some of the most prominent figures of the earlier Renaissance period were also influenced by ancient Greek and Roman literature.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"antiquity, however","B":"antiquity, however,","C":"antiquity, however;","D":"antiquity; however,"},"answer":"C","explanation":"\"However\" belongs with the first clause (it contrasts with the previous sentence), and a semicolon separates the two independent clauses. A and B are comma splices; D wrongly attaches \"however\" to the second clause, where it makes no sense (the second clause supports rather than contrasts with the first).","category":"Punctuation","skill":"Semicolon + conjunctive adverb placement","alsoAppears":""},{"no":"166","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"25","passage":"English poet and Shakespeare contemporary John Donne’s _______ much admired during his lifetime (1572–1631) and in the decades that followed, had, at the time of their enthusiastic rediscovery by the early twentieth-century modernists, been essentially gathering dust for the intervening 250 years.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"works were","B":"works, were","C":"works,","D":"works had been"},"answer":"C","explanation":"The main verb is \"had...been gathering.\" \"Much admired during his lifetime...\" is a nonessential participial phrase that must be set off by commas; it needs an opening comma after \"works.\" Adding \"were\" or \"had been\" creates two main verbs.","category":"Punctuation","skill":"Paired commas around a nonessential participial phrase","alsoAppears":""},{"no":"167","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"26","passage":"Compared to that of alumina glass, _______ silica glass atoms are so far apart that they are unable to re-form bonds after being separated.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"silica glass is at a significant disadvantage due to its more dispersed atomic arrangement:","B":"silica glass has a more dispersed atomic arrangement, resulting in a significant disadvantage:","C":"a significant disadvantage of silica glass is that its atomic arrangement is more dispersed:","D":"silica glass’s atomic arrangement is more dispersed, resulting in a significant disadvantage:"},"answer":"D","explanation":"\"That of alumina glass\" means \"the atomic arrangement of alumina glass,\" so it must be compared with another atomic arrangement—\"silica glass’s atomic arrangement.\" The other choices compare an arrangement with silica glass itself or with a disadvantage (illogical comparison/modifier).","category":"Modifier","skill":"Logical comparison / modifier placement","alsoAppears":""},{"no":"168","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"27","passage":"In November 1934, Amrita Sher-Gil was living in what must have seemed like the ideal city for a young artist: Paris. She was studying firsthand the color-saturated style of France’s modernist masters and beginning to make a name for herself as a painter. _______ Sher-Gil longed to return to her childhood home of India; only there, she believed, could her art truly flourish.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Still,","B":"Therefore,","C":"Indeed,","D":"Furthermore,"},"answer":"A","explanation":"Despite ideal conditions in Paris, she wanted to leave. \"Still\" signals this unexpected contrast.","category":"Transition","skill":"Contrast / concession","alsoAppears":"SAT 1 M2 Q29"},{"no":"169","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"28","passage":"In 1974, Mexican chemist Mario Molina and US chemist F. Sherwood Rowland discovered that chemicals called CFCs were harmful to the ozone layer. Their research was extremely influential in the fight against CFCs. _______ it laid the foundation for a 1987 treaty that phased out the use of CFCs across the globe.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Regardless,","B":"Specifically,","C":"However,","D":"Earlier,"},"answer":"B","explanation":"The sentence gives a specific example of how the research was influential, so \"Specifically\" is logical.","category":"Transition","skill":"Specification / elaboration","alsoAppears":""},{"no":"170","source":"Digital SAT 8 – Module 1","test":"8","module":"1","originalQuestion":"29",
