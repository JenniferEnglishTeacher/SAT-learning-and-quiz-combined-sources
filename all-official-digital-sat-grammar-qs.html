"passage":"With his room-sized installation Unicorn/My Private Sky, Norwegian artist Børre Sæthre succeeds in creating a whimsical yet perplexing experience. _______ when visitors set foot inside the fantastically blue room and encounter the life-sized stuffed unicorn preening at the far end of it, they are both dazzled and confused—as if stepping into a strange and enchanting new world.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Second,","B":"Instead,","C":"Indeed,","D":"Nevertheless,"},"answer":"C","explanation":"The second sentence confirms and reinforces the claim that the experience is whimsical yet perplexing. \"Indeed\" signals this support.","category":"Transition","skill":"Emphasis / confirmation","alsoAppears":""},{"no":"171","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"19","passage":"To survive when water is scarce, embryos inside African turquoise killifish eggs _______ a dormant state known as diapause. In this state, embryonic development is paused for as long as two years—longer than the life span of an adult killifish.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"enter","B":"to enter","C":"having entered","D":"entering"},"answer":"A","explanation":"The subject \"embryos\" needs a main (finite) verb. \"Enter\" is a finite plural present-tense verb. The infinitive (B) and participles (C, D) cannot serve as the main verb, leaving the sentence incomplete.","category":"Verb Form","skill":"Finite vs. nonfinite verb (main verb needed)","alsoAppears":"SAT 2 M1 Q20"},{"no":"172","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"20","passage":"Formed in 1967 to foster political and economic stability within the Asia-Pacific region, the Association of Southeast Asian Nations was originally made up of five members: Thailand, the Philippines, Singapore, Malaysia, and Indonesia. By the end of the 1990s, the organization _______ its initial membership.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"has doubled","B":"had doubled","C":"doubles","D":"will double"},"answer":"B","explanation":"\"By the end of the 1990s\" marks an action completed before a specific past point, which requires the past perfect \"had doubled.\"","category":"Verb Tense","skill":"Past perfect (by + past time)","alsoAppears":"SAT 2 M1 Q21"},{"no":"173","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"21","passage":"After the United Kingdom began rolling out taxes equivalent to a few cents on single-use plastic grocery bags in 2011, plastic-bag consumption decreased by up to ninety _______ taxes are subject to what economists call the “rebound effect”: as the change became normalized, plastic-bag use started to creep back up.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"percent, such","B":"percent and such","C":"percent. Such","D":"percent such"},"answer":"C","explanation":"Two independent clauses must be separated; a period does this. A is a comma splice, D is a run-on, and B needs a comma before \"and.\"","category":"Punctuation","skill":"Sentence boundary – independent clauses (period)","alsoAppears":"SAT 3 M1 Q22"},{"no":"174","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"22","passage":"In 1966, Emmett Ashford became the first African American to umpire a Major League Baseball game. His energetic gestures announcing when a player had struck out and his habit of barreling after a hit ball to see if it would land out of _______ transform the traditionally solemn umpire role into a dynamic one.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"bounds helped","B":"bounds, helping","C":"bounds that helped","D":"bounds to help"},"answer":"A","explanation":"The compound subject (\"His energetic gestures...and his habit...\") needs a finite main verb: \"helped.\" The other choices are nonfinite or create a relative clause, leaving the sentence without a main verb.","category":"Verb Form","skill":"Finite vs. nonfinite verb (main verb needed)","alsoAppears":""},{"no":"175","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"23","passage":"The forty-seven geothermal springs of Arkansas’ Hot Springs National Park are sourced via a process known as natural groundwater recharge, in which rainwater percolates downward through the earth—in this case, the porous rocks of the hills around Hot _______ collect in a subterranean basin.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Springs to","B":"Springs: to","C":"Springs—to","D":"Springs, to"},"answer":"C","explanation":"The supplementary phrase \"in this case, the porous rocks...Hot Springs\" opens with a dash, so it must close with a matching dash before the sentence resumes (\"percolates downward through the earth...to collect\").","category":"Punctuation","skill":"Paired dashes around a supplementary element","alsoAppears":"SAT 2 M2 Q24"},{"no":"176","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"24","passage":"Over twenty years ago, in a landmark experiment in the psychology of choice, professor Sheena Iyengar set up a jam-tasting booth at a grocery store. The number of jams available for tasting _______ some shoppers had twenty-four different options, others only six. Interestingly, the shoppers with fewer jams to choose from purchased more jam.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"varied:","B":"varied,","C":"varied, while","D":"varied while"},"answer":"A","explanation":"The second part explains how the number varied, so a colon (which introduces an explanation after an independent clause) is correct. B is a comma splice; C and D create an illogical/garbled structure with \"while\" followed by another comma-joined clause.","category":"Punctuation","skill":"Colon introducing an explanation","alsoAppears":"SAT 2 M2 Q25"},{"no":"177","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"25","passage":"Nigerian author Buchi Emecheta’s celebrated literary oeuvre includes The Joys of Motherhood, a novel about the changing roles of women in 1950s _______ a television play about the private struggles of a newlywed couple in Nigeria; and Head Above Water, her autobiography.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Lagos, A Kind of Marriage,","B":"Lagos; A Kind of Marriage,","C":"Lagos, A Kind of Marriage:","D":"Lagos; A Kind of Marriage"},"answer":"B","explanation":"The list items contain internal commas, so semicolons separate them (matching the later \"; and Head Above Water\"). Within item 2, a comma sets off the appositive \"a television play...\" after the title.","category":"Punctuation","skill":"Semicolons in a complex series + appositive comma","alsoAppears":"SAT 2 M2 Q26"},{"no":"178","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"26","passage":"Jetties—long, narrow structures that extend from a landmass into the water—are often constructed to protect coastlines from erosion. Jetties can sometimes have the opposite _______ obstructing the natural flow of sand along the shore can lead to increased erosion in some areas.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"effect, though;","B":"effect, though","C":"effect; though","D":"effect, though,"},"answer":"A","explanation":"\"Though\" is an adverb ending the first clause, set off by a comma. A semicolon then separates the two independent clauses. B and D are comma splices/run-ons; C attaches \"though\" to the second clause, making it a dependent clause fragment after the semicolon.","category":"Punctuation","skill":"Semicolon between independent clauses (adverb placement)","alsoAppears":""},{"no":"179","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"27","passage":"The Alaska Native Language Archive (ANLA) is known for its impressive audio collection. _______ the ANLA has more than 5,000 audio recordings of Native Alaskan languages dating as far back as 1943.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In fact,","B":"After,","C":"Regardless,","D":"Instead,"},"answer":"A","explanation":"The second sentence gives concrete evidence that strengthens the claim about the \"impressive\" collection. \"In fact\" introduces this emphasis.","category":"Transition","skill":"Emphasis / support","alsoAppears":""},{"no":"180","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"28","passage":"Etched into Peru’s Nazca Desert are line drawings so large that they can only be fully seen from high above. Archaeologists have known of the lines since the 1920s, when a researcher spotted some from a nearby foothill, and they have been studying the markings ever since. _______ archaeologists’ efforts are aided by drones that capture high-resolution aerial photographs of the lines.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Currently,","B":"In comparison,","C":"Still,","D":"However,"},"answer":"A","explanation":"The text moves from past study (since the 1920s) to present practice (\"are aided\"). \"Currently\" marks this time shift.","category":"Transition","skill":"Time / sequence","alsoAppears":"SAT 3 M2 Q28"},{"no":"181","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"29","passage":"At two weeks old, the time their critical socialization period begins, wolves can smell but cannot yet see or hear. Domesticated dogs, _______ can see, hear, and smell by the end of two weeks. This relative lack of sensory input may help explain why wolves behave so differently around humans than dogs do: from a very young age, wolves are more wary and less exploratory.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in other words,","B":"for instance,","C":"by contrast,","D":"accordingly,"},"answer":"C","explanation":"Dogs differ from wolves in sensory development at two weeks, so \"by contrast\" is logical.","category":"Transition","skill":"Contrast","alsoAppears":"SAT 1 M1 Q30"},{"no":"182","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"30","passage":"Upon first approaching artist Kurt Wenner’s Dies Irae, a colorful scene painted on the surface of a cobblestone street in Mantua, Italy, one might assume a deep hole filled with life-sized, classically styled sculptures had opened up in the street. _______ by expertly applying the principles of perspective, Wenner created merely the illusion of depth.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Additionally,","B":"On the contrary,","C":"As a result,","D":"Next,"},"answer":"B","explanation":"The second sentence corrects the false assumption in the first (there is no real hole). \"On the contrary\" signals this correction.","category":"Transition","skill":"Contrast / correction","alsoAppears":""},{"no":"183","source":"Digital SAT 8 – Module 2","test":"8","module":"2","originalQuestion":"31","passage":"Economist Elinor Ostrom’s studies of communities around the world have empirically demonstrated that common pool resources, such as grazing lands, can be sustainably managed by the people who use them (rather than through private entities or centralized governments). _______ Ostrom’s work is a repudiation of the “tragedy of the commons,” the view that individuals will inevitably overexploit a finite shared resource if given unfettered access to it.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"By contrast,","B":"For example,","C":"That said,","D":"As such,"},"answer":"D","explanation":"Because her work demonstrates sustainable shared management, it therefore functions as a repudiation of the \"tragedy of the commons.\" \"As such\" signals this consequence/characterization.","category":"Transition","skill":"Cause and effect / consequence","alsoAppears":""},{"no":"184","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"19","passage":"A member of the Cherokee Nation, Mary Golda Ross is renowned for her contributions to NASA’s Planetary Flight Handbook, which _______ detailed mathematical guidance for missions to Mars and Venus.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"provided","B":"having provided","C":"to provide","D":"providing"},"answer":"A","explanation":"The relative clause \"which ___ detailed mathematical guidance\" needs a finite verb. \"Provided\" is finite; the other choices are nonfinite and leave the clause without a verb.","category":"Verb Form","skill":"Finite verb in a relative clause","alsoAppears":"SAT 3 M1 Q20"},{"no":"185","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"20","passage":"The classic children’s board game Chutes and Ladders is a version of an ancient Nepalese game, Paramapada Sopanapata. In both games, players encounter “good” or “bad” spaces while traveling along a path; landing on one of the good spaces _______ a player to skip ahead and arrive closer to the end goal.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"allows","B":"are allowing","C":"have allowed","D":"allow"},"answer":"A","explanation":"The subject is the gerund phrase \"landing on one of the good spaces,\" which is singular (not \"spaces\"), so the singular \"allows\" is correct.","category":"Agreement (S-V)","skill":"Subject–verb agreement (gerund subject)","alsoAppears":"SAT 1 M1 Q26"},{"no":"186","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"21","passage":"In 1930, Japanese American artist Chiura Obata depicted the natural beauty of Yosemite National Park in two memorable woodcuts: Evening at Carl Inn and Lake Basin in the High Sierra. In 2019, _______ exhibited alongside 150 of Obata’s other works in a single-artist show at the Smithsonian American Art Museum.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"it was","B":"they were","C":"this was","D":"some were"},"answer":"B","explanation":"The pronoun refers to the two woodcuts, a plural antecedent, so \"they were\" is correct. \"Some\" is illogical because both woodcuts are meant.","category":"Agreement (Pronoun)","skill":"Pronoun–antecedent agreement (plural)","alsoAppears":""},{"no":"187","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"22","passage":"Journalists have dubbed Gil Scott-Heron the “godfather of rap,” a title that has appeared in hundreds of articles about him since the 1990s. Scott-Heron himself resisted the godfather _______ feeling that it didn’t encapsulate his devotion to the broader African American blues music tradition as well as “bluesologist,” the moniker he preferred.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"nickname, however","B":"nickname, however;","C":"nickname, however,","D":"nickname; however,"},"answer":"C","explanation":"\"However\" interrupts one sentence (the participial phrase \"feeling that...\" is not an independent clause), so it is set off by a pair of commas. D uses a semicolon, which would require an independent clause after it.","category":"Punctuation","skill":"Commas around an interrupting conjunctive adverb","alsoAppears":"SAT 3 M1 Q25"},{"no":"188","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"23","passage":"Stomata, tiny pore structures in a leaf that absorb gases needed for plant growth, open when guard cells surrounding each pore swell with water. In a pivotal 2007 article, plant cell _______ showed that lipid molecules called phosphatidylinositol phosphates are responsible for signaling guard cells to open stomata.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"biologist, Yuree Lee","B":"biologist Yuree Lee,","C":"biologist Yuree Lee","D":"biologist, Yuree Lee,"},"answer":"C","explanation":"\"Plant cell biologist Yuree Lee\" is a title + name (restrictive), so no commas. No punctuation belongs between the subject and the verb \"showed.\"","category":"Punctuation","skill":"Restrictive appositive (title + name) – no commas","alsoAppears":"SAT 1 M2 Q27"},{"no":"189","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"24","passage":"As cheesemaking practices spread throughout Europe and Asia during and after the Neolithic, divergent strategies for preserving milk _______ whereas rennet-coagulated cheesemaking became key to milk preservation in Europe and Southwest Asia, acid-heat coagulation methods became common among nomadic herding populations of the northeastern Eurasian steppe.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"emerged","B":"emerged and","C":"emerged:","D":"emerged,"},"answer":"C","explanation":"The first part is a complete sentence; the second part explains what the \"divergent strategies\" were. A colon introduces this explanation. D creates a comma splice, A a run-on, B an illogical compound.","category":"Punctuation","skill":"Colon introducing an explanation","alsoAppears":""},{"no":"190","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"25","passage":"Recent pollen analyses of the Aran Islands have led some researchers to propose that the now treeless islands were once wooded. This hypothesis _______ that certain trees, such as P. sylvestris, survived without interruption or human intervention throughout the Holocene cannot stand, researchers Michael O’Connell and Karen Molloy counter, unless other explanations can first be ruled out.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"suggesting","B":"suggested","C":"suggests","D":"has suggested"},"answer":"A","explanation":"The main verb of the sentence is \"cannot stand.\" \"Suggesting that...\" is a participial phrase modifying \"This hypothesis.\" A finite verb (B, C, D) would give the subject two main verbs.","category":"Verb Form","skill":"Participle as modifier (main verb elsewhere)","alsoAppears":""},{"no":"191","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"26","passage":"Researchers studying the “terra-cotta army,” the thousands of life-size statues of warriors found interred near the tomb of Emperor Qin Shi Huang of China, were shocked to realize that the shape of each statue’s ears, like the shape of each person’s ears, _______ unique.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are","B":"is","C":"were","D":"have been"},"answer":"B","explanation":"The subject is \"the shape\" (singular), not \"ears\"; the comparison phrase is an interrupter. The fact is permanently true, so the singular present \"is\" is correct.","category":"Agreement (S-V)","skill":"Subject–verb agreement (singular subject + interrupter)","alsoAppears":""},{"no":"192","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"27","passage":"Chimamanda Ngozi Adichie’s 2013 novel Americanah chronicles the divergent experiences of Ifemelu and Obinze, a young Nigerian couple, after high school. Ifemelu moves to the United States to attend a prestigious university. _______ Obinze travels to London, hoping to start a career there. However, frustrated with the lack of opportunities, he soon returns to Nigeria.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Meanwhile,","B":"Nevertheless,","C":"Secondly,","D":"In fact,"},"answer":"A","explanation":"The two events happen at the same time to two different characters. \"Meanwhile\" signals simultaneous action.","category":"Transition","skill":"Time / simultaneity","alsoAppears":"SAT 2 M2 Q27"},{"no":"193","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"28","passage":"Some members of the US Supreme Court have resisted calls to televise the court’s oral arguments, concerned that the participants would be tempted to perform for the cameras (and thus lower the quality of the discourse). _______ the justices worry that most viewers would not even watch the full deliberations, only short clips that could be misinterpreted and mischaracterized.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"However,","B":"Additionally,","C":"In comparison,","D":"For example,"},"answer":"B","explanation":"The sentence adds a second concern the justices have, so \"Additionally\" is logical.","category":"Transition","skill":"Addition","alsoAppears":""},{"no":"194","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"29","passage":"The more diverse and wide ranging an animal’s behaviors, the larger and more energy demanding the animal’s brain tends to be. _______ from an evolutionary perspective, animals that perform only basic actions should allocate fewer resources to growing and maintaining brain tissue. The specialized subtypes of ants within colonies provide an opportunity to explore this hypothesis.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Subsequently,","B":"Besides,","C":"Nevertheless,","D":"Thus,"},"answer":"D","explanation":"The second sentence is a logical conclusion drawn from the first, so \"Thus\" (cause–effect) fits.","category":"Transition","skill":"Cause and effect / conclusion","alsoAppears":"SAT 3 M2 Q30"},{"no":"195","source":"Digital SAT 9 – Module 1","test":"9","module":"1","originalQuestion":"30","passage":"A firefly uses specialized muscles to draw oxygen into its lower abdomen through narrow tubes, triggering a chemical reaction whereby the oxygen combines with chemicals in the firefly’s abdomen to produce a glow. _______ when the firefly stops drawing in oxygen, the reaction—and the glow—cease.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For instance,","B":"By contrast,","C":"Specifically,","D":"In conclusion,"},"answer":"B","explanation":"Stopping oxygen intake (glow ceases) is the opposite of drawing in oxygen (glow produced). \"By contrast\" signals this opposite situation.","category":"Transition","skill":"Contrast","alsoAppears":""},{"no":"196","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"19","passage":"British scientists James Watson and Francis Crick won the Nobel Prize in part for their 1953 paper announcing the double helix structure of DNA, but it is misleading to say that Watson and Crick discovered the double helix. _______ findings were based on a famous X-ray image of DNA fibers, “Photo 51,” developed by X-ray crystallographer Rosalind Franklin and her graduate student Raymond Gosling.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"They’re","B":"It’s","C":"Their","D":"Its"},"answer":"C","explanation":"A plural possessive determiner is needed to show the findings belong to Watson and Crick: \"Their.\" \"They’re\" and \"It’s\" are contractions; \"Its\" is singular.","category":"Agreement (Pronoun)","skill":"Possessive pronoun (their vs. they’re/its)","alsoAppears":"SAT 1 M1 Q21"},{"no":"197","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"20","passage":"In the historical novel The Surrender Tree, Cuban American author Margarita Engle uses poetry rather than prose _______ the true story of Cuban folk hero Rosa La Bayamesa.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"tells","B":"told","C":"is telling","D":"to tell"},"answer":"D","explanation":"The infinitive \"to tell\" expresses purpose (she uses poetry in order to tell the story). The sentence already has its main verb, \"uses.\"","category":"Verb Form","skill":"Infinitive of purpose","alsoAppears":""},{"no":"198","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"21","passage":"Interest in mechanotransduction, the mechanism by which cells sense and convert mechanical stimuli into biochemical signals, is expanding because of innovative work by biomedical scientists—many of whom, like neuroscience and biophysics expert Elba Serrano, _______ this mechanism to better understand how the body’s neurological and biomechanical systems interact.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"is studying","B":"has studied","C":"study","D":"studies"},"answer":"C","explanation":"The subject is \"many of whom\" (many scientists), which is plural; \"like...Elba Serrano\" is an interrupter. The plural verb \"study\" is required.","category":"Agreement (S-V)","skill":"Subject–verb agreement (plural subject + interrupter)","alsoAppears":""},{"no":"199","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"22","passage":"In crafting her fantasy fiction, Nigerian-born British author Helen Oyeyemi has drawn inspiration from the classic nineteenth-century fairy tales of the Brothers Grimm. Her 2014 novel Boy, Snow, Bird, for instance, is a complex retelling of the story of Snow White, while her 2019 novel _______ offers a delicious twist on the classic tale of Hansel and Gretel.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Gingerbread—","B":"Gingerbread,","C":"Gingerbread","D":"Gingerbread:"},"answer":"C","explanation":"\"Her 2019 novel Gingerbread\" is the subject of the clause and \"offers\" is its verb. No punctuation should separate a subject from its verb, and the title is an essential (restrictive) identifier.","category":"Punctuation","skill":"No punctuation between subject and verb / restrictive appositive","alsoAppears":"SAT 2 M1 Q28"},{"no":"200","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"23","passage":"Sociologist Todd Gitlin co-opted the term “recombinant,” normally used in reference to genetic engineering, to describe serialized television shows of the 1980s. Gitlin’s use of the term referenced TV studios’ practice of repackaging successful narrative formulas as new _______ even shows that varied only slightly from other shows still attracted sizeable audiences.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"content, in that era","B":"content; in that era,","C":"content in that era,","D":"content, in that era,"},"answer":"B","explanation":"Two independent clauses are joined, so a semicolon is needed after \"content.\" \"In that era\" introduces the second clause and is followed by a comma.","category":"Punctuation","skill":"Semicolon between independent clauses","alsoAppears":""},{"no":"201","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"24","passage":"When external forces are applied to common glass made from silicates, energy builds up around minuscule defects in the material, resulting in fractures. Recently, engineer Erkka Frankberg of Tampere University in Finland used the chemical _______ to make a glassy solid that can withstand higher strain than silicate glass can before fracturing.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"compound, aluminum oxide","B":"compound aluminum oxide,","C":"compound, aluminum oxide,","D":"compound aluminum oxide"},"answer":"D","explanation":"\"Aluminum oxide\" is an essential (restrictive) appositive identifying which compound; it takes no commas. Nothing should separate the object from \"to make.\"","category":"Punctuation","skill":"Restrictive appositive – no commas","alsoAppears":"SAT 3 M2 Q27"},{"no":"202","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"25","passage":"In the late nineteenth and early twentieth centuries, automobiles were commonly referred to as horseless carriages after the older technology they still resembled. Known as the Brass Era, this period in automotive design is remembered for its grandeur and artistry, its vehicles _______ by collectors for their ornate detailing and gleaming brass fittings.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are highly prized","B":"had been highly prized","C":"highly prized","D":"were highly prized"},"answer":"C","explanation":"\"Its vehicles highly prized by collectors...\" is an absolute phrase (noun + participle) attached with a comma. A finite verb (A, B, D) would create a comma splice.","category":"Verb Form","skill":"Absolute phrase (nonfinite participle)","alsoAppears":""},{"no":"203","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"26","passage":"With the development of new technologies that use natural resources more efficiently, the overall consumption of those resources might be expected to decrease. Economists have observed that improvements in efficiency often correlate negatively with resource _______ efficiency gains, lowering the cost of use, may increase demand to the extent that resource consumption ultimately rises.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"conservation, though,","B":"conservation; though","C":"conservation, though;","D":"conservation, though"},"answer":"C","explanation":"\"Though\" ends the first clause as a contrast adverb (set off with a comma); a semicolon then separates the two independent clauses. A and D create comma splices; B makes the second part a dependent clause after a semicolon.","category":"Punctuation","skill":"Semicolon between independent clauses (adverb placement)","alsoAppears":""},{"no":"204","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"27","passage":"Before California’s 1911 election to approve a proposition granting women the right to vote, activists across the state sold tea to promote the cause of suffrage. In San Francisco, the Woman’s Suffrage Party sold Equality Tea at local fairs. _______ in Los Angeles, activist Nancy Tuttle Craig, who ran one of California’s largest grocery store firms, distributed Votes for Women Tea.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For example,","B":"To conclude,","C":"Similarly,","D":"In other words,"},"answer":"C","explanation":"The Los Angeles activity is parallel to the San Francisco one (both sold tea for suffrage), so \"Similarly\" is logical.","category":"Transition","skill":"Similarity / comparison","alsoAppears":"SAT 1 M2 Q30"},{"no":"205","source":"Digital SAT 9 – Module 2","test":"9","module":"2","originalQuestion":"28","passage":"Earth’s auroras—colorful displays of light seen above the northern and southern poles—result, broadly speaking, from the Sun’s activity. _______ the Sun releases charged particles that are captured by Earth’s magnetic field and channeled toward the poles. These particles then collide with atoms in the atmosphere, causing the atoms to emit auroral light.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Specifically,","B":"Similarly,","C":"Nevertheless,","D":"Hence,"},"answer":"A","explanation":"The following sentences give precise details of the \"broadly speaking\" explanation. \"Specifically\" signals this elaboration.","category":"Transition","skill":"Specification / elaboration","alsoAppears":""},{"no":"206","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"20","passage":"The Alvarez theory, developed in 1980 by physicist Luis Walter Alvarez and his geologist son Walter Alvarez, maintained that the secondary effects of an asteroid impact caused many dinosaurs and other animals to die _______ it left unexplored the question of whether unrelated volcanic activity might have also contributed to the mass extinctions.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"out but","B":"out, but","C":"out","D":"out,"},"answer":"B","explanation":"Two independent clauses are joined with a comma plus the coordinating conjunction \"but.\" A lacks the comma, C is a run-on, D is a comma splice.","category":"Punctuation","skill":"Comma + FANBOYS between independent clauses","alsoAppears":"SAT 1 M2 Q20"},{"no":"207","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"21","passage":"Typically, underlines, scribbles, and notes left in the margins by a former owner lower a book’s _______ when the former owner is a famous poet like Walt Whitman, such markings, known as marginalia, can be a gold mine to literary scholars.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"value, but","B":"value","C":"value,","D":"value but"},"answer":"A","explanation":"Two independent clauses with contrasting ideas are joined; a comma plus the coordinating conjunction \"but\" is correct. B is a run-on, C a comma splice, D lacks the comma before \"but.\"","category":"Punctuation","skill":"Comma + FANBOYS between independent clauses","alsoAppears":"SAT 3 M1 Q21"},{"no":"208","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"22","passage":"In winter, the diets of Japanese macaques, also known as snow monkeys, are influenced more by food availability than by food preference. Although the monkeys prefer to eat vegetation and land-dwelling invertebrates, those food sources may become unavailable because of extensive snow and ice cover, _______ the monkeys to hunt for marine animals in any streams that have not frozen over.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"forces","B":"to force","C":"forcing","D":"forced"},"answer":"C","explanation":"\"Forcing the monkeys to hunt...\" is a participial phrase describing the result of the snow cover; it attaches with a comma. A finite verb (A, D) would create a comma splice; \"to force\" suggests purpose, which is illogical.","category":"Verb Form","skill":"Participial phrase showing result (nonfinite)","alsoAppears":"SAT 1 M2 Q21"},{"no":"209","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"23","passage":"While many video game creators strive to make their graphics ever more _______ others look to the past, developing titles with visuals inspired by the “8-bit” games of the 1980s and 1990s. (The term “8-bit” refers to a console whose processor could only handle eight bits of data at once.)","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"lifelike but","B":"lifelike","C":"lifelike,","D":"lifelike, but"},"answer":"C","explanation":"\"While…lifelike\" is an introductory dependent clause, so a comma separates it from the main clause \"others look to the past.\" Adding \"but\" (A, D) is wrong because \"while\" already links the clauses; B lacks the needed comma.","category":"Punctuation","skill":"Comma after introductory dependent clause","alsoAppears":"SAT 2 M2 Q19"},{"no":"210","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"24","passage":"Food and the sensation of taste are central to Monique Truong’s novels. In The Book of Salt, for example, the exiled character of Bình connects to his native Saigon through the food he prepares, while in Bitter in the Mouth, the character of Linda _______ a form of synesthesia whereby the words she hears evoke tastes.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"experienced","B":"had experienced","C":"experiences","D":"will be experiencing"},"answer":"C","explanation":"The sentence uses the literary present (\"connects\") to describe events in novels. The parallel verb for Linda must also be simple present: \"experiences.\"","category":"Verb Tense","skill":"Tense consistency (literary present)","alsoAppears":"SAT 2 M1 Q23"},{"no":"211","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"25","passage":"Along with carbon dioxide concentration and temperature, light intensity affects the chemical reaction rate of _______ as light intensity increases, so does the rate at which the reactants (water and carbon dioxide) are converted into their products (glucose and oxygen).","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"photosynthesis and","B":"photosynthesis,","C":"photosynthesis:","D":"photosynthesis"},"answer":"C","explanation":"The second independent clause explains how light intensity affects the rate, so a colon is appropriate. B is a comma splice, D a run-on, A lacks the comma before \"and.\"","category":"Punctuation","skill":"Colon introducing an explanation","alsoAppears":""},{"no":"212","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"26","passage":"In Marisol’s 1968 sculpture Mi Mama y Yo, gone are the types of pop culture references that made the Parisian-born Venezuelan American artist a star at the height of the pop art movement. In _______ place is a far more personal subject: a sculptural depiction of the artist as a young girl with her mother.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"its","B":"they’re","C":"their","D":"it’s"},"answer":"C","explanation":"The possessive refers to \"the types of pop culture references\" (plural), which are gone; the new subject takes their place. So the plural possessive \"their\" is correct. \"It’s\" and \"they’re\" are contractions.","category":"Agreement (Pronoun)","skill":"Possessive pronoun (their vs. its/it’s/they’re)","alsoAppears":""},{"no":"213","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"27","passage":"The ghazal, a poetic form originating in seventh‑century Arabic poetry, has an intricate structure. The twentieth‑century Kashmiri American poet Agha Shahid Ali explains that each one of a ghazal’s couplets, while adhering to the patterns of rhyme (qafia) and refrain (radif) established in the poem’s opening lines (matla), _______ thematically and logically autonomous, resulting in a poem with “a stringently formal disunity.”","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"is","B":"were","C":"have been","D":"are"},"answer":"A","explanation":"The subject is \"each one\" (singular), not \"couplets.\" The present tense matches \"explains\" and a general description, so \"is\" is correct.","category":"Agreement (S-V)","skill":"Subject–verb agreement (each one = singular)","alsoAppears":""},{"no":"214","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"28","passage":"Organisms have evolved a number of surprising adaptations to ensure their survival in adverse conditions. Tadpole shrimp (Triops longicaudatus) embryos, _______ can pause development for over ten years during extended periods of drought.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in contrast,","B":"for example,","C":"meanwhile,","D":"consequently,"},"answer":"B","explanation":"Tadpole shrimp embryos are a specific instance of the \"surprising adaptations\" mentioned in the first sentence, so \"for example\" is logical.","category":"Transition","skill":"Example / illustration","alsoAppears":"SAT 2 M2 Q28"},{"no":"215","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"29","passage":"When Chinese director Chloé Zhao accepted the Oscar in 2021 for her film Nomadland, she made Academy Award history. _______ only one other woman, Kathryn Bigelow of the United States, had been named best director at the Oscars, making Zhao the second woman and the first Asian woman to win the award.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"As a result,","B":"Previously,","C":"However,","D":"Likewise,"},"answer":"B","explanation":"The sentence describes what had happened before Zhao's win (\"had been named\"), so the time transition \"Previously\" is logical.","category":"Transition","skill":"Time (earlier event)","alsoAppears":""},{"no":"216","source":"Digital SAT 10 – Module 1","test":"10","module":"1","originalQuestion":"30","passage":"If the formation of Earth’s mantle had been purely a product of core differentiation—whereby heavier elements sink toward the core and lighter elements rise—the upper mantle would be depleted of heavy siderophile elements. Siderophiles are much more abundant in the mantle than predicted in that model, however. _______ extraterrestrial material containing siderophiles, likely from asteroid or comet impacts, almost certainly accreted to Earth following core differentiation.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"That said,","B":"Hence,","C":"For example,","D":"Likewise,"},"answer":"B","explanation":"The final sentence is a conclusion drawn from the evidence (siderophiles are more abundant than predicted), so \"Hence\" is logical.","category":"Transition","skill":"Cause and effect / conclusion","alsoAppears":""},{"no":"217","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"18","passage":"Public-awareness campaigns about the need to reduce single-use plastics can be successful, says researcher Kim Borg of Monash University in Australia, when these campaigns give consumers a choice: for example, Japan achieved a 40 percent reduction in plastic-bag use after cashiers were instructed to ask customers whether _______ wanted a bag.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"they","B":"one","C":"you","D":"it"},"answer":"A","explanation":"The pronoun refers to the plural \"customers,\" so \"they\" is required.","category":"Agreement (Pronoun)","skill":"Pronoun–antecedent agreement (plural)","alsoAppears":"SAT 1 M1 Q19"},{"no":"218","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"19","passage":"Lucía Michel of the University of Chile observed that alkaline soils contain an insoluble form of iron that blueberry plants cannot absorb, thus inhibiting blueberry growth. If these plants were grown in alkaline soil alongside grasses that aid in iron solubilization, _______ Michel was determined to find out.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"could the blueberries thrive.","B":"the blueberries could thrive.","C":"the blueberries could thrive?","D":"could the blueberries thrive?"},"answer":"D","explanation":"This is a direct question that Michel wanted answered (\"...could the blueberries thrive? Michel was determined to find out.\"). A direct question uses inverted word order and a question mark.","category":"Sentence Structure","skill":"Direct question – word order & question mark","alsoAppears":"SAT 1 M2 Q22"},{"no":"219","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"20","passage":"Atoms in a synchrotron, a type of circular particle accelerator, travel faster and faster until they _______ a desired energy level, at which point they are diverted to collide with a target, smashing the atoms.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will reach","B":"reach","C":"had reached","D":"are reaching"},"answer":"B","explanation":"The text describes a general, repeated process in the simple present (\"travel,\" \"are diverted\"), so the simple present \"reach\" is consistent.","category":"Verb Tense","skill":"Simple present for general process","alsoAppears":"SAT 3 M2 Q18"},{"no":"220","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"21","passage":"In his 1963 exhibition Exposition of Music—Electronic Television, Korean American artist Nam June Paik showed how television images could be manipulated to express an artist’s perspective. Today, Paik _______ considered the first video artist.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will be","B":"had been","C":"was","D":"is"},"answer":"D","explanation":"\"Today\" signals the present, so the simple present \"is\" is correct.","category":"Verb Tense","skill":"Simple present (time marker \"today\")","alsoAppears":"SAT 1 M2 Q23"},{"no":"221","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"22","passage":"Former First Lady of the United States Eleanor Roosevelt and Indian activist and educator Hansa Mehta were instrumental in drafting the United Nations’ Universal Declaration of Human Rights, a document that _______ the basic freedoms to which all people are entitled.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have outlined","B":"were outlining","C":"outlines","D":"outline"},"answer":"C","explanation":"The relative pronoun \"that\" refers to the singular \"a document,\" so the singular verb \"outlines\" is required. The present tense suits a document that still exists.","category":"Agreement (S-V)","skill":"Subject–verb agreement in relative clause","alsoAppears":"SAT 3 M2 Q20"},{"no":"222","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"23","passage":"In February 1919, following the end of the First World War, women from ten countries around the world convened the Inter-Allied Women’s Conference in Paris. The conference’s goals were _______ ensure women’s participation in the proceedings of the Paris Peace Conference, to secure the right of women to serve in the League of Nations, and to advocate for human rights.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"threefold: to","B":"threefold. To","C":"threefold to","D":"threefold; to"},"answer":"A","explanation":"\"The conference’s goals were threefold\" is complete; a colon introduces the list of the three goals that follows. B and D would leave the list as a fragment; C runs them together.","category":"Punctuation","skill":"Colon introducing a list","alsoAppears":""},{"no":"223","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"24","passage":"Mathematician Grigori Perelman, sometimes in conjunction with mathematicians Richard S. Hamilton and Shing-Tung Yau, _______ credited with proving the Poincaré conjecture. Having built on Hamilton’s previous work to solve the proof, Perelman has insisted that Hamilton receive credit. Yau later found and closed gaps in Perelman’s proof, persuading some mathematicians that he deserves credit as well.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are","B":"have been","C":"are being","D":"is"},"answer":"D","explanation":"The subject is the singular \"Grigori Perelman\"; the phrase \"sometimes in conjunction with...\" is an interrupter and does not make the subject plural. So the singular \"is\" is required.","category":"Agreement (S-V)","skill":"Subject–verb agreement (\"in conjunction with\" doesn't pluralize)","alsoAppears":""},{"no":"224","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"25","passage":"Researchers studying magnetosensation have determined why some soil-dwelling roundworms in the Southern Hemisphere move in the opposite direction of Earth’s magnetic field when searching for _______ in the Northern Hemisphere, the magnetic field points down, into the ground, but in the Southern Hemisphere, it points up, toward the surface and away from worms’ food sources.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"food:","B":"food,","C":"food while","D":"food"},"answer":"A","explanation":"The second independent clause explains why the worms behave this way, so a colon is appropriate. B is a comma splice, D a run-on, C creates a confusing structure.","category":"Punctuation","skill":"Colon introducing an explanation","alsoAppears":"SAT 1 M1 Q24"},{"no":"225","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"26","passage":"Most conifers (trees belonging to the phylum Coniferophyta) are evergreen. That is, they keep their green leaves or needles year-round. However, not all conifer species are evergreen. Larch trees, _______ lose their needles every fall.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"for instance,","B":"nevertheless,","C":"meanwhile,","D":"in addition,"},"answer":"A","explanation":"Larch trees are an example of a conifer that is not evergreen, so \"for instance\" is logical.","category":"Transition","skill":"Example / illustration","alsoAppears":"SAT 3 M1 Q27"},{"no":"226","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"27","passage":"Neuroscientist Karen Konkoly wanted to determine whether individuals can understand and respond to questions during REM sleep. She first taught volunteers eye movements they would use to respond to basic math problems while asleep (a single left-right eye movement indicated the number one). _______ she attached electrodes to the volunteers’ faces to record their eye movements during sleep.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Specifically,","B":"Next,","C":"For instance,","D":"In sum,"},"answer":"B","explanation":"The procedure is described in order (\"first\"); the following step is introduced by \"Next.\"","category":"Transition","skill":"Sequence","alsoAppears":""},{"no":"227","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"28","passage":"In his 1925 book The Morphology of Landscape, US geographer Carl Sauer challenged prevailing views about how natural landscapes influence human cultures. _______ Sauer argued that instead of being shaped entirely by their natural surroundings, cultures play an active role in their own development by virtue of their interactions with the environment.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Similarly,","B":"Finally,","C":"Therefore,","D":"Specifically,"},"answer":"D","explanation":"The second sentence explains exactly how Sauer challenged the prevailing views, so \"Specifically\" is logical.","category":"Transition","skill":"Specification / elaboration","alsoAppears":""},{"no":"228","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"29","passage":"In her 2012 analysis of tree rings from Japan’s Yaku Island, cosmic ray physicist Fusa Miyake noted an anomalous carbon-14 spike dating to 774–775 CE, indicating that a massive burst of radiation reached Earth during that time. _______ this unprecedented radiocarbon surge was dubbed a “Miyake event” in honor of its discoverer.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Fittingly,","B":"Similarly,","C":"However,","D":"In other words,"},"answer":"A","explanation":"It is appropriate that the event is named after the person who discovered it. \"Fittingly\" expresses this appropriateness.","category":"Transition","skill":"Comment / appropriateness","alsoAppears":""},{"no":"229","source":"Digital SAT 10 – Module 2","test":"10","module":"2","originalQuestion":"30","passage":"Researchers Helena Mihaljević-Brandt, Lucía Santamaría, and Marco Tullney report that while mathematicians may have traditionally worked alone, evidence points to a shift in the opposite direction. _______ mathematicians are choosing to collaborate with their peers—a trend illustrated by a rise in the number of mathematics publications credited to multiple authors.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Similarly,","B":"For this reason,","C":"Furthermore,","D":"Increasingly,"},"answer":"D","explanation":"The sentence describes a growing trend (\"a shift\"), so \"Increasingly\" is logical.","category":"Transition","skill":"Trend / change over time","alsoAppears":"SAT 1 M1 Q31"}];
const state={filtered:[...QUESTIONS],index:0,selected:{},checked:{},correct:{}};
const letters=["A","B","C","D"];
const el=id=>document.getElementById(id);

function unique(field){return [...new Set(QUESTIONS.map(q=>q[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));}
function fillSelect(id,values){const select=el(id); values.forEach(value=>{const option=document.createElement("option");option.value=value;option.textContent=value;select.appendChild(option);});}
fillSelect("testFilter",unique("test"));
fillSelect("categoryFilter",unique("category"));
fillSelect("skillFilter",unique("skill"));

function esc(value){const node=document.createElement("div");node.textContent=value||"";return node.innerHTML;}
function passageHtml(value){return esc(value).replace(/_{3,}/g,'<span class="blank">_______</span>');}
function key(q){return q.no;}

function applyFilters(){
 const term=el("search").value.trim().toLowerCase();
 const test=el("testFilter").value;
 const module=el("moduleFilter").value;
 const category=el("categoryFilter").value;
 const skill=el("skillFilter").value;
 state.filtered=QUESTIONS.filter(q=>{
   const hay=[q.source,q.passage,q.stem,q.category,q.skill,...Object.values(q.options)].join(" ").toLowerCase();
   return (!term||hay.includes(term))&&(!test||q.test===test)&&(!module||q.module===module)&&(!category||q.category===category)&&(!skill||q.skill===skill);
 });
 state.index=0;
 render();
}

function render(){
 const total=state.filtered.length;
 el("filterSummary").textContent=total+" of "+QUESTIONS.length+" questions";
 el("counter").textContent=total?"Question "+(state.index+1)+" of "+total:"";
 el("previous").disabled=state.index<=0;
 el("next").disabled=!total||state.index>=total-1;
 if(!total){el("questionHost").innerHTML='<div class="empty"><strong>No questions match these filters.</strong><p>Try clearing one or more filters.</p></div>';updateProgress();return;}
 const q=state.filtered[state.index], id=key(q), selected=state.selected[id], checked=state.checked[id];
 const optionHtml=letters.map(letter=>{
   const isCorrect=checked&&letter===q.answer;
   const isWrong=checked&&selected===letter&&letter!==q.answer;
   const classes=["option",selected===letter?"selected":"",isCorrect?"correct":"",isWrong?"incorrect":""].filter(Boolean).join(" ");
   return '<button class="'+classes+'" type="button" data-letter="'+letter+'" '+(checked?"disabled":"")+'><span class="letter">'+letter+'</span><span>'+esc(q.options[letter])+'</span></button>';
 }).join("");
 const result=checked?(selected===q.answer?"Correct":"Not quite"):"";
 el("questionHost").innerHTML=
 '<article class="question-panel">'+
 '<div class="question-meta"><span class="tag">'+esc(q.source)+'</span><span class="tag">Original Q'+esc(q.originalQuestion)+'</span><span class="tag">'+esc(q.category)+'</span></div>'+
 '<div class="question-content">'+
 '<h2>Question '+esc(q.no)+'</h2>'+
 '<p class="passage">'+passageHtml(q.passage)+'</p>'+
 '<p class="stem">'+esc(q.stem)+'</p>'+
 '<div class="options">'+optionHtml+'</div>'+
 '<div class="actions"><button class="primary" id="checkAnswer" type="button" '+(!selected||checked?"disabled":"")+'>Check answer</button><span class="score" id="score"></span></div>'+
 '<div class="feedback '+(checked&&selected!==q.answer?"is-wrong":"")+'" id="feedback" style="display:'+(checked?"block":"none")+'"><h3>'+esc(result)+'</h3><p><strong>Answer: '+esc(q.answer)+')</strong> '+esc(q.options[q.answer])+'</p><p>'+esc(q.explanation)+'</p><p class="duplicate">'+(q.alsoAppears?"Also appears in: "+esc(q.alsoAppears):"Unique in this workbook")+'</p></div>'+
 '</div></article>';
 document.querySelectorAll(".option").forEach(button=>button.addEventListener("click",()=>{
   state.selected[id]=button.dataset.letter;
   render();
 }));
 el("checkAnswer").addEventListener("click",()=>{
   state.checked[id]=true;
   state.correct[id]=state.selected[id]===q.answer;
   render();
 });
 updateProgress();
}

function updateProgress(){
 const answered=Object.keys(state.checked).length;
 const right=Object.values(state.correct).filter(Boolean).length;
 el("progressText").textContent=answered+" / "+QUESTIONS.length+" answered";
 el("progressBar").style.width=(answered/QUESTIONS.length*100)+"%";
 const score=el("score");
 if(score) score.textContent=answered?"Score: "+right+" / "+answered:"";
}
["search","testFilter","moduleFilter","categoryFilter","skillFilter"].forEach(id=>el(id).addEventListener(id==="search"?"input":"change",applyFilters));
el("resetFilters").addEventListener("click",()=>{["search","testFilter","moduleFilter","categoryFilter","skillFilter"].forEach(id=>el(id).value="");applyFilters();});
el("previous").addEventListener("click",()=>{if(state.index>0){state.index--;render();window.scrollTo({top:0,behavior:"smooth"});}});
el("next").addEventListener("click",()=>{if(state.index<state.filtered.length-1){state.index++;render();window.scrollTo({top:0,behavior:"smooth"});}});
document.addEventListener("keydown",event=>{if(event.target.matches("input,select"))return;if(event.key==="ArrowLeft")el("previous").click();if(event.key==="ArrowRight")el("next").click();});
render();
</script>
</body>
</html>
