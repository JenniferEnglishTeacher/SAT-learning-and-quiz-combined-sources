","options":{"A":"Previously,","B":"On the contrary,","C":"As a result,","D":"For example,"},"answer":"C","explanation":"The gleaming seams are the result of the technique described in the previous sentence, so “As a result” is logical."},{"number":94,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect","passage":"Bats take to the air at dusk, flapping and gliding much as swallows and swifts do. _______ bats are often mistakenly grouped with birds, whose wings are supported by fused arm bones and covered in feathers, when in fact bats are mammals whose wings consist of membranes stretched between greatly elongated finger bones.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For instance,","B":"Hence,","C":"However,","D":"That being said,"},"answer":"B","explanation":"Because bats fly as birds do, people mistakenly group them with birds: the second sentence is a consequence of the first, so “Hence” is logical."},{"number":95,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect","passage":"To compare the brightness of stars reliably, astronomers need a scale that does not depend on how far a star happens to be from Earth. _______ they developed the concept of absolute magnitude, which describes how bright a star would appear if it were located exactly 10 parsecs away. The scale allows stars at vastly different distances to be compared directly.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In addition,","B":"For this reason,","C":"Regardless,","D":"In contrast,"},"answer":"B","explanation":"The need described in the first sentence is the reason astronomers developed absolute magnitude, so “For this reason” is logical."},{"number":96,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect / consequence","passage":"In recent decades, one of the lessons of ecology has been that a species’ survival depends on many factors, not the least of which is its interactions with the other organisms that share its habitat. _______ rather than concentrating solely on individual endangered species, many conservation programs have begun to protect entire ecosystems, including the full range of plants and animals found in them.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In other words,","B":"Accordingly,","C":"That said,","D":"For example,"},"answer":"B","explanation":"Conservation programs changed their approach in response to the lesson described in the first sentence, so “Accordingly” (= as a consequence) is logical. The second sentence is an action, not a restatement or an example."},{"number":97,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Conclusion / inference","passage":"In retrospect, given how many mathematicians in the 1600s were studying tangents, areas, and rates of change, the invention of calculus was a natural next step. It is perhaps unsurprising, _______ that Isaac Newton and Gottfried Wilhelm Leibniz developed the method independently. Indeed, the history of science offers many instances of a major idea emerging from several thinkers at once.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"moreover,","B":"however,","C":"for example,","D":"then,"},"answer":"D","explanation":"The second sentence draws an inference from the first (calculus was a natural next step → no surprise that two people developed it). “Then” (= therefore) is logical."},{"number":98,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect (chain)","passage":"As the Sun heats the ocean near the equator, enormous quantities of water evaporate, and this warm, moist air rises and cools high in the atmosphere. The cooling air, _______ releases its moisture as the heavy rains that sustain tropical forests.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"nevertheless,","B":"in reality,","C":"likewise,","D":"in turn,"},"answer":"D","explanation":"The passage describes a chain: heating → rising, cooling air → rain. “In turn” signals the next link in a chain of effects."},{"number":99,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect","passage":"Renowned for its prehistoric paintings of bulls, horses, and deer, Lascaux Cave was once a major tourist destination in southwestern France. However, by the early 1960s the carbon dioxide and moisture exhaled by more than a thousand daily visitors were visibly damaging the images. _______ French authorities closed the cave to the public in 1963 so that specialists could work to preserve the 17,000-year-old artworks.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For example,","B":"In comparison,","C":"Similarly,","D":"As a result,"},"answer":"D","explanation":"The closure was a consequence of the damage described in the previous sentence, so “As a result” is logical."},{"number":100,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect / consequence","passage":"Biologist Lynn Margulis’s research on cell structure provided strong evidence that mitochondria and chloroplasts descended from free-living bacteria that were engulfed by other cells and survived inside them (rather than arising gradually within their host cells). _______ Margulis’s work is a challenge to the view that evolution proceeds solely through competition among organisms, since it shows that cooperation between species can produce major innovations.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"That said,","B":"For example,","C":"As such,","D":"By contrast,"},"answer":"C","explanation":"Because of what her research demonstrated, Margulis’s work challenges the competition-only view. “As such” introduces this consequence."},{"number":101,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect / conclusion","passage":"If the Moon had formed elsewhere in the solar system and later been captured by Earth’s gravity, its rocks would be expected to differ markedly from Earth’s in their mix of oxygen isotopes. The isotope ratios in lunar samples are nearly identical to those of Earth’s mantle, however. _______ the Moon most likely formed from material blasted out of the young Earth itself, probably during a collision with a Mars-sized body.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For example,","B":"Hence,","C":"Likewise,","D":"That said,"},"answer":"B","explanation":"The final sentence is the conclusion drawn from the evidence (the capture model’s prediction fails), so “Hence” is logical."},{"number":102,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Purpose","passage":"When, in the late 1950s, physician Cicely Saunders began planning a new kind of hospital in London, one of her aims was for dying patients to receive care focused on comfort rather than cure. _______ she founded St. Christopher’s Hospice, which opened in 1967 and combined expert pain relief with emotional support for patients and their families.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In other words,","B":"For example,","C":"To that end,","D":"In summary,"},"answer":"C","explanation":"The first sentence states an aim; the second describes the action taken to achieve it. “To that end” (= for that purpose) is logical."},{"number":103,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Similarity / comparison","passage":"In the 1930s, federal relief programs employed artists across the United States to create works for public buildings. In San Francisco, painters covered the interior of Coit Tower with murals depicting California agriculture and industry. _______ in Harlem, artists led by Charles Alston painted murals for the wards of Harlem Hospital.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For example,","B":"To conclude,","C":"Similarly,","D":"In other words,"},"answer":"C","explanation":"The Harlem artists did the same kind of thing as the San Francisco painters—a parallel case—so “Similarly” is logical. It is not an example OF the San Francisco sentence."},{"number":104,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Similarity / comparison","passage":"In her novel Homegoing, Yaa Gyasi links the private lives of two half sisters’ descendants to major historical developments. She sets the experiences of one family line in what is now Ghana against the expansion of British colonial rule. _______ Gyasi places the other line’s story in the United States within the larger history of slavery, segregation, and the Great Migration.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Thus,","B":"Regardless,","C":"Specifically,","D":"Similarly,"},"answer":"D","explanation":"Gyasi treats the second family line in the same way as the first (private story set within a larger history), so “Similarly” is logical."},{"number":105,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Trend / change over time","passage":"Urban planners report that although cities long treated rainwater as a nuisance to be channeled away as quickly as possible, attitudes have begun to move in the opposite direction. _______ municipalities are designing parks, plazas, and streets to absorb and store stormwater—a trend reflected in the growing number of so-called sponge city projects worldwide.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Furthermore,","B":"Increasingly,","C":"For this reason,","D":"Similarly,"},"answer":"B","explanation":"The sentence describes a growing trend (“have begun to move,” “a trend,” “the growing number”), so “Increasingly” is logical. It is not a result, a parallel case, or an additional point."},{"number":106,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Time / simultaneity","passage":"Jhumpa Lahiri’s 2003 novel The Namesake traces the experiences of the Ganguli family after Ashoke and Ashima emigrate from Calcutta to Massachusetts. Ashoke immerses himself in his work as an engineering professor. _______ Ashima struggles with isolation, longing for the relatives she left behind. Over time, however, she builds a community of fellow Bengali immigrants.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In fact,","B":"Meanwhile,","C":"Nevertheless,","D":"Secondly,"},"answer":"B","explanation":"Ashima’s experience takes place during the same period as Ashoke’s, so “Meanwhile” is logical."},{"number":107,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Time / sequence","passage":"Beneath the jungle canopy of northern Guatemala lie the remains of Maya cities so extensive that they cannot be fully mapped on foot. Archaeologists have known of the largest sites since the nineteenth century, when explorers first described their overgrown temples, and they have been surveying the region ever since. _______ researchers’ work is accelerated by lidar, an airborne laser technology that reveals structures hidden under the trees.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Currently,","B":"Still,","C":"In comparison,","D":"However,"},"answer":"A","explanation":"The passage moves from the past (“since the nineteenth century”) to the present situation, so the time transition “Currently” is logical. Nothing is being contrasted."},{"number":108,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Sequence / enumeration","passage":"Paleontologist Jack Horner has offered several reasons for thinking that the duck-billed dinosaur Maiasaura cared for its young. First, fossilized nests contain the remains of juveniles too large to be newly hatched, suggesting that the young stayed in the nest. _______ the worn teeth of these juveniles indicate that food was being brought to them.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Still,","B":"Specifically,","C":"Instead,","D":"Second,"},"answer":"D","explanation":"“First” introduces the first reason; the next sentence gives another reason in the same list, so “Second” is logical."},{"number":109,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Sequence / conclusion of a process","passage":"In 1878, a constitutional amendment granting women the right to vote was first introduced in the US Congress. The measure failed, but suffragists persisted. Their allies had the amendment reintroduced in nearly every session of Congress for the next four decades. _______ in 1919, both chambers approved it, and it was ratified the following year.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Finally,","B":"Additionally,","C":"Likewise,","D":"Instead,"},"answer":"A","explanation":"Approval came at the end of a long series of attempts, so “Finally” is logical."},{"number":110,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Time / sequence","passage":"During its first test flight in 1996, the European Space Agency’s Ariane 5 rocket suffered a catastrophic failure: a software error caused it to veer off course and self-destruct less than a minute after liftoff. _______ rather than concealing the cause, the agency convened an independent board of inquiry and published its findings in full, and the report became a standard case study for software engineers.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Afterward,","B":"Similarly,","C":"Additionally,","D":"Indeed,"},"answer":"A","explanation":"The inquiry happened after the failure, so the time transition “Afterward” is logical."},{"number":111,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Sequence","passage":"Around 1800, French confectioner Nicolas Appert devised a method of preserving food that became the basis of modern canning. In Appert’s process, a cook first packed the food into thick glass bottles. _______ the cook sealed the bottles tightly with cork and wax. Lastly, the cook submerged them in boiling water for several hours.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For example,","B":"Similarly,","C":"Next,","D":"In contrast,"},"answer":"C","explanation":"The steps are listed in order: “first... [blank]... Lastly.” The sequence transition “Next” is logical."},{"number":112,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Time / sequence","passage":"In 1992, Mae Jemison became the first African American woman to travel into space, serving as a mission specialist aboard the space shuttle Endeavour. _______ in 1994, Jemison founded an international science camp, The Earth We Share, to encourage students to work on global problems.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In other words,","B":"For example,","C":"Later,","D":"Instead,"},"answer":"C","explanation":"The second event (1994) happened after the first (1992), so “Later” is logical."},{"number":113,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Time (past vs. present)","passage":"When the Human Genome Project began in 1990, sequencing a single human genome was expected to take fifteen years and cost about $3 billion. _______ a human genome can be sequenced in about a day for less than $1,000.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For example,","B":"Today,","C":"Additionally,","D":"Nevertheless,"},"answer":"B","explanation":"The passage compares the situation in 1990 with the situation now, so the time transition “Today” is logical."},{"number":114,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Sequence","passage":"After a site has been selected, the traditional construction of a Mongolian ger, or yurt, begins with the builders standing collapsible wooden lattice walls in a circle. Then, long poles are fitted between the top of the lattice and a central roof ring. _______ the frame is covered with layers of felt and tied down with ropes.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Finally,","B":"On the contrary,","C":"Earlier,","D":"For instance,"},"answer":"A","explanation":"This is the last step in a process (“begins with... Then... [blank]”), so “Finally” is logical."},{"number":115,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Time (earlier event)","passage":"When Kenyan runner Eliud Kipchoge completed a marathon in Vienna in 2019 in 1 hour, 59 minutes, and 40 seconds, he reached a milestone in athletics. _______ no one had covered the distance in under two hours, making Kipchoge’s run, though not eligible as an official world record, a historic first.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"However,","B":"As a result,","C":"Likewise,","D":"Previously,"},"answer":"D","explanation":"The second sentence describes the situation before Kipchoge’s run (note the past perfect “had covered”), so “Previously” is logical."},{"number":116,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Sequence","passage":"Psychologist Elizabeth Loftus wanted to determine whether the wording of a question can alter a person’s memory of an event. She first showed volunteers films of automobile collisions. _______ she asked some of them how fast the cars were going when they “smashed into” each other and asked others the same question using the word “hit.”","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In sum,","B":"Specifically,","C":"Next,","D":"For instance,"},"answer":"C","explanation":"“She first...” is followed by the next step in the procedure, so “Next” is logical."},{"number":117,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Alternative","passage":"When a crop is threatened by insect pests, farmers can spray their fields with chemical insecticides. _______ the pests can be managed through biological control: natural enemies such as parasitic wasps or lady beetles are released to prey on the insects, reducing their numbers without leaving chemical residues on the harvest.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"As a result,","B":"For example,","C":"Specifically,","D":"Alternatively,"},"answer":"D","explanation":"Biological control is a different option from the one in the first sentence (spraying), so “Alternatively” is logical."},{"number":118,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Alternative / replacement","passage":"In writing about the centuries after 1492, historian Alfred Crosby urged scholars to stop treating the movement of plants, animals, and diseases between the hemispheres as a series of isolated events. _______ he argued, these transfers should be understood as a single process, which he named the Columbian Exchange. The term, he held, captured how profoundly the two hemispheres had reshaped each other’s ecosystems.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Instead,","B":"There,","C":"Regardless,","D":"Previously,"},"answer":"A","explanation":"Crosby wanted scholars to stop doing one thing and adopt a replacement view, so “Instead” is logical."},{"number":119,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Comment / appropriateness","passage":"In 1705, English astronomer Edmond Halley argued that the comets recorded in 1531, 1607, and 1682 were a single object and predicted that it would return in 1758. Halley did not live to see the prediction tested, but the comet reappeared on schedule. _______ the comet has been known ever since as Halley’s Comet, in honor of the man who first recognized its orbit.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"In other words,","B":"However,","C":"Fittingly,","D":"Similarly,"},"answer":"C","explanation":"Naming the comet after the person who predicted its return is an appropriate outcome, so “Fittingly” is logical."}];
const STORAGE_KEY="aiGeneratedSatGrammarProgressV1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch{return {}}})();
const state={filtered:[...QUESTIONS],index:0,selected:saved.selected||{},checked:saved.checked||{},correct:saved.correct||{}};
const letters=["A","B","C","D"],el=id=>document.getElementById(id);
function esc(value){const n=document.createElement("div");n.textContent=value||"";return n.innerHTML}
function passageHtml(value){return esc(value).replace(/_{4,}/g,'<span class="blank">_______</span>')}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify({selected:state.selected,checked:state.checked,correct:state.correct}))}
function unique(field){return [...new Set(QUESTIONS.map(q=>q[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))}
function fill(id,values){const s=el(id);values.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;s.appendChild(o)})}
fill("ruleFilter",unique("rule"));fill("skillFilter",unique("skill"));
function applyFilters(){
 const term=el("search").value.trim().toLowerCase(),rule=el("ruleFilter").value,skill=el("skillFilter").value;
 state.filtered=QUESTIONS.filter(q=>{const hay=[q.rule,q.skill,q.passage,q.stem,...Object.values(q.options)].join(" ").toLowerCase();return(!term||hay.includes(term))&&(!rule||q.rule===rule)&&(!skill||q.skill===skill)});
 state.index=0;render()
}
function render(){
 const total=state.filtered.length;
 el("filterSummary").textContent=total+" of "+QUESTIONS.length+" questions";
 el("counter").textContent=total?"Question "+(state.index+1)+" of "+total:"";
 el("previous").disabled=state.index<=0;el("next").disabled=!total||state.index>=total-1;
 if(!total){el("questionHost").innerHTML='<div class="empty"><strong>No questions match these filters.</strong><p>Try clearing one or more filters.</p></div>';updateProgress();return}
 const q=state.filtered[state.index],id=String(q.number),selected=state.selected[id],checked=state.checked[id];
 const options=letters.map(letter=>{const good=checked&&letter===q.answer,bad=checked&&selected===letter&&letter!==q.answer;const cls=["option",selected===letter?"selected":"",good?"correct":"",bad?"incorrect":""].filter(Boolean).join(" ");return '<button class="'+cls+'" type="button" data-letter="'+letter+'" '+(checked?"disabled":"")+'><span class="letter">'+letter+'</span><span>'+esc(q.options[letter])+'</span></button>'}).join("");
 const result=checked?(selected===q.answer?"Correct":"Not quite"):"";
 el("questionHost").innerHTML='<article class="question-panel"><div class="question-meta"><span>Practice P'+q.number+'</span><span>'+esc(q.rule)+'</span></div><div class="question-content"><h2>Practice P'+q.number+'</h2><p class="passage">'+passageHtml(q.passage)+'</p><p class="stem">'+esc(q.stem)+'</p><div class="options">'+options+'</div><div class="actions"><button class="primary" id="checkAnswer" type="button" '+(!selected||checked?"disabled":"")+'>Check answer</button><span class="score" id="score"></span></div><div class="feedback '+(checked&&selected!==q.answer?"is-wrong":"")+'" id="feedback" style="display:'+(checked?"block":"none")+'"><h3>'+esc(result)+'</h3><p><strong>Answer: '+q.answer+')</strong> '+esc(q.options[q.answer])+'</p><p>'+esc(q.explanation)+'</p><p class="rule-note">'+esc(q.skill)+'</p></div></div></article>';
 document.querySelectorAll(".option").forEach(b=>b.addEventListener("click",()=>{state.selected[id]=b.dataset.letter;persist();render()}));
 el("checkAnswer").addEventListener("click",()=>{state.checked[id]=true;state.correct[id]=state.selected[id]===q.answer;persist();render()});
 updateProgress()
}
function updateProgress(){const answered=Object.keys(state.checked).length,right=Object.values(state.correct).filter(Boolean).length;el("progressText").textContent=answered+" / "+QUESTIONS.length+" answered";el("progressBar").style.width=(answered/QUESTIONS.length*100)+"%";const score=el("score");if(score)score.textContent=answered?"Score: "+right+" / "+answered:""}
["search","ruleFilter","skillFilter"].forEach(id=>el(id).addEventListener(id==="search"?"input":"change",applyFilters));
el("resetFilters").addEventListener("click",()=>{["search","ruleFilter","skillFilter"].forEach(id=>el(id).value="");applyFilters()});
el("resetProgress").addEventListener("click",()=>{if(confirm("Clear all saved answers for this quiz?")){state.selected={};state.checked={};state.correct={};persist();render()}});
el("previous").addEventListener("click",()=>{if(state.index>0){state.index--;render();scrollTo({top:0,behavior:"smooth"})}});
el("next").addEventListener("click",()=>{if(state.index<state.filtered.length-1){state.index++;render();scrollTo({top:0,behavior:"smooth"})}});
document.addEventListener("keydown",event=>{if(event.target.matches("input,select"))return;if(event.key==="ArrowLeft")el("previous").click();if(event.key==="ArrowRight")el("next").click()});
render();
</script>
</body>
</html>
