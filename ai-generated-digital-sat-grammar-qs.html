<script>
const QUESTIONS=[{"number":1,"rule":"Rule 1 — Every Clause Needs a Finite (Main) Verb","skill":"Finite vs. nonfinite verb (main verb needed)","passage":"In the 1840s, the Irish potato crop was devastated by Phytophthora infestans, a water mold that spreads rapidly in cool, damp conditions. Many agricultural historians _______ that the island’s near-total reliance on a single potato variety, the Lumper, left the crop with almost no genetic defense against the pathogen.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"having argued","B":"to argue","C":"argue","D":"arguing"},"answer":"C","explanation":"The subject “Many agricultural historians” has no main verb yet. “Argue” is finite and plural; the participles and the infinitive are nonfinite and would leave the sentence a fragment."},{"number":2,"rule":"Rule 1 — Every Clause Needs a Finite (Main) Verb","skill":"Finite vs. nonfinite verb (main verb needed)","passage":"To conserve energy during the long Arctic winter, when air temperatures can fall below −30°C, Arctic ground squirrels in hibernation _______ their core body temperature to drop below the freezing point of water. No other mammal is known to survive such a low body temperature.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"to allow","B":"allow","C":"having allowed","D":"allowing"},"answer":"B","explanation":"Strip the interrupters: “Arctic ground squirrels [blank] their core body temperature to drop.” The subject needs a finite main verb, and only “allow” is finite."},{"number":3,"rule":"Rule 1 — Every Clause Needs a Finite (Main) Verb","skill":"Finite vs. nonfinite verb (main verb needed)","passage":"For centuries, weavers on the Indonesian island of Sumba _______ ikat, a technique in which bundles of thread are tightly bound and dyed before being woven, to produce textiles that mark births, marriages, and funerals. Remarkably, a single large cloth can take a weaver more than a year to complete.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have practiced","B":"to practice","C":"having practiced","D":"practicing"},"answer":"A","explanation":"The subject “weavers” needs a finite main verb. “Have practiced” is finite, and the present perfect fits an activity that began in the past and continues (“For centuries”). The other choices are nonfinite."},{"number":4,"rule":"Rule 1 — Every Clause Needs a Finite (Main) Verb","skill":"Finite verb in a relative clause","passage":"A largely self-taught mathematician from southern India, Srinivasa Ramanujan is celebrated for the notebooks he filled before his death in 1920, which _______ thousands of formulas that researchers are still working to prove.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"containing","B":"contain","C":"to contain","D":"having contained"},"answer":"B","explanation":"The relative clause “which [blank] thousands of formulas” needs its own finite verb. “Contain” is finite and agrees with the plural “notebooks.” The nonfinite forms leave the clause without a verb."},{"number":5,"rule":"Rule 1 — Every Clause Needs a Finite (Main) Verb","skill":"Finite vs. nonfinite verb (main verb needed)","passage":"A honeybee that has located a rich patch of flowers does not simply return to it; she first spends valuable time performing an elaborate “waggle dance” inside the dark hive. Research by Austrian ethologist Karl von Frisch _______ why: the angle and duration of the dance tell nestmates the direction and distance of the food source, allowing the entire colony to exploit it.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"revealing","B":"having revealed","C":"to reveal","D":"reveals"},"answer":"D","explanation":"The subject “Research” (ignore “by Austrian ethologist Karl von Frisch”) needs a finite main verb before the colon: “reveals.” The other choices are nonfinite."},{"number":6,"rule":"Rule 1 — Every Clause Needs a Finite (Main) Verb","skill":"Finite vs. nonfinite verb (main verb needed)","passage":"In 1928, Scottish physician Alexander Fleming noticed that a mold contaminating one of his culture plates had killed the surrounding bacteria. More than a decade later, Howard Florey and Ernst Chain _______ on Fleming’s observation to develop penicillin into a drug that could be mass-produced.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"to have built","B":"to build","C":"built","D":"building"},"answer":"C","explanation":"The subject “Howard Florey and Ernst Chain” needs a finite main verb. “Built” is finite and in the simple past, matching “noticed” and “More than a decade later.”"},{"number":7,"rule":"Rule 1 — Every Clause Needs a Finite (Main) Verb","skill":"Finite vs. nonfinite verb (main verb needed)","passage":"How do monarch butterflies, which weigh less than a gram, navigate thousands of kilometers to the same mountain forests in central Mexico each autumn? Neurobiologist Steven Reppert suspected that part of the answer lay in the insects’ antennae. In 2009, Reppert and his colleagues _______ evidence that the antennae contain a light-sensitive clock that helps the butterflies orient themselves by the Sun.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"having reported","B":"to report","C":"reporting","D":"reported"},"answer":"D","explanation":"The subject “Reppert and his colleagues” needs a finite main verb; “reported” is finite and past tense (“In 2009”). The other choices are nonfinite."},{"number":8,"rule":"Rule 1 — Every Clause Needs a Finite (Main) Verb","skill":"Finite vs. nonfinite verb (main verb needed)","passage":"In 1955, Marian Anderson became the first African American singer to perform a principal role at the Metropolitan Opera. Her decades of acclaimed concert tours across Europe and her celebrated 1939 recital on the steps of the Lincoln Memorial before a crowd of 75,000 _______ pave the way for the generations of Black opera singers who followed.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"listeners helped","B":"listeners to help","C":"listeners that helped","D":"listeners, helping"},"answer":"A","explanation":"The long compound subject (“Her decades of... tours... and her... recital...”) still needs a finite main verb: “helped.” The other choices turn “help” into a participle, a relative clause, or an infinitive, leaving the sentence without a main verb."},{"number":9,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Participial phrase showing result (nonfinite)","passage":"In summer, the hunting habits of polar bears along Hudson Bay are shaped more by ice conditions than by preference. Although the bears rely on sea ice as a platform for catching seals, that platform may disappear for months as the bay thaws, _______ the animals to come ashore and subsist on stored fat, bird eggs, and whatever carcasses they can scavenge.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"drove","B":"driving","C":"to drive","D":"drives"},"answer":"B","explanation":"The main clause (“that platform may disappear”) is already complete, so what follows the comma must be a nonfinite participial phrase showing the result: “driving the animals to come ashore.” “Drives” and “drove” are finite verbs with no subject or conjunction; “to drive” would wrongly suggest purpose."},{"number":10,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Parallel verbs after a modal (would + base form)","passage":"To reduce the urban heat island effect, in which paved surfaces cause cities to be warmer than surrounding rural areas, some planners have proposed that reflective coatings be applied to rooftops and roads. Such coatings would lower surface temperatures during heat waves and _______ the amount of electricity that buildings consume for air conditioning.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"decreases","B":"decreased","C":"decreasing","D":"decrease"},"answer":"D","explanation":"Two verbs share the modal “would”: “would lower... and (would) decrease.” After a modal, each verb must be in the base form, parallel to “lower.”"},{"number":11,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Infinitive of purpose","passage":"Drawing on decades of research into how the immune system recognizes foreign molecules, biochemists Katalin Karikó and Drew Weissman—recipients of the 2023 Nobel Prize in Physiology or Medicine—chemically modified one of the building blocks of messenger RNA _______ a molecule that cells would accept without triggering a harmful inflammatory response.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"to produce","B":"and producing","C":"produces","D":"produced"},"answer":"A","explanation":"The sentence already has its main verb (“modified”). The blank explains WHY they modified the RNA, so an infinitive of purpose is needed: “to produce a molecule.” “Produced” and “produces” add a second finite verb with no conjunction; “and producing” is not parallel to “modified.”"},{"number":12,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Participial phrase as supplement (nonfinite) + paired commas","passage":"Japanese artist Yayoi _______ her mirrored installations to give viewers the sensation of standing in a space without boundaries, lines the walls, floors, and ceilings of small rooms with reflective panels that multiply hanging lights into seemingly endless fields.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Kusama, designs","B":"Kusama, designing","C":"Kusama is designing","D":"Kusama designs"},"answer":"B","explanation":"The main verb is “lines” (“Yayoi Kusama... lines the walls”). Everything between the commas is a supplement, so it must be a nonfinite participial phrase opened with a comma: “Kusama, designing her mirrored installations...,”. The other choices give the subject two finite verbs."},{"number":13,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Past participle as introductory modifier","passage":"The Rosenwald schools were among the most important educational institutions for Black children in the rural American South in the early twentieth century. _______ through a partnership between educator Booker T. Washington and philanthropist Julius Rosenwald, the schools eventually numbered nearly five thousand across fifteen states.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Established","B":"Establishes","C":"Establishing","D":"Establish"},"answer":"A","explanation":"The opening phrase modifies “the schools,” which RECEIVED the action (they were established), so the past participle is required. “Establishing” would mean the schools did the establishing; the finite forms cannot begin a modifier."},{"number":14,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Past participle as modifier (nonfinite)","passage":"Built around a steady pulse and short melodic cells that shift gradually over time, Steve Reich’s 1976 composition Music for 18 Musicians is a landmark of minimalism, a style of music _______ by the repetition and slow transformation of simple patterns rather than by dramatic contrasts.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will be defined","B":"has been defined","C":"defined","D":"is defined"},"answer":"C","explanation":"“A style of music...” is an appositive renaming “minimalism,” not a new clause, so it cannot take a finite verb. The past participle “defined” (= “that is defined”) correctly modifies “style.”"},{"number":15,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Infinitive after certain verbs (decide to)","passage":"Today, the marathon is fixed at 42.195 kilometers, a distance that runners around the world train for years to complete. Curiously, organizers of the 1908 London Olympics chose _______ the course so that it would begin at Windsor Castle and end in front of the royal box, and the resulting distance later became the official standard.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"arranged","B":"arrange","C":"arranging","D":"to arrange"},"answer":"D","explanation":"The verb “chose” is followed by an infinitive: “chose to arrange.” (Compare decide to, plan to, agree to.)"},{"number":16,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Participle as modifier (main verb elsewhere)","passage":"Analyses of ancient DNA have led some geneticists to propose that farming spread across Europe mainly through the migration of farmers rather than through the adoption of agriculture by local hunter-gatherers. This model _______ that incoming populations almost entirely replaced existing ones cannot be accepted, some archaeologists counter, until evidence of intermarriage between the two groups has been accounted for.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"implying","B":"has implied","C":"implied","D":"implies"},"answer":"A","explanation":"Read to the end: the main verb of “This model” is “cannot be accepted.” The blank must therefore be a nonfinite modifier of “model”: “This model implying that... cannot be accepted.” Any finite choice gives the subject two main verbs."},{"number":17,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Infinitive of purpose","passage":"In the graphic memoir Persepolis, Iranian-born author Marjane Satrapi uses stark black-and-white drawings rather than conventional prose _______ her experience of growing up in Tehran during and after the 1979 revolution.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"is recounting","B":"to recount","C":"recounts","D":"recounted"},"answer":"B","explanation":"The main verb is “uses.” The blank gives the purpose of using drawings, so an infinitive is needed: “uses... drawings... to recount her experience.” The finite choices create a second main verb."},{"number":18,"rule":"Rule 2 — Nonfinite Verbs Used Correctly (Participles, Infinitives, Absolute Phrases, Parallel Verbs)","skill":"Absolute phrase (nonfinite participle)","passage":"In the mid-fifteenth century, Johannes Gutenberg’s workshop in Mainz produced roughly 180 copies of a Latin Bible using movable metal type. Regarded as the first major book printed in Europe by this method, the Gutenberg Bible is admired for the clarity and evenness of its pages, its surviving copies _______ by libraries and museums as among the most valuable books in the world.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"were now treasured","B":"are now treasured","C":"now treasured","D":"have now been treasured"},"answer":"C","explanation":"After the comma comes an absolute phrase (noun + participle): “its surviving copies now treasured by libraries.” A finite verb here (“are,” “were,” “have been”) would create a second independent clause joined only by a comma—a comma splice."},{"number":19,"rule":"Rule 3 — Verb Tense","skill":"Simple present (time marker \"today\")","passage":"In her 1962 book Silent Spring, marine biologist Rachel Carson documented how the pesticide DDT was accumulating in food chains and killing birds. Today, the book _______ widely credited with launching the modern environmental movement in the United States.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will be","B":"is","C":"had been","D":"was"},"answer":"B","explanation":"“Today” signals a present state, so the simple present “is” is required."},{"number":20,"rule":"Rule 3 — Verb Tense","skill":"Past perfect (by + past time)","passage":"Launched in 1977 to study Jupiter and Saturn, NASA’s Voyager 1 spacecraft completed its planetary flybys by 1980 and then continued toward the edge of the solar system. By the time it crossed into interstellar space in 2012, the probe _______ more than 18 billion kilometers from Earth.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"travels","B":"has traveled","C":"had traveled","D":"will travel"},"answer":"C","explanation":"“By the time it crossed... in 2012” sets a past reference point; the traveling was completed before that point, so the past perfect “had traveled” is required."},{"number":21,"rule":"Rule 3 — Verb Tense","skill":"Tense consistency (literary present)","passage":"Memory and its unreliability are recurring concerns in Kazuo Ishiguro’s fiction. In The Remains of the Day, for example, the butler Stevens reconsiders decades of loyal service during a drive through the English countryside, while in Never Let Me Go, the narrator Kathy _______ her years at a secluded boarding school whose true purpose she only gradually comes to understand.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"recalls","B":"had recalled","C":"will be recalling","D":"recalled"},"answer":"A","explanation":"Events in a literary work are described in the present tense, and the parallel verbs “reconsiders” and “comes” are present. “Recalls” keeps the tense consistent."},{"number":22,"rule":"Rule 3 — Verb Tense","skill":"Tense consistency (simple past)","passage":"In 1968, Spencer Silver, a chemist at the company 3M, was trying to develop an exceptionally strong adhesive when he instead produced a weak one that could be peeled away without leaving a residue. Years later, his colleague Art Fry realized that the adhesive could keep bookmarks from slipping out of his hymnal. Soon afterward, Fry _______ coating small sheets of paper with it, and the Post-it Note was born.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"proposes","B":"had proposed","C":"proposed","D":"was proposing"},"answer":"C","explanation":"The passage narrates a sequence of completed past events (“realized,” “was born”). The simple past “proposed” keeps the sequence; the past perfect would wrongly place this event BEFORE Fry’s realization."},{"number":23,"rule":"Rule 3 — Verb Tense","skill":"Simple present for general process","passage":"Water droplets inside a cumulonimbus cloud are carried upward by powerful air currents, freezing and accumulating layer upon layer of ice until they _______ a weight the updraft can no longer support, at which point they fall to the ground as hailstones.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will reach","B":"reach","C":"are reaching","D":"had reached"},"answer":"B","explanation":"The sentence describes a general, repeated process in the simple present (“are carried,” “fall”). “Reach” matches."},{"number":24,"rule":"Rule 3 — Verb Tense","skill":"Simple present for general fact","passage":"Unlike most desert mammals, the kangaroo rat (Dipodomys) can go its entire life without drinking, so during the hottest and driest months of the year, it _______ on the small amount of water its body produces when metabolizing the dry seeds it eats.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"had relied","B":"would rely","C":"relied","D":"relies"},"answer":"D","explanation":"The sentence states a general fact about the species in the present tense (“can go,” “produces,” “eats”), so the simple present “relies” is correct."},{"number":25,"rule":"Rule 3 — Verb Tense","skill":"Simple past (completed past event)","passage":"The Year Without a Summer followed the eruption of Mount Tambora in Indonesia in April 1815. During 1816, volcanic ash and gases in the atmosphere _______ temperatures across much of the Northern Hemisphere. Snow even fell in New England in June.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"will have lowered","B":"will lower","C":"are lowering","D":"lowered"},"answer":"D","explanation":"The event took place in 1816 and the neighboring verbs (“followed,” “fell”) are in the simple past, so “lowered” is correct."},{"number":26,"rule":"Rule 3 — Verb Tense","skill":"Simple past (specific past date)","passage":"The Tacoma Narrows Bridge in Washington State was celebrated at its opening as the third-longest suspension bridge in the world. On November 7, 1940, the bridge’s deck _______ violently in a steady wind and then tore apart. No one died, but after only four months in service the original bridge was gone.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"twisted","B":"has twisted","C":"will twist","D":"twists"},"answer":"A","explanation":"A specific past date (“On November 7, 1940”) and the parallel verb “tore” require the simple past “twisted.” The present perfect cannot be used with a finished, dated time."},{"number":27,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (gerund subject)","passage":"The ancient Chinese game of Go is played on a grid of nineteen horizontal and nineteen vertical lines. Players take turns placing black or white stones on the grid’s intersections; surrounding a group of the opponent’s stones _______ a player to remove them from the board and claim the territory they occupied.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have permitted","B":"permits","C":"are permitting","D":"permit"},"answer":"B","explanation":"The subject is the gerund phrase “surrounding a group of the opponent’s stones,” which is singular (the nearby plural “stones” is not the subject). Only “permits” is singular."},{"number":28,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement + present perfect","passage":"Colson Whitehead’s The Underground Railroad (2016), which imagines the historical network of safe houses as a literal subterranean train line, won both the National Book Award and the Pulitzer Prize for Fiction. The awards brought Whitehead a far wider readership, but his fiction _______ praised before. His 2001 novel John Henry Days, for instance, was a finalist for the Pulitzer.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"has been","B":"were","C":"have been","D":"are"},"answer":"A","explanation":"The subject “his fiction” is singular, and “before” signals experience up to now, so the singular present perfect “has been” is correct. The other choices are plural."},{"number":29,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (singular title; ignore interrupter)","passage":"Zora Neale Hurston’s Mules and Men (1935), a collection of African American folktales and songs that the author gathered in Florida and Louisiana, _______ folklorists’ understanding of the oral traditions that flourished in Black communities of the rural South.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"deepen","B":"has deepened","C":"have deepened","D":"are deepening"},"answer":"B","explanation":"The subject is the title Mules and Men, a single book, so the verb must be singular even though the title contains plural nouns. Ignore the appositive between the commas (“a collection of... folktales and songs”)."},{"number":30,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement in relative clause","passage":"Chemists Dmitri Mendeleev and Lothar Meyer independently developed early versions of the periodic table, a chart that _______ the chemical elements according to recurring patterns in their properties.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have arranged","B":"arrange","C":"arranges","D":"were arranging"},"answer":"C","explanation":"In the relative clause, “that” refers to the singular noun “a chart,” so the verb must be singular: “arranges.” The plural “Mendeleev and Meyer” and “versions” are not the subject of this clause."},{"number":31,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement in inverted sentence","passage":"The Harlem Renaissance of the 1920s saw the emergence of numerous literary magazines, publications that gave young Black writers a national audience. Among the magazines’ most influential editors _______ Jessie Redmon Fauset, literary editor of The Crisis.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"was","B":"are","C":"were","D":"have been"},"answer":"A","explanation":"The sentence is inverted: the subject follows the verb. The subject is “Jessie Redmon Fauset,” one person, so the singular “was” is correct. “Editors” is the object of the preposition “among.”"},{"number":32,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (singular subject + modifier)","passage":"In many of his woodblock prints from the 1830s, Japanese artist Katsushika Hokusai sought to convey the presence of Mount Fuji from dozens of vantage points, filling the foreground with fishermen, travelers, and laborers. Notably, the mountain framed by these busy human scenes _______ often among the smallest elements in the composition.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"were","B":"have been","C":"is","D":"are"},"answer":"C","explanation":"The subject is the singular “the mountain”; “framed by these busy human scenes” is a modifier whose plural noun “scenes” does not affect the verb. Only “is” is singular."},{"number":33,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (gerund subject)","passage":"A researcher who publishes findings without sharing the underlying data makes it difficult for others to verify the results. For this reason, many journals now encourage authors to deposit their data in public repositories. Making these data sets freely available _______ that other scientists can attempt to reproduce an experiment’s conclusions.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are meaning","B":"means","C":"have meant","D":"mean"},"answer":"B","explanation":"The subject is the gerund phrase “Making these data sets freely available,” which is singular. The plural “data sets” is the object of “making,” not the subject."},{"number":34,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (plural subject + interrupter)","passage":"In her 1974–79 installation The Dinner Party, artist Judy Chicago set a triangular table with thirty-nine elaborate place settings. These place settings, each crafted in a style evoking the era of the woman it honors and arranged along a table nearly fifteen meters long on each side, _______ figures ranging from the ancient poet Sappho to the painter Georgia O’Keeffe.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"commemorate","B":"has commemorated","C":"commemorates","D":"was commemorating"},"answer":"A","explanation":"Cross out the long interrupter between the commas. The subject is the plural “These place settings,” so the plural “commemorate” is required; the singular nouns inside the interrupter (“woman,” “table,” “side”) are traps."},{"number":35,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (plural subject + interrupter)","passage":"In his 1983 book Imagined Communities, political scientist Benedict Anderson first developed at length his account of nationalism—the idea that the shared texts a population reads in a common language (newspapers, novels, official documents, etc.) _______ a sense of belonging among millions of people who will never meet one another.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"fosters","B":"is fostering","C":"foster","D":"has been fostering"},"answer":"C","explanation":"The subject of the clause is the plural “the shared texts.” “A population reads in a common language” is a relative clause modifying “texts,” and the parenthesis is an interrupter. The verb must be plural: “foster.”"},{"number":36,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement in relative clause","passage":"“I came, I saw, I conquered.” This famous line is attributed to the Roman general Julius Caesar. It’s an example of asyndeton, a rhetorical device that _______ speed and force by omitting the conjunctions that would normally join a series of clauses.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have conveyed","B":"convey","C":"are conveying","D":"conveys"},"answer":"D","explanation":"“That” refers to the singular “a rhetorical device,” so the verb in the relative clause must be singular: “conveys.”"},{"number":37,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (plural subject + interrupter)","passage":"In her photograph Migrant Mother, taken in California in 1936, Dorothea Lange shows a weary woman flanked by two of her children. Such stark images, made by Lange, a photographer employed by the federal Resettlement Administration, _______ the hardships endured by farmworkers during the Great Depression.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"documents","B":"has documented","C":"was documenting","D":"document"},"answer":"D","explanation":"The subject is the plural “Such stark images.” Everything between the commas—including the singular nouns “Lange,” “photographer,” and “Administration”—is an interrupter. The plural “document” is correct."},{"number":38,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (plural subject + interrupter)","passage":"Milkweed plants produce bitter compounds called cardenolides to discourage animals from eating their leaves. However, in some cases, the compounds the plant makes to defend itself against herbivores actually _______ its appeal to certain insects. The monarch caterpillar, for example, not only tolerates cardenolides but stores them in its own tissues, becoming poisonous to birds.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"has enhanced","B":"enhances","C":"is enhancing","D":"enhance"},"answer":"D","explanation":"The subject is the plural “the compounds”; “the plant makes to defend itself against herbivores” is a relative clause describing them. The verb must be plural: “enhance.”"},{"number":39,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement + parallel verbs","passage":"One of the oldest surviving star charts is a Chinese manuscript discovered in a cave near Dunhuang and thought to date from about 700 CE. The chart _______ more than 1,300 stars, groups them into constellations, and includes captions naming each one.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"depict","B":"depicts","C":"are depicting","D":"have depicted"},"answer":"B","explanation":"The subject “The chart” is singular, and the verb must be parallel to “groups” and “includes” (singular simple present): “depicts.”"},{"number":40,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (plural subject + interrupter)","passage":"Laboratory methods for editing genes are transforming agricultural research, according to many plant biologists. The recent achievements of researchers at the International Rice Research Institute, the organization whose high-yield variety IR8 helped avert famine in Asia in the 1960s, _______ to the continuing importance of publicly funded crop science in feeding a growing population.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"testifies","B":"is testifying","C":"testify","D":"has testified"},"answer":"C","explanation":"The subject is the plural “achievements,” not “Institute,” “organization,” or “variety.” Cross out the prepositional phrases and the appositive between the commas, and the verb must be plural: “testify.”"},{"number":41,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (singular subject + interrupter)","passage":"Biologists studying humpback whales, the baleen whales known for their long migrations and complex songs, have long relied on the fact that the pattern of markings on the underside of each whale’s tail flukes, like the pattern of ridges on a person’s fingertips, _______ distinctive enough to identify an individual.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"is","B":"have been","C":"are","D":"were"},"answer":"A","explanation":"The subject is the singular “the pattern.” “Of markings on the underside of each whale’s tail flukes” is a chain of prepositional phrases, and “like the pattern of ridges...” is an interrupter. The singular present “is” is correct."},{"number":42,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (plural subject + interrupter)","passage":"Interest in bioluminescence, the process by which living organisms produce light through chemical reactions, is growing because of fieldwork by marine biologists—many of whom, like deep-sea researcher Edith Widder, _______ the phenomenon to learn how animals communicate in the darkness of the open ocean.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"investigate","B":"investigates","C":"has investigated","D":"is investigating"},"answer":"A","explanation":"The subject of the clause is “many (of whom),” which is plural. “Like deep-sea researcher Edith Widder” is an interrupter and does not make the subject singular. The plural “investigate” is correct."},{"number":43,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (each one = singular)","passage":"The sonnet sequence, a form popularized in sixteenth-century England, balances unity and independence. Literary scholars note that each one of the 154 poems in Shakespeare’s sequence, while sharing the meter, rhyme scheme, and recurring concerns of the poems around it, _______ capable of being read as a complete work in its own right.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"have been","B":"were","C":"are","D":"is"},"answer":"D","explanation":"“Each one” is always singular, no matter what plural noun follows “of.” The singular “is” is correct."},{"number":44,"rule":"Rule 4 — Subject–Verb Agreement","skill":"Subject–verb agreement (\"in conjunction with\" doesn't pluralize)","passage":"Physicist Lise Meitner, together with her nephew Otto Frisch and the chemists Otto Hahn and Fritz Strassmann, _______ credited with the discovery of nuclear fission. Although Hahn alone received the 1944 Nobel Prize in Chemistry for the work, it was Meitner and Frisch who first explained the physics behind his puzzling experimental results.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"are being","B":"is","C":"have been","D":"are"},"answer":"B","explanation":"The subject is the singular “Physicist Lise Meitner.” A phrase beginning with “together with” (like “along with” or “in conjunction with”) does not make the subject plural. The singular “is” is correct."},{"number":45,"rule":"Rule 5 — Pronoun and Determiner Agreement","skill":"Pronoun–antecedent agreement (plural)","passage":"Programs designed to encourage retirement saving can be remarkably effective, behavioral economists have found, when the programs change the default option: for example, one large company saw participation rise sharply after new employees were enrolled automatically and then asked whether _______ wished to opt out.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"one","B":"you","C":"it","D":"they"},"answer":"D","explanation":"The pronoun refers to the plural noun “new employees,” so “they” is required. “It” is singular; “one” and “you” shift the person."},{"number":46,"rule":"Rule 5 — Pronoun and Determiner Agreement","skill":"Possessive pronoun (their vs. they’re/its)","passage":"American astronomers Arno Penzias and Robert Wilson shared the 1978 Nobel Prize in Physics for detecting the cosmic microwave background, the faint radiation left over from the early universe, but it would be misleading to say that the two men set out to find it. _______ discovery began as an effort to eliminate a persistent hiss from a radio antenna in New Jersey.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Their","B":"They’re","C":"It’s","D":"Its"},"answer":"A","explanation":"A plural possessive is needed to show that the discovery belongs to Penzias and Wilson: “Their.” “They’re” and “It’s” are contractions (they are / it is); “Its” is singular."},{"number":47,"rule":"Rule 5 — Pronoun and Determiner Agreement","skill":"Reflexive pronoun agreement (plural)","passage":"Researchers report that, unlike most other fish, cleaner wrasses (Labroides dimidiatus) seem able to recognize _______ in a mirror, a capacity previously documented in only a handful of mammals and birds.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"them","B":"themselves","C":"itself","D":"it"},"answer":"B","explanation":"The wrasses are both the ones recognizing and the ones recognized, so a reflexive pronoun is needed, and it must be plural to match “wrasses”: “themselves.” “Them” would refer to some other group; “it/itself” are singular."},{"number":48,"rule":"Rule 5 — Pronoun and Determiner Agreement","skill":"Pronoun–antecedent agreement (singular)","passage":"Kenyan environmentalist Wangari Maathai, founder of the tree-planting Green Belt Movement, was awarded the Nobel Peace Prize in October 2004, making _______ the first time the committee had honored an African woman.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"this","B":"some","C":"those","D":"these"},"answer":"A","explanation":"The pronoun refers to a single event (Maathai’s receiving the prize) and is renamed by the singular “the first time,” so the singular “this” is correct."},{"number":49,"rule":"Rule 5 — Pronoun and Determiner Agreement","skill":"Pronoun–antecedent agreement (plural)","passage":"When they were first carried on the streets of London in the mid-eighteenth century, umbrellas were met with open hostility. The city’s hackney coachmen, who earned much of their income on rainy days, denounced the devices because the drivers considered _______ unwelcome rivals to their covered carriages.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"it","B":"that","C":"them","D":"this"},"answer":"C","explanation":"The pronoun refers to the plural “umbrellas” / “the devices” (and is renamed by the plural “rivals”), so the plural object pronoun “them” is required."},{"number":50,"rule":"Rule 5 — Pronoun and Determiner Agreement","skill":"Determiner/pronoun–noun number agreement","passage":"Thousands of glass-plate photographs examined by astronomer Williamina Fleming and her colleagues at the Harvard College Observatory have recently been digitized. _______ photographs record the spectra of stars that Fleming used to develop an early system of stellar classification.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"These","B":"This","C":"One","D":"That"},"answer":"A","explanation":"The determiner must agree with the plural noun “photographs” that follows it: “These photographs.”"},{"number":51,"rule":"Rule 5 — Pronoun and Determiner Agreement","skill":"Pronoun–antecedent agreement (singular)","passage":"When a given ecosystem—coral reefs and kelp forests are two familiar examples—depends on a single species to keep the populations of other organisms in check, _______ dramatic changes if that species disappears. Such organisms are known as keystone species.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"this often undergoes","B":"these often undergo","C":"it often undergoes","D":"they often undergo"},"answer":"C","explanation":"The antecedent is the singular “a given ecosystem” (the plural examples between the dashes are an interrupter), so the singular personal pronoun and verb are needed: “it often undergoes.” “This” is not used alone to refer back to a specific noun in this way."},{"number":52,"rule":"Rule 5 — Pronoun and Determiner Agreement","skill":"Pronoun–antecedent agreement (plural)","passage":"In 1960, British primatologist Jane Goodall recorded two chimpanzee behaviors that overturned long-standing assumptions about the species: toolmaking and meat eating. Within a few years, _______ accepted by most scientists as evidence that the boundary between humans and other animals was less sharp than previously believed.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"some were","B":"they were","C":"this was","D":"it was"},"answer":"B","explanation":"The pronoun refers to the two behaviors (toolmaking and meat eating), so the plural “they were” is correct. “Some were” would illogically mean only part of the two."},{"number":53,"rule":"Rule 5 — Pronoun and Determiner Agreement","skill":"Possessive pronoun (their vs. its/it’s/they’re)","passage":"In architect Lina Bo Bardi’s 1968 design for the São Paulo Museum of Art, absent are the interior walls that typically divide a museum into separate rooms. In _______ place stand rows of glass easels, each holding a single painting that appears to float in the open hall.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"its","B":"it’s","C":"they’re","D":"their"},"answer":"D","explanation":"The pronoun refers to the plural “the interior walls,” so the plural possessive “their” is needed. “They’re” and “it’s” are contractions; “its” is singular."},{"number":54,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Dangling modifier (subject after introductory phrase)","passage":"In 1911, Polish-born physicist Marie Curie received the Nobel Prize in Chemistry for isolating radium, eight years after sharing the prize in physics. When war broke out in 1914, she set her research aside. After equipping a fleet of vehicles with portable X-ray machines, _______ training some 150 women to operate the equipment and helping surgeons locate shrapnel in wounded soldiers.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Curie drove to the front lines herself,","B":"the front lines were where Curie herself drove,","C":"Curie’s drive to the front lines began,","D":"it was Curie who drove to the front lines herself,"},"answer":"A","explanation":"“After equipping a fleet of vehicles...” describes the person who did the equipping—Curie—so “Curie” must be the subject immediately after the comma. “The front lines,” “Curie’s drive,” and “it” did not equip anything (dangling modifier)."},{"number":55,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Dangling modifier (subject after introductory phrase)","passage":"Although prized for being lightweight, rechargeable, and capable of storing large amounts of energy, _______ they rely on cobalt and other metals that are costly to mine, and they can overheat dangerously if damaged.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"two notable drawbacks are associated with lithium-ion batteries:","B":"there are two notable drawbacks to lithium-ion batteries:","C":"lithium-ion batteries have two notable drawbacks:","D":"lithium-ion batteries’ two notable drawbacks are that"},"answer":"C","explanation":"The opening phrase describes the things that are prized for being lightweight and rechargeable—the batteries—so “lithium-ion batteries” must be the subject right after the comma. In the other choices the subject is “there” or “drawbacks,” so the modifier dangles."},{"number":56,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Dangling modifier (subject after introductory phrase)","passage":"In evaluating the career of Mexican painter Frida Kahlo, _______ have overlooked her equally sustained interest in the conventions of Mexican folk art, such as the small devotional paintings known as retablos.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"Kahlo’s turbulent personal life has been the emphasis of many biographers, who","B":"many biographers have emphasized Kahlo’s turbulent personal life but","C":"there are many biographers who have emphasized Kahlo’s turbulent personal life, but they","D":"the emphasis of many biographers has been on Kahlo’s turbulent personal life; they"},"answer":"B","explanation":"The people “evaluating the career” are the biographers, so “many biographers” must directly follow the introductory phrase. The other choices begin with “Kahlo’s... life,” “there,” or “the emphasis,” none of which can evaluate."},{"number":57,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Dangling modifier (subject after introductory phrase)","passage":"Scholars once believed that people first fermented beverages in the Middle East roughly 5,000 years ago. However, since analyzing residues on 9,000-year-old pottery fragments from the village of Jiahu in northern China, _______ arose much earlier and in more than one region.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"archaeochemist Patrick McGovern’s argument is that the practice","B":"the argument archaeochemist Patrick McGovern has made is that the practice","C":"archaeochemist Patrick McGovern has argued that the practice","D":"the practice, archaeochemist Patrick McGovern has argued,"},"answer":"C","explanation":"The one who analyzed the residues is McGovern, so “archaeochemist Patrick McGovern” must be the subject after the comma. In the other choices the subject is “argument” or “the practice”—neither analyzed anything."},{"number":58,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Dangling modifier (subject after introductory phrase)","passage":"Chinese pharmacologist Tu Youyou was a researcher whose work has saved millions of lives. Recognized with a Nobel Prize in 2015 as one of the most significant medical advances of the twentieth century, _______ gave doctors a powerful new treatment for malaria.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"in 1972 Tu extracted the compound artemisinin, which","B":"the compound artemisinin was extracted by Tu in 1972 and","C":"Tu extracted the compound artemisinin in 1972; it","D":"Tu’s 1972 extraction of the compound artemisinin"},"answer":"D","explanation":"What was recognized as “one of the most significant medical advances” is the extraction (an achievement), not Tu herself, so “Tu’s 1972 extraction” must follow the comma. Beginning with “Tu” or “in 1972 Tu” wrongly makes the person the “advance.”"},{"number":59,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Dangling modifier (subject after introductory phrase)","passage":"In 2003, the city of Seoul began dismantling an elevated highway in order to uncover the Cheonggyecheon, a stream that had been paved over decades earlier, and to line its banks with vegetation. By drawing cooler air through the dense city center, _______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"the restored stream has lowered summer temperatures in the surrounding neighborhoods by several degrees.","B":"the restored stream’s lowering of summer temperatures in the surrounding neighborhoods by several degrees has been achieved.","C":"summer temperatures in the surrounding neighborhoods have been lowered by several degrees by the restored stream.","D":"the lowering of summer temperatures in the surrounding neighborhoods by several degrees has been achieved by the restored stream."},"answer":"A","explanation":"What draws cooler air through the city? The restored stream. It must therefore be the subject right after the modifier. The other choices begin with “the lowering,” “the restored stream’s lowering,” or “summer temperatures,” none of which draws air."},{"number":60,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Dangling modifier (subject after introductory phrase)","passage":"The first woman to earn a degree from the Massachusetts Institute of Technology, _______","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"the 1880s were the years in which Ellen Swallow Richards conducted pioneering surveys of water quality across Massachusetts.","B":"Massachusetts was where Ellen Swallow Richards conducted pioneering surveys of water quality in the 1880s.","C":"pioneering surveys of water quality across Massachusetts were conducted by Ellen Swallow Richards in the 1880s.","D":"Ellen Swallow Richards conducted pioneering surveys of water quality across Massachusetts in the 1880s."},"answer":"D","explanation":"The opening phrase describes a person (“The first woman to earn a degree...”), so the person’s name must come right after the comma. “The 1880s,” “Massachusetts,” and “surveys” are not the first woman."},{"number":61,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Dangling modifier (subject after introductory phrase)","passage":"Assembled from thousands of flattened liquor-bottle caps and stitched together with copper wire by teams of assistants in the artist’s Nigerian studio, _______ so supple and shimmering that viewers often mistake them for woven cloth.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"when he creates his wall hangings, Ghanaian sculptor El Anatsui makes them","B":"the wall hangings of Ghanaian sculptor El Anatsui are","C":"the Ghanaian sculptor El Anatsui creates wall hangings that are","D":"El Anatsui is a Ghanaian sculptor whose wall hangings are"},"answer":"B","explanation":"What is “assembled from... bottle caps and stitched together”? The wall hangings, not the artist. “The wall hangings” must be the subject after the comma."},{"number":62,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Dangling modifier (subject after introductory phrase)","passage":"Hoping to solve the problem of determining a ship’s longitude at sea, _______ up with a practical method. Clockmaker John Harrison eventually claimed most of the reward for his marine chronometer.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"up to £20,000 would be paid to anyone by the British Parliament under a prize established in 1714 for coming","B":"the British Parliament established a prize in 1714 that would pay up to £20,000 to anyone who came","C":"a payment of up to £20,000 would go to anyone under a prize established by the British Parliament in 1714 for coming","D":"a prize established by the British Parliament in 1714 would pay up to £20,000 to anyone who came"},"answer":"B","explanation":"Who was “hoping to solve the problem”? The British Parliament. It must be the subject after the comma. A prize, a payment, and a sum of money cannot hope."},{"number":63,"rule":"Rule 6 — Modifiers: Dangling Modifiers and Logical Comparisons","skill":"Logical comparison / modifier placement","passage":"Compared to that of a typical bony fish, _______ the animal’s tissues retain high levels of urea, keeping its internal fluids nearly as salty as seawater.","stem":"Which choice completes the text so that it conforms to the conventions of Standard English?","options":{"A":"a shark’s blood chemistry is far more concentrated, giving the shark a significant advantage in the ocean:","B":"a shark has a significant advantage in the ocean due to its far more concentrated blood chemistry:","C":"a significant advantage of a shark in the ocean is that its blood chemistry is far more concentrated:","D":"a shark has far more concentrated blood chemistry, resulting in a significant advantage in the ocean:"},"answer":"A","explanation":"“That of a typical bony fish” means “the blood chemistry of a bony fish,” so it must be compared with “a shark’s blood chemistry,” not with “a shark” or “a significant advantage.” Compare like with like."},{"number":64,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Addition","passage":"In 1987, the Montreal Protocol was adopted by dozens of nations. The treaty requires participating countries to phase out the production of chlorofluorocarbons, chemicals that damage the ozone layer. _______ the agreement, as amended in 1990, obliges wealthier nations to contribute to a fund that helps developing countries adopt safer alternatives.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For instance,","B":"Instead,","C":"In addition,","D":"Specifically,"},"answer":"C","explanation":"The sentence adds a second, separate requirement of the same treaty, so “In addition” is logical. The fund is not an example or a more precise statement of the phase-out."},{"number":65,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Addition","passage":"Florence Price was an American composer whose Symphony No. 1 was premiered by the Chicago Symphony Orchestra in 1933. Raised in Arkansas, Price drew openly on her African American heritage in her music. For example, she replaced the traditional scherzo movement of her symphony with a juba, a dance that originated among enslaved people. _______ she wove melodies in the style of spirituals into many of her works.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"However,","B":"In addition,","C":"Actually,","D":"Regardless,"},"answer":"B","explanation":"The last sentence gives a second way Price drew on her heritage, after the first example, so “In addition” is logical."},{"number":66,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Addition","passage":"Medieval European cathedrals relied on stained-glass windows to fill their vast interiors with colored light. _______ the windows served to teach biblical stories to worshippers who could not read, according to many historians.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"For example,","B":"In other words,","C":"As a result,","D":"In addition,"},"answer":"D","explanation":"The second sentence adds another function of the windows (teaching), different from the first (light), so “In addition” is logical."},{"number":67,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Addition","passage":"Mycorrhizal fungi are organisms that grow in close association with the roots of most land plants. These fungi help plants absorb phosphorus from the soil. _______ they help plants take up water during dry periods.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Additionally,","B":"In conclusion,","C":"Instead,","D":"Previously,"},"answer":"A","explanation":"The last sentence adds a second benefit the fungi provide, so “Additionally” is logical."},{"number":68,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Addition","passage":"Some astronomers have opposed plans to launch tens of thousands of new communications satellites into low Earth orbit, concerned that the bright streaks the satellites leave in telescope images would obscure faint objects (and thus compromise long-term surveys of the sky). _______ the researchers worry that radio signals from the satellites would interfere with observatories designed to detect weak emissions from distant galaxies.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"However,","B":"For example,","C":"Additionally,","D":"In comparison,"},"answer":"C","explanation":"The second sentence gives another, separate concern of the same astronomers, so “Additionally” is logical."},{"number":69,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Example / illustration","passage":"Although mammals and birds are usually regarded as the only warm-blooded animals, a few fish have evolved the ability to keep their bodies warmer than the surrounding water. The opah, _______ circulates heated blood throughout its body, allowing it to remain active in the cold depths where it hunts.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"for example,","B":"by contrast,","C":"consequently,","D":"secondly,"},"answer":"A","explanation":"The opah is one specific case of the “few fish” described in the previous sentence, so “for example” is logical."},{"number":70,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Example / illustration","passage":"Plants have evolved a number of remarkable strategies for scattering their seeds away from the parent plant. The seeds of the sandbox tree (Hura crepitans), _______ are flung as far as 40 meters when the tree’s ripe fruit explodes.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"consequently,","B":"in contrast,","C":"for example,","D":"meanwhile,"},"answer":"C","explanation":"The sandbox tree is one specific instance of the “remarkable strategies” mentioned in the first sentence, so “for example” is logical."},{"number":71,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Example / illustration","passage":"Most birds are active during the day and rest at night. That is, they are diurnal. However, not all bird species follow this pattern. The kiwi of New Zealand, _______ forages almost exclusively after dark.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"for instance,","B":"meanwhile,","C":"in addition,","D":"nevertheless,"},"answer":"A","explanation":"The kiwi is an example of a bird species that does not follow the daytime pattern (the claim in the previous sentence), so “for instance” is logical. The contrast was already signaled by “However.”"},{"number":72,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Emphasis / intensification","passage":"Art historians note that the painter J. M. W. Turner frequently reworked his canvases in the days before an exhibition opened, adding details while the pictures hung on the gallery wall. However, the change he made to one seascape in 1832 astonished even his fellow painters; _______ his rival John Constable compared Turner’s last-minute addition of a single red buoy to the firing of a gun.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"nevertheless,","B":"by contrast,","C":"in other words,","D":"in fact,"},"answer":"D","explanation":"Constable’s remark reinforces and intensifies the claim that the change “astonished even his fellow painters,” so “in fact” is logical."},{"number":73,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Specification / elaboration","passage":"In 1980, physicist Luis Alvarez and his son, geologist Walter Alvarez, proposed that the mass extinction that ended the age of the dinosaurs was caused by an asteroid striking Earth. _______ their hypothesis held that dust thrown into the atmosphere by the impact blocked sunlight for months, halting photosynthesis and collapsing food chains.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"However,","B":"Specifically,","C":"Hence,","D":"Admittedly,"},"answer":"B","explanation":"The second sentence gives precise details of how the hypothesis worked, elaborating on the general statement before it. “Specifically” is logical."},{"number":74,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Specification / emphasis","passage":"During the Tang dynasty, trade along the Silk Road reshaped daily life in the Chinese capital of Chang’an, driven largely by growing demand for imported goods and fashions. The popularity of Central Asian music, dance, and clothing, _______ gave the city’s elite a strikingly cosmopolitan culture.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"alternatively,","B":"second of all,","C":"by comparison,","D":"in particular,"},"answer":"D","explanation":"The sentence singles out certain imports (music, dance, clothing) from the general category just mentioned, so “in particular” is logical."},{"number":75,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Specification / elaboration","passage":"In 1928, Indian physicist C. V. Raman discovered that a small fraction of light changes wavelength when it is scattered by molecules. His finding proved enormously useful to chemists. _______ it gave them a way to identify a substance by the distinctive pattern of light it scatters, a method now known as Raman spectroscopy.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Earlier,","B":"Regardless,","C":"However,","D":"Specifically,"},"answer":"D","explanation":"The last sentence explains exactly HOW the finding was useful, so “Specifically” is logical."},{"number":76,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Emphasis / confirmation","passage":"With his 2003 installation The Weather Project, Danish-Icelandic artist Olafur Eliasson succeeded in turning a vast industrial hall at London’s Tate Modern into a communal yet dreamlike space. _______ when visitors entered the hall and saw the enormous glowing sun suspended in mist at its far end, many lay down on the floor and gazed upward for long stretches—as if basking on a beach at sunset.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Nevertheless,","B":"Indeed,","C":"Second,","D":"Instead,"},"answer":"B","explanation":"The second sentence confirms and emphasizes the claim in the first (the space was communal and dreamlike), so “Indeed” is logical."},{"number":77,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Emphasis / support","passage":"The Svalbard Global Seed Vault, built into a mountainside on a Norwegian island in the Arctic, is known for the scale of its collection. _______ the vault holds more than one million seed samples from nearly every country in the world.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"After,","B":"Instead,","C":"In fact,","D":"Regardless,"},"answer":"C","explanation":"The second sentence supports and emphasizes the first with a specific figure, so “In fact” is logical."},{"number":78,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Specification / elaboration","passage":"Ocean tides—the regular rise and fall of sea level along coastlines—result, generally speaking, from the Moon’s gravity. _______ the Moon pulls more strongly on the side of Earth nearest to it than on Earth’s center, drawing the ocean into a bulge. As Earth rotates, coastlines pass through this bulge and experience high tide.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Specifically,","B":"Similarly,","C":"Hence,","D":"Nevertheless,"},"answer":"A","explanation":"The first sentence gives a general cause (“generally speaking”); the second gives the precise mechanism. “Specifically” is logical."},{"number":79,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Specification / elaboration","passage":"In his 1962 book The Structure of Scientific Revolutions, US philosopher Thomas Kuhn disputed the prevailing account of how scientific knowledge advances. _______ Kuhn argued that instead of accumulating steadily through the addition of new facts, science periodically undergoes abrupt “paradigm shifts” in which one framework for understanding the world replaces another.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Specifically,","B":"Therefore,","C":"Finally,","D":"Similarly,"},"answer":"A","explanation":"The second sentence states precisely how Kuhn disputed the prevailing account, so “Specifically” is logical."},{"number":80,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast","passage":"Within hours of hatching, the chicks of megapodes, a family of ground-dwelling birds, can run, feed themselves, and even fly. The chicks of most songbirds, _______ emerge blind and featherless and must be fed by their parents for weeks. This difference in development reflects a trade-off: megapode eggs are unusually large and rich in yolk, allowing the embryo to mature fully before it hatches.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in other words,","B":"by contrast,","C":"accordingly,","D":"for instance,"},"answer":"B","explanation":"Songbird chicks are helpless, the opposite of the independent megapode chicks; the next sentence even names “this difference.” “By contrast” is logical."},{"number":81,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast / concession","passage":"In 1845, Frederick Douglass was enjoying what must have seemed like an extraordinary reception in Great Britain and Ireland. He was lecturing to enthusiastic crowds and, for the first time in his life, moving about without fear of being captured and returned to slavery. _______ Douglass was determined to go back to the United States; only there, he felt, could he work effectively for abolition.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Indeed,","B":"Still,","C":"Furthermore,","D":"Therefore,"},"answer":"B","explanation":"Despite the ideal circumstances just described, Douglass wanted to leave. “Still” signals this concession/contrast."},{"number":82,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast / exception","passage":"Before a performance, American pianist Keith Jarrett typically insists on a carefully selected concert grand piano. _______ for a 1975 concert in Cologne, Germany, he agreed to play an undersized, poorly tuned instrument with malfunctioning pedals; forced to avoid the piano’s weakest registers, he produced an improvisation whose recording became one of the best-selling solo piano albums in history.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Nevertheless,","B":"Likewise,","C":"Moreover,","D":"Thus,"},"answer":"A","explanation":"The Cologne concert is an exception to Jarrett’s usual practice (“typically insists”), so a contrast transition is needed: “Nevertheless.”"},{"number":83,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast","passage":"For decades, textbooks identified the Nile, at roughly 6,650 kilometers, as the longest river on Earth. _______ according to a 2007 expedition by Brazilian scientists who traced the Amazon to a more distant source in southern Peru, the Amazon is slightly longer, extending about 6,800 kilometers.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Consequently,","B":"Moreover,","C":"However,","D":"Secondly,"},"answer":"C","explanation":"The 2007 claim contradicts the long-accepted view stated in the first sentence, so “However” is logical."},{"number":84,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast / concession","passage":"Scholars agree that Thomas Edison was overstating his role when he presented himself as the sole inventor of the incandescent light bulb. Few would dispute, _______ that Edison’s systematic testing of thousands of filament materials helped make electric lighting commercially practical.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"though,","B":"therefore,","C":"in other words,","D":"in the second place,"},"answer":"A","explanation":"The second sentence concedes a point in Edison’s favor after the first sentence criticized him. “Though” signals this contrast."},{"number":85,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast (opposite case)","passage":"According to Bergmann’s rule, populations of warm-blooded animals living in cold climates tend to have larger bodies, which lose heat more slowly relative to their volume. _______ populations of the same or closely related species living in warm climates tend to be smaller, a build that allows excess body heat to escape more readily.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Subsequently,","B":"Conversely,","C":"In other words,","D":"For instance,"},"answer":"B","explanation":"The second sentence presents the opposite situation (warm climates → smaller bodies), so “Conversely” is logical."},{"number":86,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast","passage":"In his classic studies of tide pools on the coast of Washington State, ecologist Robert Paine observed that mussels crowded the rocks in the middle of the intertidal zone. In the lowest part of the zone, _______ sea stars that prey on mussels kept the rocks nearly clear of them.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"in other words,","B":"in summary,","C":"on the other hand,","D":"for instance,"},"answer":"C","explanation":"The lowest part of the zone (few mussels) differs from the middle of the zone (crowded with mussels), so the contrast transition “on the other hand” is logical."},{"number":87,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast (rarely → more often)","passage":"Structures that carry water across valleys on rows of arches are known as aqueducts, from the Latin for “water conduit.” Although such elevated arcades are the most famous feature of ancient Rome’s water system, Roman engineers rarely built them when an alternative existed. _______ the water traveled through underground channels, which were cheaper to construct and easier to protect.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Additionally,","B":"Nonetheless,","C":"On the other hand,","D":"More often,"},"answer":"D","explanation":"“Rarely” in the previous sentence sets up a comparison of frequency: arcades were rare; underground channels were the usual solution. “More often” completes this contrast."},{"number":88,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast / correction","passage":"Upon first seeing the ceiling of the church of Sant’Ignazio in Rome, a visitor might assume that a soaring dome rises above the crossing. _______ by skillfully applying the rules of perspective to a flat canvas, the painter Andrea Pozzo produced only the appearance of a dome.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Additionally,","B":"As a result,","C":"Next,","D":"On the contrary,"},"answer":"D","explanation":"The second sentence corrects the false assumption in the first (there is no real dome), so “On the contrary” is logical."},{"number":89,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Contrast","passage":"When a Venus flytrap’s sensitive trigger hairs are touched twice in quick succession, the plant sends an electrical signal that causes its leaf lobes to snap shut around an insect, beginning the process of digestion. _______ when a hair is touched only once, as by a falling raindrop, the trap remains open.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"By contrast,","B":"In conclusion,","C":"Specifically,","D":"For instance,"},"answer":"A","explanation":"The second sentence describes the opposite situation (one touch → trap stays open), so “By contrast” is logical."},{"number":90,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect","passage":"The feathers of a barn owl’s wings have comb-like serrations along their leading edges and soft fringes along their trailing edges. These structures break up the air flowing over the wing into smaller, quieter currents. _______ barn owls are able to approach their prey in near silence.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"However,","B":"As a result,","C":"For instance,","D":"Similarly,"},"answer":"B","explanation":"Silent flight is the consequence of the feather structures described in the previous sentences, so the cause-and-effect transition “As a result” is logical."},{"number":91,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect / conclusion","passage":"Flight muscles are among the most energetically expensive tissues a bird maintains, and the benefits of flight depend largely on the need to escape predators. _______ from an evolutionary standpoint, birds on islands that lack ground-dwelling predators should invest less in these muscles. Island species such as the kakapo, a flightless parrot of New Zealand, offer a chance to examine this prediction.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Nevertheless,","B":"Subsequently,","C":"Besides,","D":"Thus,"},"answer":"D","explanation":"The second sentence is a logical conclusion drawn from the first (costly muscles + no predators → less investment); the passage even calls it a “prediction.” “Thus” is logical."},{"number":92,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect / conclusion","passage":"In the 1950s, experimental archaeologists in Denmark felled trees using replicas of 5,000-year-old polished flint axes. When they tested the tools, they found that three people could clear about 500 square meters of forest in four hours. _______ the researchers, aware that pollen records showed a sudden decline of forests in the region at the time such axes appeared, concluded that early farmers could have cleared the land themselves with stone tools.","stem":"Which choice completes the text with the most logical transition?","options":{"A":"Therefore,","B":"Alternately,","C":"Likewise,","D":"Nevertheless,"},"answer":"A","explanation":"The researchers’ conclusion follows from what they observed in the experiment, so “Therefore” is logical."},{"number":93,"rule":"Rule 7 — Transitions: Choosing the Logical Connector","skill":"Cause and effect","passage":"Japanese craftspeople developed a repair technique known as kintsugi, in which a broken ceramic vessel is mended with lacquer mixed with powdered gold. This technique involves highlighting each crack rather than hiding it. _______ the repaired vessel displays a network of gleaming seams that record its history.","stem":"Which choice completes the text with the most logical transition?
