<!doctype html><html lang="en"><head><meta charset="utf-8"><title>SAT Synonym Groups → Vocabulary Board</title><meta http-equiv="refresh" content="0;url=https://jenniferenglishteacher.github.io/Barron-s-1100-words-webpage-new/index.html#hot"><script>(function(){var m=/#(hot-(\d+)|sat-[\w-]+)/.exec(location.hash);var base="https://jenniferenglishteacher.github.io/Barron-s-1100-words-webpage-new/";if(!m){location.replace(base+"index.html#hot");return;}if(m[2]){location.replace(base+"hot-unit"+Number(m[2])+".html");return;}fetch("data/synonym-groups.json").then(function(r){return r.json()}).then(function(g){var x=g.find(function(i){return i.id===m[1]});location.replace(x&&x.lesson?base+"hot-unit"+x.lesson+".html":base+"index.html#hot")}).catch(function(){location.replace(base+"index.html#hot")})})();</script></head><body><p>The synonym groups now live on the <a href="https://jenniferenglishteacher.github.io/Barron-s-1100-words-webpage-new/index.html#hot">SAT Vocabulary Board · Hot Words</a>.</p></body></html>
